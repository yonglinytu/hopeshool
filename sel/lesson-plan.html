<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HOPE 每日教學流程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 左側是班級設定與匯出的固定面板，右側是「每位孩子一條時間軸」的排課區，可切換成全班總表 */
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --ink:#1E3640; --muted:#5E7076; --line:#D8E0DF;
  --accent:#D9702A; --accent-ink:#FFFFFF; --accent-soft:#FCE9DA;
  --task:#E8F1FA; --task-line:#B8D2EA; --common:#EDF3EB; --common-ink:#4A684D;
  --warn:#A8461F; --ok:#2C7656; --focus:#2F6FA8;
  --font-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12191C; --surface:#1A2428; --ink:#E4ECEC; --muted:#98A9AD; --line:#2C3A3F;
  --accent:#EE8C47; --accent-ink:#1C1007; --accent-soft:#3A2617;
  --task:#172634; --task-line:#2D4961; --common:#1A2820; --common-ink:#A6C8A9;
  --warn:#F0895B; --ok:#5DC496; --focus:#7DB4E6; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12191C; --surface:#1A2428; --ink:#E4ECEC; --muted:#98A9AD; --line:#2C3A3F;
  --accent:#EE8C47; --accent-ink:#1C1007; --accent-soft:#3A2617;
  --task:#172634; --task-line:#2D4961; --common:#1A2820; --common-ink:#A6C8A9;
  --warn:#F0895B; --ok:#5DC496; --focus:#7DB4E6; color-scheme:dark;}
*{box-sizing:border-box}
html{color-scheme:light}body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
.app{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,4vw,34px);margin:2px 0 0;text-wrap:balance;line-height:1.2}
h1 .subj{color:var(--accent)}
.saved{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.saved::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.banner p{margin:0;flex:1 1 260px}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{display:contents}aside .panel:nth-child(1){order:1}aside .panel:nth-child(2){order:2}main{order:3}aside .panel:nth-child(3),aside .panel:nth-child(4){order:4}}
aside{display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){aside{display:contents}}   /* 手機：送出面板排在主要內容下面 */
@media (min-width:901px){aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:2px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--font-display);font-weight:400;font-size:17px;margin:0}
.panel h2 small{font-family:var(--font-body);font-size:12px;color:var(--muted);margin-left:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label,.lbl{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:38px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg label{flex:1;position:relative;text-align:center;cursor:pointer;margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:7px 4px;font-size:14px;color:var(--ink);white-space:nowrap}
.seg label+label span{border-left:1px solid var(--line)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-2px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px}
button:hover{border-color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.primary:hover{filter:brightness(1.05);border-color:var(--accent)}
.link{border:none;background:none;color:var(--focus);padding:2px 4px;font-size:13px}
.link:hover{text-decoration:underline}
.danger{color:var(--warn)}
.roster{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:8px;padding:10px}
.roster .row2{grid-template-columns:1fr}.roster .row2 select{background:var(--surface)}
.roster .hint .link{font-size:12.5px}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exports .wide{grid-column:1/-1}
.status{font-size:13px;margin:0;color:var(--muted)}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.status .miss,.status.miss{color:var(--warn)}
.status.ok{color:var(--ok)}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
details[open] summary{margin-bottom:8px}

main{min-width:0;display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.viewseg{width:auto}
.viewseg label span{padding:6px 16px}
.kids{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.kid{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 12px;min-width:92px;text-align:left}
.kid .kid-name{font-weight:700;font-size:14.5px}
.kid .kid-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kid[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.kid.add{justify-content:center;align-items:center;color:var(--muted);border-style:dashed}
.meter{width:100%;height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}

.kid-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1.2fr .8fr 1.6fr;gap:10px 12px}
.kid-head .note{grid-column:1/-1}
.kid-head .actions{grid-column:1/-1;display:flex;justify-content:flex-end}
@media (max-width:560px){.kid-head{grid-template-columns:1fr 1fr}.kid-head .start{grid-column:1/-1}}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.time{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.common{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:var(--common);color:var(--common-ink)}
.common .seg-name{flex:1;font-size:14px}
.common .tag{font-size:11.5px;letter-spacing:.06em;opacity:.8}
.block{border:1px solid var(--task-line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.block-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 12px;background:var(--task);border-bottom:1px solid var(--task-line)}
.block-head .seg-name{font-weight:700;flex:1}
.block-head .mins{font-size:12.5px;color:var(--muted)}
.task{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px 14px;padding:10px 12px}
.task+.task{border-top:1px dashed var(--line)}
.task-side{display:flex;flex-direction:column;gap:2px}
.task-no{font-family:var(--font-display);font-size:16px}
.task-side .mins{font-size:12.5px;color:var(--muted)}
.task-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.field.span{grid-column:1/-1}
.hint .warn,.warn{color:var(--warn)}
.tseg{display:flex;align-self:flex-start;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tseg label{position:relative;cursor:pointer}
.tseg input{position:absolute;opacity:0;pointer-events:none}
.tseg span{display:block;padding:3px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tseg label+label span{border-left:1px solid var(--line)}
.tseg input:checked+span{background:var(--task);color:var(--ink);font-weight:700}
.tseg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-2px}
.task.extra{background:color-mix(in srgb,var(--common) 55%,var(--surface))}
.grid .cell .ty{font-weight:700;color:var(--common-ink)}
.task-side .link{align-self:flex-start;padding-left:0;margin-top:4px}
.task-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px}
.task.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
@media (max-width:620px){.task{grid-template-columns:1fr}.task-side{flex-direction:row;align-items:baseline;gap:10px;flex-wrap:wrap}.task-side .link{margin:0 0 0 auto}.task-fields{grid-template-columns:1fr}}

.backups{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.backups h3{font-family:var(--font-display);font-weight:400;font-size:17px;margin:0}
.backups .list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.backups .list{grid-template-columns:1fr}}
.backups-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.backups .field input{margin-top:6px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font-family:var(--font-display);font-weight:400;font-size:20px;margin:0}

.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.grid{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.grid thead th{position:sticky;top:0;background:var(--surface);font-weight:700;z-index:1}
.grid th small{display:block;font-weight:400;color:var(--muted)}
.grid .r-common td{background:var(--common);color:var(--common-ink)}
.grid .r-block td{background:var(--task);font-weight:700;font-size:13px}
.grid .r-pre td{background:var(--bg)}
.grid .cell{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:none;background:none;padding:2px;border-radius:6px;min-width:120px}
.grid .cell:hover{background:var(--accent-soft)}
.grid .cell .u{font-size:12px;color:var(--muted)}
.grid .cell .a.none{color:var(--line)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.copybox{width:100%;height:120px;font-family:var(--font-num);font-size:12px}
@media (prefers-reduced-motion:reduce){.task.flash{animation:none}}

/* ===== 課前排課／課後紀錄 切換 ===== */
body[data-mode="record"] .plan-only{display:none!important}
body[data-mode="plan"] .rec-only{display:none!important}
.fieldgroup{display:flex;flex-direction:column;gap:10px}
.modes{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;width:fit-content;max-width:100%}
.modes button{border:none;background:none;padding:8px 20px;border-radius:9px;font-size:15px;display:flex;align-items:baseline;justify-content:center;gap:6px;color:var(--muted)}
.modes button:hover{background:var(--bg)}
.modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.modes .n{font-family:var(--font-num);font-size:12px;opacity:.85}
@media (max-width:560px){.modes{width:100%}.modes button{flex:1;padding:9px 6px}}

/* 社工回饋 */
.fb{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--focus);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fb-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fb-top h2{font-family:var(--font-display);font-weight:400;font-size:17px;margin:0 auto 0 0}
.fb-n{display:inline-block;min-width:22px;text-align:center;background:var(--focus);color:var(--surface);border-radius:999px;font-family:var(--font-num);font-size:12px;padding:1px 7px;margin-left:4px;vertical-align:2px}
.fb-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fb-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.fb-item>button{justify-self:end;padding:4px 14px;font-size:13px}
.fb-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:14px}
.fb-date{font-family:var(--font-num);font-size:12.5px;color:var(--muted)}
.fb-st{font-size:12px;background:var(--common);color:var(--common-ink);padding:1px 8px;border-radius:999px}
.fb-ctx{margin:0;font-size:13px;color:var(--muted)}
.fb-reply{margin:0;white-space:pre-wrap}
.fb-err{padding:0 2px}

/* 課後紀錄 */
#rview{display:flex;flex-direction:column;gap:14px}
.rec-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.rec-bar .lbl{margin-right:2px}
.rec-bar button{padding:5px 12px;font-size:14px}
.rec-bar .prog{margin-left:auto;font-size:13px;color:var(--muted)}
.rec-bar .prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:12px;align-items:start}
.rc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rc.done{border-left-color:var(--ok)}
.rc.has-ev{border-left-color:var(--warn)}
.rc-head{display:flex;align-items:baseline;gap:8px}
.rc-name{font-family:var(--font-display);font-size:19px}
.rc-grade{font-size:12.5px;color:var(--muted)}
.rc-state{margin-left:auto;font-size:12px;color:var(--muted)}
.rc.done .rc-state{color:var(--ok)}
.rc.absent .rc-name{color:var(--muted)}
.rrow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:start}
.rl{font-size:13px;color:var(--muted);padding-top:6px}
.rv{display:flex;flex-direction:column;gap:6px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;cursor:pointer;margin:0;color:var(--ink)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:block;padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:14px;line-height:20px;color:var(--ink);background:var(--bg);white-space:nowrap}
.chip:hover span{border-color:var(--muted)}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip[data-tone="good"] input:checked+span{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chip[data-tone="bad"] input:checked+span{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.chip input:focus-visible+span{outline:2px solid var(--focus);outline-offset:1px}
.chips.small .chip span{font-size:13px;padding:3px 10px}
.tags{padding:8px;border-radius:8px;background:var(--accent-soft)}
.tags .chip span{background:var(--surface)}
.unit-in{display:flex;align-items:center;gap:8px}.unit-in input{width:90px}.unit-in span{font-size:14px;color:var(--muted)}
.rv .link{align-self:flex-start;padding-left:0}
@media (max-width:420px){.rrow{grid-template-columns:1fr;gap:4px}.rl{padding-top:0}}
.ev-add{align-self:flex-start;border-style:dashed;color:var(--muted)}
.ev{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 6%,var(--surface));border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ev-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ev-head b{color:var(--warn);font-size:14px}
.feel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.feel h3{font-family:var(--font-display);font-weight:400;font-size:18px;margin:0}
.feel .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.feel .row3{grid-template-columns:1fr}}
.mood .chip span{padding:6px 12px}
/* 調整時段 */
.lay{display:flex;flex-direction:column;gap:12px}
.lay-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.lay-head p{margin:0}
.lay-task,.lay-brk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--task-line)}
.lay-task .seg-name,.lay-brk .seg-name{flex:1;font-weight:700}
.lay-brk{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.lay-brk select{width:auto;padding:4px 8px}
.lay-ctl{display:flex;align-items:center;gap:6px}
.lay-ctl button{padding:3px 10px;font-family:var(--font-num);font-size:13px}
.lay-min{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.lay-ins{list-style:none;display:flex;justify-content:center;margin:-2px 0}
.lay-ins button{border-style:dashed;border-radius:999px;padding:1px 14px;font-size:12.5px;color:var(--muted);background:transparent}
.lay-ins button:hover{color:var(--accent);border-color:var(--accent)}
.lay-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cloud{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.cloud>button{align-self:stretch}
#cloud-box{display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--focus) 8%,var(--surface));border-radius:8px;padding:10px}
#cloud-box .acts{display:flex;align-items:center;gap:8px}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <p class="eyebrow">永齡希望小學 雲科大分校 · 課輔老師用</p>
      <h1><span class="subj" id="h-subj">英語</span> <span id="h-title">每日教學流程</span></h1>
    </div>
    <span class="saved" id="saved">自動儲存在這台裝置</span>
  </header>

  <nav class="modes" role="tablist" aria-label="切換課前或課後">
    <button role="tab" data-mode="plan" aria-selected="true"><span class="n">1</span>課前排課</button>
    <button role="tab" data-mode="record" aria-selected="false"><span class="n">2</span>課後紀錄</button>
  </nav>

  <div id="banner"></div>

  <div class="layout">
    <aside>
      <section class="panel" aria-labelledby="h-class">
        <h2 id="h-class">班級與日期</h2>
        <div class="roster" id="roster"></div>
        <input type="file" id="roster-file" accept=".xlsx,.xls,.csv" hidden>
        <div class="row2">

// 把一段上課時間切成任務：以 5 分鐘為單位平均分配，較長的放前面
function slice(L, N){
  const n = Math.max(1, Math.round(L/N - 0.01));
  const units = L/5, base = Math.floor(units/n), extra = units - base*n;
  return Array.from({length:n}, (_,i) => (base + (i < extra ? 1 : 0)) * 5);
}
/* ===== 上課時段的配置：任務長短和下課 =====
   layout 是「上課時間」這一段裡依序的項目：{k:'t', min} 任務、{k:'b', min} 下課
   沒有調整過時，依「每個任務」的分鐘數平均切開（跟以前一樣） */
const LAYOUT_KEY = 'hope-lesson-layouts';
const BREAK_MINS = [5, 10, 15, 20];
const curTpl = () => TEMPLATES[state.meta.template] || TEMPLATES['4h'];
const blockRange = () => { const it = curTpl().items.find(x => x[3] === 'task'); return [toMin(it[1]), toMin(it[2])]; };
const blockLen = () => { const [a, b] = blockRange(); return b - a; };
const defaultLayout = () => slice(blockLen(), Number(state.meta.taskLen) || 15).map(min => ({k:'t', min}));
// 讓配置剛好填滿上課時間：多出來的從最後一個任務扣，不足的補到最後一個任務（超過一個任務長度就多開一個任務）
function normLayout(items){
  const L = blockLen(), N = Number(state.meta.taskLen) || 15;
  let it = [];
  (items || []).forEach(x => {
    const k = x.k === 'b' ? 'b' : 't', min = Math.max(5, Math.round((Number(x.min) || 0) / 5) * 5);
    if (k === 'b' && (!it.length || it[it.length - 1].k === 'b')) return;   // 下課不能在最前面，也不能連著兩個
    it.push({k, min});
  });
  for (let pass = 0; pass < 2; pass++){
    let total = it.reduce((t, x) => t + x.min, 0);
    while (total > L && it.length){
      const last = it[it.length - 1], cut = last.k === 't' ? Math.min(total - L, last.min - 5) : 0;
      if (cut > 0){ last.min -= cut; total -= cut; } else { total -= last.min; it.pop(); }
    }
    while (total < L){
      const slack = L - total, last = it[it.length - 1];
      if (last && last.k === 't' && last.min < N){ const g = Math.min(slack, N - last.min); last.min += g; total += g; }
      else { const m = Math.min(slack, N); it.push({k:'t', min:m}); total += m; }
    }
    if (it.length && it[it.length - 1].k === 'b') it.pop(); else break;   // 下課不放在統整前的最後一段
  }
  return it;
}
const layout = () => state.meta.layout ? normLayout(state.meta.layout) : defaultLayout();
const sameLayout = (a, b) => JSON.stringify(a.map(x => [x.k, x.min])) === JSON.stringify(b.map(x => [x.k, x.min]));
const layoutKey = () => [state.meta.cls || '', state.meta.template, state.meta.taskLen].join('|');
const savedLayouts = () => store.get(LAYOUT_KEY) || {};
const savedLayout = () => { const v = savedLayouts()[layoutKey()]; return v ? normLayout(v) : null; };
// 換班別、時段類型或任務長度時，帶入這班存過的固定時段
function syncLayout(){ const v = savedLayout(); state.meta.layout = v && !sameLayout(v, defaultLayout()) ? v : null; }
function buildFlow(){
  let no = 0;
  return curTpl().items.flatMap(([name, s, e, kind]) => {
    const a = toMin(s), b = toMin(e);
    if (kind !== 'task') return [{kind:'common', name, start:s, end:e, min:b-a}];
    const out = []; let t = a, cur = null;
    for (const x of layout()){
      if (x.k === 'b'){ cur = null; out.push({kind:'common', name:'下課', start:fmt(t), end:fmt(t + x.min), min:x.min, brk:true}); t += x.min; continue; }
      if (!cur){ cur = {kind:'block', name, start:fmt(t), end:'', min:0, tasks:[]}; out.push(cur); }
      cur.tasks.push({no:++no, start:fmt(t), end:fmt(t + x.min), min:x.min}); t += x.min; cur.end = fmt(t); cur.min += x.min;
    }
    return out;
  });
}
const allTasks = flow => flow.flatMap(i => i.tasks || []);
// 本科任務的單元空白＝沿用前一個本科任務；家課／閱讀任務各自獨立，不影響「同上」
function resolved(st, tasks){
  let cur = st.start || ''; const out = {}, before = {};
  for (const t of tasks){
    const v = st.tasks['t'+t.no] || {}; before[t.no] = cur;
    if (taskType(v)){ out[t.no] = v.unit || ''; continue; }
    if (v.unit) cur = v.unit; out[t.no] = cur;
  }
  out.before = before; return out;
}

  const H = aoa[hi].map(v => String(v ?? '').replace(/\s/g,''));
  const col = k => H.findIndex(h => h.includes(k));
  const c = {cls: col('班別') >= 0 ? col('班別') : col('班級'), subj:col('科目'), tch:col('老師'), grade:col('年級'), name:col('學生姓名')};
  if (c.cls < 0) throw new Error('找不到「班級名稱」或「課輔班別」欄位');
  const map = new Map(); let cls = '', subj = '', tch = '';
  for (const r of aoa.slice(hi+1)){
    if (!r) continue;
    const v = k => c[k] >= 0 ? String(r[c[k]] ?? '').trim() : '';
    if (!['cls','subj','tch','name'].some(k => v(k))) continue;
    if (v('cls') && v('cls') !== cls){ cls = v('cls'); subj = ''; tch = ''; }
    if (v('subj')) subj = normSubj(v('subj'));
    if (v('tch')) tch = v('tch');
    if (!DATA.subjects[subj] || !v('name')) continue;   // 只收國語、英語、數學；家課／閱讀改在排課時選填
    const key = [cls, subj, tch].join('|');
    if (!map.has(key)) map.set(key, {cls, subject:subj, teachers:splitNames(tch), students:[]});
    const g = map.get(key);
    if (!g.students.some(s => s.name === v('name'))) g.students.push({name:v('name'), grade:normGrade(v('grade'))});
  }
  const out = [...map.values()];
  if (!out.length) throw new Error('名冊裡沒有讀到任何國語、英語或數學的學生');
  return out;
}

const txt = (field, sid, val, ph, {area=false, type='text', label=''} = {}) => area
  ? `<textarea rows="2" id="${field}-${sid}" data-rx="${field}" data-sid="${sid}" placeholder="${esc(ph)}" aria-label="${esc(label||ph)}">${esc(val||'')}</textarea>`
  : `<input type="${type}" id="${field}-${sid}" data-rx="${field}" data-sid="${sid}" value="${esc(val||'')}" placeholder="${esc(ph)}" aria-label="${esc(label||ph)}"${type==='number'?' inputmode="numeric" min="1" max="240"':''}>`;

function recCard(st){
  const r = kidRec(st), sid = st.id, ab = isAbsent(r), done = kidDone(st), nm = st.name || '未命名';
  let h = `<article class="rc${done?' done':''}${r.ev.on?' has-ev':''}${ab?' absent':''}" id="rc-${sid}" aria-label="${esc(nm)} 課後紀錄">
    <header class="rc-head"><span class="rc-name">${esc(nm)}</span><span class="rc-grade">${esc(st.grade||'')}</span><span class="rc-state">${done?'✓ 已完成':'未完成'}</span></header>`;
  let att = chipGroup('att', sid, ATT, r.att, {label:'出席'});
  if (r.att === '遲到' || r.att === '早退') att += `<div class="unit-in">${txt('attNote', sid, r.attNote, '', {type:'number', label:`${r.att}分鐘數`})}<span>分鐘</span></div>`;
  if (ab) att += txt('attNote', sid, r.attNote, '原因（選填）', {label:'請假或缺席原因'});
  h += rrow('出席', att);
  if (!ab){
    let hw = chipGroup('hw', sid, HW, r.hw, {label:'學校作業'});
    if (HW_NOTE.includes(r.hw)) hw += txt('hwNote', sid, r.hwNote, '原因或還差哪些', {label:'作業說明'});
    h += rrow('學校作業', hw);

    const P = plannedTasks(st);
    let tk = chipGroup('taskAll', sid, TASK_ALL, r.taskAll, {label:'今日任務完成度'});
    if (!P.length) tk += `<p class="hint">課前排課沒有這位孩子的任務，只記整體完成度。</p>`;
    if (r.taskAll && r.taskAll !== '全部完成'){
      if (P.length) tk += `<div class="tags"><p class="hint" style="margin:0 0 6px">沒完成的是哪幾項？</p>${chipGroup('taskMiss', sid, P.map(p => [String(p.no), `${p.no}. ${p.act}`]), r.taskMiss, {multi:true, small:true, label:'沒完成的任務'})}</div>`;
      tk += txt('taskNote', sid, r.taskNote, '沒完成的原因', {label:'任務未完成原因'});
    }
    h += rrow('今日任務', tk);

    let ln = chipGroup('learn', sid, LEVEL, r.learn, {label:'學習表現'});
    if (r.learn === '需要關注') ln += `<div class="tags">${chipGroup('learnTags', sid, LEARN_TAGS, r.learnTags, {multi:true, small:true, label:'學習需要關注的地方'})}</div>`;
    h += rrow('學習表現', ln);
    let bh = chipGroup('behave', sid, LEVEL, r.behave, {label:'行為表現'});
    if (r.behave === '需要關注') bh += `<div class="tags">${chipGroup('behaveTags', sid, BEHAVE_TAGS, r.behaveTags, {multi:true, small:true, label:'行為需要關注的地方'})}</div>`;
    h += rrow('行為表現', bh);
    h += rrow('今日觀察', txt('obs', sid, r.obs, '選填：亮點、進步、想記下的事', {area:true, label:'今日觀察'}));
  }
  if (!r.ev.on){
    h += `<button class="ev-add" data-ract="ev-on" data-sid="${sid}">＋ 需要協助／事件</button>`;
  } else {
    const e = r.ev;
    h += `<div class="ev"><div class="ev-head"><b>需要協助／事件</b><button class="link danger" data-ract="ev-off" data-sid="${sid}">取消這則事件</button></div>
      ${rrow('類型', chipGroup('evTypes', sid, EV_TYPES, e.types, {multi:true, small:true, label:'事件類型'}))}
      ${rrow('經過', txt('evWhat', sid, e.what, '發生了什麼？（時間、對象、經過）', {area:true, label:'事件經過'}))}
      ${rrow('處理方式', chipGroup('evHow', sid, EV_HOW, e.how, {multi:true, small:true, label:'處理方式'}) + txt('evHowNote', sid, e.howNote, '其他處理或後續約定（選填）', {label:'其他處理方式'}))}
      ${rrow('社工', chipGroup('evUrg', sid, EV_URG, e.urg, {label:'社工需要做什麼'}))}
    </div>`;
  }
  return h + `</article>`;
}

document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (!d.r) return;
  if (d.sid === 'feel'){ dayRec().feel[d.r] = el.value; renderRecStatus(); save(); return; }
  const st = findKid(d.sid); if (!st) return;
  const r = kidRec(st), v = el.value;
  const toggle = arr => { const s = new Set(arr || []); el.checked ? s.add(v) : s.delete(v); return [...s]; };
  switch (d.r){
    case 'att': r.att = v; r.attNote = ''; break;
    case 'hw': r.hw = v; if (!HW_NOTE.includes(v)) r.hwNote = ''; break;
    case 'taskAll': r.taskAll = v; if (v === '全部完成'){ r.taskMiss = []; r.taskNote = ''; } break;
    case 'taskMiss': r.taskMiss = toggle(r.taskMiss); break;
    case 'learn': r.learn = v; if (v !== '需要關注') r.learnTags = []; break;
    case 'behave': r.behave = v; if (v !== '需要關注') r.behaveTags = []; break;
    case 'learnTags': r.learnTags = toggle(r.learnTags); break;
    case 'behaveTags': r.behaveTags = toggle(r.behaveTags); break;
    case 'evTypes': r.ev.types = toggle(r.ev.types); break;
    case 'evHow': r.ev.how = toggle(r.ev.how); break;
    case 'evUrg': r.ev.urg = v; break;
  }
  refreshCard(d.sid, el.id);
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (el.id === 'r-endpoint'){ store.set(REPKEY, el.value.trim()); fb.key = ''; renderEndpointTag(); return; }

  if (d.m){

    renderRecStatus(); renderFeedback(); return;

  const st = findKid(d.sid); if (!st) return;

let evArmed = null, evTimer;
document.addEventListener('click', e => {
  const md = e.target.closest('.modes [data-mode]');
  if (md){ ui.mode = md.dataset.mode; render(); window.scrollTo({top:0}); return; }
  const b = e.target.closest('[data-ract]'); if (!b) return;
  const a = b.dataset.ract, sid = b.dataset.sid, st = sid ? findKid(sid) : null;
  if (a === 'go-plan'){ ui.mode = 'plan'; render(); window.scrollTo({top:0}); return; }
  if (a === 'ev-on'){ kidRec(st).ev.on = true; refreshCard(sid, `evTypes-${sid}-0`); return; }
  if (a === 'ev-off'){
    const ev = kidRec(st).ev;
    if ((ev.what || ev.types.length) && evArmed !== sid){
      evArmed = sid; b.textContent = '確定取消？再按一次'; clearTimeout(evTimer);
      evTimer = setTimeout(() => { evArmed = null; if (b.isConnected) b.textContent = '取消這則事件'; }, 3500); return;
    }
    evArmed = null; kidRec(st).ev = {on:false, types:[], how:[]}; refreshCard(sid); return;
  }
  if (a.startsWith('bulk-')){
    let n = 0;
    state.students.forEach(s => {
      const r = kidRec(s);
      if (a === 'bulk-att' && !r.att){ r.att = '出席'; n++; }
      if (a === 'bulk-hw' && !isAbsent(r) && !r.hw){ r.hw = '完成'; n++; }
      if (a === 'bulk-task' && !isAbsent(r)){
        if (!r.taskAll){ r.taskAll = '全部完成'; n++; }
      }
    });
    renderRecord(); renderRecStatus(); save();
    toast(n ? `已填入 ${n} 位孩子` : '每位孩子都已經選過了');
    return;
  }
  if (a === 'fb-seen'){ markSeen([b.dataset.fid]); return; }
  if (a === 'fb-all'){ markSeen(visibleFb().map(fbKey)); return; }
  if (a === 'fb-refresh'){ loadFeedback(true); return; }
});

const REC_HEAD = ['紀錄編號','日期','班別','課輔老師','科目','學生','年級','出席','出席說明','學校作業','作業說明',
  '任務完成','任務明細','任務未完成原因','學習表現','學習需關注','行為表現','行為需關注','今日觀察',
  '事件類型','事件經過','處理方式','社工需求','送出時間'];
const FEEL_HEAD = ['紀錄編號','日期','班別','課輔老師','科目','教學天氣','順利的地方','卡住的地方','想請協助','送出時間'];
const recBase = () => [state.meta.date, state.meta.cls || '未填班別', state.meta.subject].join('_');
function recRows(stamp){
  const m = state.meta;
  return state.students.filter(st => st.name).map(st => {
    const r = kidRec(st), ab = isAbsent(r), P = plannedTasks(st), e = r.ev;
    let tDone = '', tDetail = '';
    if (!ab){
      tDone = r.taskAll || '';
      if (r.taskAll && r.taskAll !== '全部完成') tDetail = P.filter(p => (r.taskMiss || []).includes(String(p.no))).map(p => `任務${p.no} ${p.label}`).join('、');
    }
    const attNote = (r.att === '遲到' || r.att === '早退') ? (r.attNote ? r.attNote + ' 分鐘' : '') : (ab ? r.attNote || '' : '');
    return [recBase() + '_' + st.name, m.date, m.cls, m.teacher, m.subject, st.name, st.grade, r.att || '', attNote,
      ab ? '' : r.hw || '', ab ? '' : r.hwNote || '', tDone, tDetail, ab ? '' : r.taskNote || '',
      ab ? '' : r.learn || '', ab ? '' : (r.learnTags || []).join('、'), ab ? '' : r.behave || '', ab ? '' : (r.behaveTags || []).join('、'), ab ? '' : r.obs || '',
      e.on ? e.types.join('、') : '', e.on ? e.what || '' : '', e.on ? [...e.how, e.howNote].filter(Boolean).join('、') : '', e.on ? e.urg || '' : '', stamp];
  });
}
function feelRow(stamp){

/* ----- 傳送到課後紀錄試算表 ----- */
function openRecSettings(msg, focusCode){
  const d = $('#r-settings'); d.open = true;
  (focusCode ? $('#r-code') : (RECORD_ENDPOINT ? $('#r-code') : $('#r-endpoint'))).focus();
  toast(msg);
}
async function getJSON(url){
  const res = await fetch(url); const text = await res.text();
  try { return JSON.parse(text); } catch(e){ return {ok:false, error: /accounts\.google|ServiceLogin|登入/.test(text) ? 'login' : 'html'}; }
}
const errMsg = err => ({
  login:'接收程式需要登入才能用，請督導把部署的「誰可以存取」改成「任何人」',
  html:'網址不是課後紀錄的接收程式，或還沒部署新版本',
  code:'通行碼不對，請向督導確認'})[err] || ('試算表回報錯誤：' + err);
let sendArmed = false, overwriteArmed = false, sendTimer;
$('#r-send').addEventListener('click', async () => {
  const btn = $('#r-send'), url = recEndpoint();
  if (!url){ openRecSettings('請先貼上督導提供的課後紀錄接收網址'); return; }
  const miss = [['cls','班別'],['teacher','課輔老師'],['date','日期']].filter(([k]) => !String(state.meta[k]||'').trim());
  if (miss.length){ toast('送出前請先填：' + miss.map(x => x[1]).join('、')); return; }
  const p = recProgress();
  if ((p.miss.length || !p.feelDone) && !sendArmed){
    sendArmed = true; clearTimeout(sendTimer);
    btn.textContent = p.miss.length ? `還有 ${p.miss.length} 位沒填完，再按一次仍要送出` : '教學感受還沒選天氣，再按一次仍要送出';
    sendTimer = setTimeout(() => { sendArmed = false; btn.textContent = '傳送給社工（Google 試算表）'; }, 4000);
    return;
  }
  sendArmed = false; clearTimeout(sendTimer);
  btn.disabled = true; btn.textContent = '傳送中…';
  const time = new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
  const show = (ok, msg) => { const el = $('#r-send-result'); el.className = 'status ' + (ok ? 'ok' : 'miss'); el.textContent = `${time}　${msg}`; toast(msg); };
  try {
    let ping;
    const q = new URLSearchParams({action:'load', only:'record', date:state.meta.date, cls:state.meta.cls, subject:state.meta.subject, code:recCode()});
    try { ping = await getJSON(`${url}?${q}`); }
    catch(err){ ping = {ok:false, error:'net'}; }
    if (ping.error === 'code'){ show(false, errMsg('code')); openRecSettings('請輸入督導提供的通行碼', true); return; }
    if (ping.error !== 'net' && ping.app !== 'hope-record'){ show(false, '沒有送進去：' + errMsg(ping.error || 'html')); return; }
    // 雲端有比這台裝置更新的紀錄（通常是用別台裝置送的）→ 先提醒，避免蓋掉
    const latest = cloudLatest(ping), day = dayRec(), synced = day.sentAt || day.loadedAt || '';
    if (latest && latest > synced && !overwriteArmed){
      overwriteArmed = true; clearTimeout(sendTimer);
      show(false, `雲端在 ${latest.slice(5)} 已有這天的紀錄（可能是別台裝置送的）。建議先按「從雲端載入」；確定要用這台的內容取代，再按一次送出`);
      sendTimer = setTimeout(() => { overwriteArmed = false; }, 15000);
      return;
    }
    overwriteArmed = false;
    const stamp = nowStamp();
    const body = JSON.stringify({kind:'record', code:recCode(), recHeaders:REC_HEAD, recRows:recRows(stamp), feelHeaders:FEEL_HEAD, feelRow:feelRow(stamp)});
    try {
      const res = await fetch(url, {method:'POST', body});
      const text = await res.text(); let data = null; try { data = JSON.parse(text); } catch(e){}
      if (data && data.ok){ dayRec().sentAt = stamp; delete dayRec().loadedAt; save(); show(true, `試算表已收到 ${data.rows} 位孩子的紀錄和教學感受`); }
      else if (data) show(false, '沒有送進去：' + errMsg(data.error));
      else show(false, '沒有送進去：' + errMsg(/accounts\.google|ServiceLogin/.test(text) ? 'login' : 'html'));
    } catch(err){
      await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body});
      dayRec().sentAt = stamp; save();
      show(true, '已送出，但無法確認試算表是否收到，請到試算表檢查');
    }
  } catch(err){ show(false, '沒有送出：這個頁面連不到 Google。請改用下載或複製表格'); }
  finally { btn.disabled = false; btn.textContent = '傳送給社工（Google 試算表）'; }
});

async function loadFeedback(force){
  if (state.sample){ fb.items = SAMPLE_FB(); fb.err = ''; fb.key = 'sample'; renderFeedback(); return; }
  const url = recEndpoint(), m = state.meta;
  const key = [url, m.cls, m.subject, recCode()].join('|');
  if (!url || !m.cls || !m.subject){ fb.items = []; fb.err = ''; fb.key = key; renderFeedback(); return; }
  fb.key = key;
  try {
    const q = new URLSearchParams({action:'feedback', cls:m.cls, subject:m.subject, days:'14', code:recCode()});
    const data = await getJSON(`${url}?${q}`);
    if (fb.key !== key) return;
    if (data.ok){ fb.items = data.items || []; fb.err = ''; }
    else { fb.items = []; fb.err = '讀不到社工回饋：' + errMsg(data.error); }
  } catch(err){ fb.items = []; fb.err = '讀不到社工回饋：網路連不到接收程式'; }
  renderFeedback(true);
  if (force) toast(fb.err || (visibleFb().length ? `有 ${visibleFb().length} 則新回饋` : '目前沒有新的社工回饋'));
}
const WEEK = '日一二三四五六';
const fmtDay = d => { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? esc(d) : `${t.getMonth()+1}/${t.getDate()}（${WEEK[t.getDay()]}）`; };
function renderFeedback(fromLoad){
  const box = $('#feedback'); if (!box) return;
  // 班別、科目或接收網址變了就重新讀取（等使用者打完字）
  const want = state.sample ? 'sample' : [recEndpoint(), state.meta.cls, state.meta.subject, recCode()].join('|');
  if (!fromLoad && want !== fb.key){ clearTimeout(fb.timer); fb.timer = setTimeout(() => loadFeedback(false), state.sample ? 0 : 800); }
  const items = visibleFb();
  if (!items.length){
    box.innerHTML = (ui.mode === 'record' && fb.err) ? `<p class="hint fb-err">${esc(fb.err)}</p>` : '';
    return;
  }
  box.innerHTML = `<section class="fb" aria-labelledby="fb-h"><div class="fb-top"><h2 id="fb-h">社工回饋<span class="fb-n">${items.length}</span></h2>
      <button class="link" data-ract="fb-refresh">重新整理</button>${items.length > 1 ? '<button class="link" data-ract="fb-all">全部標為已讀</button>' : ''}</div>
    <ul class="fb-list">${items.map(i => `<li class="fb-item">
      <div class="fb-meta"><span class="fb-date">${fmtDay(i.date)}</span><b>${esc(i.type === 'feel' ? '給這班／給你的話' : i.student)}</b>${i.status ? `<span class="fb-st">${esc(i.status)}</span>` : ''}</div>
      ${i.context ? `<p class="fb-ctx">你寫：${esc(i.context)}</p>` : ''}
      <p class="fb-reply">${esc(i.reply || '（社工已處理，沒有留言）')}</p>
      <button data-ract="fb-seen" data-fid="${esc(fbKey(i))}">知道了</button></li>`).join('')}</ul></section>`;
}

/* ----- 從雲端載入：換裝置時帶回那天的排課和課後紀錄 ----- */
let cloudItems = [], cloudTimer, cloudArmed = false;
const cloudLatest = d => [...(d.records || []).map(o => o['送出時間']), d.feel ? d.feel['送出時間'] : ''].filter(Boolean).sort().pop() || '';
const splitList = v => String(v || '').split('、').map(x => x.trim()).filter(Boolean);
function cloudHint(msg){ $('#cloud-hint').textContent = msg; }
async function cloudList(){
  const url = recEndpoint(), date = state.meta.date;
  $('#cloud-sel').hidden = true; $('#cloud-load').hidden = true; cloudArmed = false;
  if (!url){ cloudHint('還沒設定課後紀錄接收網址：請到「課後紀錄」分頁最下方的「課後紀錄連線設定」貼上督導提供的網址。'); return; }
  if (!date){ cloudHint('請先選日期。'); return; }
  cloudHint(`查詢 ${date} 雲端上的資料…`);
  try {
    const d = await getJSON(`${url}?${new URLSearchParams({action:'list', date, code:recCode()})}`);
    if (!d.ok){ cloudHint('查不到：' + errMsg(d.error)); if (d.error === 'code'){ ui.mode = 'record'; render(); openRecSettings('請輸入督導提供的通行碼', true); } return; }
    if (d.app && !d.items){ cloudHint('接收程式還是舊版，請督導把 Apps Script 更新後重新部署。'); return; }
    cloudItems = d.items || [];
    if (!cloudItems.length){ cloudHint(`雲端上沒有 ${date} 的排課或課後紀錄。要載入別天，先改上面的日期。` + (d.planError ? `（${d.planError}）` : '')); return; }
    const m = state.meta;
    let pick = cloudItems.findIndex(i => i.cls === m.cls && i.subject === m.subject);
    if (pick < 0) pick = cloudItems.findIndex(i => m.teacher && i.teacher && i.teacher.includes(m.teacher));
    $('#cloud-sel').innerHTML = cloudItems.map((i, n) => `<option value="${n}"${n === Math.max(0, pick) ? ' selected' : ''}>${esc(i.cls)}｜${esc(i.subject)}｜${esc(i.teacher || '未填老師')}・${i.students}位${i.hasRecord ? '・有紀錄' : '・排課'}</option>`).join('');
    $('#cloud-sel').hidden = false; $('#cloud-load').hidden = false;
    cloudHint(`${date} 雲端上有 ${cloudItems.length} 組資料，選你的班別後按「載入」。` + (d.planError ? `（${d.planError}）` : ''));
  } catch(err){ cloudHint('連不到接收程式，請確認網路。'); }
}
function parseRec(o, st){
  const r = {taskMiss:[], learnTags:[], behaveTags:[], ev:{on:false, types:[], how:[]}};
  r.att = o['出席'] || '';
  const an = o['出席說明'] || '';
  r.attNote = (r.att === '遲到' || r.att === '早退') ? an.replace(/\s*分鐘$/, '') : an;
  r.hw = o['學校作業'] || ''; r.hwNote = o['作業說明'] || '';
  const P = plannedTasks(st), det = o['任務明細'] || '', tc = o['任務完成'] || '';
  if (TASK_ALL.includes(tc)) r.taskAll = tc;
  else if (/／/.test(tc)) r.taskAll = det ? '大部分完成' : '全部完成';   // 舊格式（逐項）的紀錄
  const nos = new Set(P.map(p => String(p.no)));
  r.taskMiss = [...det.matchAll(/任務(\d+)/g)].map(m => m[1]).filter(n => nos.has(n));
  r.taskNote = o['任務未完成原因'] || '';
  r.learn = o['學習表現'] || ''; r.learnTags = splitList(o['學習需關注']);
  r.behave = o['行為表現'] || ''; r.behaveTags = splitList(o['行為需關注']);
  r.obs = o['今日觀察'] || '';
  const types = splitList(o['事件類型']), how = splitList(o['處理方式']);
  r.ev = {on: !!(types.length || o['事件經過'] || o['社工需求']), types, what:o['事件經過'] || '',
    how: how.filter(x => EV_HOW.includes(x)), howNote: how.filter(x => !EV_HOW.includes(x)).join('、'), urg:o['社工需求'] || ''};
  return r;
}
async function cloudLoad(btn){
  const it = cloudItems[Number($('#cloud-sel').value)]; if (!it) return;
  const date = state.meta.date, local = state.records && state.records[date];
  const localHas = !state.sample && local && state.meta.cls === it.cls && Object.values(local.kids).some(k => k.att);
  if (localHas && it.hasRecord && !cloudArmed){
    cloudArmed = true; btn.textContent = '這台已有這天的紀錄，再按一次用雲端版本取代';
    setTimeout(() => { cloudArmed = false; if (btn.isConnected) btn.textContent = '載入'; }, 4000); return;
  }
  cloudArmed = false; btn.disabled = true; btn.textContent = '載入中…';
  try {
    const d = await getJSON(`${recEndpoint()}?${new URLSearchParams({action:'load', date, cls:it.cls, subject:it.subject, code:recCode()})}`);
    if (!d.ok){ cloudHint('載入失敗：' + errMsg(d.error)); return; }
    applyCloud(d, it, date);
  } catch(err){ cloudHint('連不到接收程式，請確認網路。'); }
  finally { btn.disabled = false; btn.textContent = '載入'; }
}
function applyCloud(d, it, date){
  if (state.sample){ state = blankState(); state.students = []; }
  const P = d.plan, m = state.meta;
  Object.assign(m, {cls:it.cls, date, teacher:(P && P.meta.teacher) || it.teacher || m.teacher});
  if (DATA.subjects[it.subject]) m.subject = it.subject;
  const keep = new Map(state.students.map(s => [s.name, s]));
  const mk = (name, grade) => { const k = keep.get(name); return Object.assign(k ? {...k} : blankStudent(), {name, grade: grade || (k && k.grade) || ''}); };
  if (P){
    const pm = P.meta, tk = Object.keys(TEMPLATES).find(k => TEMPLATES[k].label === pm.template);
    if (tk) m.template = tk;
    // 每個任務幾分鐘：取排課裡最常出現的長度
    const cnt = {}; P.students.forEach(s => s.tasks.forEach(t => { if (TASK_LENGTHS.includes(t.min)) cnt[t.min] = (cnt[t.min] || 0) + 1; }));
    const best = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0]; if (best) m.taskLen = Number(best);
    Object.assign(m, {week:pm.week || '', calm:pm.calm || '', reminder:pm.reminder || '', tools:pm.tools || ''});
    // 用任務的開始／結束時間還原時段配置：任務之間有空檔就是下課
    const hm = v => { const x = String(v || '').match(/(\d{1,2}):(\d{2})/); if (!x) return null; let h = Number(x[1]); if (/下午|PM/i.test(v) && h < 12) h += 12; return h * 60 + Number(x[2]); };
    const ref = P.students.find(st => st.tasks.length);
    if (ref && ref.tasks.every(t => hm(t.start) != null && hm(t.end) != null)){
      const items = []; let prev = null;
      ref.tasks.slice().sort((x, y) => x.no - y.no).forEach(t => {
        const st = hm(t.start), en = hm(t.end);
        if (prev != null && st > prev) items.push({k:'b', min:st - prev});
        items.push({k:'t', min:en - st}); prev = en;
      });
      const n = normLayout(items);
      m.layout = sameLayout(n, defaultLayout()) ? null : n;
      // 這台裝置還沒存過這班的固定時段，就用雲端這份
      if (m.layout && !savedLayouts()[layoutKey()]){ const all = savedLayouts(); all[layoutKey()] = n; store.set(LAYOUT_KEY, all); }
    } else syncLayout();
    state.students = P.students.map(s => {
      const st = mk(s.name, s.grade), tasks = {};
      let cur = s.start || '';   // 單元和前一個本科任務相同就留空，保留「同上」的效果
      s.tasks.slice().sort((x, y) => x.no - y.no).forEach(t => {
        const ty = EXTRA_TYPES[t.type] ? t.type : '';
        if (!ty && t.unit && t.unit !== cur){ var unit = t.unit; cur = t.unit; } else unit = '';
        if (!t.act && !ty) return;
        tasks['t' + t.no] = ty === '家課' ? {type:ty, unit:t.unit || '', act:'學校作業'} : ty === '其他' ? {type:ty, unit:t.unit || '', act:t.act || ''} : ty ? {type:ty, unit:'', act:t.act || ''} : {unit, act:t.act};
      });
      const backups = ['', '', '']; (s.backups || []).forEach(b => { if (b.no >= 1 && b.no <= 3) backups[b.no - 1] = b.act || ''; });
      return Object.assign(st, {start:s.start || '', note:s.note || '', tasks, backups});
    });
  } else if (d.records.length){
    state.students = d.records.map(o => mk(o['學生'], o['年級']));
  }
  if (!state.records) state.records = {};
  const latest = cloudLatest(d);
  if (d.records.length || d.feel){
    const day = state.records[date] = {kids:{}, feel:{}};
    d.records.forEach(o => { const st = state.students.find(s => s.name === o['學生']); if (st) day.kids[st.id] = parseRec(o, st); });
    if (d.feel){ const f = d.feel, mood = MOODS.find(x => x[1] === f['教學天氣']); day.feel = {mood: mood ? mood[0] : '', good:f['順利的地方'] || '', stuck:f['卡住的地方'] || '', help:f['想請協助'] || ''}; }
  }
  const day = dayRec(); day.loadedAt = latest || nowStamp(); delete day.sentAt;
  ui.cur = 0; $('#cloud-box').hidden = true; $('#cloud-btn').hidden = false;
  renderMetaValues(); render();
  const parts = [P ? `${state.students.length} 位孩子和今日任務` : (d.records.length ? `${state.students.length} 位孩子（雲端沒有這天的排課，任務請到課前排課補上）` : '')];
  if (d.records.length) parts.push(`${d.records.length} 位孩子的課後紀錄`);
  toast(`已載入 ${it.cls}｜${it.subject}：` + parts.filter(Boolean).join('，'));
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ract]'); if (!b) return;
  const a = b.dataset.ract;
  if (a === 'cloud-open'){
    $('#cloud-box').hidden = false; $('#cloud-btn').hidden = true;
    $('#cloud-box').scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    cloudList(); return;
  }
  if (a === 'cloud-close'){ $('#cloud-box').hidden = true; $('#cloud-btn').hidden = false; return; }
  if (a === 'cloud-load'){ cloudLoad(b); return; }
});

/* ----- 初始化 ----- */
(() => {
  $('#r-endpoint').value = store.get(REPKEY) || '';
  $('#r-code').value = recCode();
  if (RECORD_ENDPOINT) $('#r-endpoint-field').hidden = true;
  renderEndpointTag();
})();

renderStatic(); renderMetaValues(); render(); getDownloads();
</script>
