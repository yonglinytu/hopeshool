<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HOPE 每日教學流程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 左側是班級設定與匯出的固定面板，右側是「每位孩子一條時間軸」的排課區，可切換成全班總表 */
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --ink:#1E3640; --muted:#5E7076; --line:#D8E0DF;
  --accent:#D9702A; --accent-ink:#FFFFFF; --accent-soft:#FCE9DA;
  --task:#E8F1FA; --task-line:#B8D2EA; --common:#EDF3EB; --common-ink:#4A684D;
  --warn:#A8461F; --ok:#2C7656; --focus:#2F6FA8;
  --font-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12191C; --surface:#1A2428; --ink:#E4ECEC; --muted:#98A9AD; --line:#2C3A3F;
  --accent:#EE8C47; --accent-ink:#1C1007; --accent-soft:#3A2617;
  --task:#172634; --task-line:#2D4961; --common:#1A2820; --common-ink:#A6C8A9;
  --warn:#F0895B; --ok:#5DC496; --focus:#7DB4E6; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12191C; --surface:#1A2428; --ink:#E4ECEC; --muted:#98A9AD; --line:#2C3A3F;
  --accent:#EE8C47; --accent-ink:#1C1007; --accent-soft:#3A2617;
  --task:#172634; --task-line:#2D4961; --common:#1A2820; --common-ink:#A6C8A9;
  --warn:#F0895B; --ok:#5DC496; --focus:#7DB4E6; color-scheme:dark;}
*{box-sizing:border-box}
html{color-scheme:light}body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
.app{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,4vw,34px);margin:2px 0 0;text-wrap:balance;line-height:1.2}
h1 .subj{color:var(--accent)}
.saved{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.saved::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.banner p{margin:0;flex:1 1 260px}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{display:contents}aside .panel:nth-child(1){order:1}aside .panel:nth-child(2){order:2}main{order:3}aside .panel:nth-child(3){order:4}}
aside{display:flex;flex-direction:column;gap:14px}
@media (min-width:901px){aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:2px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--font-display);font-weight:400;font-size:17px;margin:0}
.panel h2 small{font-family:var(--font-body);font-size:12px;color:var(--muted);margin-left:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label,.lbl{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:38px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg label{flex:1;position:relative;text-align:center;cursor:pointer;margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:7px 4px;font-size:14px;color:var(--ink);white-space:nowrap}
.seg label+label span{border-left:1px solid var(--line)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-2px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px}
button:hover{border-color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.primary:hover{filter:brightness(1.05);border-color:var(--accent)}
.link{border:none;background:none;color:var(--focus);padding:2px 4px;font-size:13px}
.link:hover{text-decoration:underline}
.danger{color:var(--warn)}
.roster{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:8px;padding:10px}
.roster .row2{grid-template-columns:1fr}.roster .row2 select{background:var(--surface)}
.roster .hint .link{font-size:12.5px}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exports .wide{grid-column:1/-1}
.status{font-size:13px;margin:0;color:var(--muted)}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.status .miss,.status.miss{color:var(--warn)}
.status.ok{color:var(--ok)}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
details[open] summary{margin-bottom:8px}

main{min-width:0;display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.viewseg{width:auto}
.viewseg label span{padding:6px 16px}
.kids{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.kid{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 12px;min-width:92px;text-align:left}
.kid .kid-name{font-weight:700;font-size:14.5px}
.kid .kid-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kid[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.kid.add{justify-content:center;align-items:center;color:var(--muted);border-style:dashed}
.meter{width:100%;height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}

.kid-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1.2fr .8fr 1.6fr;gap:10px 12px}
.kid-head .note{grid-column:1/-1}
.kid-head .actions{grid-column:1/-1;display:flex;justify-content:flex-end}
@media (max-width:560px){.kid-head{grid-template-columns:1fr 1fr}.kid-head .start{grid-column:1/-1}}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.time{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.common{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:var(--common);color:var(--common-ink)}
.common .seg-name{flex:1;font-size:14px}
.common .tag{font-size:11.5px;letter-spacing:.06em;opacity:.8}
.block{border:1px solid var(--task-line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.block-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 12px;background:var(--task);border-bottom:1px solid var(--task-line)}
.block-head .seg-name{font-weight:700;flex:1}
.block-head .mins{font-size:12.5px;color:var(--muted)}
.task{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px 14px;padding:10px 12px}
.task+.task{border-top:1px dashed var(--line)}
.task-side{display:flex;flex-direction:column;gap:2px}
.task-no{font-family:var(--font-display);font-size:16px}
.task-side .mins{font-size:12.5px;color:var(--muted)}
.task-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.field.span{grid-column:1/-1}
.hint .warn,.warn{color:var(--warn)}
.tseg{display:flex;align-self:flex-start;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tseg label{position:relative;cursor:pointer}
.tseg input{position:absolute;opacity:0;pointer-events:none}
.tseg span{display:block;padding:3px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tseg label+label span{border-left:1px solid var(--line)}
.tseg input:checked+span{background:var(--task);color:var(--ink);font-weight:700}
.tseg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-2px}
.task.extra{background:color-mix(in srgb,var(--common) 55%,var(--surface))}
.grid .cell .ty{font-weight:700;color:var(--common-ink)}
.task-side .link{align-self:flex-start;padding-left:0;margin-top:4px}
.task-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px}
.task.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
@media (max-width:620px){.task{grid-template-columns:1fr}.task-side{flex-direction:row;align-items:baseline;gap:10px;flex-wrap:wrap}.task-side .link{margin:0 0 0 auto}.task-fields{grid-template-columns:1fr}}

.backups{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.backups h3{font-family:var(--font-display);font-weight:400;font-size:17px;margin:0}
.backups .list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.backups .list{grid-template-columns:1fr}}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font-family:var(--font-display);font-weight:400;font-size:20px;margin:0}

.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.grid{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.grid thead th{position:sticky;top:0;background:var(--surface);font-weight:700;z-index:1}
.grid th small{display:block;font-weight:400;color:var(--muted)}
.grid .r-common td{background:var(--common);color:var(--common-ink)}
.grid .r-block td{background:var(--task);font-weight:700;font-size:13px}
.grid .r-pre td{background:var(--bg)}
.grid .cell{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:none;background:none;padding:2px;border-radius:6px;min-width:120px}
.grid .cell:hover{background:var(--accent-soft)}
.grid .cell .u{font-size:12px;color:var(--muted)}
.grid .cell .a.none{color:var(--line)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.copybox{width:100%;height:120px;font-family:var(--font-num);font-size:12px}
@media (prefers-reduced-motion:reduce){.task.flash{animation:none}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <p class="eyebrow">永齡希望小學 雲科大分校 · 課輔老師用</p>
      <h1><span class="subj" id="h-subj">英語</span> 每日教學流程</h1>
    </div>
    <span class="saved" id="saved">自動儲存在這台裝置</span>
  </header>

  <div id="banner"></div>

  <div class="layout">
    <aside>
      <section class="panel" aria-labelledby="h-class">
        <h2 id="h-class">班級與日期</h2>
        <div class="roster" id="roster"></div>
        <input type="file" id="roster-file" accept=".xlsx,.xls,.csv" hidden>
        <div class="row2">
          <div class="field"><label for="m-cls">課輔班別</label><input id="m-cls" data-m="cls" placeholder="例如：林頭1班"></div>
          <div class="field"><label for="m-teacher">課輔老師</label><input id="m-teacher" data-m="teacher"></div>
        </div>
        <div class="field"><span class="lbl" id="lbl-subj">科目</span>
          <div class="seg" role="radiogroup" aria-labelledby="lbl-subj" id="subj-seg"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="m-date">日期</label><input id="m-date" type="date" data-m="date"></div>
          <div class="field"><label for="m-week">第幾週</label><input id="m-week" type="number" min="1" max="30" inputmode="numeric" data-m="week"></div>
        </div>
        <div class="field"><label for="m-template">時段類型</label><select id="m-template" data-m="template"></select></div>
        <div class="field"><span class="lbl" id="lbl-len">每個任務</span>
          <div class="seg" role="radiogroup" aria-labelledby="lbl-len" id="len-seg"></div>
          <p class="hint" id="len-hint"></p>
        </div>
      </section>

      <section class="panel" aria-labelledby="h-common">
        <h2 id="h-common">班級共通規劃</h2>
        <div class="field"><label for="m-calm">靜心活動</label><select id="m-calm" data-m="calm"></select></div>
        <div class="field"><label for="m-reminder">班級提醒／默契</label><textarea id="m-reminder" data-m="reminder" rows="2"></textarea></div>
        <div class="field"><label for="m-tools">教具／備註</label><input id="m-tools" data-m="tools"></div>
      </section>

      <section class="panel" aria-labelledby="h-export">
        <h2 id="h-export">完成後送出</h2>
        <p class="status" id="status"></p>
        <p class="status" id="send-result" aria-live="polite"></p>
        <div class="exports">
          <button class="primary wide" id="x-sheet">傳送到 Google 試算表</button>
          <button id="x-xlsx">下載 Excel</button>
          <button id="x-csv">下載 CSV</button>
          <button class="wide" id="x-copy">複製表格（貼到試算表）</button>
        </div>
        <p class="hint" id="endpoint-tag"></p>
        <div id="copy-fallback" hidden>
          <p class="hint">這裡不能直接寫入剪貼簿，請全選下面的內容後複製：</p>
          <textarea class="copybox" id="copy-text" readonly></textarea>
        </div>
        <details id="sheet-settings">
          <summary>Google 試算表連線設定</summary>
          <div class="field"><label for="m-endpoint">試算表接收網址（Apps Script 網頁應用程式）</label><input id="m-endpoint" placeholder="https://script.google.com/macros/s/…/exec"></div>
          <p class="hint">由督導提供。設定一次後，這台裝置會記住。</p>
        </details>
      </section>
    </aside>

    <main>
      <div class="toolbar">
        <div class="seg viewseg" role="radiogroup" aria-label="檢視方式">
          <label><input type="radio" name="view" value="child" id="v-child"><span>逐位排課</span></label>
          <label><input type="radio" name="view" value="grid" id="v-grid"><span>全班總表</span></label>
        </div>
        <span class="hint" id="flow-hint"></span>
      </div>
      <div class="kids" role="tablist" aria-label="孩子名單" id="kids"></div>
      <div id="view"></div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<datalist id="acts"></datalist>
<datalist id="acts-all"></datalist>
<datalist id="acts-read"></datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== 督導可修改的設定 ===== */
// 部署到學校網站後，把 Apps Script 的網址貼在這裡，老師就不用自己設定
const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyEAgUVxlvbReJ5qbCPbI9viif48EPG8sJakgo-BubTs41vYVjPOkoM6TQFSY3e-OzkCQ/exec';

// 各時段類型的固定流程：只有開頭的暖身、點名和最後的統整是全班共同，中間全部依「每個任務」的分鐘數切成任務
const tpl = (start, end) => {
  const a = toMin(start), b = toMin(end);
  return [['暖身時間（入場券）', fmt(a), fmt(a+5)],
          ['點名／靜心／任務分派', fmt(a+5), fmt(a+10)],
          ['上課時間（適時巡堂）', fmt(a+10), fmt(b-15), 'task'],
          ['統整時間（出場券）', fmt(b-15), fmt(b)]];
};
const TEMPLATES = {
  '4h':   {label:'4 小時（12:30–16:30）', items:tpl('12:30','16:30')},
  '3.5h': {label:'3.5 小時（12:30–16:00）', items:tpl('12:30','16:00')},
  '3h':   {label:'3 小時（13:00–16:00）', items:tpl('13:00','16:00')},
  '1.5h': {label:'1.5 小時（16:00–17:30）', items:tpl('16:00','17:30')},
  '1h':   {label:'1 小時（16:00–17:00）', items:tpl('16:00','17:00')}
};
const TASK_LENGTHS = [10,15,20];

// 把一段上課時間切成任務：以 5 分鐘為單位平均分配，較長的放前面
function slice(L, N){
  const n = Math.max(1, Math.round(L/N - 0.01));
  const units = L/5, base = Math.floor(units/n), extra = units - base*n;
  return Array.from({length:n}, (_,i) => (base + (i < extra ? 1 : 0)) * 5);
}
function buildFlow(){
  const tpl = TEMPLATES[state.meta.template] || TEMPLATES['4h']; let no = 0;
  return tpl.items.map(([name,s,e,kind]) => {
    const a = toMin(s), b = toMin(e);
    if (kind !== 'task') return {kind:'common', name, start:s, end:e, min:b-a};
    let t = a;
    const tasks = slice(b-a, state.meta.taskLen).map(len => { const x = {no:++no, start:fmt(t), end:fmt(t+len), min:len}; t += len; return x; });
    return {kind:'block', name, start:s, end:e, min:b-a, tasks};
  });
}

function resolved(st, tasks){
  let cur = st.start || ''; const out = {}, before = {};
  for (const t of tasks){
    const v = st.tasks['t'+t.no] || {}; before[t.no] = cur;
    if (taskType(v)){ out[t.no] = v.unit || ''; continue; }
    if (v.unit) cur = v.unit; out[t.no] = cur;
  }
  out.before = before; return out;
}

/* ===== 學童名冊（只存在這台裝置） ===== */
const RKEY = 'hope-lesson-plan-roster-v2';
let roster = store.get(RKEY);   // {file, importedAt, groups:[{cls, subject, teachers[], students[{name,grade}]}]}
const GRADE_CH = '一二三四五六';
const normGrade = g => { const s = String(g||'').trim(); const i = GRADE_CH.indexOf(s.charAt(0)); return i >= 0 ? GRADE_CH[i] + '年級' : s; };
const normSubj = s => String(s||'').replace(/\s+/g,'').replace(/\//g,'／');
const splitNames = s => String(s||'').split(/[\/／、,，\s]+/).map(x => x.trim()).filter(Boolean);
// 支援兩種名冊：每列都填滿的「課輔編班報表」，以及用合併儲存格往下延續的舊版名冊
function parseRoster(aoa){
  const hi = aoa.findIndex(r => r && r.some(v => String(v ?? '').replace(/\s/g,'').includes('學生姓名')));
  if (hi < 0) throw new Error('找不到「學生姓名」欄位，請確認選的是學童名冊');
  const H = aoa[hi].map(v => String(v ?? '').replace(/\s/g,''));
  const col = k => H.findIndex(h => h.includes(k));
  const c = {cls: col('班別') >= 0 ? col('班別') : col('班級'), subj:col('科目'), tch:col('老師'), grade:col('年級'), name:col('學生姓名')};
  if (c.cls < 0) throw new Error('找不到「班級名稱」或「課輔班別」欄位');
  const map = new Map(); let cls = '', subj = '', tch = '';
  for (const r of aoa.slice(hi+1)){
    if (!r) continue;
    const v = k => c[k] >= 0 ? String(r[c[k]] ?? '').trim() : '';
    if (!['cls','subj','tch','name'].some(k => v(k))) continue;
    if (v('cls') && v('cls') !== cls){ cls = v('cls'); subj = ''; tch = ''; }
    if (v('subj')) subj = normSubj(v('subj'));
    if (v('tch')) tch = v('tch');
    if (!DATA.subjects[subj] || !v('name')) continue;   // 只收國語、英語、數學；家課／閱讀改在排課時選填
    const key = [cls, subj, tch].join('|');
    if (!map.has(key)) map.set(key, {cls, subject:subj, teachers:splitNames(tch), students:[]});
    const g = map.get(key);
    if (!g.students.some(s => s.name === v('name'))) g.students.push({name:v('name'), grade:normGrade(v('grade'))});
  }
  const out = [...map.values()];
  if (!out.length) throw new Error('名冊裡沒有讀到任何國語、英語或數學的學生');
  return out;
}

function applyRoster(){
  const g = roster.groups[ui.rGi]; if (!g) return;
  const studs = g.students;
  if (state.sample){ state = blankState(); state.students = []; }
  Object.assign(state.meta, {cls:g.cls, teacher:g.teachers.join('、')});
  if (DATA.subjects[g.subject]) state.meta.subject = g.subject;
  const byName = new Map(state.students.map(s => [s.name, s]));
  state.students = studs.map(s => { const old = byName.get(s.name); return old ? {...old, grade:s.grade || old.grade} : {...blankStudent(), name:s.name, grade:s.grade}; });
  ui.cur = 0; ui.view = 'child'; renderMetaValues(); render();
  toast(`已帶入 ${g.cls}｜${g.subject}，共 ${studs.length} 位孩子`);
}
$('#roster-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (!window.XLSX){ toast('Excel 元件還沒載入，請稍等幾秒再試'); return; }
  try {
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:null, raw:false});
    roster = {file:f.name, importedAt:new Date().toISOString(), groups:parseRoster(aoa)};
    store.set(RKEY, roster); ui.rCls = null; ui.rGi = null; renderRoster();
    toast(`已匯入名冊：${rosterClasses().length} 班、${roster.groups.length} 組`);
  } catch(err){ toast('匯入失敗：' + (err.message || '檔案讀不出來')); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'r-cls'){ ui.rCls = e.target.value; ui.rGi = null; renderRoster(); }
  if (e.target.id === 'r-group'){ ui.rGi = Number(e.target.value); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act === 'import-roster') $('#roster-file').click();
  if (b.dataset.act === 'apply-roster') applyRoster();
  if (b.dataset.act === 'clear-roster'){ roster = null; try { localStorage.removeItem(RKEY); } catch(err){} renderRoster(); toast('已從這台裝置清除名冊'); }
});

/* ===== 匯出 ===== */
const HEAD = ['排課編號','日期','週次','班別','課輔老師','科目','時段類型','靜心活動','班級提醒','教具備註',
  '學生','年級','今日進度','課前提醒','類別','任務類型','序','開始','結束','分鐘','單元／教材','任務內容'];
const planId = () => [state.meta.date, state.meta.cls || '未填班別', state.meta.subject].join('_');
function rows(){
  const m = state.meta, tasks = allTasks(buildFlow()), pid = planId(), out = [];
  state.students.forEach(st => {
    const res = resolved(st, tasks);
    const base = [pid, m.date, m.week, m.cls, m.teacher, m.subject, TEMPLATES[m.template].label, m.calm, m.reminder, m.tools, st.name, st.grade, st.start, st.note];
    tasks.forEach(t => { const v = st.tasks['t'+t.no] || {}; out.push([...base, '課中任務', taskType(v) || m.subject, t.no, t.start, t.end, t.min, res[t.no]||'', v.act||'']); });
    st.backups.forEach((b,i) => { if (b) out.push([...base, '備用任務', '', i+1, '', '', '', '', b]); });
  });
  return out;
}
const fileBase = () => `教學流程_${state.meta.cls || '班別'}_${state.meta.subject}_${state.meta.date || today()}`;
let dlPromise;
function getDownloads(){
  if (!dlPromise) dlPromise = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  return dlPromise;
}
async function saveFile(name, data){
  const ns = await getDownloads();
  if (ns){
    try { await ns.save({filename:name, data}); toast('已下載 ' + name); }
    catch(err){ toast(err && err.code === 'declined' ? '已取消下載' : '這裡無法下載，請改用「複製表格」'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('已下載 ' + name);
}
function buildXlsx(){
  const m = state.meta, S = state.students, flow = buildFlow(), tasks = allTasks(flow), R = S.map(s => resolved(s, tasks));
  const aoa = [[`${m.cls} ${m.subject} 每日教學流程`],
    [`日期 ${m.date}　第 ${m.week||'＿'} 週　課輔老師 ${m.teacher}　${TEMPLATES[m.template].label}　每個任務 ${m.taskLen} 分鐘`],
    [`靜心活動：${m.calm}　班級提醒：${m.reminder}　教具：${m.tools}`], [],
    ['時間','段落', ...S.map(s => s.name + (s.grade ? `（${s.grade}）` : ''))],
    ['課前','今日進度', ...S.map(s => s.start)],
    ['課前','課前提醒', ...S.map(s => s.note)]];
  const merges = [];
  for (const it of flow){
    if (it.kind === 'common'){ merges.push({s:{r:aoa.length,c:2}, e:{r:aoa.length,c:Math.max(2, 1+S.length)}}); aoa.push([`${it.start}-${it.end}`, it.name, '（全班共同）']); continue; }
    it.tasks.forEach(t => aoa.push([`${t.start}-${t.end}`, `${it.name}｜任務 ${t.no}`, ...S.map((s,i) => { const v = s.tasks['t'+t.no] || {}, ty = taskType(v); return (ty ? `【${ty}】` : '') + [R[i][t.no], v.act].filter(Boolean).join('｜'); })]));
  }
  [0,1,2].forEach(i => aoa.push(['備用任務', `第 ${i+1} 項`, ...S.map(s => s.backups[i] || '')]));
  const ws1 = XLSX.utils.aoa_to_sheet(aoa);
  ws1['!merges'] = merges; ws1['!cols'] = [{wch:13},{wch:30}, ...S.map(() => ({wch:30}))];
  const ws2 = XLSX.utils.aoa_to_sheet([HEAD, ...rows()]);
  ws2['!cols'] = HEAD.map(h => ({wch: ['任務內容','單元／教材','排課編號','時段類型'].includes(h) ? 24 : 11}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, '總表');
  XLSX.utils.book_append_sheet(wb, ws2, '明細');
  return new Blob([XLSX.write(wb, {bookType:'xlsx', type:'array'})]);
}
const csvCell = v => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
$('#x-xlsx').addEventListener('click', () => {
  if (!window.XLSX){ toast('Excel 元件還沒載入，請稍等或改用 CSV'); return; }
  saveFile(fileBase() + '.xlsx', buildXlsx());
});
$('#x-csv').addEventListener('click', () => {
  saveFile(fileBase() + '.csv', '﻿' + [HEAD, ...rows()].map(r => r.map(csvCell).join(',')).join('\r\n'));
});
$('#x-copy').addEventListener('click', () => {
  const tsv = [HEAD, ...rows()].map(r => r.map(v => String(v ?? '').replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
  const fallback = () => { $('#copy-fallback').hidden = false; const t = $('#copy-text'); t.value = tsv; t.focus(); t.select(); };
  try {
    navigator.clipboard.writeText(tsv).then(() => { $('#copy-fallback').hidden = true; toast('已複製，到 Google 試算表點一格後貼上'); }, fallback);
  } catch(err){ fallback(); }
});
$('#x-sheet').addEventListener('click', async () => {
  const url = SHEET_ENDPOINT || (store.get(EPKEY) || '').trim();
  if (!url){ const d = $('#sheet-settings'); d.hidden = false; d.open = true; $('#m-endpoint').focus(); toast('請先貼上督導提供的試算表接收網址'); return; }
  const miss = [['cls','班別'],['teacher','課輔老師'],['date','日期']].filter(([k]) => !String(state.meta[k]||'').trim());
  if (miss.length){ toast('送出前請先填：' + miss.map(x => x[1]).join('、')); return; }
  const btn = $('#x-sheet'); btn.disabled = true; btn.textContent = '傳送中…';
  const body = JSON.stringify({planId: planId(), headers: HEAD, rows: rows()});
  const time = new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
  const show = (ok, msg) => { const el = $('#send-result'); el.className = 'status ' + (ok ? 'ok' : 'miss'); el.textContent = `${time}　${msg}`; toast(msg); };
  try {
    // 讀得到 Google 的回覆，成功或失敗都照實顯示
    const res = await fetch(url, {method:'POST', body});
    const text = await res.text();
    let data = null; try { data = JSON.parse(text); } catch(e){}
    if (data && data.ok) show(true, `試算表已收到 ${data.rows} 筆。同一天同班同科目再送會覆蓋舊紀錄`);
    else if (data) show(false, '試算表回報錯誤：' + data.error);
    else if (/accounts\.google|ServiceLogin|登入/.test(text)) show(false, '沒有送進去：接收程式需要登入才能用，請督導把部署的「誰可以存取」改成「任何人」');
    else show(false, '沒有送進去：Google 回傳的不是預期的內容，請督導到 Apps Script 重新授權並部署新版本');
  } catch(err){
    // 讀不到回覆（例如網路或瀏覽器限制）時，改用不讀回覆的方式再送一次
    try {
      await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body});
      show(true, '已送出，但無法確認試算表是否收到，請到試算表檢查');
    } catch(err2){ show(false, '沒有送出：這個頁面連不到 Google。請改用下載或複製表格'); }
  } finally { btn.disabled = false; btn.textContent = '傳送到 Google 試算表'; }
});
// 顯示接收網址尾碼，方便確認開的是哪一版檔案
(() => { const u = SHEET_ENDPOINT || (store.get(EPKEY) || ''); const m = u.match(/\/s\/([^/]+)\/exec/); $('#endpoint-tag').textContent = m ? `接收程式 …${m[1].slice(-6)}` : '尚未設定接收網址'; })();

renderStatic(); renderMetaValues(); render(); getDownloads();
</script>

</body>
