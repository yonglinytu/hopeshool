<style>
:root {
  --yellow: #F5C842;
  --yellow-bg: #FFFBEA;
  --green: #4CAF7D;
  --green-bg: #F0FFF6;
  --blue: #5B9BD5;
  --blue-bg: #EEF5FF;
  --orange: #F4844B;
  --orange-bg: #FFF5EE;
  --purple: #9B72CF;
  --purple-bg: #F8F0FF;
  --red: #E05B5B;
  --red-bg: #FFF0F0;
  --rainbow: #888;
  --rainbow-bg: #F8F8F8;
  --text: #2A2A2A;
  --text-light: #666;
  --bg: #FAFAF8;
  --card-bg: #FFFFFF;
  --border: #EDEDE8;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --shadow-hover: 0 6px 24px rgba(0,0,0,0.13);
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ─── Header ─── */
.site-header {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.site-header a {
  color: var(--text-light);
  text-decoration: none;
  font-size: 14px;
}
.site-header a:hover { color: var(--text); }
.site-header .sep { color: var(--border); }

.hero {
  background: linear-gradient(135deg, #FFFBEA 0%, #F0FFF6 50%, #EEF5FF 100%);
  padding: 48px 24px 36px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.hero h1 {
  font-family: 'Noto Serif TC', serif;
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.hero p {
  color: var(--text-light);
  font-size: 15px;
  margin-bottom: 24px;
}
.stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
}
.stat {
  text-align: center;
}
.stat-num {
  font-family: 'Noto Serif TC', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
}
.stat-label {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 2px;
}

/* ─── Layout ─── */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 16px;
}

.main-layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 0;
  min-height: calc(100vh - 200px);
}

/* ─── Sidebar ─── */
.sidebar {
  background: #fff;
  border-right: 1px solid var(--border);
  padding: 24px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.filter-group {
  margin-bottom: 28px;
}
.filter-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--text-light);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.filter-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1.5px solid transparent;
  background: transparent;
  cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 4px;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.filter-btn:hover {
  background: var(--bg);
  color: var(--text);
}
.filter-btn.active {
  background: var(--text);
  color: #fff;
  border-color: var(--text);
}
.filter-btn .count {
  margin-left: auto;
  font-size: 11px;
  opacity: 0.6;
}

/* 家族顏色 */
.btn-yellow.active { background: var(--yellow); color: #2A2A2A; border-color: var(--yellow); }
.btn-green.active { background: var(--green); color: #fff; border-color: var(--green); }
.btn-blue.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-orange.active { background: var(--orange); color: #fff; border-color: var(--orange); }
.btn-purple.active { background: var(--purple); color: #fff; border-color: var(--purple); }
.btn-red.active { background: var(--red); color: #fff; border-color: var(--red); }
.btn-rainbow.active { background: linear-gradient(90deg, #F5C842,#4CAF7D,#5B9BD5,#F4844B,#9B72CF,#E05B5B); color: #fff; border-color: #999; }

/* ─── Content ─── */
.content {
  padding: 24px;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.search-wrap {
  flex: 1;
  min-width: 180px;
  position: relative;
}
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-light);
}
.search-input {
  width: 100%;
  padding: 10px 12px 10px 38px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  background: #fff;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
.search-input:focus {
  border-color: #aaa;
}
.result-count {
  font-size: 13px;
  color: var(--text-light);
  white-space: nowrap;
}

/* 時間篩選 */
.time-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.time-btn {
  padding: 6px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: #fff;
  cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 12px;
  color: var(--text-light);
  transition: all 0.15s;
}
.time-btn:hover { border-color: #aaa; color: var(--text); }
.time-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

/* ─── Cards Grid ─── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1.5px solid var(--border);
  padding: 18px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
  border-color: #ccc;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.card.fam-yellow::before { background: var(--yellow); }
.card.fam-green::before { background: var(--green); }
.card.fam-blue::before { background: var(--blue); }
.card.fam-orange::before { background: var(--orange); }
.card.fam-purple::before { background: var(--purple); }
.card.fam-red::before { background: var(--red); }
.card.fam-rainbow::before { background: linear-gradient(90deg, #F5C842,#4CAF7D,#5B9BD5,#F4844B,#9B72CF,#E05B5B); }

.card-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.card-code {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-light);
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
  flex-shrink: 0;
}
.card-name {
  font-family: 'Noto Serif TC', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.card-family {
  font-size: 12px;
  color: var(--text-light);
}
.card-time {
  font-size: 12px;
  color: var(--text-light);
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 4px;
}
.card-part {
  font-size: 11px;
  color: var(--text-light);
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.card-sel {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.sel-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  color: #fff;
  font-weight: 500;
}
.sel-awareness { background: #5B9BD5; }
.sel-social { background: #4CAF7D; }
.sel-management { background: #F4844B; }
.sel-relationship { background: #9B72CF; }
.sel-decision { background: #E05B5B; }

.empty-state {

  padding: 60px 20px;
  color: var(--text-light);
  grid-column: 1 / -1;
}
.empty-state .emoji { font-size: 40px; margin-bottom: 12px; }

/* ─── Modal ─── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  backdrop-filter: blur(2px);
  overflow-y: auto;
  padding: 24px 16px;
}
.modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
.modal {
  background: #fff;
  border-radius: 16px;
  max-width: 720px;
  width: 100%;
  padding: 32px;
  position: relative;
  margin: auto;
}
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--text-light);
  transition: all 0.15s;
}
.modal-close:hover { background: var(--bg); color: var(--text); }
.modal-family-bar {
  height: 4px;
  border-radius: 2px;
  margin-bottom: 20px;
}
.modal-body { line-height: 1.8; }
.modal-body h2.act-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text);
}
.modal-body .act-meta {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.modal-body .section-head {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  margin: 20px 0 8px;
  padding-left: 10px;
  border-left: 3px solid var(--border);
}
.modal-body p {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 8px;
}
.modal-body ol {
  padding-left: 20px;
  margin-bottom: 12px;
}
.modal-body li {
  font-size: 14px;
  margin-bottom: 6px;
  line-height: 1.7;
}
.modal-body blockquote.quote {
  background: var(--bg);
  border-left: 3px solid #ddd;
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
  font-style: italic;
  font-size: 13px;
  color: var(--text-light);
  margin: 12px 0;
}

/* Print button */
.modal-actions {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
.btn-print {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: #fff;
  cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px;
  color: var(--text-light);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;

.btn-print:hover { border-color: #aaa; color: var(--text); background: var(--bg); }

/* ─── Mobile ─── */
@media (max-width: 768px) {
  .main-layout {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }
  .filter-btn {
    display: inline-flex;
    width: auto;
    margin-right: 6px;
    margin-bottom: 6px;
  }
  .content { padding: 16px; }
}

@media print {
  .site-header, .hero, .sidebar, .toolbar, .modal-actions, .modal-close { display: none !important; }
  .modal-overlay { display: block !important; position: static !important; padding: 0; background: none; }
  .modal { box-shadow: none; border-radius: 0; max-width: 100%; }
  .cards-grid { display: none !important; }
}
</style>

<!-- ===== PASSWORD GATE ===== -->
<div id="pwGate" style="position:fixed;inset:0;z-index:99999;background:#f5f0e8;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="background:white;border-radius:24px;padding:48px 40px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(42,32,24,0.12);text-align:center;">
    <div style="width:56px;height:56px;border-radius:16px;background:#e4f0e4;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:1.6rem;">&#x1F512;</div>
    <div style="font-family:'Noto Serif TC',serif;font-size:1.3rem;font-weight:400;color:#2a2018;margin-bottom:8px;">請輸入密碼</div>
    <div style="font-family:'Noto Sans TC',sans-serif;font-size:0.85rem;color:#9a8878;margin-bottom:32px;line-height:1.7;">此資源僅供永齡希望小學<br>與相關教育夥伴使用</div>
    <input id="pwInput" type="password" placeholder="請輸入密碼"
      style="width:100%;padding:12px 18px;border:1.5px solid rgba(42,32,24,0.15);border-radius:12px;font-family:'Noto Sans TC',sans-serif;font-size:0.95rem;color:#2a2018;background:#faf6f0;outline:none;margin-bottom:12px;transition:border-color 0.2s;"
      onfocus="this.style.borderColor='#4a8c8c'"
      onblur="this.style.borderColor='rgba(42,32,24,0.15)'"
      onkeydown="if(event.key==='Enter')checkPw()">
    <div id="pwError" style="font-size:0.8rem;color:#c0503a;margin-bottom:12px;height:18px;font-family:'Noto Sans TC',sans-serif;"></div>
    <button onclick="checkPw()"
      style="width:100%;padding:13px;border-radius:12px;border:none;background:#4a8c8c;color:white;font-family:'Noto Sans TC',sans-serif;font-size:0.95rem;cursor:pointer;transition:background 0.2s;"
      onmouseover="this.style.background='#2d6464'"
      onmouseout="this.style.background='#4a8c8c'">進入</button>
    <div style="margin-top:20px;font-size:0.75rem;color:#c8b8a8;font-family:'Noto Sans TC',sans-serif;">永齡希望小學雲科大分校 SEL 資源中心</div>
  </div>
</div>

<script>
(function(){
  const KEY = 'sel_auth';
  const HASH = '1b14e200a08bbe35510f106a1eb60a7834c3672a40a794009cb871b1910058f4';
  async function sha256(msg){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function checkPw(){
    const val = document.getElementById('pwInput').value;
    const h = await sha256(val);
    if(h === HASH){
      sessionStorage.setItem(KEY, '1');
      document.getElementById('pwGate').style.display = 'none';
    } else {
      const err = document.getElementById('pwError');
      err.textContent = '密碼錯誤，請再試一次';
      document.getElementById('pwInput').style.borderColor = '#c0503a';
      setTimeout(()=>{ err.textContent=''; document.getElementById('pwInput').style.borderColor='rgba(42,32,24,0.15)'; }, 2500);
    }
  }
  window.checkPw = checkPw;
  if(sessionStorage.getItem(KEY) === '1'){
    document.getElementById('pwGate').style.display = 'none';
  }
})();
<\/script>
<!-- ===== END PASSWORD GATE ===== -->

<script>
const ACTIVITIES = [{"code": "B-1", "name": "情緒小夥伴——開心", "family": "黃色家族", "emoji": "💛", "time": "10 分鐘", "sel": ["自我覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-1　情緒小夥伴——開心</h3><br><h3>💛 黃色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>認識並覺察開心的情緒；從影片觀察情緒的外在表現，連結自己的身體感受。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「認識情緒」影片（Inside Out: Guessing the feelings）、「情緒臉譜」學習單、探索盒外星人與外星寵物</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>播放影片片段（0:00–0:35）：https://www.youtube.com/watch?v=dOkyKyVFnSs，觀察影片中女孩的表情與動作。</li><br><li>教師提問：「影片中的女孩正在做什麼？臉上有什麼表情？身體做了哪些動作？你覺得她的心情如何？」引導學生說出「開心」的情緒。</li><br><li>延伸提問：「分享一件今天或近期感到開心的事。當你開心時，你的身體會有什麼動作？臉部會有什麼表情？」</li><br><li>情緒小夥伴任務：請孩子在探索盒中找出看起來開心的外星人與外星寵物。</li><br><li>搭配「情緒臉譜」學習單，畫出開心時的臉部表情，並用譬喻法形容：「我開心的像＿＿。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「開心的感覺，你的身體是怎麼回應的？是心跳變快？還是嘴角忍不住往上？今天我們要用我們自己的身體，來認識什麼叫做開心。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>特別適合低年級情緒辨識起步，也能融入繪本教學中。鼓勵孩子用具體的身體感受描述，而不只說「很開心」。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家後，試著觀察家人有沒有開心的樣子，記下你是從哪裡看出來的（表情、動作、聲音），明天可以和同學分享你的觀察。</p><p><h3>老師的延伸</h3><br>可製作班級「開心地圖」，整理孩子說出的開心來源，畫成視覺地圖貼在教室情緒牆。</p><p>---</p></div>"}, {"code": "B-2", "name": "情緒光譜——開心", "family": "黃色家族", "emoji": "💛", "time": "10 分鐘", "sel": ["自我覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-2　情緒光譜——開心</h3><br><h3>💛 黃色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>擴充「開心」的情緒詞彙，練習區辨開心的不同程度，建立細緻的情緒辨識能力。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>字典或網路字典（視需要）、「情緒光譜」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>全班共同腦力激盪：「開心」的相似詞有哪些？教師可視語文程度搭配字典引導。相似詞參考：高興、快樂、興奮、愉快、喜悅、雀躍、狂喜、欣喜、得意；成語參考：興高采烈、歡天喜地、欣喜若狂、笑逐顏開、心花怒放。</li><br><li>搭配「情緒光譜」學習單，請孩子從全班蒐集的詞彙中，自己選出五個，由弱到強排出「開心光譜」。</li><br><li>在情緒光譜上塗上黃色漸層，用深淺表現情緒的強弱。</li><br><li>兩兩分享排序，討論差異：「你為什麼把『狂喜』排在最強？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「開心不只有一種，有時候是小小的滿足，有時候是大大的雀躍。今天我們來幫開心排隊，看看它有多少個不同的程度。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>孩子排序可能不同，這很正常，正好用來說明「情緒感受是主觀的」。鼓勵孩子說出排序的理由。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天試著不只說「我很開心」，而是更精確地說：「我現在是＿＿（選一個今天學到的詞）的感覺。」看看說得更具體之後，對方的反應有什麼不同。</p><p><h3>老師的延伸</h3><br>可延伸為語文寫作：請學生用自選的情緒詞寫一段開心的經驗小故事。也可製作「情緒光譜詞彙本」作為班級共備素材。</p><p>---</p></div>"}, {"code": "B-3", "name": "情緒小偵探——開心", "family": "黃色家族", "emoji": "💛", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-3　情緒小偵探——開心</h3><br><h3>💛 黃色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習在生活中觀察自己與他人的開心情緒，培養情緒覺察的日常習慣。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒小偵探」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>導入：「你有注意到你今天什麼時候開心嗎？有人也開心嗎？」介紹今天的任務是當「情緒小偵探」。</li><br><li>說明學習單使用方式：可畫圖或寫字，記錄觀察到自己或他人開心的情況。範例：「我吃到布丁我很開心」；「妹妹拿到生日禮物很開心」。</li><br><li>回家觀察任務：請學生觀察生活中的開心情緒，記錄在學習單中。引導語：「開心的情緒，除了你有之外，周遭的人或動物有沒有？例如：媽媽看到我們吃完她煮的飯，她很開心。小狗看到我回家搖尾巴，牠很開心。」</li><br><li>下次課分享：回到教室後安排小組或全班分享觀察到的情緒故事。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「仔細看一看，用心找一找——我們每天都有很多情緒，小偵探們來找出生活周遭裡的所有開心情緒吧！」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>教師視學生狀況決定用寫或畫的方式記錄。以鼓勵性語言引導學生說出具體觀察，而非標籤情緒。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家當一天的情緒小偵探，找出至少三個開心的情緒畫面，記在學習單上，明天帶回來分享。</p><p><h3>老師的延伸</h3><br>可整理大家的觀察，製作班級「開心事件地圖」，標出哪些情境最常讓大家感到開心。</p><p>---</p></div>"}, {"code": "B-4", "name": "情緒小夥伴——難過", "family": "藍色家族", "emoji": "💙", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-4　情緒小夥伴——難過</h3><br><h3>💙 藍色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>認識並覺察難過的情緒；理解難過的非語言表現，連結自己的身體反應。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「認識情緒」影片（Inside Out 片段）、「情緒臉譜」學習單、探索盒外星人與外星寵物</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>播放影片片段（難過情緒段落），觀察影片中角色的表情與動作。</li><br><li>教師提問：「影片中的角色在難過時，臉上有什麼表情？身體做了哪些動作？」引導說出「難過」。</li><br><li>延伸提問：「你曾經有過難過的感覺嗎？是什麼事讓你難過？當你難過時，身體哪裡最有感覺？」</li><br><li>情緒小夥伴任務：在探索盒中找出看起來難過的外星人與外星寵物。</li><br><li>搭配學習單畫出難過時的表情，並用一句話或顏色表達難過的感覺。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「難過是一個很重要的情緒，它告訴我們有什麼事對我們來說很重要。今天我們要好好認識它。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>孩子分享難過經驗時，以接納與不評價的態度回應。不需要說「別難過了」，而是說「我聽到了」。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家後，試著觀察有沒有人（或自己）出現難過的表情，記下你是從哪裡看出來的。</p><p><h3>老師的延伸</h3><br>可引導孩子討論：難過的時候，什麼會讓你感覺好一點？整理成班級「陪伴小妙方」。</p><p>---</p></div>"}, {"code": "B-5", "name": "情緒光譜——難過", "family": "藍色家族", "emoji": "💙", "time": "10 分鐘", "sel": ["自我覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-5　情緒光譜——難過</h3><br><h3>💙 藍色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>擴充「難過」的情緒詞彙，練習區辨難過的不同程度與細微差異。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>字典或網路字典（視需要）、「情緒光譜」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>全班腦力激盪「難過」的相似詞。參考詞彙：小難過、心悶、低落、失落、傷心、心酸、委屈、沮喪、心碎、悲傷、哀痛；成語：以淚洗面、心如刀割、悲痛欲絕。</li><br><li>搭配學習單，孩子自選五個詞，排列難過的情緒光譜（由輕到重）。</li><br><li>在光譜上塗上藍色漸層色。</li><br><li>兩兩比較排序差異，說出理由。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「難過也有輕重之分——有些難過像小烏雲，有些難過像大雨。你覺得這些詞，誰是小烏雲，誰是大雨？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>可搭配身體覺察：「心碎的感覺，身體哪裡最有感覺？沮喪呢？」幫助孩子連結詞彙與感受。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>下次難過時，試著不只說「我很難過」，而是選一個今天學到的詞，更精準地說出自己的感受。</p><p><h3>老師的延伸</h3><br>可結合語文課，讓學生用不同程度的難過詞彙寫一小段故事，練習情緒詞彙的精確運用。</p><p>---</p></div>"}, {"code": "B-6", "name": "情緒小偵探——難過", "family": "藍色家族", "emoji": "💙", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-6　情緒小偵探——難過</h3><br><h3>💙 藍色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習在生活中觀察難過情緒，培養對他人情緒的敏感度與理解能力。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒小偵探」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>導入：「你今天有沒有感覺到自己或別人有一點難過？你是從哪裡發現的？」</li><br><li>說明任務：回家觀察難過情緒，記錄在學習單。引導語：「難過可能是自己的感覺，也可能在別人身上看到——可能是朋友今天特別安靜，可能是家人說話聲音不一樣。」</li><br><li>回到教室後分享觀察，引導討論：「當你發現有人難過，你做了什麼？或者你希望別人怎麼對你？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「情緒小偵探今天的任務有點特別——我們要去找難過的情緒。找到了，不一定要馬上幫忙解決，先好好看見它，就很重要。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>若孩子分享到較沉重的家庭狀況，以接納代替追問，必要時個別關懷。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果發現有人難過，試著靠近說一句：「你還好嗎？我在這裡。」不需要說很多，就只是讓對方知道你看見他了。</p><p><h3>老師的延伸</h3><br>可引導孩子討論：「看見別人難過，你通常會怎麼做？有沒有你想多練習的回應方式？」</p><p>---</p></div>"}, {"code": "B-7", "name": "情緒小夥伴——生氣", "family": "紅色家族", "emoji": "❤️", "time": "10 分鐘", "sel": ["自我覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-7　情緒小夥伴——生氣</h3><br><h3>❤️ 紅色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>認識並覺察生氣的情緒；辨識生氣時的身體反應，理解生氣是重要的情緒訊號。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「認識情緒」影片（Inside Out 片段）、「情緒臉譜」學習單、探索盒外星人與外星寵物</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>播放影片片段（生氣情緒段落），觀察角色的表現。</li><br><li>教師提問：「影片中的角色生氣時，臉上有什麼表情？身體做了哪些動作？」</li><br><li>延伸提問：「你曾經生氣過嗎？是什麼讓你生氣？生氣時，你的身體哪裡最有感覺？（手心、心跳、肚子…）」</li><br><li>情緒小夥伴任務：找出探索盒中看起來生氣的外星人。</li><br><li>搭配學習單畫出生氣的臉，並用一句話形容：「我生氣的像＿＿。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「生氣不是壞事——它是在告訴你，有一件很重要的事被碰到了。今天我們要好好認識生氣，讓它成為你的朋友。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>強調生氣是正常的情緒，重點是認識它，而不是壓制它。避免說「不要生氣」，改說「生氣的感覺很真實」。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週留意一次自己生氣的時刻，記下：是什麼讓你生氣？當時身體哪裡最有感覺？</p><p><h3>老師的延伸</h3><br>可延伸討論：「你覺得生氣在保護你什麼？」幫助孩子理解生氣背後的需求。</p><p>---</p></div>"}, {"code": "B-8", "name": "情緒光譜——生氣", "family": "紅色家族", "emoji": "❤️", "time": "10 分鐘", "sel": ["自我覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-8　情緒光譜——生氣</h3><br><h3>❤️ 紅色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>擴充「生氣」的情緒詞彙，練習辨識憤怒的不同強度。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒光譜」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>全班腦力激盪生氣的相似詞。參考詞彙：不高興、不耐煩、心煩、煩躁、惱火、生氣、火大、憤怒、氣炸；成語：怒髮衝冠、火冒三丈、七竅生煙。</li><br><li>搭配學習單，排列生氣的情緒光譜（由輕到重）。</li><br><li>在光譜上塗上紅色漸層。</li><br><li>討論：「你上次生氣大概是光譜的哪個位置？到幾分時，你會覺得比較難控制自己？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「生氣就像辣度，有一顆辣椒的辣，也有五顆辣椒的辣。你現在的生氣，是幾顆辣椒呢？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>可在這個活動中初步介紹「情緒溫度計」的概念，為後續的降溫計畫活動做鋪墊。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>下次生氣前，先在心裡問自己：「我現在幾度？」試著用今天學到的詞，更精準地說出自己的感覺。</p><p><h3>老師的延伸</h3><br>可延伸為教室「生氣光譜海報」，讓孩子日常中練習用精確的詞描述情緒強度。</p><p>---</p></div>"}, {"code": "B-9", "name": "情緒小偵探——生氣", "family": "紅色家族", "emoji": "❤️", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-9　情緒小偵探——生氣</h3><br><h3>❤️ 紅色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習在生活中觀察生氣情緒的來源與表現，初步認識生氣背後可能藏著的感受。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒小偵探」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>導入：「你今天有沒有感覺到自己或別人有一點生氣？你是從哪裡發現的？」</li><br><li>說明任務：觀察並記錄生活中的生氣情緒，思考：是什麼事情引起的？那個人的身體有什麼反應？</li><br><li>進階引導：「生氣有時候是在保護某件很重要的事。當你看到有人生氣，你覺得他可能在乎的是什麼？」</li><br><li>回到教室分享觀察，引導討論不同情境下的生氣。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「情緒小偵探今天要找生氣——但找到了之後，試著多看一層：這個生氣背後，可能藏著什麼？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>鼓勵孩子用好奇、理解的眼光觀察生氣，而不是評判它是「不好的」行為。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果自己生氣了，事後試著問自己：「我生氣，是因為我在乎什麼？」把想到的寫下來或畫下來。</p><p><h3>老師的延伸</h3><br>可連結到後續的「生氣小偵探」（H-33）進行更深入的探索，形成學習進程。</p><p>---</p></div>"}, {"code": "B-10", "name": "情緒小夥伴——噁心或厭惡", "family": "綠色家族", "emoji": "💚", "time": "10 分鐘", "sel": ["自我覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-10　情緒小夥伴——噁心或厭惡</h3><br><h3>💚 綠色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>認識厭惡情緒，理解它作為保護機制的功能，並辨識身體的反應。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒臉譜」學習單、探索盒外星人與外星寵物</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>教師提問：「你有沒有過一種感覺——看到某個東西或某件事，整個人都覺得『噁』或『好討厭』？那是什麼感覺？」</li><br><li>引導孩子描述身體反應：皺眉、退後、想吐、不想靠近。</li><br><li>說明：厭惡情緒是我們保護自己的方式，讓我們遠離對身體或心理有害的東西。</li><br><li>情緒小夥伴任務：找出探索盒中看起來厭惡或不喜歡的外星人。</li><br><li>搭配學習單畫出厭惡時的臉，並完成句子：「當我遇到＿＿，我的身體會＿＿。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「噁心或厭惡的感覺，是你的身體在說：『這個我不要！』它是在保護你。今天我們來好好認識這個保護你的情緒。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>提醒孩子：厭惡可以是對食物、氣味，也可以是對某些行為或情境。不批評孩子的厭惡對象，以理解代替評價。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家後想一想：你最討厭的東西是什麼？當你遇到它，你的身體通常有什麼反應？</p><p><h3>老師的延伸</h3><br>可延伸討論：厭惡情緒有時是在保護我們，但有時我們可以選擇靠近我們不習慣的事物——什麼時候厭惡是在幫我們？什麼時候我們可以試著突破它？</p><p>---</p></div>"}, {"code": "B-11", "name": "情緒光譜——噁心或厭惡", "family": "綠色家族", "emoji": "💚", "time": "10 分鐘", "sel": ["自我覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-11　情緒光譜——噁心或厭惡</h3><br><h3>💚 綠色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>擴充厭惡情緒的詞彙，辨識從輕微不適到強烈厭惡的不同程度。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒光譜」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>全班腦力激盪「厭惡」的相似詞。參考詞彙：怪怪的、不合拍、看膩、不舒服、反感、討厭、厭煩、厭惡、噁心。</li><br><li>排列情緒光譜（由輕微到強烈），塗上對應的綠色漸層。</li><br><li>討論：哪些詞讓你覺得只是有點不喜歡？哪些詞感覺很強烈？</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「有些討厭是淡淡的，有些討厭是很強烈的。今天我們來替這些感覺排隊，看看它們的輕重。」</em></p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週用一個比「討厭」更精確的詞來描述你的感受，試著說給身邊的人聽，看看他們的反應。</p><p>---</p></div>"}, {"code": "B-12", "name": "情緒小偵探——噁心或厭惡", "family": "綠色家族", "emoji": "💚", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-12　情緒小偵探——噁心或厭惡</h3><br><h3>💚 綠色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習在生活中觀察厭惡情緒，並理解不同的人對同樣事物可能有不同的反應。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒小偵探」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>導入：「你今天有沒有遇到什麼讓你覺得有點討厭或不舒服的事？你是從什麼感覺發現的？」</li><br><li>說明任務：觀察自己或他人的厭惡情緒，記錄在學習單。</li><br><li>回到教室後分享，特別引導：「你和同學對同樣的東西，有沒有不一樣的感覺？這說明了什麼？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「同一件事，有人覺得噁心，有人覺得沒關係——情緒是很個人的。今天我們來找找看，什麼樣的事情容易讓人有厭惡的感覺。」</em></p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家後問一個家人：「你最討厭的東西是什麼？」聽聽他的理由，看看和你的感覺一不一樣。</p><p>---</p></div>"}, {"code": "B-13", "name": "情緒小夥伴——害怕", "family": "紫色家族", "emoji": "💜", "time": "10 分鐘", "sel": ["自我覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-13　情緒小夥伴——害怕</h3><br><h3>💜 紫色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>認識害怕情緒，理解害怕是正常且有保護功能的情緒，辨識身體的害怕訊號。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒臉譜」學習單、探索盒外星人與外星寵物</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>教師提問：「你有沒有特別害怕的東西？（例如：蜘蛛、黑暗、被罵、上台）當你害怕的時候，身體有什麼感覺？」</li><br><li>引導身體覺察：心跳變快、肌肉緊繃、想逃跑、肚子怪怪的。</li><br><li>說明：害怕不是弱，是身體在提醒你需要注意某件事，是保護你的機制。</li><br><li>情緒小夥伴任務：找出探索盒中看起來害怕的外星人。</li><br><li>搭配學習單畫出害怕時的臉和身體感受。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「很多人以為勇敢就是不害怕，但其實，真正的勇敢是：知道自己在害怕什麼，還願意慢慢往前。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>孩子可能分享不同程度的害怕，以接納與不評價的態度回應，不比較「誰的害怕比較合理」。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家後想一件你曾經很害怕、但後來發現還好的事。那次，是什麼幫助了你？</p><p><h3>老師的延伸</h3><br>可連結後續的「身體的警報器：我的害怕地圖」（H-11）進行更深入的探索。</p><p>---</p></div>"}, {"code": "B-14", "name": "情緒光譜——害怕", "family": "紫色家族", "emoji": "💜", "time": "10 分鐘", "sel": ["自我覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-14　情緒光譜——害怕</h3><br><h3>💜 紫色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>擴充「害怕」的情緒詞彙，辨識從輕微不安到強烈恐懼的不同程度。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒光譜」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>全班腦力激盪「害怕」的相似詞。參考詞彙：不安、擔心、緊張、忐忑、怕怕的、害怕、恐懼、驚恐、嚇壞了；成語：心驚膽戰、毛骨悚然、膽顫心驚。</li><br><li>排列情緒光譜（由輕到重），塗上紫色漸層。</li><br><li>討論：「你覺得害怕和緊張有什麼不同？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「害怕也有大有小——有時候是小小的擔心，有時候是大大的恐懼。今天我們來幫害怕排排隊，看看它的輕重。」</em></p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>下次你感到緊張或不安時，試著用今天學到的詞更精確地說出感覺：「我現在感覺的是＿＿，不只是害怕。」</p><p>---</p></div>"}, {"code": "B-15", "name": "情緒小偵探——害怕", "family": "紫色家族", "emoji": "💜", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-15　情緒小偵探——害怕</h3><br><h3>💜 紫色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習觀察生活中的害怕情緒，培養對他人恐懼的理解與回應能力。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒小偵探」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>導入：「你今天有沒有感覺到自己或別人有一點緊張或害怕？」</li><br><li>說明任務：觀察生活中的害怕情緒，記錄在學習單。</li><br><li>回到教室分享，引導討論：「當你發現有人害怕，你可以做什麼讓對方感覺安心一點？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天的偵探任務有點挑戰性——害怕有時候被藏起來，不容易發現。用心觀察，你可能會發現別人害怕的樣子，和你想的不一樣。」</em></p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果你發現有人看起來緊張或害怕，試著靠近問一句：「你還好嗎？需要我陪你嗎？」</p><p>---</p></div>"}, {"code": "B-16", "name": "情緒小夥伴——驚訝或驚喜", "family": "橘色家族", "emoji": "🧡", "time": "10 分鐘", "sel": ["自我覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-16　情緒小夥伴——驚訝或驚喜</h3><br><h3>🧡 橘色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>認識驚訝情緒，辨識驚訝的身體反應，區分正向驚喜與負向驚嚇的不同感受。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒臉譜」學習單、探索盒外星人與外星寵物</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>教師提問：「你有沒有被突然嚇到、或收到意外驚喜的經驗？那一刻，你的身體有什麼反應？」</li><br><li>引導孩子描述：心跳加速、愣住、叫出聲、眼睛瞪大。</li><br><li>討論：「驚訝和驚喜有什麼不同？被嚇到和收到好消息，哪個讓你感覺比較好？」</li><br><li>情緒小夥伴任務：找出探索盒中看起來驚訝或驚喜的外星人。</li><br><li>搭配學習單畫出驚訝的表情。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「驚訝這個情緒很特別——它可以是好的，也可以是不舒服的。你的身體有時候來不及想，就先反應了。今天我們來認識這個讓人一下子傻住的情緒。」</em></p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週留意一次讓你感到驚訝的事。是好的驚訝還是不舒服的驚訝？你的身體當時有什麼反應？</p><p>---</p></div>"}, {"code": "B-17", "name": "情緒光譜——驚訝或驚喜", "family": "橘色家族", "emoji": "🧡", "time": "10 分鐘", "sel": ["自我覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-17　情緒光譜——驚訝或驚喜</h3><br><h3>🧡 橘色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>擴充驚訝相關情緒詞彙，區辨正向（驚喜）與負向（驚嚇）的不同程度。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒光譜」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>全班腦力激盪驚訝的相似詞。參考詞彙：小驚喜、好奇、想不到、驚訝、嚇一跳、驚豔、嚇呆、傻眼、嚇壞了。</li><br><li>討論：哪些詞感覺比較「好的驚訝」？哪些感覺比較「嚇到的」？</li><br><li>排列兩條光譜：一條「驚喜程度」、一條「驚嚇程度」，各自塗上橘色漸層。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「驚訝有很多種——有些讓你高興，有些讓你不舒服。今天我們來幫它們分類，找出哪些是好的驚訝，哪些是讓你不好受的驚嚇。」</em></p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週找一個讓你感到「驚豔」的事物（不一定是大事），和家人或朋友分享。</p><p>---</p></div>"}, {"code": "B-18", "name": "情緒小偵探——驚訝或驚喜", "family": "橘色家族", "emoji": "🧡", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察"], "part": "基礎入門", "html": "<div class=\"act-meta\"><p><h3>B-18　情緒小偵探——驚訝或驚喜</h3><br><h3>🧡 橘色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習在生活中觀察驚訝情緒，並了解相同事件對不同人可能產生不同的驚訝反應。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒小偵探」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>導入：「你今天有沒有遇到讓你感到意外或驚訝的事？是好的驚訝還是不舒服的驚嚇？」</li><br><li>說明任務：觀察生活中的驚訝情緒，記錄在學習單。</li><br><li>回到教室分享，引導討論：「同樣一件事，有人覺得驚喜，有人覺得嚇到——這說明了什麼？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「每個人對『意外』的感受都不一樣。今天的偵探任務就是去發現：生活裡有哪些讓人驚訝的時刻，而不同的人，會有不同的感受。」</em></p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週試著給家人一個小小的驚喜（不需要花錢，可以是一個擁抱、一張小卡），觀察他們的反應。</p><p>---</p><p># 第二部分：情緒覺察工具——輔助活動</p><p>> <strong>定位說明：</strong> 本系列為工具型活動，不依附特定情緒家族，可靈活穿插在課程各階段使用。適合作為課堂開場（Check In）、情緒調節橋梁（音樂/律動）、或獨立的情緒探索（畫畫/書寫）。</p><p>---</p></div>"}, {"code": "T-1", "name": "認識我的外星夥伴", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察", "人際技巧"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-1　認識我的外星夥伴</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察・人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>複習六大情緒，透過外星人教具連結個人情緒經驗，練習情緒辨識與分享。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>探索盒外星人與外星寵物、紙袋</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>教師將所有外星人與外星寵物放入紙袋，請學生輪流抽出一位「外星夥伴」。</li><br><li>學生觀察外星人或寵物的臉部表情與肢體動作，猜測這位外星人現在的情緒，說出理由。</li><br><li>自我情緒連結：「你最近有沒有出現過這樣的情緒？是什麼事情讓你有這個感覺？如果可以的話，你當時是怎麼做的？後來有沒有比較好？」</li><br><li>完成後進行「六種情緒分類」：把外星人依照情緒表情分組，練習分類與命名。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你抽到的外星人，現在感覺怎麼樣？你是從哪裡看出來的？你最近有沒有和他一樣的感覺？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>鼓勵孩子說出解決情緒的方法，但不強迫。傾聽者練習以接納態度回應，不評論他人的情緒經驗。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家後，從六種情緒中選一個最能代表你今天心情的情緒，把它畫出來，明天帶來和同學分享。</p><p><h3>老師的延伸</h3><br>可發展為「我的外星情緒日記」，記錄今天自己的情緒與原因，畫下與外星人一樣的臉。</p><p>---</p></div>"}, {"code": "T-2", "name": "情緒動物代言人", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-2　情緒動物代言人</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>以動物作為情緒的象徵媒介，透過投射與想像加深對六大情緒的理解與個人連結。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒動物代言人」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>引導提問：「你覺得最能代表『開心』的是什麼動物？最能代表『生氣』的呢？難過？害怕？厭惡？驚訝？」若孩子有困難，可調整提問方式：「你看到哪一種動物會讓你感到害怕？」</li><br><li>搭配學習單，在六個情緒框格中畫出或寫出每個情緒的動物代言人。</li><br><li>和同組夥伴分享，說明選擇理由。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「如果每一種情緒都有一個動物代言人，你覺得他們會是誰？發揮你的想像力，選出你心目中最適合的動物！」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>沒有標準答案，重點在孩子能說出選擇的理由，說明情緒與動物特質的連結。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家把你選的情緒動物代言人介紹給家人，讓他們猜猜看你選的是哪種情緒。</p><p><h3>老師的延伸</h3><br>可設計「班級情緒動物園」，讓全班將自己的情緒動物代言人貼在大海報上，看見不同孩子對同一情緒的不同想像。</p><p>---</p></div>"}, {"code": "T-3", "name": "情緒紅綠燈", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理", "負責任的決策"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-3　情緒紅綠燈</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>覺察生活中不同事件對自己情緒的影響程度，辨識哪些情境需要「暫停等待」（紅燈），哪些可以順利通過（綠燈）。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「情緒紅綠燈」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>教師提問：「生活中有哪些事情，會讓你的情緒起伏比較大，需要停下來的？有哪些事情讓你情緒平穩，可以很順利通過？」</li><br><li>搭配學習單，在紅燈區寫下情緒起伏較大的事件，在綠燈區寫下情緒平穩的事件。</li><br><li>全班玩「一、二、三，紅綠燈」遊戲：全班站在教室最後排成一排，一位同學當發號施令者，說出「一、二、三，（紅/綠燈事件）」，其他同學自行判斷：若認為是紅燈事件就停止不動；若認為是綠燈事件就往前走三步。每個人的判斷可能不同，說出合理理由都被接受。</li><br><li>討論：「有沒有同一件事，有人覺得是紅燈，有人覺得是綠燈？這說明了什麼？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「紅燈不是壞事——它是在告訴你，現在需要先停一下，等情緒穩定了再通過。今天我們來找找看，你生活裡的紅燈和綠燈各是哪些事情。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>活動中可能引起爭論（步伐長度、紅綠燈判斷），教師可在活動前先與學生共同討論規則。若孩子因活動產生情緒，可借此帶入冷靜方法的練習。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週製作自己的「情緒紅綠燈手卡」，記下你最容易遇到的一個紅燈事件，以及你打算用什麼方式幫自己等到綠燈。</p><p><h3>老師的延伸</h3><br>可搭配冷靜魔法技巧，讓孩子為自己的紅燈事件設計對應的「等待策略」，結合自我管理的學習。</p><p>---</p></div>"}, {"code": "T-4", "name": "情緒遙控器", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-4　情緒遙控器</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過遊戲體驗「被控制情緒」與「掌控自己情緒」的感受差異，培養情緒自主意識。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>情緒遙控器教具（可在空白遙控器上畫表情或寫字：開心、生氣、難過、害怕、厭惡、驚訝）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>一位學生上台控制情緒遙控器，按下某個情緒按鈕並說出情緒名稱，其他學生表演出對應的表情加動作。</li><br><li>控制者將按鍵越按越快，讓表演者快速在不同情緒中切換。</li><br><li>邀請三位學生輪流當控制者，之後教師提問：「被控制是什麼感受？控制別人的感受是什麼？」</li><br><li>引導思考：「我們都不喜歡被別人控制，但我們的情緒常常會因為別人的一句話或一個行為就改變，就像被情緒遙控器控制一樣。我們可以怎麼拿回自己的主控權？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你有沒有過這種感覺：別人說了一句話，你的情緒就瞬間變了，好像被遙控器控制一樣？今天我們要來感受這件事，然後想想：我們可以怎麼拿回控制自己情緒的主控權？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>活動趣味性高，孩子通常很投入。結束後的討論是關鍵，幫助孩子從遊戲連結到真實生活中的情緒反應。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週留意一次：是什麼讓你的情緒突然改變了？是別人的一句話？還是一件事？記下來，試著想：下次你可以怎麼讓自己慢一點反應？</p><p><h3>老師的延伸</h3><br>可製作「我的情緒遙控器卡」，讓孩子在空白遙控器上標出自己希望的情緒與對應的冷靜行動。</p><p>---</p></div>"}, {"code": "T-5", "name": "情緒 Check In", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-5　情緒 Check In</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>培養每日情緒覺察習慣，讓孩子練習辨識當下的情緒狀態並說出來。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>探索盒外星人與外星寵物（或情緒牌卡）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>教師將所有情緒外星人與外星寵物放置在桌上（或展示情緒牌卡）。</li><br><li>請每位學生挑選一個符合今天心情的外星人（或牌卡），覺察自己當下的情緒與感受。</li><br><li>若學生當下需要協助平靜，帶著做 3–5 次呼吸練習。</li><br><li>簡短分享（自願）：「我今天選的是＿＿，因為＿＿。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「現在的你，感覺比較像哪個外星人？不需要完全一樣，只要選一個最接近你現在感覺的就可以。這不是考試，沒有對錯。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個活動可以成為每天開場的固定環節（只要 5 分鐘），長期下來孩子的情緒語言會明顯增加。幫助老師快速了解班級當日情緒狀態。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家後，告訴家人你今天的情緒是什麼顏色（選一個你覺得代表今天心情的顏色），並說說為什麼。</p><p><h3>老師的延伸</h3><br>可搭配「今天我在哪個情緒家族的家」（H-16）形成更完整的每日 Check In 系統。</p><p>---</p></div>"}, {"code": "T-6", "name": "情緒探索號帶動唱", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-6　情緒探索號帶動唱</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過音樂律動覺察情緒，體驗身體活動作為情緒調節工具的效果。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>情緒探索號影片（波波星球泡泡哥哥）：https://reurl.cc/gGXVXR</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>教師簡單介紹：「今天我們要一起搭上『情緒探索號』，在音樂中找到我們的情緒！」</li><br><li>播放影片，請學生跟著一起唱跳，模仿影片中的動作與表情變化。</li><br><li>情緒覺察回顧：「你剛剛最喜歡哪一段動作？那段動作代表什麼情緒？你覺得身體跳舞後有什麼變化？心情有沒有不一樣？」</li><br><li>引導總結：「當我們覺得累、煩或生氣時，可以像今天一樣，用唱歌、跳舞的方式來放鬆自己。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「音樂和身體是很好的朋友——當我們動起來，情緒也會跟著流動。今天我們用身體來探索情緒！」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>活動趣味性強，適合在班級氣氛較沉悶時使用，或作為課堂前段的暖身活動。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週心情不好的時候，試著放一首你喜歡的歌，跟著動一動身體，看看心情有沒有不一樣。</p><p><h3>老師的延伸</h3><br>可讓孩子各自設計一個代表自己某種情緒的動作，組合成「班級情緒舞」。</p><p>---</p></div>"}, {"code": "T-7", "name": "聽聽音樂 情緒流動", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-7　聽聽音樂 情緒流動</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>體驗不同音樂引發的情緒差異，學習以音樂作為情緒覺察與調節的工具。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>動感音樂、悲傷音樂、輕柔音樂各一首（教師可自選，以下為參考連結）：動感：https://www.youtube.com/watch?v=14JPLlfD-Vc｜輕柔：https://reurl.cc/0vyV5l</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>請學生端坐，閉上雙眼，雙腳踩地，手掌打開放在膝蓋上。</li><br><li>依序播放動感音樂、悲傷音樂、輕柔音樂，每首約 1 分鐘。每首結束後提問：「這音樂讓你有什麼感覺？身體有什麼反應？」</li><br><li>引導總結：「音樂對每個人的感受都不同，但音樂會讓人有情緒的起伏，也可以紓緩情緒。當你心情不好時，可以聽一聽喜歡的音樂，或許就會讓心情轉換了。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「閉上眼睛，讓音樂流進來——感受一下，這個聲音讓你的心裡有什麼感覺？身體哪裡最有反應？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>最後一首音樂應為平靜或愉快的曲子。活動中留意孩子的情緒反應，若有較大波動，適時關懷。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>請學生挑選三首自己喜歡的音樂，說明每首歌代表的情緒和適合什麼心情時聽，製作「我的情緒歌單」。</p><p><h3>老師的延伸</h3><br>可延伸為「音樂日記」：今天我聽的音樂＋當下的心情，結合語文與情緒素養。</p><p>---</p></div>"}, {"code": "T-8", "name": "自由畫畫", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-8　自由畫畫</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>以自由創作為媒介，讓情緒找到出口，培養情緒穩定與自我照顧的能力。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>白紙、彩色筆或蠟筆、輕鬆背景音樂（可選）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>教師發下白紙與彩色筆，給予一個主題：「我討厭…」「我害怕…」「我現在…」「我最喜歡…」「我想念的…」（教師可依課程選擇）。</li><br><li>播放輕鬆音樂，給孩子 5 分鐘自由創作。</li><br><li>引導說明：「自由畫畫是一種讓情緒平穩的方法。想到什麼就畫，不用管別人的看法，這張紙都是你自己的，畫完後收起來，不用給別人看。」</li><br><li>若有孩子自願分享，歡迎；其餘保持隱私。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天我們不用畫得好看，只要畫出你心裡的感覺。想到什麼顏色、什麼形狀，就讓它出現在紙上。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>若有學生一直以某種色彩平塗，或畫面帶有強烈情緒，教師可適時個別關懷。創作是私人的，不強迫分享。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週心情有點亂的時候，試著拿出一張紙和彩色筆，設定一個主題，給自己 5 分鐘自由畫。畫完後感覺有沒有不一樣？</p><p><h3>老師的延伸</h3><br>可讓孩子持續記錄情緒主題畫作，彙整成個人「情緒圖像日記」；也可在畫作背面寫下當下的感受詞彙。</p><p>---</p></div>"}, {"code": "T-9", "name": "自由書寫", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-9　自由書寫</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>以書寫作為情緒表達與釋放的媒介，練習將內在感受轉化為文字。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>白紙、筆、輕鬆背景音樂（可選）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>教師給予主題（可與自由畫畫使用相同主題，或擇一）：「我討厭…」「我害怕…」「我現在…」「我最喜歡…」「我做過一個夢…」「當我長大後…」</li><br><li>播放輕鬆音樂，給孩子 5 分鐘自由書寫。</li><br><li>引導說明：「想到什麼就寫，可以是連續的句子，也可以是一個詞、一個感覺。不用管文法或格式，這張紙是你自己的，寫完後收起來。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天的書寫沒有對錯，沒有標準答案。讓你的筆跟著你的心走，想到什麼就寫什麼。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>若孩子狀態停滯，可適時問一句「你現在心裡最大的感覺是什麼？」幫助啟動書寫。不強迫完成完整文章。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週試著寫一封信給你某一種常常出現的情緒（例如：「親愛的害怕……」），告訴它你想說的話。</p><p><h3>老師的延伸</h3><br>可在班級設置「秘密信箱」，學生可匿名投遞心情信件，讓老師了解班級情緒風向；也可發展為學期書寫計畫。</p><p>---</p></div>"}, {"code": "T-10", "name": "情緒 Check In——今天我在哪個家族的家", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-10　情緒 Check In——今天我在哪個家族的家</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>培養每日情緒覺察習慣，練習用情緒語言自我介紹，作為牌卡課程的常態開場。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>六個家族各取 1–2 張代表性卡片，共展示 6–12 張</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示六個家族的代表卡，老師說明每個家族的核心關鍵字（黃：正向溫暖；藍：低落柔軟；紅：強烈能量；綠：怪怪不適；橘：驚奇好奇；紫：擔心不安）。</li><br><li>孩子各自在白板（或紙上）寫下：今天我在「＿＿色家族」的家，最像的是「＿＿」。</li><br><li>舉起讓老師掃視（不需全班唸出，保護隱私）。</li><br><li>老師觀察整體分布，分享觀察。</li><br><li>問一兩個自願的孩子：「今天你選這張卡，是因為發生了什麼嗎？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「現在的你，覺得自己比較像住在哪個情緒家族的家？不需要完全一樣，只要選一個最接近的感覺就可以。這不是考試，沒有對錯。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個活動建議固定安排在牌卡課程開始前進行，長期累積下來孩子的情緒語言會明顯豐富。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家後，和家人分享：你今天比較像住在哪個情緒家族的家，說說為什麼你有這樣的感覺。</p><p><h3>老師的延伸</h3><br>可設計「本週住最久的情緒家族」回顧，引導孩子回想一週中最常出現的情緒狀態。</p><p>---</p></div>"}, {"code": "T-11", "name": "情緒光譜排隊", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["自我覺察"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-11　情緒光譜排隊</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>建立情緒強度的具體概念，擴充情緒詞彙，練習精準命名自己的感受。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>任選一個家族的全部 14 張卡（建議先從紅色或黃色開始）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>小組各拿一套家族卡（14 張），攤開在桌上。</li><br><li>討論並排成情緒光譜：從最輕微排到最強烈，說出排序理由。</li><br><li>完成後展示給其他組看，比較哪裡排法不同，討論為什麼。</li><br><li>問：「你今天的狀態在這個光譜的哪個位置？」</li><br><li>以陪伴句收尾（隨當天選的家族調整）。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「我們今天要做一件有趣的事，幫這些情緒排隊。就像辣度有一顆辣椒到五顆辣椒，情緒也有不同的程度。你可以想一想：有點煩，和快要氣炸，中間差了幾格呢？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>不同組排法不同很正常，讓孩子理解情緒感受是主觀的，沒有標準答案。重點在討論過程，而不是結果正確。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週試著用今天學到的情緒詞更精準地描述自己的感覺，不只說「我很難過」，而是說「我現在是第幾格的難過」。看看這樣說，別人有沒有更懂你。</p><p><h3>老師的延伸</h3><br>可將光譜排隊發展為每日晨間 Check-In：「今天你在第幾格？」幫助孩子每天練習精準的情緒命名。</p><p>---</p></div>"}, {"code": "T-12", "name": "傳遞杯子——專注、合作與情緒調節", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理", "人際技巧"], "part": "情緒覺察工具", "html": "<div class=\"act-meta\"><p><h3>T-12　傳遞杯子——專注、合作與情緒調節</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理・人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過需要高度專注的合作遊戲，覺察自己在壓力下的情緒反應，練習冷靜調節。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>水杯兩個（裝六七分滿的水）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>學生與教師圍一圈站（或坐），水杯裝六七分滿。</li><br><li>第一輪：睜眼傳遞——教師拿起水杯不說話，傳給右邊的人，直到傳完；接著傳給左邊；然後同時往左右各傳一杯。</li><br><li>第二輪：閉眼傳遞——閉上眼睛完成相同動作。</li><br><li>討論：「哪一邊比較好傳？睜眼還是閉眼哪個比較好？老師提醒不能灑水時，你的感覺是什麼？你要怎麼做才能完成這個任務？」</li><br><li>引導：「當水灑落時，若有情緒產生，這時可以使用冷靜魔法，讓情緒穩定。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天的任務很簡單，就是把水杯傳下去，但你的挑戰是：讓水一滴都不灑出來。放慢你的動作，感受一下你的手和杯子的接觸，讓自己完全專注在這一刻。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>水灑落時不責怪任何人，引導全班一起整理，然後繼續。水灑出的瞬間是很好的情緒覺察機會，留意孩子的反應並引導討論。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週找一件需要你很專注的事，試著讓自己完全沉浸其中，感受「只想著這件事、其他都暫時不想」的感覺。</p><p><h3>老師的延伸</h3><br>可加入背景音樂，鼓勵學生在更複雜的環境下練習專注；也可在每次傳遞前讓孩子說出一種冷靜方法，邊練習邊整合冷靜工具箱的學習。</p><p>---</p><p># 第三部分：HOPE 牌卡活動——六大情緒家族</p><p>> <strong>定位說明：</strong> 本系列以 HOPE 情緒六大家族牌卡（共 84 張）為核心，每個活動都有對應的牌卡。建議完成第一部分基礎入門後再進行，以獲得更好的學習效果。各活動可單獨使用，也可依家族主題組合為連貫課程。</p><p>---</p><p>## 💛 黃色家族——正向情緒</p><p>---</p></div>"}, {"code": "H-1", "name": "安心地圖——找到讓我心安的地方", "family": "黃色家族", "emoji": "💛", "time": "10 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-1　安心地圖——找到讓我心安的地方</h3><br><h3>💛 黃色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>擴充正向情緒詞彙，連結身體放鬆感受，練習命名「心安」情緒。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>黃色家族：心安（1）、放鬆（2）、輕鬆（3）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示「心安」卡，請孩子用手指出現在身體哪裡感覺最放鬆。</li><br><li>發給每人一張紙（或學習單），畫出三個讓自己心安的地方或人。</li><br><li>兩兩配對，輪流分享：「當我想到＿＿，我的肩膀就放鬆了。」</li><br><li>全班分享一兩個，老師用「心安」卡在黑板上做情緒命名。</li><br><li>以陪伴句收尾：「你值得待在讓自己覺得安心、踏實的地方。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「現在閉上眼睛，想一個讓你覺得很放鬆、很安全的地方——可能是你家的某個角落、奶奶家的廚房、操場的某棵樹下……感受一下那裡的溫度和聲音。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>若有孩子說不出來，可先示範老師自己的安心地方。不強迫分享，只需完成自己的學習單即可。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家後，找一個讓你覺得最安心的角落，靜靜坐 1 分鐘，感受身體哪裡放鬆了。明天可以把那個感覺用一句話或一張圖記錄下來。</p><p><h3>老師的延伸</h3><br>可在下次課前請 1–2 位孩子分享「安心角落」，延伸討論：這週有沒有需要讓自己平靜的時刻，你有沒有想到那個地方？也可發展為課前例行活動：「今天你的心安放在哪裡？」</p><p>---</p></div>"}, {"code": "H-2", "name": "喜悅存摺——收集今天的好事", "family": "黃色家族", "emoji": "💛", "time": "15 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-2　喜悅存摺——收集今天的好事</h3><br><h3>💛 黃色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習辨識喜悅、開心、感恩等正向情緒，建立感恩日記習慣。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>黃色家族：喜悅（4）、開心（5）、感恩（12）、滿足（13）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示四張卡，請孩子說說這四種感覺有什麼不同。</li><br><li>每人拿一張便利貼，寫下今天讓自己「心裡亮亮的」一件小事。</li><br><li>貼到全班「喜悅存摺」的海報上。</li><br><li>老師隨機抽讀幾張，問：「這件事對你來說，最像哪張情緒卡？」</li><br><li>以陪伴句收尾：「那種從心裡冒出來的喜悅，很值得收藏。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天有沒有什麼小事——不一定是大事，可能是朋友對你笑、午餐很好吃、或是終於看懂一題數學——讓你心裡有一點點亮亮的感覺？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>海報可持續使用，每週選出班上票數最多的「本週最暖小事」，培養正向班級文化。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今晚睡前，在心裡回想今天一件讓你感覺好的事，把它說給自己聽，或寫在筆記本上。連續做三天，看看你的「喜悅存摺」會變得多豐富。</p><p><h3>老師的延伸</h3><br>可設置班級「喜悅牆」持續累積，每隔兩週做一次回顧。也可延伸討論：喜悅可以分享嗎？分享之後喜悅會變多還是變少？</p><p>---</p></div>"}, {"code": "H-3", "name": "給自己的獎狀", "family": "黃色家族", "emoji": "💛", "time": "10 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-3　給自己的獎狀</h3><br><h3>💛 黃色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習自我肯定，辨識「得意」與「自豪」的差別，發展成長型思維。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>黃色家族：得意（9）、自豪（10）、感動（11）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示「得意」和「自豪」卡，討論兩者的不同：得意是今天做到的，自豪是長期努力的。</li><br><li>發給每人空白獎狀（A5 紙折一下），填上：我這學期（或這個星期）最努力的一件事是＿＿。</li><br><li>孩子分組輪流展示，同組傾聽者說一句：「我覺得你的這件事讓我感動，因為＿＿。」</li><br><li>收回全部獎狀，老師整理後展示在公佈欄（可匿名）。</li><br><li>以陪伴句收尾：「你可以為自己感到自豪，不只是成績，而是你做人的方式。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「現在我們不是在比誰最厲害，而是要看見自己真的有在努力的地方——可能很小，可能別人沒注意到，但你自己知道。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>提醒孩子不一定要寫學科，也可以是：我努力不亂生氣、我練習每天運動。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的獎狀帶回家，念給家人聽，或放在你看得到的地方。接下來一週，每天睡前問自己：「今天有沒有一件值得給自己掌聲的事？」</p><p><h3>老師的延伸</h3><br>一個月後可做「獎狀升級」：請孩子回顧當初寫的努力，看看有什麼新的成長。也可邀請家長在獎狀背面寫一句給孩子的話。</p><p>---</p></div>"}, {"code": "H-21", "name": "感恩三明治：把謝謝說清楚", "family": "黃色家族", "emoji": "💛", "time": "15 分鐘", "sel": ["社會覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-21　感恩三明治：把謝謝說清楚</h3><br><h3>💛 黃色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>能說出自己感謝的人或事情，並用具體的句子描述原因與感受，讓感謝真正被對方感受到。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>黃色家族：感恩（12）、感動（11）、幸福（14）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示「感恩」卡，問：最近有沒有人做了一件事，讓你想對他說謝謝？那是什麼事？</li><br><li>介紹感恩三明治句型：「謝謝你＿＿（你做了什麼），因為＿＿（對我有什麼影響），這讓我感覺＿＿（我的感受）。」</li><br><li>每人在便利貼上寫一張感恩三明治，對象可以是人，也可以是事物。</li><br><li>兩兩讀給對方聽，傾聽者回應：「聽到你說這些，我覺得＿＿。」</li><br><li>自願者可把便利貼貼到班級「感謝牆」，老師以陪伴句收尾：「當你把感謝說清楚，那份心意就真的到了對方那裡。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「說『謝謝』其實不難，但如果沒有說清楚在謝什麼，對方有時不一定感受得到。當我們把『為什麼謝謝』說清楚，對方就更能感受到你的心意。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>感謝的對象不一定是人，也可以是天氣、一首歌、一頓讓人滿足的餐點。引導孩子從日常中發現，生活其實有很多值得感謝的小地方。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天試著把你的感恩三明治，說給真正想感恩的對象。說完之後，留意兩件事：對方的反應是什麼？你自己心裡的感覺有什麼變化？</p><p><h3>老師的延伸</h3><br>可發展為「感恩三明治週」，每週固定時段讓孩子寫一張感謝卡給班上同學，可匿名或署名。</p><p>---</p></div>"}, {"code": "H-22", "name": "幸福快照：我的美好瞬間相簿", "family": "黃色家族", "emoji": "💛", "time": "10 分鐘", "sel": ["自我管理"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-22　幸福快照：我的美好瞬間相簿</h3><br><h3>💛 黃色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>引導學生運用正向記憶進行情緒調節，覺察安撫歷程中的身體感受變化。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>黃色家族：幸福（14）、感動（11）、喜悅（4）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>請孩子輕輕閉上眼睛，慢慢呼吸。引導：「想一個讓你覺得很舒服、很幸福的畫面——看看那裡有什麼顏色、聲音，或你在做什麼。」停留約 15 秒。</li><br><li>引導：「在這個畫面裡，注意你的身體，哪一個地方最有感覺，是暖暖的、輕輕的，還是放鬆的。」</li><br><li>睜開眼睛，把剛剛的畫面畫下來，不需要漂亮，自己看得懂就好。</li><br><li>寫上：「我的幸福快照：＿＿，我的身體感受：＿＿。」</li><br><li>老師說：「這個畫面一直都在你心裡。當你覺得難過、緊張時，可以再想起它，讓自己慢慢穩下來。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「我們要一起走進你心裡的相簿，找一張讓你感到溫暖的照片。請你慢慢停在那裡，感受一下那個畫面。我們一起停留十五秒。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>可將此活動發展為一種「情緒急救法」，引導孩子在焦慮或難過時，主動使用回想正向畫面的方式進行自我安撫。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的幸福快照放在書桌上或書包裡。當你心情不好時，先停一下，閉上眼睛回到那個畫面，停留十五秒，感受身體有沒有一點點變暖、變放鬆。</p><p><h3>老師的延伸</h3><br>可發展為「幸福快照相簿」，每月引導孩子新增一張快照，學期末彙整成個人的情緒資源集。在考試前帶全班進行快照回想，協助情緒回穩。</p><p>---</p></div>"}, {"code": "H-23", "name": "鼓勵信：寫給一個月後的自己", "family": "黃色家族", "emoji": "💛", "time": "12 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-23　鼓勵信：寫給一個月後的自己</h3><br><h3>💛 黃色家族<strong> ｜ ⏱ 12 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過書寫進行正向自我對話，連結當下經驗與未來時間點，培養自我覺察與成長意識。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>黃色家族：自豪（10）、幸福（14）、興奮（7）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>問：「如果一個月後的你，回頭看現在的自己，他會想對你說什麼？」</li><br><li>老師示範：「親愛的現在的我，你一定沒想到，這個月你慢慢做到了＿＿。有些時候你很辛苦，但你還是撐過來了。」</li><br><li>孩子自由書寫 5 分鐘，不限格式。句型提示：現在的我＿＿，我想對未來的自己說＿＿，未來的你，請記得＿＿。</li><br><li>放入信封，老師收存，一個月後發回。</li><br><li>以陪伴句收尾：「你現在寫下的這些話，會成為未來支持你的力量。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「想像一下，一個月後的你，已經慢慢長大了一點點。那個更成熟一點的你，會想對現在的你說什麼？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>一個月後發回信件時，請孩子對照當初的內容，回想與現在的自己有什麼不同。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>寫完信之後，在信封背面畫或寫下一件「這個月我想做到的事」，讓未來的自己可以回來對照。</p><p><h3>老師的延伸</h3><br>在發回信件的同時，引導孩子立即寫下一封給「兩個月後的自己」的新信，形成持續的自我對話循環。</p><p>---</p><p>## 💚 綠色家族——不適與界線</p><p>---</p></div>"}, {"code": "H-4", "name": "我的舒適圈——界線雷達", "family": "綠色家族", "emoji": "💚", "time": "15 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-4　我的舒適圈——界線雷達</h3><br><h3>💚 綠色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>辨識界線被侵犯時的身體訊號，練習用語言取代身體推拒反應。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>綠色家族：怪怪的（1）、不合拍（2）、反感（6）、討厭（5）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示「怪怪的」卡，問：「有沒有過心裡怪怪的、說不上來哪裡不對的感覺？那時身體哪裡有感覺？」</li><br><li>畫出人體輪廓，請孩子說出身體警報器在哪裡（肩膀緊、肚子翻、喉嚨卡）。</li><br><li>小組討論：在哪些情境下，你的身體會發出這個訊號？（被人碰觸、被嘲笑、被迫表演…）</li><br><li>介紹「界線用語」：「這樣我感覺不舒服，可以不要這樣嗎？」全班練習說一次。</li><br><li>以陪伴句收尾：「你的身體在保護你，那個怪怪的感覺很重要。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你的身體是你最誠實的朋友——它會在你還沒想清楚之前，先告訴你『這裡不太對』。我們今天要學會聽懂它說的話。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>若孩子說出具體被侵犯的情境，需謹慎回應，必要時依輔導機制處理。活動聚焦在「辨識」，不深入挖掘個人創傷。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週留意一次身體的「警報感覺」，記下：是什麼情境？身體哪裡有感覺？你後來怎麼做？</p><p><h3>老師的延伸</h3><br>後續可設計「界線情境卡」讓孩子練習如何開口。也可連結生命教育或健康課，討論身體自主權的概念。</p><p>---</p></div>"}, {"code": "H-5", "name": "拒絕句練習站", "family": "綠色家族", "emoji": "💚", "time": "10 分鐘", "sel": ["人際技巧"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-5　拒絕句練習站</h3><br><h3>💚 綠色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>降低拒絕的焦慮感，練習至少三種不同語氣的拒絕表達。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>綠色家族：拒絕（14）、躲開（13）、反感（6）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示「拒絕」卡，問：「有沒有過明明不想卻不好意思說不要的經驗？」</li><br><li>老師示範三種拒絕語氣：硬式（「不要！」）、軟式（「謝謝你，但我不要。」）、理由式（「我現在不方便，可以下次嗎？」）。</li><br><li>兩兩配對角色扮演（老師先準備不同情境），一人提出請求，一人練習拒絕。</li><br><li>交換角色，感受被拒絕是什麼感覺。</li><br><li>全班討論：哪種拒絕方式你最常用？哪種你會想多練習？</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「說『不』是很重要的能力，但很多人從小就覺得說不會讓別人不高興。今天我們要練習——拒絕不是不禮貌，是在照顧自己。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>配對時讓孩子自己選場景，如同學借東西、被邀請做不想做的事，才更有真實感。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週試試看，當有人提出你不想答應的要求時，練習用今天學到的其中一種拒絕方式。說完之後注意自己的感覺——是不是沒有你想的那麼可怕？</p><p><h3>老師的延伸</h3><br>可設計「拒絕情境卡」，每隔一週抽一張進行快速角色扮演。也可引導討論：被拒絕的感受和拒絕別人的感受，哪個比較難？為什麼？</p><p>---</p></div>"}, {"code": "H-24", "name": "怪怪的雷達：身體小提醒", "family": "綠色家族", "emoji": "💚", "time": "15 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-24　怪怪的雷達：身體小提醒</h3><br><h3>💚 綠色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>引導學生覺察細微情緒與身體訊號，建立早期辨識能力。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>綠色家族：怪怪的（1）、不合拍（2）、看膩（3）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>問孩子：「怪怪的」是什麼感覺？先不要用生氣或難過這些詞，試著用自己的方式來形容（悶悶的、卡卡的、不太對勁）。</li><br><li>小組討論：哪些情況最容易讓你覺得怪怪的？（有人靠太近、某種說話方式、氣氛變得不太一樣）</li><br><li>每人畫一個「怪怪的雷達圖」，在圓的四周寫下會出現這種感覺的情境。</li><br><li>兩兩分享，討論：當這個感覺出現時，通常接下來會發生什麼？</li><br><li>以陪伴句收尾：「有些感覺一開始說不清楚也沒關係，那個怪怪的本身，就是在提醒你一些重要的事。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你有沒有過一種感覺，說不太出來哪裡不對，但就是覺得有點怪怪的？那個感覺是在提醒我們一些事情。今天，我們要學會把這個『怪怪的』當成一個重要的提醒。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>雷達圖完成後可讓孩子自行保留，作為未來辨識情境的參照工具。與 H-4 可連堂進行，H-24 側重內在覺察，H-4 側重外在行動。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週請留意一次出現「怪怪的」感覺的時刻，事後想一想：當時發生了什麼事？那個感覺可能在提醒你什麼？</p><p><h3>老師的延伸</h3><br>以雷達圖為基礎，發展個人化的情緒敏感情境紀錄，幫助孩子理解自己的觸發點。</p><p>---</p></div>"}, {"code": "H-25", "name": "從怪怪的，到慢慢懂自己", "family": "綠色家族", "emoji": "💚", "time": "15 分鐘", "sel": ["人際技巧"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-25　從怪怪的，到慢慢懂自己</h3><br><h3>💚 綠色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>在人際互動中辨識低強度不適感受並進行適切表達，強化衝突預防與關係調節能力。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>綠色家族：不合拍（2）、厭煩（4）、躲開（13）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示「不合拍」卡，問：「你有沒有跟某個人或某個團體在一起時，覺得有點怪怪卡卡的，但說不上是誰的問題。」</li><br><li>老師說明：不合拍不代表誰不好，而是彼此的節奏或方式不一樣，就像不是每首歌都適合每個心情。</li><br><li>角色扮演：一人說出「我最近在這個小組有點不合拍」，另一人練習先接住對方的感受（「我聽到你覺得有點卡住」），而不是急著解決。</li><br><li>討論：當不合拍出現，可以怎麼說出來？練習：「我覺得我們現在節奏有點不一樣，可以一起聊一下嗎？」</li><br><li>以陪伴句收尾：「當你感覺不合拍時，願意說出來，是在照顧自己，也是在保護彼此的關係。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「有時候跟別人相處，會出現一種卡卡的感覺，不是誰做錯了什麼，而是好像有哪裡對不上。這種感覺很正常，但如果一直不說出來，就可能越來越悶。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>特別適合在班級重新分組或換座位後進行，協助孩子覺察與表達人際互動中的不適感。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果感覺有一點不合拍，試著用今天練習的句子說出來，說完後留意氣氛有沒有什麼改變。</p><p><h3>老師的延伸</h3><br>換組或換座位後的第一週，可安排一次「不合拍 Check-in」，引導孩子分享新互動中的小小不適，提早化解人際摩擦。</p><p>---</p><p>## 💙 藍色家族——低落與悲傷</p><p>---</p></div>"}, {"code": "H-6", "name": "委屈翻譯機", "family": "藍色家族", "emoji": "💙", "time": "15 分鐘", "sel": ["社會覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-6　委屈翻譯機</h3><br><h3>💙 藍色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>將難以說出口的委屈情緒轉化為語言，練習「被聽見」與「真正聆聽」兩種能力。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>藍色家族：委屈（7）、孤單（9）、心酸（6）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示「委屈」卡，請孩子用身體表演一下「委屈」的樣子（不需說話）。</li><br><li>老師示範：「我最近有一件委屈的事，其實我想說的是：＿＿。」</li><br><li>孩子寫在紙上（不需唸出）：「最近讓我感到委屈的是＿＿，其實我想說的是＿＿。」</li><br><li>兩兩配對，選擇是否願意分享；傾聽者只能說：「我聽到了，你＿＿（重複剛剛聽到的話），是嗎？」</li><br><li>以陪伴句收尾：「你覺得委屈，是因為你心裡有很重要的話想被聽見。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「委屈很難說清楚，所以很多人選擇放棄，乾脆不說。但今天我們要來幫委屈翻譯一下——讓那個說不出口的感覺，變成別人可以懂的話。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>傾聽者的任務只有一個：說回去讓對方知道你聽到了。這是最基本的同理心練習，比直接給建議更重要。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>下次當你心裡有委屈的時候，先試著在紙上寫：「讓我委屈的是＿＿，我真正想說的是＿＿。」寫出來之後，決定要不要說給某個人聽。</p><p><h3>老師的延伸</h3><br>可在班級設置「委屈信箱」，讓孩子匿名投入，老師定期回應。也可每月做一次「翻譯練習」，讓孩子練習把同學描述的委屈翻譯成清楚的語言。</p><p>---</p></div>"}, {"code": "H-7", "name": "我的求救名單", "family": "藍色家族", "emoji": "💙", "time": "15 分鐘", "sel": ["自我管理"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-7　我的求救名單</h3><br><h3>💙 藍色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>辨識可信任的求助對象，降低求助的心理障礙，建立安全感。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>藍色家族：無助（14）、低落（12）、沮喪（11）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示「無助」卡，問：「覺得無助的時候，你最希望有誰在旁邊？」</li><br><li>發給孩子一張手掌形狀的紙，五根手指各寫上一個「可以找的人」。</li><br><li>討論：找不同的人，做哪些不同的事？（找媽媽說心裡話、找同學一起抱怨、找老師詢問建議）</li><br><li>老師提示：求助不一定要說完整的事，也可以說：「我現在覺得不太好，可以陪我一下嗎？」</li><br><li>以陪伴句收尾：「你覺得無助的時候，不代表真的沒有人在，你只是還在找路。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「有沒有過一種感覺：很想有人幫忙，但又不知道要找誰？今天我們要先想好，如果我現在很無助，可以找誰幫忙？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>手掌圖可以讓孩子保留，貼在聯絡簿內側或書包裡，成為實際可用的情感支持提醒卡。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的手掌名單帶回家，貼在你常常看到的地方。這週試著主動跟名單上的一個人說說話，不一定要說重要的事，就只是分享生活。</p><p><h3>老師的延伸</h3><br>可在期初讓孩子製作手掌名單，學期中再更新一次，觀察孩子的支持網絡是否有所變化。</p><p>---</p></div>"}, {"code": "H-8", "name": "情緒許可證", "family": "藍色家族", "emoji": "💙", "time": "15 分鐘", "sel": ["自我管理"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-8　情緒許可證</h3><br><h3>💙 藍色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>理解有負向情緒是正常的，學習允許自己有感覺，並溫柔對待自己。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>藍色家族：心悶（1）、小難過（3）、難過（4）、傷心（5）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示四張卡，請孩子排排看哪個程度最深。</li><br><li>老師分享：「我曾經覺得難過時，我做的第一件事是＿＿。（示範誠實分享）」</li><br><li>請孩子畫一個「當我難過時的樣子」（臉會變成怎樣？身體哪裡有感覺？可用顏色或線條表現）。</li><br><li>寫一張給自己的「情緒許可證」：「我允許自己難過，因為那表示我很在乎＿＿。」</li><br><li>以陪伴句收尾：「就算只是小小的難過，也值得被溫柔對待。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你有沒有過這種經驗——難過的時候，馬上有人說：『別哭了、這又沒有什麼大不了』，結果心裡反而更悶了？今天我們要練習：讓難過好好被溫柔對待，再慢慢變好。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>老師的誠實分享是建立信任的關鍵，不需要說很私密的事，但要真實。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的「情緒許可證」收好。當你下次難過時，拿出來看看，對自己說：「我現在很難過，這是可以的。」給自己 5 分鐘好好感覺一下，準備好之後再慢慢往前走。</p><p><h3>老師的延伸</h3><br>可將孩子的「情緒許可證」護貝，讓孩子隨身保存。同時在班級中持續營造「難過也沒關係」的氛圍，設置安靜角，讓孩子在情緒低落時有地方暫時停下來。</p><p>---</p></div>"}, {"code": "H-26", "name": "感覺翻譯機", "family": "藍色家族", "emoji": "💙", "time": "15 分鐘", "sel": ["自我管理"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-26　感覺翻譯機</h3><br><h3>💙 藍色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>將模糊或負向的情緒轉化為具體的需求語言，提升自我照顧與求助能力。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>藍色家族：低落（12）、沮喪（11）、心悶（1）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示三張卡，問：「當你有這些感覺的時候，你心裡最想要的是什麼？（不是要解決問題，而是那一刻最需要什麼？）」</li><br><li>老師帶出四種常見需求：被聽見、被陪伴、被幫助、被留一點空間，並舉例說明。</li><br><li>孩子在紙上寫：「當我感到＿＿，我需要的是＿＿。」（建議寫兩到三個，選不同情境）</li><br><li>兩兩分享，傾聽者練習回應，例如：「好，我可以先聽你說」或「我可以陪你一下」。</li><br><li>討論：為什麼說出需求這麼難？（怕被拒絕、怕麻煻別人、不知道怎麼說）</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「當你很難過的時候，有沒有人問過你：你現在需要什麼？如果沒有，你也可以慢慢學會，先問自己這個問題，然後把答案說出來。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>許多孩子其實從未真正想過「自己需要什麼」，光是能覺察並說出需求，本身就是很重要的進展。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天試著告訴家人一個你現在的需求，使用句型「我需要＿＿」。不需要說很多，只要說出一件真實的需要就可以。</p><p><h3>老師的延伸</h3><br>可設計「需求小卡」，讓孩子寫下當下的需要放在老師桌上，作為低壓力的求助方式，特別適合不容易開口的孩子。</p><p>---</p></div>"}, {"code": "H-27", "name": "心願氣球", "family": "藍色家族", "emoji": "💙", "time": "12 分鐘", "sel": ["自我管理"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-27　心願氣球</h3><br><h3>💙 藍色家族<strong> ｜ ⏱ 12 分鐘 ｜ SEL 核心能力：</strong>自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>接納失望感，並在其中找到一點仍存在的期待，培養情緒韌性。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>藍色家族：失望（10）、失落（2）、沮喪（11）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示「失望」卡，問：「最近有沒有一件你期待很久，但沒有發生或沒有如願的事？」</li><br><li>老師示範分享一件自己的失望經驗，示範「有失望，但還在意」的狀態。</li><br><li>孩子在氣球形狀的紙上寫：「我失望的是＿＿，但我仍然在意的是＿＿。」</li><br><li>小組輪流分享，其他人回應：「我聽到了，你仍然在乎＿＿。」</li><br><li>以陪伴句收尾：「你會失望，是因為你曾經很用力在意，那份在意本身就很珍貴。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「失望裡其實藏著一個重要的訊息：它在告訴你，有一件事情你曾經很在乎。今天我們要一起把那個『在乎』找出來。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>使用氣球形狀的紙，象徵原本充滿期待的心願，但並沒有完全消失——仍然留著一些在乎與可能。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的氣球紙放在平常看得到的地方。當你再次感到失望時，可以拿出來看「仍然在意的是＿＿」那一格，提醒自己那些重要的東西其實還在。</p><p><h3>老師的延伸</h3><br>可在期末安排回顧，邀請孩子重新看當初寫的氣球內容，思考：那個仍然在意的事情，後來有沒有改變？</p><p>---</p></div>"}, {"code": "H-28", "name": "好好聽你說", "family": "藍色家族", "emoji": "💙", "time": "15 分鐘", "sel": ["社會覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-28　好好聽你說</h3><br><h3>💙 藍色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>學會好好聽別人說話，說出讓人感覺被理解的話。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>藍色家族：心酸（6）、委屈（7）、寂寞（8）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示三張牌卡，引導孩子想一想：這些情緒背後最需要的是什麼？</li><br><li>呈現兩種回應句讓孩子比較：「你想太多了」vs「我聽到你說……」，請孩子投票說明哪一個比較讓人感覺被懂。</li><br><li>介紹三個傾聽技巧：說回去（「我聽到你說…」）、確認感受（「那一定很…」）、不急著給建議。</li><br><li>兩兩練習：分享者選一張牌卡或說一件相關經驗，傾聽者只用三個技巧回應；交換角色。</li><br><li>分享：哪一句話讓你最感到被理解？以陪伴句收尾：「被好好聽見，常常比馬上被解決，更能讓人感覺安心。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天我們要練習一件不太容易，但很重要的事：當朋友在說話的時候，我們先不急著回應，只專心做一件事——好好聽，讓對方知道：我在這裡，我有在聽。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>「不急著給建議」通常是最困難的部分，可先讓孩子討論為什麼會想立刻給建議，幫助理解傾聽本身就是重要的陪伴方式。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週試著當一次「好的傾聽者」——當朋友分享困擾時，先不急著給建議，只練習說回去和確認感受。結束後問自己：剛剛有沒有真的聽懂對方？</p><p><h3>老師的延伸</h3><br>可設計「傾聽挑戰週」，讓孩子每天記錄一次傾聽的經驗，下週分享心得。也可延伸討論：什麼時候需要傾聽？什麼時候對方是真的需要建議？</p><p>---</p><p>## 🧡 橘色家族——驚訝與好奇</p><p>---</p></div>"}, {"code": "H-9", "name": "表情漫畫家", "family": "橘色家族", "emoji": "🧡", "time": "10 分鐘", "sel": ["自我管理"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-9　表情漫畫家</h3><br><h3>🧡 橘色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>認識驚訝情緒家族，練習在突發情況下先停頓再反應的策略。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>橘色家族：驚訝（5）、傻眼（11）、嚇一跳（10）、嚇呆（14）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>老師念出一個橘色情緒詞，孩子在 15 秒內快速畫出那個情緒的表情。</li><br><li>展示幾張讓全班猜是哪個詞，笑著討論。</li><br><li>介紹「停看選」：停下來→看清楚發生什麼→選一個反應。</li><br><li>角色扮演：老師突然說「明天要抽考！」，孩子練習「停→深呼吸→看」。</li><br><li>以陪伴句收尾：「當你很驚訝時，給自己一點時間慢慢消化也沒關係。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你有沒有被嚇到後，馬上做出一個後來有點後悔的反應？像是大叫、大笑，或不小心把東西推倒……。今天我們要學一個很有用的能力：先停一下，讓大腦跟上身體。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>畫表情的過程常會帶來笑聲，是很好的暖身活動。進行前可和孩子約定：我們可以一起笑，但不嘲笑別人的作品。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>引導學生在突發情境中運用「停—看—選」策略，透過暫停與呼吸降低自動反應，事後紀錄：你有沒有用到這個方法？效果如何？</p><p><h3>老師的延伸</h3><br>可製作「停看選」提示卡張貼於教室。當班級出現突發事件時，引導孩子一起運用這個策略。</p><p>---</p></div>"}, {"code": "H-10", "name": "好奇心偵探", "family": "橘色家族", "emoji": "🧡", "time": "15 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-10　好奇心偵探</h3><br><h3>🧡 橘色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>將好奇情緒連結到主動學習動力，練習用語言描述驚豔感受。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>橘色家族：好奇（1）、驚豔（7）、讚嘆（6）、小驚喜（2）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示「好奇」卡，請孩子說出最近一個讓他一直想知道答案的問題。</li><br><li>小組分享：「我最好奇的事是＿＿，因為＿＿。我猜答案可能是＿＿。」</li><br><li>老師帶出幾個有趣小知識，孩子用「驚豔」卡打分 1–5，並說明：「為什麼這件事讓你覺得驚豔？」</li><br><li>孩子寫下今天最讓自己「哇」的一件事：「原來＿＿，世界也可以這樣！我還想知道的是＿＿。」</li><br><li>以陪伴句收尾：「你的好奇心，是一個很重要的學習超能力。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「世界上有太多很奇怪、很厲害、很奇妙的事在等著你去發現——但你得先打開那個好奇的開關。今天我們來找找，你的好奇開關在哪裡？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>可連結到孩子正在學習的任何科目，幫助他們體驗「知識本身可以很驚豔」。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週請找一個你一直很好奇的問題，試著去找答案（問大人、查書或上網）。找到之後，下次上課和大家分享你的發現，用「驚豔」卡幫自己的發現打 1–5 分。</p><p><h3>老師的延伸</h3><br>可在班級設立「好奇牆」，讓孩子將想知道的問題貼上去，由老師或同學一起協助尋找答案。</p><p>---</p></div>"}, {"code": "H-29", "name": "意外來了怎麼辦：停看選練習", "family": "橘色家族", "emoji": "🧡", "time": "10 分鐘", "sel": ["負責任的決策"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-29　意外來了怎麼辦：停看選練習</h3><br><h3>🧡 橘色家族<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習在突發情境中停下來思考，理解發生了什麼，並做出較合適的反應選擇。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>橘色家族：意外（3）、嚇一跳（10）、想不到（4）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>引導孩子回想一個「嚇一跳但後來覺得還好」的小意外（日常小事即可）。</li><br><li>介紹「停看選」三步驟：先停下來讓身體慢下來→看清楚發生了什麼→選擇一個比較合適的反應。</li><br><li>孩子在紙上畫三格漫畫：第一格畫意外情境，第二格畫停下來的動作（如深呼吸），第三格畫重新選擇的反應。</li><br><li>兩兩分享漫畫，說說當時做了什麼反應，想一想如果再來一次，會不會有不同的選擇。</li><br><li>以陪伴句收尾：「每一次『想不到』，都是在幫你學會怎麼選擇。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「我們在遇到意外的時候，身體和大腦常常會很快做出反應，可能說出自己其實不太想說的話。這不是做錯，而是反應太快了。今天我們要練習：在那一瞬間先讓自己停一下，給自己一點點時間，再來選擇怎麼做。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>三格漫畫能有效降低書寫壓力，讓孩子用圖像表達經驗，特別適合不同語言能力的學生。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果遇到讓你感到意外的事情，事後畫一張三格漫畫：第一格畫發生了什麼，第二格畫你當下的反應，第三格畫如果再來一次，你希望自己怎麼做。</p><p><h3>老師的延伸</h3><br>可收集孩子的三格漫畫，定期展示「改寫成功故事」，讓孩子看見同學如何從原本的反應轉變為更好的選擇。</p><p>---</p></div>"}, {"code": "H-30", "name": "我發現的哇世界", "family": "橘色家族", "emoji": "🧡", "time": "15 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-30　我發現的哇世界</h3><br><h3>🧡 橘色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>主動覺察生活中的驚豔時刻，說出帶來的感受，培養對美好事物的注意力。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>橘色家族：驚豔（7）、讚嘆（6）、欣喜（8）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示「驚豔」牌卡，問：「最近有沒有一個畫面、聲音或事情，讓你忍不住多看一眼？」（小小的也可以）</li><br><li>老師分享一個自己的驚豔時刻，描述具體情境與感受。</li><br><li>孩子在紙上寫下「我的驚豔清單」，列出最近三件讓自己覺得「哇」的事（簡單句子或關鍵字即可）。</li><br><li>兩兩分享，傾聽者從中選出一件最有感的，回應：「你說的＿＿讓我也有一點哇。」</li><br><li>老師蒐集整理班級的「哇清單」，帶領孩子一起閱讀，看見每個人感到驚豔的地方很不一樣。以陪伴句收尾：「當你開始注意生活中的小小驚豔，會發現日常裡有很多值得開心的地方。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你有沒有過被一個畫面吸引住，好像整個人停下來只想再感受一下？那一刻讓你覺得很特別——這種感覺就叫做驚豔。今天我們來找找你生活裡的驚豔時刻。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>每個孩子感到「哇」的地方都很不一樣，這樣的差異是很好的學習素材，引導孩子看見彼此不同的感受方式。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>從今天開始，每天睡前想一件讓你覺得「哇」的事，連續記錄七天（寫的或畫的都可以）。看看一週後你的驚豔清單變得多豐富。</p><p><h3>老師的延伸</h3><br>可在教室設置「驚豔牆」，孩子有感覺時隨時補充，每週安排時間一起欣賞，逐步培養對生活細節的敏感度。</p><p>---</p><p>## 💜 紫色家族——害怕與不安</p><p>---</p></div>"}, {"code": "H-11", "name": "身體的警報器：我的害怕地圖", "family": "紫色家族", "emoji": "💜", "time": "15 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-11　身體的警報器：我的害怕地圖</h3><br><h3>💜 紫色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>理解害怕是正常的情緒，辨識身體出現的害怕訊號，並學習保護自己的方法。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>紫色家族（害怕、緊張、不安相關卡）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>問：「你有沒有特別害怕的東西？請先在紙上悄悄寫下，不需要分享。」也可引導：「寫一點點就好，也可以用畫的。」</li><br><li>說明：「害怕不是弱，而是你的身體在提醒你：這裡可能有危險，需要注意。」</li><br><li>請孩子在人體輪廓上，用顏色標出：當我害怕時，身體哪裡最有感覺。</li><br><li>問：「當那個地方有感覺時，它在提醒你什麼？（小心一點？找人幫忙？先停一下？）」</li><br><li>兩兩分享，傾聽者說：「我聽到你說，當你＿＿時，身體＿＿會有感覺，對嗎？」以陪伴句收尾：「害怕不是弱，是身體在保護我。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「很多人以為勇敢就是不會害怕，但其實真正的勇敢，是知道自己在害怕什麼，還願意慢慢往前。今天我們要認識：當我害怕的時候，我的身體在告訴我什麼。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>孩子可能分享不同程度的害怕。請以接納與不評價的態度回應，避免比較或過度解讀。若觀察到孩子有較強烈或持續的恐懼反應，建議個別關懷，並視需要連結心理師。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的「害怕地圖」帶回家，找一位你信任的大人分享你的身體感覺。可以這樣說：「我害怕的時候，身體這裡最有感覺。」不一定需要說出害怕的內容。</p><p><h3>老師的延伸</h3><br>可在課堂中定期安排「勇氣分享時間」，邀請孩子分享曾經害怕但仍然嘗試的經驗，引導重點放在：當時身體的感覺、做了什麼決定、結果如何。</p><p>---</p></div>"}, {"code": "H-12", "name": "我的安全盾牌", "family": "紫色家族", "emoji": "💜", "time": "15 分鐘", "sel": ["自我管理"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-12　我的安全盾牌</h3><br><h3>💜 紫色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>建立具體可操作的個人安全計畫，強化自我保護與情緒回穩的能力。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>紫色家族（不安、緊張、擔心等相關卡）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>發給孩子 A5 空白紙，請他們畫出自己心目中「盾牌」的形狀。</li><br><li>盾牌分四格：①讓我安心的人；②讓我安心的話；③讓我安心的行動；④讓我安心的地點。</li><br><li>各自填寫，可以畫也可以寫。</li><br><li>兩兩分享其中一格。</li><br><li>老師說：「這張盾牌是你的，當你很不安的時候，可以在心裡把它拿出來。」以陪伴句收尾：「你的盾牌一直都在，你自己就帶著它。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「當我們覺得不安全、很緊張的時候，最需要的是能快速想到：我可以找誰？我可以做什麼？我可以去哪裡？今天我們要把這些方法整理起來，放進自己的安全盾牌裡。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>盾牌可護貝或讓孩子貼在聯絡簿，成為真實的「情緒急救工具」。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的盾牌護貝或貼在你常看到的地方。這週試試看：當你感覺有點不安的時候，在心裡把盾牌拿出來，想一想裡面的內容，看看有沒有幫助。</p><p><h3>老師的延伸</h3><br>期末可做「盾牌更新」活動：請孩子重新填寫，比較學期初和期末的不同，作為成長記錄。也可邀請家長在盾牌上加寫一格「家人的話」。</p><p>---</p></div>"}, {"code": "H-31", "name": "煩惱分類站", "family": "紫色家族", "emoji": "💜", "time": "15 分鐘", "sel": ["負責任的決策"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-31　煩惱分類站</h3><br><h3>💜 紫色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>學會把煩惱分開，找到自己可以做的一件小事，降低焦慮並提升自我效能感。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>紫色家族（擔心、不安、緊張相關卡）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>引導孩子在心中想一件最近讓自己擔心或不安的事（不用說出來，先在心裡想）。</li><br><li>老師在黑板畫出兩個圓：大圓代表「我擔心的事」，小圓代表「我可以做的事」。說明：有些擔心我們無法控制，有些部分我們可以採取行動。</li><br><li>每個孩子寫下一個煩惱，再寫出自己「可以做的一步」（只需要是一個小步驟）。</li><br><li>小組輪流分享「可以做的那一步」，不需要說出煩惱本身。</li><br><li>老師帶領回顧，強調把注意力放在「可以做的事」時，心裡通常會比較穩定。以陪伴句收尾：「擔心會出現很正常，但我們可以把力氣放在自己做得到的地方。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「有些煩惱，我們怎麼努力都很難改變，例如天氣、別人的想法；也有一些煩惱，是我們可以做一點點事情去影響的。今天我們要練習把這兩種分開，把力氣放在自己做得到的地方。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>若孩子提到較沉重的煩惱，先接納與理解，再溫和引導：「有沒有一件很小、你現在做得到的事，可以讓自己好過一點？」</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週當你開始擔心某件事時，先問自己：「這件事在我能控制的範圍裡嗎？」如果是，寫下一個你現在可以做的小步驟；如果不是，提醒自己把力氣放回做得到的事上。</p><p><h3>老師的延伸</h3><br>特別適合在考試前一週進行，引導孩子區分「可以準備的部分」與「無法控制的結果」，幫助孩子把注意力放在複習等可行行動上。</p><p>---</p></div>"}, {"code": "H-32", "name": "緊張小貓來了，我知道怎麼辦", "family": "紫色家族", "emoji": "💜", "time": "15 分鐘", "sel": ["自我管理"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-32　緊張小貓來了，我知道怎麼辦</h3><br><h3>💜 紫色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>覺察緊張時的身體反應，並運用簡單步驟幫助自己穩定下來，建立面對挑戰的信心。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>紫色家族（緊張、不安相關卡）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>引導孩子回想上台或考試前緊張的經驗，說說當時身體哪裡最有感覺（心跳變快、手心出汗、肚子緊緊的）。</li><br><li>介紹「緊張小貓」五步驟：①腳踩地感受地板→②聳肩放下 3 次→③深呼吸 4-7-8 節奏→④對自己說一句話→⑤微笑。</li><br><li>帶領全班一起做一次完整的五步驟，節奏放慢，感受身體的變化。</li><br><li>設計簡單上台情境，孩子輪流到前面先做五步驟準備，再說一句話即可（重點在練習過程）。</li><br><li>引導分享練習後的感受，強調緊張是正常的，只要有方法幫助自己，就能更安心面對。以陪伴句收尾：「緊張出現的時候，我知道怎麼幫助自己慢慢穩下來。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「當我們感到緊張的時候，身體正在啟動一種保護模式——心跳變快、手心出汗，這些反應不是壞事，而是在幫助我們準備面對挑戰。今天我們不是要把緊張趕走，而是學會讓身體慢慢穩下來。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>4-7-8 呼吸法：吸氣 4 秒→憋氣 7 秒→吐氣 8 秒。對國小孩子可簡化為：吸 4→憋 4→吐 6，重點是吐氣比吸氣更長，幫助身體從緊繃轉向放鬆。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>在下一次你需要上台或考試前，提前練習「緊張小貓」五步驟至少三次。事後記錄：有沒有比平常緊張少一點？哪一步最有幫助？</p><p><h3>老師的延伸</h3><br>可在班級重要表演或考試前帶全班一起做，建立集體的「準備儀式感」。也可讓孩子設計屬於自己的「上台前咒語」（對自己說的那句話）。</p><p>---</p><p>## ❤️ 紅色家族——憤怒與衝突</p><p>---</p></div>"}, {"code": "H-13", "name": "怒火溫度計：我的情緒溫度", "family": "紅色家族", "emoji": "❤️", "time": "15 分鐘", "sel": ["自我管理"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-13　怒火溫度計：我的情緒溫度</h3><br><h3>❤️ 紅色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>辨識憤怒光譜從輕微到強烈，理解憤怒背後的界線訊號，設計個人降溫行動。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>紅色家族（心煩、不耐、惱火、火大、氣炸等相關卡）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>在黑板上畫出 0 到 10 的情緒溫度計，邀請孩子上台，將不同的憤怒情緒詞放在他們認為合適的位置。</li><br><li>問：「你上次情緒很強烈的時候，大概是幾度？通常到幾度時，你會開始覺得比較難控制自己？」</li><br><li>孩子設計個人「降溫計畫」：在幾度要做什麼行動？（如：7 度以上先走出去深呼吸）</li><br><li>兩兩分享降溫計畫，互相給建議。</li><br><li>練習說界線用語：「我現在有點不舒服，可以先停一下嗎？」以陪伴句收尾：「生氣是在提醒你：有一個重要的界線被碰到了。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「生氣不是你的問題。生氣是你的身體在提醒你：『這裡有一條重要的界線被碰到了。』真正重要的，不是有沒有生氣，而是我們怎麼回應這個感覺。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>降溫計畫要具體（哪個動作、幾分鐘），才能在真的氣到 7 度時想得起來用。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的降溫計畫寫在一張小紙條上，放在書包裡。這週如果情緒快要升高時，先在心裡問自己：「我現在是幾度？」接著試著啟動你的降溫方法。</p><p><h3>老師的延伸</h3><br>可在教室設置「情緒溫度計」海報，讓孩子每天早上貼上代表自己狀態的溫度貼紙，老師藉此快速掌握班級情緒狀態。</p><p>---</p></div>"}, {"code": "H-14", "name": "界線用語工廠", "family": "紅色家族", "emoji": "❤️", "time": "15 分鐘", "sel": ["人際技巧"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-14　界線用語工廠</h3><br><h3>❤️ 紅色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>建立多樣且合適的界線表達語句，並能在情緒升高前嘗試用語言表達自己的需求與不舒服。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>紅色家族（不耐、惱火、憤怒等相關卡）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>老師提供三個常見衝突情境，請孩子討論「可以怎麼說」。說明原則：用說的表達，不攻擊、不責備、不動手。</li><br><li>介紹界線語言句型：「我不喜歡你＿＿，我希望你＿＿。」</li><br><li>小組接龍練習：每人提出一個情境，並說出一句界線用語，目標是「清楚又合適」。</li><br><li>全班票選「最不容易說出口的一句話」，討論為什麼這句話很難說，還有沒有其他說法。</li><br><li>老師帶著全班一起說：「我現在需要一點空間，等我平靜一下我們再談。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你有沒有這樣的經驗：明明很生氣，但又知道不能動手、也不想罵人，卻一時不知道可以說什麼。今天我們要一起設計一個『界線工具箱』，把一些在生氣時也能說得出來的話，放進去。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>接龍遊戲能讓孩子在輕鬆與笑聲中練習，比單純反覆說明更容易投入與記住。活動結束前，確認每位孩子至少記住並能說出一句適合的界線用語。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>從今天練習的句子中，選出一句你最想多用的話，寫下來貼在書桌前。這週找一個合適的時機，試著用一次。</p><p><h3>老師的延伸</h3><br>可定期進行「語言工具箱補充」，每隔幾週邀請孩子再想出新的界線用語，加入班級的語言工具箱海報。</p><p>---</p></div>"}, {"code": "H-33", "name": "生氣小偵探", "family": "紅色家族", "emoji": "❤️", "time": "15 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-33　生氣小偵探</h3><br><h3>❤️ 紅色家族<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>覺察生氣背後的真實感受與在乎的事，並學會用語言表達，而不是用攻擊方式回應。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>紅色家族（心煩、不耐、惱火相關卡）</p><p><h3
