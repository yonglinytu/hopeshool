  '橘色家族': '#F4844B',
  '紫色家族': '#9B72CF',
  '紅色家族': '#E05B5B',
  '彩虹綜合': 'linear-gradient(90deg,#F5C842,#4CAF7D,#5B9BD5,#F4844B,#9B72CF,#E05B5B)',
};

const SEL_CLASS = {
  '自我覺察': 'sel-awareness',
  '社會覺察': 'sel-social',
  '自我管理': 'sel-management',
  '人際技巧': 'sel-relationship',
  '負責任的決策': 'sel-decision',
};

// State
let state = {
  part: 'all',
  family: null,
  sel: null,
  search: '',
  time: null,
};

function getFiltered() {
  return ACTIVITIES.filter(a => {
    if (state.part !== 'all' && a.part !== state.part) return false;
    if (state.family && a.family !== state.family) return false;
    if (state.sel && !a.sel.includes(state.sel)) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!a.name.toLowerCase().includes(q) && !a.code.toLowerCase().includes(q) && !a.part.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  const filtered = getFiltered();

  document.getElementById('result-count').textContent = `顯示 ${filtered.length} 個活動`;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="emoji">🔍</div><p>找不到符合條件的活動，試試其他篩選條件</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(a => {
    const famClass = FAMILY_CLASS[a.family] || 'fam-rainbow';
    const selTags = a.sel.map(s =>
      `<span class="sel-tag ${SEL_CLASS[s] || ''}">${s}</span>`
    ).join('');
    return `
      <div class="card ${famClass}" onclick="openModal('${a.code}')">
        <div class="card-header">
          <span class="card-code">${a.code}</span>
          <span class="card-name">${a.name}</span>
        </div>
        <div class="card-meta">
          <span class="card-family">${a.emoji} ${a.family}</span>
          <span class="card-time">⏱ ${a.time}</span>
          <span class="card-part">${a.part}</span>
        </div>
        <div class="card-sel">${selTags}</div>
      </div>`;
  }).join('');
}

function openModal(code) {
  const a = ACTIVITIES.find(x => x.code === code);
  if (!a) return;

  const bar = document.getElementById('modal-bar');
  const color = FAMILY_COLOR[a.family] || '#888';
  bar.style.background = color;

  document.getElementById('modal-body').innerHTML = a.html || '<p>內容載入中…</p>';
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// Events
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value;
  renderCards();
});

// Sidebar buttons
document.querySelectorAll('[data-part]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.part = btn.dataset.part;
    state.family = null;
    state.sel = null;
    document.querySelectorAll('[data-part]').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('[data-family]').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('[data-sel]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards();
  });
});

document.querySelectorAll('[data-family]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (state.family === btn.dataset.family) {
      state.family = null;
      btn.classList.remove('active');
    } else {
      state.family = btn.dataset.family;
      document.querySelectorAll('[data-family]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    renderCards();
  });
});

document.querySelectorAll('[data-sel]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (state.sel === btn.dataset.sel) {
      state.sel = null;
      btn.classList.remove('active');
    } else {
      state.sel = btn.dataset.sel;
      document.querySelectorAll('[data-sel]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    renderCards();
  });
});

// Update family counts
function updateCounts() {
  document.querySelectorAll('[data-family]').forEach(btn => {
    const fam = btn.dataset.family;
    const cnt = ACTIVITIES.filter(a => a.family === fam).length;
    const span = btn.querySelector('.count');
    if (span) span.textContent = cnt;
  });
}

updateCounts();
renderCards();
</script>
</body>
</html>
