><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示由輕到重的紅色家族牌卡，引導孩子回想最近一次生氣的經驗，用「情緒溫度」說說大概是幾度。</li><br><li>老師說明：生氣通常不只是表面情緒，背後常藏著更深的感受，例如被誤解、覺得不公平或很在乎某件事。</li><br><li>孩子在紙上完成句型：「我生氣是因為＿＿，但在生氣背後，我其實在乎的是＿＿。」</li><br><li>兩兩分享，傾聽者只回應：「我聽到你說，你在乎的是＿＿。」</li><br><li>老師帶領整理，強調當我們看見生氣背後的在乎，就更有機會用說的來表達，而不是用行為爆發。以陪伴句收尾：「生氣不是壞事，它是在提醒你，有一件重要的事被碰到了。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天我們要來玩一個偵探遊戲，不是去找誰做錯了什麼，而是去找出『生氣背後藏著的感覺』。很多時候，生氣像一個外殼，看起來很硬很大，但裡面其實藏著比較柔軟的感覺，例如在乎、難過或被忽略。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>孩子辨識「憤怒背後的感受」時，常需要具體提示，可提供幾個常見連結：被忽視可能是渴望被看見，被誤會可能是希望被理解，失去某樣東西可能代表很在乎那件事。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>下次當你感到生氣時，可以先讓自己稍微停一下，等情緒比較穩定後，再問問自己：「我背後真正在乎的是什麼？」把想到的一點點寫下來就好。</p><p><h3>老師的延伸</h3><br>可設計「偵探日記本」，讓孩子在每次情緒事件後記錄生氣情境與背後在乎的原因，定期安排簡短回顧，幫助孩子發現自己反覆出現的在乎主題。</p><p>---</p></div>"}, {"code": "H-34", "name": "好好說對不起", "family": "紅色家族", "emoji": "❤️", "time": "12 分鐘", "sel": ["人際技巧"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-34　好好說對不起</h3><br><h3>❤️ 紅色家族<strong> ｜ ⏱ 12 分鐘 ｜ SEL 核心能力：</strong>人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>學會用具體方式道歉，理解自己的行為對他人的影響，並嘗試修復關係。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>紅色家族（火大、惱火等相關卡），搭配藍色家族委屈（7）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>引導孩子回想曾經想道歉卻不知道怎麼說，或說了對不起但對方還是生氣的經驗。</li><br><li>介紹有效道歉三步驟：①說清楚自己做了什麼→②承認對對方造成的影響（「我知道這讓你…」）→③說出下次會怎麼做。強調重點在讓對方感受到被理解與被在乎。</li><br><li>老師示範一個敷衍的道歉，以及一個包含三步驟的有效道歉，引導孩子比較哪一種讓人比較願意接受。</li><br><li>提供簡單情境，讓孩子兩兩或小組進行角色扮演，練習三步驟道歉，並交換角色體驗感受。</li><br><li>老師統整，強調道歉不是只說對不起，而是讓對方知道你理解發生了什麼、在乎他的感受，並願意做出改變。以陪伴句收尾：「願意好好道歉，是在為這段關係再做一次努力。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「『對不起』這三個字說起來很簡單，但有時候說完之後，對方反而更不開心，因為那個道歉沒有讓人感覺被真正理解。今天我們要學的，不只是說對不起，而是學會一種能讓人感覺被看見、被在乎的道歉方式。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>三步驟道歉中最困難的是第一步：清楚說出自己做了什麼，而不是模糊說法（例如「如果你覺得受傷我很抱歉」）。建議多花時間練習把行為說具體，例如「我剛剛打斷你說話」。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>如果這週有一件你一直沒有說出口的道歉，可以試著用三步驟把它說出來。說完之後，不管對方的反應如何，都記得給自己一個肯定，因為願意面對並說出口，本身就是一種勇氣。</p><p><h3>老師的延伸</h3><br>當班級中出現衝突時，可引導相關孩子使用三步驟進行道歉，由老師在旁協助釐清語句；也可在平時安排情境練習，讓孩子在沒有壓力的情況下熟悉這個方式，逐步建立班級中的「修復文化」。</p><p>---</p><p>## 🌈 彩虹綜合——跨家族整合活動</p><p>---</p></div>"}, {"code": "H-15", "name": "情緒光譜排隊", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<p><p><h3>H-15　情緒光譜排隊</h3><br>（見第二部分 T-11，功能重疊已整合）</p><p>---</p></p>"}, {"code": "H-16", "name": "今天我在哪個家族的家", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<p><p><h3>H-16　今天我在哪個家族的家</h3><br>（見第二部分 T-10，功能重疊已整合）</p><p>---</p></p>"}, {"code": "H-17", "name": "情境小劇場——你怎麼了？", "family": "彩虹綜合", "emoji": "🌈", "time": "20 分鐘", "sel": ["社會覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-17　情境小劇場——你怎麼了？</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 20 分鐘 ｜ SEL 核心能力：</strong>社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習同理傾聽，學會分辨能真正幫助他人的陪伴方式，與只是表面安慰的差別。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>依情境選擇對應家族卡，建議使用藍色或紅色家族</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>老師展示一張卡，描述一個情境（如：「一個孩子抽到藍色 12 低落，他是因為被好朋友排擠了。」）</li><br><li>兩兩配對，一人扮演「有感覺的人」，一人扮演「朋友」。</li><br><li>朋友只能用陪伴句回應，不能說：「沒事啦、你想太多了、忘掉就好。」</li><br><li>演完後交換角色，換一個情境。</li><br><li>全班分享：哪句話讓你感受到被懂的感覺？哪句最沒有用？</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「當朋友很難過、很生氣的時候，我們常常不知道該說什麼，有時候還會不小心說出讓對方更不舒服的話。今天我們要練習：怎麼好好陪伴一個人，而不是只說表面的安慰。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>在討論「哪句話最沒有幫助」時，孩子常提出「不就是這樣嗎」「算了啦」等回應，引導孩子思考：為什麼這些話可能讓人感覺不被理解，甚至更難受。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週當朋友遇到困難時，試著用今天學到的陪伴方式：先聽對方說，再用自己的話回應，讓對方知道你有聽到，不急著給建議。</p><p><h3>老師的延伸</h3><br>可定期進行「陪伴句更新」，邀請孩子分享自己覺得有效的陪伴語句，整理後加入班級的陪伴語言庫。</p><p>---</p></div>"}, {"code": "H-18", "name": "回穩工具箱：我的情緒急救包", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["自我管理"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-18　回穩工具箱：我的情緒急救包</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>建立適合自己的情緒調節方法，並能在需要時選擇使用，照顧自己的感受。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>各家族代表性卡片，重點在「回穩小任務」部分</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>老師介紹「回穩小任務」的概念，每張卡背後都有一個可以馬上做的小動作。</li><br><li>展示幾個例子：放鬆卡的「三次深呼吸」、委屈卡的「寫下其實我想說的是＿＿」、憤怒卡的「先走開 60 秒」。</li><br><li>孩子在紙上設計自己的「情緒急救包」，挑選 4 個最喜歡的回穩行動，可以加上圖示。</li><br><li>兩兩分享，互相補充。</li><br><li>以陪伴句收尾：「你已經有工具了，剩下的是練習在需要的時候想起用它。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「當我們很難受的時候，大腦有時會一下子變得亂亂的，想不到可以怎麼做。所以我們要在平靜的時候，先準備好一些方法。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>可將「情緒急救包」製作成小卡片，讓孩子隨身攜帶，情緒升高時可以快速拿出來參考。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的情緒急救包做成一張小卡，放在書包裡或貼在書桌旁。這週試著使用其中一個方法。</p><p><h3>老師的延伸</h3><br>可定期進行「情緒工具箱升級」，每學期引導孩子檢視並更新最有效的調節方法。</p><p>---</p></div>"}, {"code": "H-19", "name": "給情緒的一封信", "family": "彩虹綜合", "emoji": "🌈", "time": "20 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-19　給情緒的一封信</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 20 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>提升對自己情緒的理解，學會把內在的感受用語言說出來，練習用文字表達情緒。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>孩子自選一張最近最有感覺的卡片</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>請每位孩子翻閱情緒牌卡，選出一張最符合自己最近狀態的卡片（最常出現的，或印象最深的）。</li><br><li>老師示範擬人化書寫：「親愛的委屈，你最近好像常常出現。有時候是在我被誤會的時候……你來的時候，我的心會悶悶的，好像有東西卡住。」</li><br><li>孩子自由書寫「給這個情緒的一封信」，5–8 分鐘，不限格式。</li><br><li>自願者分享 1–2 句（完全自願，可以只聽）。</li><br><li>以陪伴句收尾：「你的感受值得被好好說出來，就算只是寫給自己看，也很重要。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「如果你的情緒是一個人，你會想對它說什麼？你可以抱怨它、謝謝它，或問它一些問題。今天，試著把你想說的話寫給它聽。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>情緒書寫是很私密的歷程，需明確讓孩子知道，不會被強迫分享，也可以自行決定是否讓老師閱讀。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週再選一個你常常出現的情緒，試著寫一封信給它。你可以問它：「你為什麼一直來找我？」也可以謝謝它曾在某些時候保護過你。</p><p><h3>老師的延伸</h3><br>可發展為學期性的情緒書寫計畫，每月引導孩子選擇一種情緒進行書寫，學期末彙整成個人的「情緒書信集」。</p><p>---</p></div>"}, {"code": "H-20", "name": "情緒抽卡說故事", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-20　情緒抽卡說故事</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>在創意遊戲中練習使用情緒詞彙，提升表達情緒的流暢度與多樣性。（快速暖身版）</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>混合六個家族，抽取 3 張</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>將所有牌卡混合，放在桌上正面朝下。</li><br><li>每組 2–3 人，輪流抽 3 張牌。</li><br><li>用抽到的 3 個情緒詞，編一個 30 秒的即興小故事（可以很荒謬）。</li><br><li>其他人猜哪個場景對應哪張卡。</li><br><li>玩完後問：「今天哪個情緒詞你以前從來沒有說過？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你會抽到三個情緒，然後把它們編成一個故事。這個故事可以很奇怪、很好笑，也可以很離奇。最重要的是，讓大家聽得出來，你用了哪三個情緒。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>低壓力的關鍵，在於允許孩子創作出「不需要合理」的故事。當故事可以荒謬、有趣，孩子更容易投入，也更敢表達。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>回家後，把今天玩的遊戲教給家人，一起抽三張情緒卡來說故事。過程中觀察：家人對哪些情緒詞比較不熟悉，你可以試著幫他們解釋。</p><p><h3>老師的延伸</h3><br>可發展成每月一次的「情緒說故事活動」，讓孩子在持續練習中逐漸提升情緒詞彙的運用能力。</p><p>---</p></div>"}, {"code": "H-35", "name": "情緒觀察員：今天的班級情緒天氣", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["社會覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-35　情緒觀察員：今天的班級情緒天氣</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>學會從他人的表情、動作與語氣中觀察情緒線索，提升理解他人感受的能力。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>六個家族各一張代表卡（共 6 張展示）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>老師用誇張但不說名稱的方式表演一種情緒，請孩子觀察並猜測，追問：「你是從哪裡看出來的？」</li><br><li>整理孩子的回答，介紹「情緒線索」：表情、姿勢、說話速度、聲音大小與眼神。</li><br><li>兩兩一組輪流進行，一人表演一種情緒，另一人先說觀察到的線索，再做出猜測。</li><br><li>全班討論哪些線索最容易判斷，哪些情緒比較難辨識。老師引導思考：當我們看見別人有情緒時，可以怎麼回應（先關心或給空間）。</li><br><li>強調觀察他人情緒不是為了評斷對錯，而是幫助我們更懂對方。以陪伴句收尾：「當你看見對方的情緒線索，就更有機會用合適的方式靠近他。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「每個人的臉和身體其實都在不停地表達訊息，只是我們有時候沒有注意到。今天我們要練習：讀懂情緒，從別人的表情、動作和聲音中，看見他現在的感覺。這不是在考誰猜得準，而是幫助我們多一點理解別人。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個活動輕鬆有趣，很適合在班級氣氛稍微緊繃時進行，透過笑聲與互動重新建立連結。提醒孩子：觀察別人的情緒是出於理解與關心，而不是模仿或嘲笑。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家後，試著觀察家人的情緒，留意你是從哪些線索看出來的（表情、聲音、動作）。若要說出觀察，可用溫和的方式：「我看到你好像有點累，是因為今天很忙嗎？」重點是關心，而不是判斷。</p><p><h3>老師的延伸</h3><br>可在班級設置每週輪流的「情緒觀察員」，負責觀察整體氛圍（今天比較安靜還是活躍），並在週五用簡短方式分享班級的「情緒天氣」。</p><p>---</p></div>"}, {"code": "H-36", "name": "情緒自畫像", "family": "彩虹綜合", "emoji": "🌈", "time": "20 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-36　情緒自畫像</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 20 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>統整情緒學習，建立個人化的情緒自我認識，作為期末反思。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>全六個家族，孩子各自選出「最像自己的卡」</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>引導孩子從六個家族中各選一張最常出現或最有感覺的情緒卡（強調沒有對錯）。</li><br><li>發下空白紙，請孩子進行情緒自畫像創作，將選出的卡放在旁邊作為參考，透過顏色、圖案與文字呈現自己的狀態，鼓勵自由表達。</li><br><li>完成後，引導孩子寫下三個重點：①我最常出現的情緒是什麼；②哪一種情緒讓我感覺有力量；③我接下來想練習的一個情緒能力。</li><br><li>兩兩分享，傾聽者不評論，只回應一個具體觀察（如：「我看到你用很多藍色」「我沒想到你其實很在乎這件事」）。</li><br><li>老師帶領回顧，強調每個人的情緒樣貌都不同，能看懂自己的情緒，就是很重要的能力。以陪伴句收尾：「當你開始看懂自己的情緒，你就在慢慢學會照顧自己。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天我們要做一件很特別的事，不是畫你的外表，而是畫出你的情緒樣子——你的心是什麼樣的顏色、感覺和樣貌。這沒有標準答案，每一個人的畫都會不一樣，因為每個人的情緒世界本來就不一樣。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個活動很適合安排在學期末進行，讓孩子回顧並整合整段時間的情緒學習經驗，增加成就感與自我理解。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的情緒自畫像帶回家，找一個時間和家人分享：「這是我現在的情緒＿＿，我最常有的情緒是＿＿，我這學期學到最重要的一件事是＿＿。」</p><p><h3>老師的延伸</h3><br>可在下學期開學初安排孩子再次進行情緒自畫像，並與上學期作品對照，觀察自己的情緒變化與成長。</p><p>---</p></div>"}, {"code": "H-37", "name": "身體掃描", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-37　身體掃描</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br>（與正念系列 M-1 功能重疊，完整內容詳見第五部分 M-1）</p><p>---</p></div>"}, {"code": "H-38", "name": "交換情緒便利貼", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["社會覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-38　交換情緒便利貼</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習用情緒語言表達對他人的感謝與欣賞，強化班級正向連結。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>黃色家族（感恩 12、感動 11）、橘色家族（讚嘆 6、驚豔 7）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>展示感恩、感動、讚嘆、驚豔牌卡，引導孩子想一想：最近有哪位同學做了讓你覺得被幫助、被感動或很欣賞的事情。</li><br><li>發給每人三張不同顏色的便利貼，示範句型：「謝謝你曾經幫我」「你的某個行為讓我覺得很溫暖」「我想對你說的一句話」。</li><br><li>孩子安靜完成三張便利貼（可以寫給不同同學或同一人，內容具體、真實）。</li><br><li>老師統一收集後重新分發，確保每位孩子至少收到一張。孩子默讀收到的便利貼，感受內容帶來的情緒變化。</li><br><li>邀請自願的孩子分享感受或印象深刻的一句話。以陪伴句收尾：「當你把好的感受說出來，就在幫彼此的關係多加一點溫度。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「有時候我們心裡其實有很多想對別人說的話，可能是謝謝、欣賞，或是一句讓人溫暖的感受，但平常不一定有機會說出口。今天我們用便利貼，把這些話安靜地送給對方。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>在分發便利貼之前，建議老師先快速檢視內容，確保沒有出現傷害性文字；提醒孩子盡量寫出具體且真誠的觀察，描述一個實際行為或時刻，比抽象稱讚更能讓對方感受到被理解。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你收到的便利貼好好保存起來，可以放在書包或一個固定的小盒子裡。當你心情低落、覺得自己不夠好或不被看見的時候，拿出來看一看。</p><p><h3>老師的延伸</h3><br>可每學期安排一次「交換情緒便利貼」活動，讓孩子持續累積屬於自己的「被看見收藏」。</p><p>---</p></div>"}, {"code": "H-39", "name": "我的情緒小故事", "family": "彩虹綜合", "emoji": "🌈", "time": "20 分鐘", "sel": ["負責任的決策"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-39　我的情緒小故事</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 20 分鐘 ｜ SEL 核心能力：</strong>負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>整合情緒詞彙學習，培養情緒敘事能力，用故事幫助情緒理解。（小組深度版）</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>從六個家族中各抽一張，共六張（可分組各自抽）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>小組從六個情緒家族中抽取 4–5 張牌卡，說明這些情緒都需要出現在故事中（沒有標準答案，自由發揮）。</li><br><li>小組共同討論故事內容：主角是誰、發生了什麼、情緒如何隨著情節發展而改變，特別留意情緒的「變化歷程」。</li><br><li>將 A4 紙折成四格小書，每一格代表一個情節，畫出故事畫面並在旁標註對應的情緒詞。</li><br><li>各組輪流上台說故事，其他組邊聽邊猜測故事中使用了哪些情緒牌卡。</li><br><li>老師引導思考故事結尾：主角學到了什麼、遇到情緒時可以怎麼做。總結：情緒會隨著事件改變，而透過說故事可以幫助我們更清楚理解自己的感受與選擇。以陪伴句收尾：「當你能說出情緒的故事，就更能看懂自己的選擇。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「每個人的生活裡，其實都在慢慢寫著一本屬於自己的情緒故事書。今天我們要一起合作寫其中一頁，讓不同的情緒出現在同一個故事裡。好的故事不會只有一種感覺，有高有低、有轉折，才會更真實。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>若時間有限，可將「製作小書」調整為「口頭說故事」，讓孩子直接說情節與情緒變化，節省時間但保留覺察重點。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你們小組完成的情緒小書帶回家，說給家人聽，說完後問家人：「如果你是故事裡的主角，你會怎麼做？」聽聽不同的答案，看看有沒有讓你產生新的想法。</p><p><h3>老師的延伸</h3><br>可收集各組完成的情緒小書，設置「情緒書展」，讓孩子閱讀彼此的作品；也可連結語文課，將小書內容整理為完整文章。</p><p>---</p></div>"}, {"code": "H-40", "name": "情緒成長紀錄", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["自我覺察"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-40　情緒成長紀錄</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>回顧情緒學習歷程，覺察自己的改變，建立成長感與自我肯定。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>孩子自選對自己影響最深的三張卡</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>引導孩子從整套牌卡中挑選三張「對自己最有感、最有影響」的卡，不一定是最喜歡的，而是讓自己有改變或印象最深的。</li><br><li>在每張卡旁寫下兩件事：這張卡讓我發現了什麼；以及我現在和以前不一樣的地方。</li><br><li>輪流分享，每人約 90 秒，其他人專心傾聽，不評論。</li><br><li>老師提問：在這段學習中，有沒有哪一個改變是你自己也覺得意外的？</li><br><li>引導孩子思考：如果情緒課可以再多一堂，你還想學什麼？老師統整，強調每個人的改變速度與方式都不同，能看見自己的改變，本身就是一種成長。以陪伴句收尾：「當你開始看見自己的改變，就正在慢慢成為更了解自己的人。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天我們來到這段情緒學習旅程的一個小小終點，也是一個回頭看的時刻。你可以想一想，還記得一開始上課的時候，你是怎麼說情緒的嗎？現在的你，和那時候有沒有哪裡不一樣？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>在課程結尾詢問孩子「接下來還想學什麼」，能讓孩子感受到自己不只是學習者，也是課程的一部分，同時提供教師在下一階段設計上的重要參考。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你選的三張情緒卡抄寫回家，找一個時間和家人分享：「這學期讓我改變最多的三個情緒是＿＿、＿＿、＿＿」，說一小段自己的故事，並問家人：「你覺得我最近有什麼不一樣？」</p><p><h3>老師的延伸</h3><br>將孩子回饋的「還想再學什麼」整理成主題清單，作為下一階段課程設計的重要依據。</p><p>---</p></div>"}, {"code": "H-41", "name": "情緒解碼大作戰", "family": "彩虹綜合", "emoji": "🌈", "time": "40 分鐘", "sel": ["自我覺察", "社會覺察", "負責任的決策"], "part": "HOPE牌卡", "html": "<div class=\"act-meta\"><p><h3>H-41　情緒解碼大作戰</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 40 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>從客觀事件中推測可能的情緒，並用具體語言說出判斷與理由，培養情緒理解與多元觀點的能力。</p><p><h3><span class=\"section-label\">【使用牌卡】</span></h3><br>六大家族全部牌卡混合使用（建議每人發 5 張，剩餘置中為牌堆）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>每位孩子（或每組）發 5 張情緒牌卡，其餘牌卡置中作為牌堆。說明遊戲目標：根據情境推測情緒並說出理由，而不是找標準答案。</li><br><li>老師說出一段只有事件、沒有情緒的客觀情境，語氣稍有畫面感，但避免暗示特定情緒。</li><br><li>孩子檢視手中的牌卡，選出一張最符合自己想法的情緒，用句型說出：「我覺得他可能是＿＿，因為＿＿。」強調理由比答案更重要。</li><br><li>只要理由合理即可出牌成功；若手牌沒有適合的，可選擇棄一張並從牌堆補一張。</li><br><li>老師逐步延伸或改變情境，讓故事產生轉折，孩子需依新資訊重新判斷與出牌。</li><br><li>當有人出完手牌後暫停遊戲，邀請幾位孩子分享自己的判斷與理由。</li><br><li>老師引導全班討論：為什麼同一個情境會有不同的情緒判斷？強調每個人的經驗與想法不同，情緒理解也會不同。</li><br><li>以陪伴句收尾：「同一件事，可以有不同感受，而說出理由，能幫助我們更理解彼此。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天這個活動沒有標準答案，也不是在比誰猜得最準，因為同一件事情，每個人的感覺本來就可能不一樣。你要做的只有一件事：選一個你覺得合理的情緒，然後說出你的理由，只要你的想法說得通，就是一個很好的答案。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>活動開始前特別強調「沒有標準答案」；建議預留至少五分鐘進行最後的全班討論，因為理解彼此不同觀點的過程，比遊戲本身更重要。若孩子已先熟悉各情緒家族的基本概念，再進行此活動效果更佳。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週當你看到同學或家人出現情緒反應時，可以在心裡練習用今天的句型想一想：「他可能是＿＿，因為＿＿。」不需要說出來，只是練習多一點理解別人的可能感受。</p><p><h3>老師的延伸</h3><br>可建立班級「情境故事庫」，邀請孩子輪流提供生活中的客觀事件情境，累積成可持續使用的教學素材；也可連結品德教育或班會課，將「同一件事有不同感受」的概念應用在衝突情境中。</p><p>---</p><p># 第四部分：冷靜工具箱</p><p>> <strong>定位說明：</strong> 以下五個活動是「冷靜工具箱」系列，方法各異，適合不同孩子。老師可逐一介紹，讓孩子找到最適合自己的冷靜方法，再透過「自創冷靜魔法」（C-5）統整個人專屬工具箱。</p><p>---</p></div>"}, {"code": "C-1", "name": "呼吸小夥伴", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "冷靜工具箱", "html": "<div class=\"act-meta\"><p><h3>C-1　呼吸小夥伴</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過有引導的深呼吸練習，覺察呼吸對身體與情緒的影響，建立基礎的冷靜工具。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>探索盒外星人與外星寵物（或任何小玩偶）、兒童冥想音檔</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>請每個學生選擇一個外星人當作這次的「呼吸小夥伴」，回到座位坐好，將外星人放在肚子上（若學生自己有隨身玩偶，也可替代）。</li><br><li>播放音檔：《兒童專注力冥想》第一集——像小青蛙一樣呼吸（https://www.youtube.com/watch?v=nqX2k7NnoXw），讓學生練習（只需要聲音，不用看影片）。</li><br><li>分享與討論：「剛剛的呼吸，跟平常的呼吸有什麼不同？你現在感覺你的呼吸是怎麼樣的？深呼吸時，哪個部位的運動最明顯——胸部還是腹部？」</li><br><li>引導孩子感受深呼吸和淺呼吸的差異，找到最讓自己放鬆的節奏。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「把小夥伴放在你的肚子上，感覺它隨著你的呼吸上下移動。吸氣的時候，小夥伴輕輕往上；吐氣的時候，它慢慢往下。讓你的呼吸帶著它，也讓它帶著你放鬆。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>每次上課都可以搭配音檔帶著學生練習深呼吸，只要 3–5 分鐘，長期下來孩子會逐漸建立隨時可用的冷靜習慣。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>睡前可以找一個安靜的時刻，把玩偶放在肚子上，練習安定呼吸 2–3 分鐘。感受一下，呼吸穩定之後，身體有沒有什麼不一樣？</p><p><h3>老師的延伸</h3><br>可搭配不同風格的音檔，讓孩子體驗情緒起伏與呼吸的關係，也可在課堂開始前作為穩定儀式使用。</p><p>---</p></div>"}, {"code": "C-2", "name": "爬爬五指山", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "冷靜工具箱", "html": "<div class=\"act-meta\"><p><h3>C-2　爬爬五指山</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過手指移動配合呼吸，練習一個隨時可用、不需要任何工具的冷靜技巧。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>無（教師參考影片：https://reurl.cc/r9Oyvx）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>伸出左手掌，比出五。</li><br><li>伸出右手食指，沿著左手大拇指側邊開始往上爬，同時鼻子吸氣；沿著大拇指另一側往下時，鼻子呼氣。上山吸氣，下山呼氣，以此類推爬完小拇指。</li><br><li>帶領全班練習兩遍，讓孩子熟悉節奏。</li><br><li>引導感受：「爬完五指山，你的身體有沒有什麼不一樣？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你的手隨時都在，所以這個冷靜方法也隨時都可以用——在教室、在家裡、在任何地方。當你感覺情緒快要來了，就把手拿出來，爬一次五指山。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個方法特別適合在考試前、上台前、或任何需要快速冷靜的情境。引導孩子在壓力不大的時候多練習，這樣在真正需要的時候才會想起用它。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週找兩次機會練習爬爬五指山——一次在放鬆的時候練習，一次在心裡有點小緊張的時候試試看，感受兩次的效果有沒有不同。</p><p><h3>老師的延伸</h3><br>可搭配其他呼吸法（吹蠟燭、呼吸小夥伴）讓孩子比較，討論哪一種方法最適合自己，納入個人的冷靜工具箱。</p><p>---</p></div>"}, {"code": "C-3", "name": "吹蠟燭呼吸法", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "冷靜工具箱", "html": "<div class=\"act-meta\"><p><h3>C-3　吹蠟燭呼吸法</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過吹蠟燭的意象幫助孩子練習緩慢的深吐氣，緩解緊繃情緒。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>無（參考影片：https://www.youtube.com/watch?v=qTN_MtV5TFw）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>伸出一隻手，想像 5 根手指頭是蛋糕上點燃的蠟燭。</li><br><li>深深吸一口氣，大口地把一根蠟燭吹熄，一根手指收進掌心；繼續一根根吹，直到五根蠟燭都熄滅，手變成一顆石頭。</li><br><li>可以逐漸拉長呼吸，邊吹可以把手掌慢慢拉遠，增加吹氣的時間。</li><br><li>也可讓孩子把手放在胸口，感受現在的心跳速度。</li><br><li>教師提問：「吹氣時，有什麼樣的感覺？吹完之後，身體有沒有不一樣？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「人緊張焦慮時，會不自覺身體緊繃，但是當我們慢慢地吹——呼～，整個肌肉會慢慢放鬆下來。試著在你的生日蠟燭上，把緊繃的情緒一根根吹熄。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>吐氣要慢而長，效果才明顯。可以讓孩子邊吹邊感受嘴唇的涼意，增加身體覺察的深度。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>下次感到緊張、生氣或心跳很快的時候，伸出手，試著用吹蠟燭呼吸法讓自己慢下來。注意：吐氣要慢，慢到感覺身體鬆了。</p><p><h3>老師的延伸</h3><br>可讓孩子在手掌圖上為每根蠟燭（手指）標上一種想放下的情緒（例如：焦慮、生氣、緊張），練習每次吹熄一根，就想像放下那個情緒。</p><p>---</p></div>"}, {"code": "C-4", "name": "緊張小貓五步驟", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "冷靜工具箱", "html": "<p><p><h3>C-4　緊張小貓五步驟</h3><br>（已收錄於第三部分 H-32，可同時納入本工具箱）</p><p>---</p></p>"}, {"code": "C-5", "name": "自創冷靜魔法", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "冷靜工具箱", "html": "<div class=\"act-meta\"><p><h3>C-5　自創冷靜魔法</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>統整個人情緒調節策略，發展適合自己的客製化冷靜方法，並能主動應用。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「自創冷靜魔法」學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>發下學習單，邀請學生想一想：當情緒來時，會運用什麼方法讓自己平靜下來？除了課堂上學過的方法（呼吸、爬五指山、吹蠟燭、五步驟緊張小貓），還可以加入其他自己的方法，例如：從 1 數到 100、澆花、唱歌、跑步、聽音樂、閱讀、做家事、玩遊戲、與寵物玩、找朋友聊天、跳舞、畫畫、睡覺…等。</li><br><li>請學生在學習單上畫下並寫出每個冷靜魔法，讓它成為屬於自己的冷靜工具手冊。</li><br><li>邀請學生上台發表自己的方法。</li><br><li>參考他人的方法，補充或修改自己的學習單，形成最終版本。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「冷靜的方法沒有標準答案，適合你的，就是你最好的魔法。今天我們來創造屬於你自己的冷靜魔法書——裡面每一頁，都是只對你有用的魔法。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>沒有什麼冷靜方法是「錯的」，只要安全、合法、不傷害自己和他人即可。鼓勵多元，讓孩子知道每個人的冷靜方法可以很不一樣。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的冷靜魔法學習單帶回家，讓家人也看看你有哪些魔法。這週試著用其中一個你還沒有用過的方法，看看效果如何。</p><p><h3>老師的延伸</h3><br>可彙整全班作品，製作一本「班級冷靜魔法寶典」，讓孩子在情緒低落時可以從中尋找靈感。也可設立教室「情緒補給站」，放置孩子可以使用的冷靜工具（如畫紙、閱讀書角）。</p><p>---</p></div>"}, {"code": "C-6", "name": "找尋每一個人的冷靜空間", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "冷靜工具箱", "html": "<div class=\"act-meta\"><p><h3>C-6　找尋每一個人的冷靜空間</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過繪本引導，讓孩子理解冷靜空間的功能（積極暫停，而非懲罰），並為自己設計個人化的冷靜角。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>《傑瑞的冷靜太空》繪本或影片（https://www.youtube.com/watch?v=n1ck2UkNJCw）、冷靜空間學習單</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>說故事：播放或朗讀《傑瑞的冷靜太空》。</li><br><li>說明：「冷靜空間」又稱「積極暫停區」，當一個人情緒快要爆炸時使用，能讓人轉移注意力，讓情緒慢慢恢復。重點是：這不是被處罰，而是自己願意、主動去的地方。</li><br><li>發下學習單，讓學生設計自己的冷靜角，並在教室及家中各找一個地方，想像它成為自己的冷靜空間。</li><br><li>引導提問：「傑瑞的冷靜太空長什麼樣子？你覺得那樣的空間有什麼魔法？」「如果你有一個角落可以讓你放鬆冷靜，你希望裡面有什麼？」「你願意在什麼時候主動進入冷靜空間？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「每個人都需要一個屬於自己的小角落，當情緒快滿出來的時候，可以進去停一下，不是逃跑，而是給自己一點時間充電，然後再出來面對。今天我們來設計你的專屬冷靜空間。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>冷靜空間需要搭配清楚的班級規範，讓孩子知道「什麼時候可以去」「去了要做什麼」「多久可以回來」，才能真正發揮效果。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>在家裡找一個可以當作你冷靜空間的角落（可以是沙發的一個角、書桌前、甚至是浴室），下次情緒來了，試著去那裡待 3–5 分鐘，讓自己慢慢平靜。</p><p><h3>老師的延伸</h3><br>可讓全班共同設計班級冷靜角，由孩子一起決定裡面放什麼、有什麼規則，增加使用意願。</p><p>---</p><p># 第五部分：正念與身體覺察系列</p><p>> <strong>定位說明：</strong> 本系列七個活動以身體覺察與正念為核心，幫助孩子學習把注意力帶回當下。活動難度由基礎到深化，可依班級需求選擇；M-4（戶外五感尋寶）需要戶外空間，其餘均可在教室進行。</p><p>---</p></div>"}, {"code": "M-1", "name": "身體掃描", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["自我覺察"], "part": "正念覺察", "html": "<div class=\"act-meta\"><p><h3>M-1　身體掃描</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>深化身體覺察能力，練習用身體感受作為情緒辨識的起點。</p><p><h3><span class=\"section-label\">【使用牌卡/教具】</span></h3><br>各家族中涉及身體感受的卡（如黃色放鬆、紫色害怕、紅色火大等）、人體輪廓圖</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>引導孩子找一個舒服的位置坐好，輕輕閉上眼睛，提醒過程中不需要做任何表現，只要安靜感受自己的身體。</li><br><li>老師以穩定、緩慢的語速帶領身體掃描，從頭到腳依序移動注意力（頭→肩膀→胸→肚子→腿→腳），每個部位停留約 2–3 秒，引導孩子感受是否有緊、熱、重、輕或其他感覺，不需命名情緒，只需覺察感受。</li><br><li>孩子睜開眼後，在人體輪廓圖上圈出「最有感覺的地方」，用顏色、符號或文字標記（緊緊的、暖暖的、刺刺的），將抽象感受轉為具體表達。</li><br><li>引導孩子對照牌卡，思考這個身體感覺最接近哪一個情緒家族，建立內在連結。</li><br><li>兩兩分享，傾聽者先回應觀察到的內容（「我聽到你說你的肩膀很緊」），再輕問：「這個感覺對你來說像是在提醒什麼？」</li><br><li>老師帶領收斂，強調身體常常會比情緒更早出現訊號。以陪伴句收尾：「當你開始聽見身體的訊號，你就更靠近自己一點。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「我們的身體其實很敏感，常常在我們還沒搞清楚自己在想什麼之前，就已經先有一些反應了——像是緊緊的、熱熱的、或有點不舒服。今天我們要練習：慢慢把注意力放在身體上，聽一聽它在告訴我們什麼。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>需要相對安靜的環境。若班級難以進入安靜狀態，可簡化為只專注「肩膀、胸口、肚子」三個部位，縮短時間但保留覺察重點。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天睡前找一個安靜的時刻，閉上眼睛，從頭到腳做一次簡單的身體掃描，感受哪個地方最緊、哪個地方最放鬆，然後在心裡問自己：「今天這個感覺在說什麼？」</p><p><h3>老師的延伸</h3><br>可將身體掃描發展為班級固定的「正念時間」，例如每週一次 5 分鐘，讓孩子逐漸熟悉將注意力帶回身體的經驗。</p><p>---</p></div>"}, {"code": "M-2", "name": "跟身體做朋友", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "正念覺察", "html": "<div class=\"act-meta\"><p><h3>M-2　跟身體做朋友</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過身體隊友卡，讓孩子嘗試不同的讓自己平靜的身體姿勢，並用創作方式感謝自己的身體。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>身體隊友卡、隊友學習單、彩色筆</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>每位學童抽出兩張身體隊友卡，試試這些讓自己平靜的方法。</li><br><li>老師請學童發想並分享：除了卡上的姿勢，有哪些身體動作可以幫助自己感到平靜？（例如：伸個懶腰、輕輕甩手、深呼吸、搓搓手掌…）</li><br><li>發下隊友學習單，引導孩子：「感謝自己的身體當你的隊友！想像自己的身體如果有顏色跟圖案，會是什麼樣子？」在人體輪廓上用顏色、形狀、表情等方式表達，例如：心臟部位上有笑容、膝蓋上有一團毛球、胃是藍色的。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你的身體每天都在幫助你——走路、呼吸、感覺。今天我們要謝謝它，也要讓它知道：你注意到它了，你在照顧它。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>引導孩子理解身體感受是連結情緒的橋梁，不只是生理反應，也是情緒訊號。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>挑選三個你最喜歡的平靜身體動作，畫成小卡，製作「我的平靜隊友卡」隨身攜帶，在感覺緊繃時拿出來使用。</p><p><h3>老師的延伸</h3><br>可延伸為「情緒身體地圖」，讓孩子分別畫出「生氣時」「害怕時」「快樂時」身體的感受圖，理解情緒與身體的連動。</p><p>---</p></div>"}, {"code": "M-3", "name": "感受當下——運用五感回到此刻", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "正念覺察", "html": "<div class=\"act-meta\"><p><h3>M-3　感受當下——運用五感回到此刻</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過有引導的五感覺察練習，學習將注意力帶回當下，作為情緒穩定的工具。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>白紙、筆</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>跟學生討論五感是哪五感（視覺、聽覺、嗅覺、味覺、觸覺）。</li><br><li>邀請學生閉上眼睛，依序引導運用五感感受當下環境（每個感官停留約 30 秒）：聽覺（教室裡的聲音、窗外的聲音）→嗅覺（空氣裡的氣味）→觸覺（輕輕按摩自己的手，感受身體哪裡緊繃或放鬆）→視覺（閉眼回想剛才進教室看到的東西）→味覺（感受嘴巴裡現在有什麼味道）。</li><br><li>一組發下一張白紙，請同學分組寫下他們的五感發現。</li><br><li>分組上台發表，引導討論：「做完五感覺察，你的身體感覺有沒有不一樣？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「我們的身體提供了五扇門，讓我們隨時可以回到現在這個時刻。當思緒很亂、情緒很多的時候，試著打開其中一扇門，把自己帶回來。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>若時間允許，也可以帶領學生到教室外的空間進行，讓學生感受戶外環境的五感（蟲鳴聲、草地氣味、樹幹觸感…），效果更豐富。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週找一個你覺得有點焦慮或分心的時刻，試著用五感把自己拉回來：深吸一口氣，聽聽周圍有什麼聲音，感覺一下腳踩在地板上的感覺，讓自己回到現在。</p><p><h3>老師的延伸</h3><br>可設計「五感感受日記」，每週選一天記錄「今天我聽見...」「我聞到...」「我感覺...」等句型，建立自我覺察的日常習慣。</p><p>---</p></div>"}, {"code": "M-4", "name": "雲冥想", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "正念覺察", "html": "<div class=\"act-meta\"><p><h3>M-4　雲冥想</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過雲的意象練習觀察情緒而不被情緒淹沒，培養情緒的旁觀者視角。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>安靜的環境（可選輕柔背景音樂）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>引導孩子找舒服的姿勢坐好，閉上眼睛，做幾次深呼吸穩定身體。</li><br><li>老師帶領想像：「你現在坐在一片草地上，天空是藍色的。你可以看見一朵一朵的雲，慢慢地飄過去。現在，試著把你心裡的想法或感覺，放在那些雲上。每一朵雲代表一個你現在有的感覺——可能是高興，可能是擔心，可能是說不清楚的感覺。你只是看著它們飄過去，不需要抓住它們，也不需要趕走它們，就只是看著它們慢慢飄走。」</li><br><li>靜默約 1 分鐘後，引導孩子慢慢睜開眼睛，回到現在的教室。</li><br><li>分享：「剛才你的雲上面有什麼？是什麼感覺讓你印象最深？那朵雲飄走了嗎，還是還在？」</li><br><li>以陪伴句收尾：「你不需要消滅你的感覺，只需要看著它們慢慢飄過去。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你不是那朵雲，你是看著雲飄的人。你的情緒會來，也會走，就像雲一樣。你只需要靜靜地看著它，不需要被它帶走。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個活動對孩子來說可能是第一次體驗「觀察情緒」而非「被情緒控制」的感受，引導語的語速要慢，留足夠的靜默時間。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>下次當你情緒很混亂的時候，試著在心裡做一次「雲冥想」：找一個安靜的角落，閉上眼睛，把你的感覺放在雲上，看著它飄走，不用急著解決它。</p><p><h3>老師的延伸</h3><br>可發展為每週一次的「雲時間」，作為固定的情緒安頓儀式。也可搭配創作：讓孩子把今天的雲畫出來，標上雲上的情緒詞。</p><p>---</p></div>"}, {"code": "M-5", "name": "正念散步——感官覺察之旅", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["自我覺察"], "part": "正念覺察", "html": "<div class=\"act-meta\"><p><h3>M-5　正念散步——感官覺察之旅</h3><br><strong>🌈 彩虹綜合</strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：<strong>自我覺察</strong> （需戶外空間）</p><p><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過有引導的戶外行走，練習將注意力帶向當下的感官體驗，體驗正念在日常移動中的應用。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>戶外空間（校園草地、走廊、操場均可）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>帶領孩子到戶外，說明今天的散步有些不一樣：我們要用「正念」的方式走路——非常慢、非常專注，把所有的注意力放在行走這件事本身和身邊的環境上。</li><br><li>開始走路，教師以緩慢的語速引導：感受腳底接觸地面的感覺→感受腳跟先著地還是腳尖→留意每一步的重量轉換→感受空氣流過皮膚→留意周圍的聲音→留意眼睛看到的顏色與形狀。</li><br><li>停下來找一個讓自己有感覺的地方，停留 30 秒，感受這個空間給你的感覺。</li><br><li>回到教室後分享：「這次散步中，有沒有哪個瞬間讓你特別有感覺？你注意到了什麼以前沒有注意到的事情？」</li><br><li>以陪伴句收尾：「當我們慢下來，世界會給我們更多。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天的散步，我們不趕時間，也不想要去哪裡。我們只是走，然後感覺——感覺腳底下的地面，感覺風，感覺眼睛看到的東西。讓自己完全在這個時刻裡。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>正念散步需要孩子能夠安靜行走，建議在班級有一定規範基礎後進行。若孩子難以放慢速度，可先在走廊段練習，再逐步延伸到更開放的戶外空間。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天走回家（或走到公車站）的時候，試著做一次正念散步：慢下來，感受每一步，看看有沒有什麼平常沒有注意到的風景或聲音。</p><p><h3>老師的延伸</h3><br>可定期安排「正念散步時間」，讓孩子持續練習在行走中保持覺察；也可連結環境教育，讓孩子在正念散步中記錄校園中的自然觀察。</p><p>---</p></div>"}, {"code": "M-6", "name": "禪繞靜心繪圖", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["自我覺察", "自我管理"], "part": "正念覺察", "html": "<div class=\"act-meta\"><p><h3>M-6　禪繞靜心繪圖</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過重複、有規律的圖形繪製，進入專注的創作狀態，幫助情緒穩定與壓力釋放。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>白紙（建議較厚）、黑色細筆或鉛筆（彩色筆可選用）、輕柔背景音樂</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>簡單介紹禪繞畫的概念：「禪繞是一種重複畫簡單圖形的方法——不需要計畫、不需要有主題，就只是把一個簡單的線條或圖案，重複畫很多次，填滿一個空間。」</li><br><li>示範幾種基本圖形（例如：螺旋線、波浪線、格子、圓點的排列），讓孩子先試著在小紙片上練習。</li><br><li>播放輕柔音樂，讓孩子在白紙上自由進行禪繞繪圖，10–12 分鐘。</li><br><li>完成後請孩子靜靜看著自己的作品約 30 秒，感受一下：現在身體有什麼感覺？心情有沒有什麼不一樣？</li><br><li>分享：「畫的過程中，你的腦袋裡在想什麼？還是什麼都沒想？你覺得這種感覺怎麼樣？」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「禪繞不需要畫得好看，不需要想要畫什麼。只要讓你的手慢慢動，讓線條慢慢出現。你的腦袋可以放空，也可以讓念頭出現又消失，只要繼續畫就好。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>禪繞繪圖的重點在過程，而不是作品。若孩子說「我不會畫」，引導他從最簡單的波浪線或圓點開始，任何重複的圖形都可以。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週找一個心情有點亂的時刻，拿出一張紙和一枝筆，試著畫 5 分鐘的禪繞圖，讓自己的手動起來，讓腦袋稍微休息一下。</p><p><h3>老師的延伸</h3><br>可讓孩子把禪繞圖展示在教室，也可以讓孩子在上面標注創作當下的情緒詞，成為情緒與創作的結合紀錄。</p><p>---</p></div>"}, {"code": "M-7", "name": "正念隨身行——戶外五感尋寶", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["自我覺察"], "part": "正念覺察", "html": "<div class=\"act-meta\"><p><h3>M-7　正念隨身行——戶外五感尋寶</h3><br><strong>🌈 彩虹綜合</strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：<strong>自我覺察</strong> （需戶外空間）</p><p><h3><span class=\"section-label\">【活動目標】</span></h3><br>在戶外環境中進行有目標的五感探索，深化感官覺察能力，體驗自然環境對情緒的安定效果。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>五感尋寶學習單（記錄格式）、戶外空間</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>說明今天的任務：「我們要在校園裡進行五感尋寶，用你的眼睛、耳朵、鼻子、手和注意力，去找到五種不同的東西或感受。」</li><br><li>分發學習單（五欄，每欄對應一個感官），帶孩子到戶外，分配 8–10 分鐘自由尋寶。提示：用眼睛找讓你「哇」的顏色或形狀；用耳朵聽最讓你有感覺的聲音；用手觸摸兩種不同質地的東西；用鼻子感受戶外的氣味；用身體感受空氣的溫度或風。</li><br><li>回到教室分享：「你的五感今天發現了什麼？有沒有讓你特別有感覺的一個時刻？在戶外的這段時間，你的情緒有沒有什麼變化？」</li><br><li>引導討論：「為什麼在自然環境裡，有時候情緒會變得比較平靜？」</li><br><li>以陪伴句收尾：「你的五感是很好的朋友，隨時都可以用它們讓自己回到當下。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天的尋寶，不是找到什麼東西帶回來，而是找到一個感受、一個瞬間。讓你的感官全部打開，讓自然告訴你一些事情。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>事先確認戶外路線的安全性，並告知孩子不摘採任何植物，用感受代替採集。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天放學後，在回家的路上試著做一次「迷你版戶外五感尋寶」——只用 5 分鐘，找出今天在戶外聽到、聞到、看到的各一件讓你有感覺的事。</p><p><h3>老師的延伸</h3><br>可定期安排戶外五感時間，讓孩子持續觀察校園環境的變化（季節、天氣、生物），形成長期的自然正念練習。</p><p>---</p><p># 第六部分：情境故事討論系列</p><p>> <strong>定位說明：</strong> 本系列以「故事時間」為核心教學模式，搭配冥想音樂帶領孩子進入情境，透過故事討論培養情緒覺察與同理能力，每個故事結束後均有引導式放鬆練習。所有故事均來自雲科版，融入 SEL 五大核心能力框架。<br>><br>> <strong>共同流程結構（每個故事均適用）：</strong><br>> 1. 邀請孩子安靜、放鬆地坐好<br>> 2. 播放冥想背景音樂（音量適中，不蓋過老師說話聲）：https://www.youtube.com/watch?v=y2_hVYj9P1E<br>> 3. 告知孩子現在要說一個小故事，邀請他們閉上眼睛進入情境<br>> 4. 老師朗讀故事（語速緩慢、有停頓感）<br>> 5. 結束音樂，請孩子睜開眼睛<br>> 6. 分享與討論（依各故事引導提問）<br>> 7. 播放放鬆引導詞（見下方），以呼吸收尾<br>><br>> <strong>共同放鬆引導詞（所有故事通用）：</strong><br>> <em>「現在，請你閉上眼睛，以你最舒服的姿勢坐在椅子上，雙腳踏穩地板，調整好自己的呼吸，就專注在你的呼吸上，鼻子吸……鼻子吐……，吸……吐……，用呼吸讓自己靜下來，剛剛在活動的過程中，你可能有一些情緒的產生，就讓它產生，不用特別停留，這些情緒都很自然，但你並不是這些情緒，就讓這些情緒慢慢地流動，再次深呼吸，心中默數 3 秒，1～2～3～，大大吐氣，1～2～3～，慢慢的吸，慢慢的吐，再深呼吸三次後，當你準備好了就可以張開眼睛。」</em></p><p>---</p></div>"}, {"code": "S-1", "name": "故事時間（一）——掉落的霜淇淋", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理", "社會覺察"], "part": "情境故事", "html": "<div class=\"act-meta\"><p><h3>S-1　故事時間（一）——掉落的霜淇淋</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理・社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>覺察突發意外帶來的情緒，練習在意外後調節情緒，並理解他人的無心之失。</p><p><h3><span class=\"section-label\">【使用教具】</span></h3><br>22th 情緒卡牌（搭配放鬆結尾使用）</p><p><h3><span class=\"section-label\">【故事內容】</span></h3><br>終於來到了期待的星期日，你非常開心地拿著自己辛苦存下來的零用錢，愉悅地走到便利商店，買到了最新口味的霜淇淋。當你拿著霜淇淋正要開心享用時，結果被一個急急忙忙的路人撞到，路人急急忙忙地走了，並沒有發現撞到你，而你手上的霜淇淋也瞬間掉到地上了……此時你已經沒有其他的零用錢再買一支了。</p><p><h3><span class=\"section-label\">【討論引導】</span></h3><br><li>被路人撞到、霜淇淋瞬間掉到地上時，你的感覺是什麼？</li><br><li>如果可以對那個路人說一句話，你會說什麼？為什麼？</li><br><li>霜淇淋掉到地上後，你產生了情緒，你會怎麼處理這些情緒？</li><br><li>此時如果有朋友或家人在場，你希望他們怎麼安慰你？為什麼？</li><br><li>你曾經有過類似的經驗嗎？當時你是如何處理自己的情緒的？</li></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>每個學生分享完後，提醒孩子：雖然大家聽的是同一個故事，卻有不同的感覺與反應，這是很正常的——每個人心裡都有自己對事情的想法，所以看待事情的反應也會不同。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果遇到讓你很失望的意外，試著在心裡做一件事：先停下來、做一次深呼吸，然後問自己：「我現在最需要的是什麼？」允許自己有那個情緒，然後慢慢找一個讓自己好過一點的方式。</p><p><h3>老師的延伸</h3><br>可搭配 22th 情緒卡牌，邀請孩子在討論後選一張代表當下感受的牌卡，說說為什麼選這張。也可引導孩子創作「情緒轉化小故事」：把霜淇淋掉落變成一個故事的新開頭，看看接下來會怎麼發展。</p><p>---</p></div>"}, {"code": "S-2", "name": "故事時間（二）——弟弟的眼淚", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察", "人際技巧"], "part": "情境故事", "html": "<div class=\"act-meta\"><p><h3>S-2　故事時間（二）——弟弟的眼淚</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察・人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>辨識看見他人難過時自己的感受，練習推測他人情緒並思考如何回應。</p><p><h3><span class=\"section-label\">【使用教具】</span></h3><br>28th 情緒卡牌</p><p><h3><span class=\"section-label\">【故事內容】</span></h3><br>在某一天的晚上，你正在寫功課，聽到弟弟的哭泣聲。你放下手邊的功課，快步走到客廳，看到弟弟哇哇大哭，聲音回盪在整個房子裡。你不知道他怎麼了？只看到他哭得非常傷心……。</p><p><h3><span class=\"section-label\">【討論引導】</span></h3><br><li>當你聽到弟弟在哭的聲音時，你的感覺是什麼？</li><br><li>運用你的想像力，猜一猜他可能發生了什麼事？</li><br><li>你到客廳後，看到弟弟哇哇大哭，你會跟他說什麼？</li><br><li>你曾經看過弟弟妹妹或朋友哭泣嗎？當時你的感覺是什麼，你是怎麼處理的？</li></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個故事特別適合引導孩子覺察「看見別人難過時，我心裡發生了什麼」，以及練習如何第一時間回應——是先說話，還是先陪著？</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果看到有人難過，試著先停一下，不急著說話，只是先靠近，讓對方知道你在。等他準備好，再輕輕問一句：「你還好嗎？」</p><p><h3>老師的延伸</h3><br>可進行角色扮演：兩人一組，一人演哭泣的弟弟，一人練習不同的回應方式（說話、靠近、遞紙巾），討論哪種方式讓人感覺最被安撫。</p><p>---</p></div>"}, {"code": "S-3", "name": "故事時間（三）——借不借的兩難", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察", "人際技巧", "自我管理"], "part": "情境故事", "html": "<div class=\"act-meta\"><p><h3>S-3　故事時間（三）——借不借的兩難</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察・人際技巧・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>練習在情緒影響下仍能做出合宜的回應，學習溫和拒絕與表達自己的方式。</p><p><h3><span class=\"section-label\">【使用教具】</span></h3><br>26th 情緒卡牌</p><p><h3><span class=\"section-label\">【故事內容】</span></h3><br>某一天你在公園裡玩耍，手裡拿著媽媽剛買給你的新玩具——一個精緻的遙控車，你愛不釋手，不停操作著它在地上來回奔跑。就在你玩得正開心的時候，一個陌生的小朋友走了過來，他的眼睛盯著你的遙控車，充滿好奇和羨慕。你玩得正起勁，沒有注意到他，他不自覺地伸手碰了你的遙控器。「哇，你的玩具車真好看！」他興奮地說，「能讓我玩一下嗎？」</p><p><h3><span class=\"section-label\">【討論引導】</span></h3><br><li>當陌生小朋友不自覺地碰了你的遙控器，你的感覺是什麼？</li><br><li>你覺得這個小朋友當時的情緒是什麼？</li><br><li>你會怎麼回答他的要求？為什麼？</li><br><li>假如你不想讓他玩，你會怎麼樣婉轉地拒絕他？</li><br><li>如果你是那個小朋友，別人不願意讓你玩他的玩具，你會有什麼感受？</li><br><li>你曾經有過玩得正開心、有人要拿走你東西的經驗嗎？當時你怎麼處理的？</li></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個故事可以自然連結「拒絕句練習站」（H-5），引導孩子在有情緒的情況下，仍然練習用溫和而清楚的語言說出自己的想法。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週試著在一個真實的情境中，練習用「謝謝你的好意，但……」開頭說一句拒絕的話，不管對象是同學還是家人。說完後感受一下：比沈默或生氣，有沒有好一點？</p><p><h3>老師的延伸</h3><br>可製作「我的情緒選擇樹」小書，讓孩子畫出當時不同的選擇路線，看見每個選擇可能帶來的不同感受與後果。</p><p>---</p></div>"}, {"code": "S-4", "name": "故事時間（四）——操場上的爭執", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察", "自我管理", "人際技巧", "負責任的決策"], "part": "情境故事", "html": "<div class=\"act-meta\"><p><h3>S-4　故事時間（四）——操場上的爭執</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察・自我管理・人際技巧・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>從旁觀者視角覺察衝突中的情緒，練習思考不同的介入或回應方式，理解每種選擇的後果。</p><p><h3><span class=\"section-label\">【使用教具】</span></h3><br>30th 情緒卡牌</p><p><h3><span class=\"section-label\">【故事內容】</span></h3><br>在學校的下課時間，你和朋友們正在操場上玩耍。突然，你聽到不遠處傳來激烈的爭吵聲。轉頭一看，發現是班上的兩個同學，他們正在為了一個足球吵得面紅耳赤，甚至互相推打起來。其他同學圍在一旁，有的在看熱鬧，有的試圖勸阻，但都無濟於事。</p><p><h3><span class=\"section-label\">【討論引導】</span></h3><br><li>當你看到同學們在爭吵和推打時，你內心感受是什麼？</li><br><li>如果你是爭吵中的其中一位同學，你會感受到什麼情緒？</li><br><li>當其他同學在一旁圍觀或試圖勸阻時，他們可能有什麼感受？</li><br><li>在這種情況下，你有沒有想過要做些什麼？</li><br><li>如果你是爭吵中的其中一位，你希望其他人怎麼幫助你解決爭執？</li><br><li>你曾經有人在你面前爭吵嗎？當時你的感覺是什麼，你是怎麼處理的？</li></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個故事的重點不只在「怎麼解決衝突」，也在於引導孩子覺察「旁觀者也有情緒」——看見衝突讓人不舒服、不知所措，這些感受都很真實。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果看到有衝突發生，試著先在心裡問自己：「我現在感覺怎麼樣？」「我可以做什麼讓情況好一點？」不一定要行動，但先覺察自己是第一步。</p><p><h3>老師的延伸</h3><br>可進行「小法官觀察日誌」：回家觀察或記錄一件與他人衝突的情緒事件，並思考三種不同的處理方式。</p><p>---</p></div>"}, {"code": "S-5", "name": "故事時間（五）——爭奪遙控器的夜晚", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察", "自我管理", "人際技巧", "負責任的決策"], "part": "情境故事", "html": "<div class=\"act-meta\"><p><h3>S-5　故事時間（五）——爭奪遙控器的夜晚</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察・自我管理・人際技巧・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>從家庭衝突情境中覺察自己與他人的情緒，練習協商與溝通，思考解決爭執的方法。</p><p><h3><span class=\"section-label\">【使用教具】</span></h3><br>31th 情緒卡牌</p><p><h3><span class=\"section-label\">【故事內容】</span></h3><br>一天晚上，晚飯後，你和弟弟妹妹們一起坐在客廳裡。這時候，你們都想看電視，但各自喜歡的節目不同——你想看棒球比賽，弟弟想看卡通片，妹妹想看她最喜歡的綜藝節目。你們因為誰能掌握遙控器而陷入激烈的爭論。</p><p>「我要看棒球比賽！」你堅持道。「不行，我要看卡通片！」弟弟不甘示弱。「我要看綜藝節目！」妹妹也不甘落後。爭吵聲越來越大，誰也不肯讓步，情緒變得激動起來。</p><p><h3><span class=\"section-label\">【討論引導】</span></h3><br><li>你在這個情況下感受到什麼情緒？</li><br><li>弟弟和妹妹各自堅持要看自己喜歡的節目時，你的感受是什麼？</li><br><li>你認為弟弟和妹妹在這個爭吵中感受到什麼情緒？</li><br><li>當爭吵聲越來越大時，你有沒有感到害怕或緊張？</li><br><li>你認為有沒有其他方式可以解決這樣的爭執？</li><br><li>你們曾經有過與兄弟姊妹爭吵搶奪東西的情形嗎？當時你的感覺是什麼，你怎麼處理的？</li></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個故事很貼近孩子的生活，可以引發強烈共鳴。重點在於引導孩子把焦點從「誰對誰錯」移向「大家都有需求，可以怎麼協商」。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果家裡出現爭執，試著在情緒升高之前說一句：「我們可不可以先說說各自的原因，再來想辦法？」看看這樣說有沒有讓氣氛不一樣。</p><p><h3>老師的延伸</h3><br>可設計「我們家怎麼解決爭執」的溝通小海報，帶回家和家人一起討論並張貼，建立家庭溝通慣例。</p><p>---</p></div>"}, {"code": "S-6", "name": "故事時間（六）——上台的勇氣", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察", "自我管理", "人際技巧", "負責任的決策"], "part": "情境故事", "html": "<div class=\"act-meta\"><p><h3>S-6　故事時間（六）——上台的勇氣</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察・自我管理・人際技巧・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>理解緊張與害怕是面對挑戰的正常反應，練習同理他人壓力，並思考如何提供有效支持。</p><p><h3><span class=\"section-label\">【使用教具】</span></h3><br>21th 情緒卡牌</p><p><h3><span class=\"section-label\">【故事內容】</span></h3><br>你有一個朋友，對於上台他會感到非常緊張。他不喜歡被別人注視，這種壓力會讓他在面對人群時，感到無法呼吸。每次即將上台，他的手心總是出汗，心跳加速，腦海裡一片空白。雖然他準備得很充分，但一旦站在聚光燈下，那些熟悉的內容似乎都消失了，只剩下無盡的焦慮。為了幫助他克服這種恐懼，你想幫助他……。</p><p><h3><span class=\"section-label\">【討論引導】</span></h3><br><li>你覺得這個朋友最害怕的具體情境是什麼？</li><br><li>在上台準備的過程中，他的情緒是如何變化的？</li><br><li>你想要幫助他，你會怎麼幫助他？</li><br><li>你覺得這個朋友是個怎樣性格的人？有什麼優點？</li><br><li>你生活周遭有沒有這樣的朋友存在？</li><br><li>如果你是這個朋友的狀態，你會希望別人怎麼幫助你？</li></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個故事可以和「緊張小貓五步驟」（H-32）自然連結，讓孩子在討論「我會怎麼幫助朋友」時，同時複習並內化可以實際使用的冷靜方法。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果你看到朋友緊張，試著用一句話告訴他：「沒關係，我在這裡。」不需要解決他的緊張，只需要讓他知道你看到他了。</p><p><h3>老師的延伸</h3><br>可安排角色扮演：兩人一組，一人扮演上台前焦慮的朋友，一人練習給予支持的具體方式（深呼吸引導、加油語、手勢）。</p><p>---</p></div>"}, {"code": "S-7", "name": "故事時間（七）——面對全新的挑戰", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察", "自我管理", "負責任的決策"], "part": "情境故事", "html": "<div class=\"act-meta\"><p><h3>S-7　故事時間（七）——面對全新的挑戰</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察・自我管理・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>理解面對未知帶來的不安是正常的，練習用正向態度看待犯錯與挑戰，建立成長型思維。</p><p><h3><span class=\"section-label\">【使用教具】</span></h3><br>19th 情緒卡牌</p><p><h3><span class=\"section-label\">【故事內容】</span></h3><br>你有一個朋友，他正面臨一個全新的挑戰——他要參加一個他從未參加過的比賽，心中難免感到不安和焦慮。因為挑戰總是帶著未知數，而這些未知常常讓我們感到擔心和害怕。然而，你的朋友是很堅強和有能力的，他總能以智慧和勇氣去面對並克服。這次挑戰，也不會例外，只要不害怕犯錯，每一次的錯誤都是一次學習的機會，只要堅持下去，終會看到努力的成果。</p><p><h3><span class=\"section-label\">【討論引導】</span></h3><br><li>你覺得你的朋友在面臨這個全新挑戰時，心中主要的情緒是什麼？</li><br><li>挑戰中的未知數讓他產生了哪些負面的情緒？</li><br><li>你覺得你的朋友如何看待犯錯這件事？</li><br><li>對於你的朋友來說，什麼是他能夠克服挑戰的主要原因？</li><br><li>在這次挑戰中，你的朋友應該如何處理自己的不安和焦慮？</li><br><li>你曾經面對過全新的挑戰嗎？那是什麼樣的挑戰，你是如何鼓勵自己的？</li></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>強調重點在「面對未知的不安是正常的」，而不是「不應該害怕」——接納情緒本身，是比消除情緒更重要的能力。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週想一件你還沒嘗試過、但有點想試試看的事，對自己說一句鼓勵的話，不一定要馬上行動，只是允許自己去想一想、感覺一下。</p><p><h3>老師的延伸</h3><br>可製作「我的勇氣寶盒」：每人準備一個小盒子，放進「鼓勵語」「我做過的一件勇敢的事」「我曾克服的困難」紙條，作為情緒調節的自我支持工具。</p><p>---</p></div>"}, {"code": "S-8", "name": "故事時間（八）——變化中的驚喜", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察", "自我管理", "負責任的決策"], "part": "情境故事", "html": "<div class=\"act-meta\"><p><h3>S-8　故事時間（八）——變化中的驚喜</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察・自我管理・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>體驗計劃落空時的失落感，練習「情緒轉換」與「替代計畫」的思維方式，培養情緒彈性。</p><p><h3><span class=\"section-label\">【使用教具】</span></h3><br>25th 情緒卡牌</p><p><h3><span class=\"section-label\">【故事內容】</span></h3><br>你有一個朋友，叫小明。小明今天特別興奮，因為他計劃了很久要出門玩，終於來到了這一天。他早早起床，精心打扮，準備好了一切，只等著出門。</p><p>可是，當他打開門的剎那，一陣冷風夾雜著密集的雨點撲面而來。「真是天有不測風雲啊！」小明說著，關上門走回客廳，原本陽光明媚的心情，現在就像窗外的天氣一樣，灰濛濛的。</p><p>不過，小明不是一個輕易放棄的人。他想了想，決定改變計劃——他泡了一杯熱可可，找出一本很久沒有翻閱的書，躺在沙發上，享受起了難得的寧靜時光。「有時候，計劃趕不上變化，但變化也能帶來驚喜啊。」小明心滿意足地想著。</p><p><h3><span class=\"section-label\">【討論引導】</span></h3><br><li>小明今天特別興奮的原因是什麼？</li><br><li>當小明打開門發現下雨時，他的心情有什麼變化？</li><br><li>小明在無法出門玩之後，有沒有立即放棄？他的心情如何？</li><br><li>當小明決定泡熱可可並看書時，他的心情有什麼變化？</li><br><li>如果你是小明，面對這樣的情況，你的心情會是怎樣的？</li><br><li>你有沒有曾經很興奮地要做一件事，但突然意外打亂計劃？當時你的心情如何，你怎麼面對？</li></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個故事的關鍵在「轉念的歷程」——小明沒有假裝不失望，而是在失望後找到了另一種快樂。引導孩子看見，轉念不是否定情緒，而是在情緒後做出新的選擇。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果遇到計劃被打亂的情況，試著做小明做的事：先讓自己失望一下，然後問一句：「還有什麼我可以做，讓今天不白費？」</p><p><h3>老師的延伸</h3><br>可設計「雨天計劃清單」：每位孩子預先寫下三件「計劃落空時可以改做的事」，貼在書桌前，讓「轉念工具」隨時可取用。</p><p>---</p></div>"}, {"code": "S-9", "name": "故事時間（九）——等待中的情緒", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理", "社會覺察", "負責任的決策"], "part": "情境故事", "html": "<div class=\"act-meta\"><p><h3>S-9　故事時間（九）——等待中的情緒</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理・社會覺察・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>辨識等待過程中產生的失落、焦躁與期待情緒，練習在等待中保持冷靜與耐心。</p><p><h3><span class=\"section-label\">【使用教具】</span></h3><br>17th 情緒卡牌</p><p><h3><span class=\"section-label\">【故事內容】</span></h3><br>你有一個朋友，叫小華。小華非常喜歡去樂園玩，今天他和家人一起來到了兒童樂園。他迫不及待地想玩他最喜歡的急流泛舟。</p><p>當他們到達時，小華看見急流泛舟已經排了長長的隊伍。他有些失望，但還是乖乖地站在隊伍後面，耐心等待。他一邊排隊，一邊看著前面的孩子們玩得開心，心情既期待又有些焦急。</p><p>隨著隊伍緩慢地前進，小明開始感到有些無聊和不耐煩，他看看手錶，又看看前面的隊伍，覺得時間過得太慢了，滴答……滴答……</p><p><h3><span class=\"section-label\">【討論引導】</span></h3><br><li>小華看到急流泛舟的長長隊伍時，最初的心情是什麼？</li><br><li>小華在排隊過程中，情緒有什麼變化？</li><br><li>你覺得小華在等待時，有什麼方法可以改善無聊和不耐煩的情緒？</li><br><li>你們猜想小華的家人是否有注意到他的情緒變化？如果有，他們是如何反應的？</li><br><li>如果你是小華，面對這樣的情況，你的心情會是怎樣的？你怎麼排解等待的過程？</li></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>「等待」是孩子生活中非常常見、也常常難以忍受的情境。這個故事提供了一個很好的機會，讓孩子意識到等待時的情緒是真實的，同時探索等待的策略，而不只是「叫孩子忍耐」。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果遇到需要等待的時刻（排隊、等放學、等家人），試著在等待的時候做一件讓自己不那麼無聊的事，可以是觀察周圍、在心裡數數、或想一件讓自己開心的事。</p><p><h3>老師的延伸</h3><br>可引導孩子製作「等候小方法卡」，整理自己在等待時最有效的三件事，貼在聯絡簿，下次等待時就有工具可以用。</p><p>---</p></div>"}, {"code": "S-10", "name": "故事時間（十）——孤單中的努力", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察", "自我管理", "人際技巧", "負責任的決策"], "part": "情境故事", "html": "<div class=\"act-meta\"><p><h3>S-10　故事時間（十）——孤單中的努力</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察・自我管理・人際技巧・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>辨識人際融入困難帶來的挫敗與孤單情緒，思考在尋找歸屬感的過程中如何自我調節，以及如何保有自我。</p><p><h3><span class=\"section-label\">【使用教具】</span></h3><br>29th 情緒卡牌</p><p><h3><span class=\"section-label\">【故事內容】</span></h3><br>你有一個朋友，叫小綠。小綠非常友善，對周圍的人充滿好奇和熱情。然而，最近他遇到了一些困難，因為他一直無法融入他的新朋友群。</p><p>每當朋友們聚在一起聊天時，小綠總是感覺自己說的話很難引起大家的興趣。他努力地參與話題，但總是感覺自己像個局外人。</p><p>有一天，小綠決定嘗試改變自己。他觀察大家喜歡的話題，努力學習那些他並不熟悉的內容，試圖找到共同點。然而，這些努力似乎並沒有得到預期的效果。他開始感到沮喪，心裡充滿了挫敗感。</p><p><h3><span class=\"section-label\">【討論引導】</span></h3><br><li>你覺得小綠是一個什麼樣性格的人？</li><br><li>你覺得小綠碰到什麼困難，他的情緒是什麼？</li><br><li>小綠開始感到沮喪和挫敗感，這些情緒對他的日常生活可能有什麼影響？</li><br><li>小綠該如何面對和處理這些負面情緒？</li><br><li>如果你是小綠，在面對這樣的情況時，你的情緒會是怎樣的，你會如何面對？</li></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>這個故事觸及「努力改變自己去融入」與「保有自我」之間的張力，是很有深度的討論主題。引導孩子思考：什麼時候改變自己是好的，什麼時候需要找到真正接受自己的人？這兩件事都是有效的社交策略。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週想一想：在班上，你有沒有曾經感覺像個局外人？那時你是怎麼讓自己感覺好一點的？如果有一個小綠在你班上，你會希望自己能做什麼？</p><p><h3>老師的延伸</h3><br>可安排「友誼大聲說」活動：讓孩子挑選班上一位平常比較安靜或不太說話的同學，寫一張溫暖友誼卡給他，說一件你注意到的他的好地方。</p><p>---</p><p># 第八部分：綜合延伸活動</p><p>> <strong>定位說明：</strong> 本系列收錄不屬於特定情緒家族、可獨立操作的延伸活動，主題涵蓋身體律動、遊戲辨識、決策反思與目標探索。活動難度適中，可穿插於課程各階段，或作為學期末的統整延伸使用。</p><p>---</p></div>"}, {"code": "E-1", "name": "情緒對對碰——翻出你的感受力", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察", "自我管理", "人際技巧"], "part": "延伸活動", "html": "<div class=\"act-meta\"><p><h3>E-1　情緒對對碰——翻出你的感受力</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察・自我管理・人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過翻牌配對遊戲，練習從圖像中辨識情緒，並說出感受理由，培養情緒觀察力與表達能力。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>探索盒情境卡 32 張（2 套）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>將其中一套情境卡（32 張）正面朝下排成 8×4 格置於桌上。另一套疊成一疊作為補卡堆。邀請所有學生圍著桌子圍成一圈。</li><br><li>年紀最小的孩子當第一位，順時針進行。每次請孩子同時翻開兩張牌卡，說出這兩張卡片各自感受到的情緒（「這張看起來是＿＿，因為＿＿」）。</li><br><li>如果兩張牌卡孩子認為情緒相同，可以將這兩張收回手中；若不同，則放回原位（背面朝上）。每有牌卡被收走，從補卡堆補牌填回空位。</li><br><li>每次翻牌，老師協助提問：「你從卡片中感受到外星人的情緒是什麼？你是從哪裡看出來的？」</li><br><li>完成一輪後，視時間決定是否繼續；可讓孩子將成功配對的牌卡進行情緒分類（快樂系、害怕系、生氣系等）。</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「這個遊戲沒有標準答案——只要你說得出理由，說得通就算配對成功。情緒是主觀的，兩個人看同一張圖，可能有不同感受，這很正常。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>情緒沒有對錯，只要孩子能完整、有邏輯地說明理由，都值得給予肯定。遊戲過程中允許孩子有不同判斷，引導討論這種差異，是很好的同理心練習。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週用遊戲中練習過的「說出理由」方式，在生活中試試：當你觀察到某個人的情緒，先在心裡說說看：「他看起來是＿＿，因為＿＿。」練習從線索推測，而不只是直接問。</p><p><h3>老師的延伸</h3><br>可邀請孩子繪製自己的「情緒情境卡」，描述他人看到這張圖會感受到的情緒，進行下一輪的對對碰。</p><p>---</p></div>"}, {"code": "E-2", "name": "樂動紓壓 5 招——身體是最好的情緒出口", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "延伸活動", "html": "<div class=\"act-meta\"><p><h3>E-2　樂動紓壓 5 招——身體是最好的情緒出口</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>體驗透過身體律動調節情緒，學習五種可隨時使用的紓壓動作。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>空間足夠讓孩子站起來活動（教室走道或操場均可）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>老師說明：「當情緒能量太多、太強，說話解決不了，身體的動作常常是最快的出口。今天我們學 5 招，讓身體幫情緒鬆綁。」</li><br><li>帶領全班依序練習五個動作，每個動作做 5–10 次，感受身體的變化：①甩手甩腳（站好，全身放鬆，手腳像麵條一樣輕輕甩動）、②聳肩放肩（深吸氣同時用力聳肩→吐氣時整個放鬆下來）、③搖搖擺擺（雙腳站穩，身體從頭到尾像海草一樣左右搖擺）、④快走踏步（原地快走 30 秒，腳步用力踩地）、⑤伸展呼吸（雙手往上伸展、深吸→慢慢放下、慢慢吐氣）。</li><br><li>每招結束後問：「這個動作之後，你的身體有沒有什麼不一樣？」</li><br><li>最後問：「今天五招裡，哪一招你覺得最有效？你最可能在什麼時候用它？」</li><br><li>以陪伴句收尾：「你的身體是你的，你可以用它來照顧自己。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你知道嗎？生氣、緊張、難過的時候，那個能量一直卡在身體裡，讓你整個人更難受。今天我們要幫情緒找個出口——用動的！」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>活動前先確認空間安全，提醒孩子動作幅度適中，不碰觸他人。若有孩子因身體狀況無法參與部分動作，以觀察為主，同樣有學習效果。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把今天最喜歡的兩招記下來，貼在書桌前或書包裡。這週心情不好的時候，先做這兩個動作，再決定接下來要怎麼辦。</p><p><h3>老師的延伸</h3><br>可定期在課前安排 2–3 分鐘的「身體暖身」，選一招讓全班一起做，慢慢建立「用身體調節情緒」的班級慣例。</p><p>---</p></div>"}, {"code": "E-3", "name": "單腳平衡——專注當下的身體練習", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "自我管理"], "part": "延伸活動", "html": "<div class=\"act-meta\"><p><h3>E-3　單腳平衡——專注當下的身體練習</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過身體平衡挑戰，練習將注意力帶回當下，體驗專注時情緒自然穩定的效果。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>無（確認站立空間安全）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>請孩子找一個站得穩的位置，雙腳站好，感受腳底與地面的接觸。</li><br><li>深吸一口氣，準備好後，慢慢把一隻腳抬起來，盡量保持平衡。眼睛可以找一個定點看著（不必閉眼）。計時 30 秒。</li><br><li>換腳，再做一次。</li><br><li>引導討論：「你剛才單腳站立的時候，腦袋裡在想什麼？有沒有其他的煩惱或情緒跑出來？你的身體注意到了什麼？」</li><br><li>老師說明：「當我們需要專注在身體上，腦袋就比較難同時擔心其他事。這是一種很自然的、把注意力帶回當下的方法。」</li><br><li>進階版：可以閉上眼睛再試一次，感受難度的不同。以陪伴句收尾：「當你把注意力放在腳底，你的情緒也慢慢跟著穩下來了。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「試試看——當你要讓自己不倒下，你的腦袋有沒有辦法同時想很多事？你會發現，要平衡，就得把所有注意力放在身體上。這就是當下。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>若有孩子平衡較差容易擔心出醜，可以讓孩子靠近牆壁或扶著椅背，重點在體驗「專注帶來穩定」的感受，而不是競賽誰站得最久。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>下次當你感到思緒很亂、情緒很混的時候，找一個安全的地方，試著做 30 秒的單腳站立，把注意力帶回身體，讓自己先穩一下再說。</p><p><h3>老師的延伸</h3><br>可和「感受當下——運用五感回到此刻」（M-3）搭配使用，讓孩子體驗不同方式的「回到當下」，找到最適合自己的方法。</p><p>---</p></div>"}, {"code": "E-4", "name": "袋子裡面有什麼——情緒觸摸遊戲", "family": "彩虹綜合", "emoji": "🌈", "time": "10 分鐘", "sel": ["自我覺察", "社會覺察"], "part": "延伸活動", "html": "<div class=\"act-meta\"><p><h3>E-4　袋子裡面有什麼——情緒觸摸遊戲</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 10 分鐘 ｜ SEL 核心能力：</strong>自我覺察・社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過觸覺猜物遊戲，體驗在「不確定」中的感受變化（好奇、緊張、驚喜），並與情緒學習連結。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>不透明袋子 1–2 個、3–5 種觸感不同的物品（例如：海棉球、石頭、橡皮擦、糖果、羽毛）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>在袋子裡放入幾樣觸感不同的物品，不讓孩子事先看到內容。</li><br><li>請孩子輪流把手伸進袋子，摸一摸，不能看、不能說話，只感受觸感。</li><br><li>把手拿出來後，說出：「我摸到的時候感覺是＿＿（描述觸感），我猜是＿＿，我的感受是＿＿（好奇？緊張？很確定？還是很混亂？）」</li><br><li>全部摸完後，打開袋子看實物，和剛才的猜測比較，討論：猜對了和猜錯了各是什麼感覺？</li><br><li>老師引導連結：「我們每天都在面對很多『不知道裡面有什麼』的情況，有時候是好消息，有時候不確定。你在這樣的時刻，情緒通常是什麼？你怎麼讓自己穩下來？」以陪伴句收尾：「不確定裡面也可以有好奇，不一定只有緊張。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「等一下你會把手伸進一個不知道裡面有什麼的袋子——你有沒有注意到，光是這樣說，你的身體已經有什麼感覺了？這個感覺叫什麼？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>遊戲本身趣味性高，可以作為情緒討論的暖身活動，或在班級氣氛低落時用來帶動活力。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週留意一個讓你感到「不確定」的時刻，試著在心裡問自己：「我現在的感覺是＿＿，我可以做什麼讓自己稍微安定一點？」</p><p><h3>老師的延伸</h3><br>可延伸為「情緒觸感創作」：讓孩子用不同材質的素材（棉花、砂紙、布料）拼貼出自己的情緒地圖，說說每種觸感讓你聯想到什麼情緒。</p><p>---</p></div>"}, {"code": "E-5", "name": "情緒迷宮桌遊——選擇與後果的體驗", "family": "彩虹綜合", "emoji": "🌈", "time": "40 分鐘", "sel": ["負責任的決策", "自我管理", "社會覺察"], "part": "延伸活動", "html": "<div class=\"act-meta\"><p><h3>E-5　情緒迷宮桌遊——選擇與後果的體驗</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 40 分鐘 ｜ SEL 核心能力：</strong>負責任的決策・自我管理・社會覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過桌遊形式體驗「情緒→選擇→後果」的歷程，練習在不同情境下做出合宜的決策。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>情緒迷宮教具（需預先借用，確認可取得）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>介紹桌遊規則（依情緒迷宮教具說明為主），說明今天的重點不在「贏」，而在「練習選擇」。</li><br><li>進行遊戲，老師在旁觀察，適時在關鍵決策點提問：「你現在遇到了什麼情緒？你有哪些選擇？你為什麼選這個？」</li><br><li>遊戲結束後，引導全班討論：「有沒有哪一個選擇讓你後悔？如果重來，你會怎麼做？」「有沒有哪一個選擇讓你很滿意，下次還會這樣做？」</li><br><li>老師帶領統整：情緒本身不能選，但情緒之後的選擇，我們是可以練習的。以陪伴句收尾：「每一個選擇都是在練習——不管結果如何，你都在慢慢學會更了解自己。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天的桌遊不是在比誰跑最快，而是在練習：當情緒出現的時候，我有哪些選擇？每個選擇會帶我去哪裡？」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>情緒迷宮教具需提前借用，確認數量足夠（建議每 4–6 人一組）。遊戲過程中孩子可能出現挫折情緒（輸了、選錯了），這正是最佳的即時教學機會——引導他們用今天學到的情緒工具處理當下的感受。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>回家後，找一個你最近做了某個選擇（任何事都可以）的情境，問自己三個問題：當時我的情緒是什麼？我選擇了什麼？如果重來，我會不會有不同的選擇？</p><p><h3>老師的延伸</h3><br>可讓孩子在學期末設計屬於自己的「情緒迷宮」——用紙和筆畫出一個情緒情境，以及兩到三條不同路線，說明每條路線的可能後果。</p><p>---</p></div>"}, {"code": "E-6", "name": "我的超能力——認識自己的優勢", "family": "彩虹綜合", "emoji": "🌈", "time": "18 分鐘", "sel": ["自我覺察"], "part": "延伸活動", "html": "<div class=\"act-meta\"><p><h3>E-6　我的超能力——認識自己的優勢</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 18 分鐘 ｜ SEL 核心能力：</strong>自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>辨識自己的長處與擅長之事，透過分享提升自信心，學習欣賞他人的優點，培養正向自我認知。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「我的超能力徽章」學習單、彩色筆</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身提問：「如果你有一種超能力，你希望是什麼？為什麼？」引導討論：超能力不只是飛行或隱形，也可以是你做得很棒的事情（很會幫助別人、運動厲害、會說故事、能讓別人開心）。</li><br><li>老師說明：「每個人都有屬於自己的超能力。今天我們要一起發現自己的超能力！」</li><br><li>發下「超能力徽章學習單」，請孩子在徽章上完成三件事：畫或寫出自己最擅長的一件事→用一個形容詞為超能力命名（如「超級耐心王」「故事魔法師」）→寫一句話說明：「我擁有這個超能力，因為……」</li><br><li>老師示範：「我的超能力是傾聽，因為我總是能耐心地聽完朋友說話，讓他們感到被理解。」</li><br><li>小組輪流分享，同學給出一個正向回應（「我也覺得你很有這個超能力！」或「這個超能力讓我感覺……」）。</li><br><li>引導反思：「今天你發現了什麼讓自己驕傲的事情？聽到同學的分享後，有沒有發現你也想學習的超能力？」以陪伴句收尾：「每個人都有獨特的超能力——當我們認識自己的優點，就能更有自信地面對挑戰。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你的超能力可能很特別，可能平常沒有人注意到，但你自己知道——今天我們要把它說出來，讓大家都看見。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>超能力不需要是學科成績或才藝，引導孩子發現品格特質（善良、有幽默感、很有耐心）也是很重要的超能力，往往比技能更珍貴。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的超能力徽章帶回家，讓家人也看看你發現的超能力。接下來一週，每天睡前問自己：「今天我有沒有用到我的超能力？」</p><p><h3>老師的延伸</h3><br>可在班級設置「超能力展覽區」，讓每位孩子的徽章都被看見；也可每個月安排一次「超能力分享」，讓孩子說說這個月他是如何使用自己的超能力的。</p><p>---</p></div>"}, {"code": "E-7", "name": "我的選擇清單——回顧好決定", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["負責任的決策", "自我覺察"], "part": "延伸活動", "html": "<div class=\"act-meta\"><p><h3>E-7　我的選擇清單——回顧好決定</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>負責任的決策・自我覺察</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>幫助孩子辨識自己做過的好決定，理解良好決策對生活的影響，增強未來做出正確選擇的信心。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「我的選擇清單」學習單或 A4 白紙、彩色筆</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身提問：「你最近做過一個讓自己覺得很棒的決定是什麼？有沒有一個選擇讓你變得更開心或幫助了別人？」說明：「今天我們要一起回想自己做過的好決定，並思考這些選擇帶來了哪些好的結果。你會發現，每一個小小的選擇都可能帶來重要的改變！」</li><br><li>在學習單上列出至少三個讓自己感到驕傲或開心的好決定，在每個決定旁邊寫下該決定帶來的影響。範例：好決定：每天認真寫功課→影響：功課準時交出，老師表揚，自己更有自信。好決定：在同學需要幫忙時伸出援手→影響：交到新朋友。好決定：挑戰自己參加朗讀比賽→影響：雖然一開始很緊張，但最終獲得了成就感。</li><br><li>全班輪流分享最喜歡的一個好決定及其影響，老師適時給予正向回饋。</li><br><li>引導反思：「下次當你面臨選擇時，可以問自己：『這個決定會帶來什麼影響？』」以陪伴句收尾：「每一個好決定，無論大小，都為你帶來了成長和改變。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「我們常常注意到自己做錯了什麼，但今天我們要來找找看，你做對了什麼——那些讓你或別人的生活變得好一點點的選擇。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>讓孩子發現「即使是小小的決定」也算（例如：選擇去安慰難過的朋友），這樣孩子比較容易找到素材，也比較能看見自己每天都在做的微小但重要的決定。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的選擇清單帶回家，讀給家人聽。接下來一週，每天睡前問自己：「今天我做了哪個好決定？」不需要是大事，一件小事就夠了。</p><p><h3>老師的延伸</h3><br>可延伸為「好決定牆」，讓孩子每週貢獻一張便利貼，分享一個好決定，累積成班級的正向決策記錄。</p><p>---</p></div>"}, {"code": "E-8", "name": "夢想目標樹——種下成長的種子", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["自我覺察", "負責任的決策"], "part": "延伸活動", "html": "<div class=\"act-meta\"><p><h3>E-8　夢想目標樹——種下成長的種子</h3><br><h3>🌈 彩虹綜合<strong> ｜ ⏱ 15 分鐘 ｜ SEL 核心能力：</strong>自我覺察・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>幫助孩子明確表達夢想與目標，引導他們思考如何一步步實現夢想，透過視覺化方式建立成長思維。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>「夢想與目標樹」學習單、彩色筆或蠟筆</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>引發思考：「什麼是夢想？」（夢想是你最想做的事情，可以是學習某種技能、成為某種職業，或完成一件重要的事）「如何讓夢想實現？」（夢想不會自動發生，我們需要做什麼來一步步達成？）</li><br><li>發下學習單，請孩子按照指引完成「夢想目標樹」：🌳 樹幹（我的夢想）：在樹幹上寫下自己的夢想；🌿 樹枝（小目標）：列出 3–4 個小步驟，幫助慢慢達成夢想；🌱 樹根（支持力量）：寫下幫助你的人或資源（家人、老師、書籍、課程）；🍎 果實（夢想成真時的感受）：畫或寫下當夢想實現時，你的感覺或成就。</li><br><li>鼓勵孩子用顏色裝飾夢想樹，讓它生動有趣。</li><br><li>小組分享（或全班分享）：「你的夢想是什麼？你現在正在做什麼來實現它？」「哪個小目標是你最想先完成的？」「如果遇到困難，誰可以幫助你？」鼓勵學生相互給予正向回饋。</li><br><li>以陪伴句收尾：「夢想就像樹一樣，需要時間和努力才能長大。你們今天種下的這棵樹，就是未來成功的開始！」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「你的夢想是什麼？每個人都有，不管是大是小，不管是遠是近——它只要是你心裡真正想要的，就值得好好種下來。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>夢想目標樹不只是畫一棵樹，重點在「樹根的支持力量」這一格——引導孩子意識到「實現夢想不是一個人的事」，找到可以依靠的資源和人，是很重要的能力。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天回家後，把夢想目標樹分享給家人，讓他們知道你的夢想是什麼，以及你希望怎麼一步步達成。邀請他們說說：他們認為你有什麼特別的能力，可以幫助你實現這個夢想。</p><p><h3>老師的延伸</h3><br>可在學期末安排「夢想目標樹展覽」，讓孩子回頭看自己種下的樹，更新自己目前的進度，或把小目標的某一個打勾，這種成就感往往比任何獎勵都有力量。</p><p>---</p><p># 🧱 積木情緒創作系列</p><p><h3>🌈 彩虹綜合<strong> ｜ ⏱ 依主題：15–40 分鐘 ｜ SEL 核心能力：</strong>自我覺察・自我管理・人際技巧・社會覺察・負責任的決策</h3><br>---</p><p>## <span class=\"section-label\">【系列說明】</span></p><p>積木是一種特殊的情緒表達媒介——它不需要語言，不需要畫功，卻能讓孩子把內心的東西「蓋出來」。透過搭建的過程，孩子同時在思考、選擇、協商與表達，這正是 SEL 學習最真實的發生場景。</p><p>本系列共六個主題，使用同一套教學框架，老師可依課程需求、學生狀態或當週重點，<strong>選擇其中一個主題</strong>獨立操作，也可以在一學期內依序進行，讓孩子看見積木主題的演進。</p><p>---</p><p>## <span class=\"section-label\">【共同教學框架】</span></p><p>### 課前準備</p><p>積木一組（建議每人或每小組有足夠數量）；部分主題需搭配情緒牌卡或學習單，詳見各主題說明。</p><p>### 通用流程結構（約 40 分鐘為例）</p><p>| 階段 | 時間 | 說明 |<br>|------|------|------|<br>| 引導暖身 | 5 分鐘 | 用提問打開主題，啟動孩子的聯想與情緒連結 |<br>| 說明任務 | 3–5 分鐘 | 說明本次搭建的目標與規則 |<br>| 動手搭建 | 15–25 分鐘 | 個人或小組創作，老師巡視引導 |<br>| 分享與討論 | 8–10 分鐘 | 輪流展示作品，說明設計理念，進行引導提問 |<br>| 收斂與行動 | 3–5 分鐘 | 老師統整學習，孩子說出一個具體行動或想法 |</p><p>### 通用引導原則</p><p>- 搭建過程中，老師巡視時以<strong>好奇提問</strong>為主，不給「標準答案」：「這個部分代表什麼？」「你為什麼選這個顏色？」<br>- 允許孩子的作品不完美、不具象——「說得出來」比「做得好看」重要。<br>- 分享時請孩子先說<strong>作品名稱</strong>，再說<strong>設計理念</strong>，最後說<strong>和自己的連結</strong>。<br>- 建議老師協助拍照或錄影，作為記錄與後續反思的素材（上傳各班雲端照片區）。<br>- 進階版：讓各組作品最後拼合成一個「情緒城市」，看見彼此作品的連結。</p><p>---</p><p>## <span class=\"section-label\">【六個主題】</span></p><p>---</p><p>### 🏗 主題 A：情緒建築師</p><p><h3>SEL 核心能力：自我覺察・社會覺察・人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>學習用非語言方式表達情緒，練習情緒辨識與同理；透過小組合作感受「不同意見→協商→共同完成」的過程。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木、情緒牌卡（可使用情緒迷宮教具內的牌卡）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身提問：「如果情緒是一棟建築，它會長什麼樣子？」可邀請孩子先畫出草圖或口頭說說。老師可舉例啟發聯想：「快樂」可能是明亮的黃色房子，有很多窗戶；「憤怒」可能是紅色、高聳且帶有尖角的塔樓；「害怕」可能是黑暗的小屋，四周有高牆。</li><br><li>將學生分為小組（2–3 人一組），發給每組一張情緒主題卡片（如快樂、憤怒、害怕、驚訝等），任務是用積木建構一座代表該情緒的建築或場景。</li><br><li>小組討論並搭建（15 分鐘）。老師引導提問：「你們的建築有哪些元素能讓人感受到這種情緒？」「這個顏色或形狀有什麼象徵意義？」</li><br><li>各組輪流展示作品，說明如何透過形狀、顏色、結構表達情緒；其他小組猜測這棟建築代表哪種情緒，並說出是從哪些地方看出來的。</li><br><li>以陪伴句收尾：「當你能把情緒蓋出來，你就離理解它更近了一步。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「情緒住在每個人心裡，但它長什麼樣子？今天我們要用積木把它蓋出來——不用說話，只用形狀、顏色和高度，讓別人猜出你在想什麼。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>在分享階段，注意引導孩子說出<strong>合作過程中的不同意見</strong>是如何被解決的——這往往比作品本身更有討論價值。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天你用積木表達了一種情緒。回家後，試著用語言再說一次：「那種情緒感覺像是一棟＿＿，因為＿＿。」說給家人聽，看看他們有沒有類似的感受。</p><p><h3>老師的延伸</h3><br>可於學期末讓各組重新搭建同一個主題，比較和期初的作品有何不同，作為情緒理解成長的視覺紀錄。</p><p>---</p><p>### 🤖 主題 B：我的情緒機器人</p><p><h3>SEL 核心能力：自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過創作個人化的情緒機器人，讓孩子表達自己的情緒需求與調節方式；將抽象的「情緒管理策略」具體化為機器人的功能設計。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木、學習單（機器人設計圖紙）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身提問：「當你感到開心、生氣或難過時，什麼樣的事物或人最能幫助你？」引導孩子列舉幾種情緒調節方法（深呼吸、聽音樂、找人說話、畫畫…）。</li><br><li>介紹概念：「情緒機器人是一個能幫助我們處理情緒的小幫手。今天你要設計一個專屬於你的情緒機器人——它長什麼樣子？它有哪些功能？」</li><br><li>孩子先在學習單上畫出設計草圖，為機器人命名，並寫下至少兩個功能。老師引導思考：「機器人有什麼表情？」「它會做什麼事來幫助你？（例如：播放音樂、幫你深呼吸、陪你說話）」</li><br><li>依照設計圖，用積木搭建機器人（20 分鐘）。</li><br><li>展示與分享：每位孩子介紹機器人的名字、外觀與功能，鼓勵同學互相提問：「這個功能怎麼幫助你放鬆？」</li><br><li>以陪伴句收尾：「你已經知道自己需要什麼了——那就是你最強大的情緒工具。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「如果有一個機器人，專門幫你照顧情緒，你會希望它有什麼能力？今天你就是設計師，設計一個只屬於你的情緒機器人。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>孩子在說明機器人功能時，引導他們連結到<strong>真實生活中自己曾用過的情緒調節方法</strong>，讓創作與生活經驗接地。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的機器人功能記下來（或把設計圖帶回家）。這週當你情緒有點亂的時候，試著想一想：「我的機器人現在會幫我做什麼？」然後真的去做那件事。</p><p><h3>老師的延伸</h3><br>可在班級設置「情緒機器人展覽區」，讓孩子看見彼此不同的情緒需求與因應策略，促進同理與互相學習。</p><p>---</p><p>### 🦁 主題 C：友誼動物園</p><p><h3>SEL 核心能力：社會覺察・人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過創作「友誼動物」，具體化對好朋友特質的理解；反思自己在友誼中的角色，以及如何成為更好的朋友。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身——友誼接龍：全班輪流說出一個「好朋友應該有的特質」，不能重複。若孩子卡住，老師可引導：「你希望朋友怎麼對待你？」將關鍵字寫在黑板上備用。</li><br><li>提問啟動創作：「如果一隻動物代表最棒的朋友，它會長什麼樣子？」提供幾個範例啟發思考：獅子代表勇敢與保護、烏龜代表有耐心能陪伴、貓頭鷹代表聰明且願意傾聽、狗狗代表忠誠與陪伴。</li><br><li>每位孩子用積木搭建一隻「友誼動物」（15 分鐘），動物設計需反映孩子認為最重要的友誼特質。</li><br><li>為動物取名，並準備回答：「這隻動物代表什麼友誼特質？它會怎麼陪伴你？」</li><br><li>友誼交流會：輪流分享，並引導討論：「你覺得自己最像哪一種友誼動物？」「如果朋友做了讓你傷心的事，你會怎麼辦？」</li><br><li>共同製作「好朋友宣言」：老師整理孩子分享的內容，寫在白板上，全班一起念出。以陪伴句收尾：「你搭出來的，就是你心裡最珍視的那種陪伴。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「好朋友有很多種——有些像獅子，保護你；有些像烏龜，慢慢陪著你。今天我們要把心目中最棒的朋友用積木蓋出來，看看大家想要的友誼長什麼模樣。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>分享階段引導孩子說出「你自己在友誼中扮演什麼角色」，而不只是描述「理想朋友應該怎樣」，可以讓反思更有深度。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天你搭了一隻友誼動物。回家後想一想：你目前最好的朋友最像哪一種動物？你自己呢？有沒有一個你想多練習的友誼特質，下週可以試試看？</p><p><h3>老師的延伸</h3><br>可讓全班的友誼動物聚在一起，組成「班級友誼動物園」，引導孩子觀察：我們班的友誼動物有哪些種類？哪些特質最多人重視？這個班級最需要什麼樣的朋友？</p><p>---</p><p>### 🏆 主題 D：合作塔</p><p><h3>SEL 核心能力：人際技巧・自我管理・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>在限時挑戰中體驗溝通、分工與協調的重要性；覺察自己在合作中的情緒反應（壓力、挫折、興奮），並練習在衝突出現時用語言表達。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木、計時器</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身提問：「你覺得要一起完成一件事情時，最重要的是什麼？」引導學生說出溝通、傾聽、尊重意見、分工等關鍵字。</li><br><li>說明任務：「今天我們要進行一個挑戰——每組用積木合作蓋出一座最高的塔！」規則：只能用提供的材料；所有組員都要參與，每人至少放一塊積木；時間到就停止；塔必須能自行站立不倒塌。</li><br><li>小組策略討論（3 分鐘）：討論如何分工，規劃搭建順序。老師提示：「你們打算怎麼讓塔保持穩定？如果塔倒了，要怎麼調整？」</li><br><li>計時建塔挑戰（3–5 分鐘）。老師在旁觀察，鼓勵學生討論協調，若有衝突適時引導用語言表達並尋求共識。</li><br><li>成果展示：測量各組高度，每組回答：「什麼合作方法最有效？」「遇到困難時怎麼解決的？」「下次有什麼想改進的？」</li><br><li>以陪伴句收尾：「最高的塔不一定最厲害，最能一起解決問題的隊伍才最強。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天的挑戰很簡單：蓋一座塔。但真正的挑戰是：你們要一起蓋。怎麼分工、怎麼說話、塔倒了怎麼辦——這些才是今天真正要學的。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>塔倒掉的那一刻往往是最好的教學時機——孩子的情緒反應（生氣、沮喪、大笑）可以直接成為討論素材：「剛才塔倒的時候，你的感覺是什麼？你怎麼讓自己繼續？」</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週在學校或家裡找一個需要和別人合作完成的任務，試著在開始前先和對方說：「我們要怎麼分工？」然後看看有沒有比平常更順利。</p><p><h3>老師的延伸</h3><br>可記錄各組的合作過程（口頭描述或拍照），學期末回顧時討論：你們這個學期的「合作塔」有沒有蓋得更好？有沒有學到新的溝通方式？</p><p>---</p><p>### 🌸 主題 E：感恩花園</p><p><h3>SEL 核心能力：自我覺察・社會覺察・人際技巧・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>將「感恩」從抽象概念轉化為具體的積木創作，幫助孩子發現生活中容易被忽略的感恩對象；練習表達感謝，並擬定一個具體的感恩行動。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木、情緒牌卡（可選用）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身——感恩接龍：全班輪流說出一件讓自己感恩的事，不能重複。老師適時引導：「有沒有什麼平常容易忽略、但其實值得感謝的事？」</li><br><li>說明任務：「現在我們要用積木搭建一座『感恩花園』，花園裡每一朵花、每一棵樹，都代表一件讓你感恩的事。」提供顏色對應範例：紅色花代表感謝家人關心，黃色花代表感謝朋友陪伴，綠色葉片代表感謝大自然，讓孩子自由延伸或創造新的象徵。</li><br><li>搭建花園（15–20 分鐘），老師巡視並問：「這朵花代表什麼？」「這個部分是誰讓你感謝的？」搭完後為花園取一個名字。</li><br><li>感恩交流會：輪流分享花園裡的花代表什麼，並討論：「你覺得哪件事最容易忽略，但其實應該感謝？」「除了說謝謝，還有哪些方式可以表達感恩？」</li><br><li>感恩行動計畫：請每位孩子說出一個明天可以做的具體感恩行動（例如：「明天我要對媽媽說謝謝」「我要畫一張感謝卡送給朋友」）。以陪伴句收尾：「當你把感謝說出來、做出來，那份心意就真的到了對方那裡。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「生活裡有很多讓我們感謝的事，但很多時候我們來不及說出口，或根本沒有注意到。今天我們要用積木把那些感謝蓋出來——讓它變得看得見、說得出來。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>感恩花園適合在學期中段進行，當班級氣氛稍微低落或孩子壓力較大時，能有效帶出溫暖與正向連結。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把今天說出的感恩行動真的做一次。做完之後，回想一下：對方的反應是什麼？你自己心裡有什麼感覺？和說出口之前有什麼不同？</p><p><h3>老師的延伸</h3><br>可延伸為「感恩便利貼牆」：每天或每週讓孩子寫一件感恩的事貼在教室，定期回顧，看看班級的感恩清單越來越豐富的樣子。也可結合 SDGs 主題，將「感謝自然」延伸討論到永續環境的議題。</p><p><h3><span class=\"section-label\">【評量重點】</span></h3><br>學生能說出一件以上自己感謝的人事物；能在積木創作中呈現具體的感恩象徵；能說出一個明天可以行動的具體方式。</p><p>---</p><p>### 🌀 主題 F：衝突解決迷宮</p><p><h3>SEL 核心能力：自我覺察・自我管理・社會覺察・人際技巧・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>認識衝突的普遍性，學習不同的衝突解決方法；透過設計「迷宮路線」，讓孩子理解不同選擇會帶來不同結果，培養負責任的決策思維。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木、情緒牌卡（可選用）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>破冰——「誰遇過這種情況？」：老師描述幾種常見衝突情境，請孩子舉手：「有人拿走你的東西，沒問過你。」「你和朋友吵架，兩個人都不開心。」「大家都想當隊長，但沒人願意讓步。」引導：「我們每個人都可能遇到衝突，但我們可以學習不同的方法來解決。」</li><br><li>說明任務：「今天我們要用積木搭建一座『衝突解決迷宮』——起點代表衝突開始，終點代表解決辦法。中間的路線，就是各種不同的選擇。」設計說明：迷宮需要有幾條不同的路線，通往不同的出口，例如「冷靜思考」、「傾聽對方」、「說出自己的想法」、「找大人幫忙」；也可以設計死路，例如「直接大吵」→ 無法解決，最終回到起點。</li><br><li>搭建迷宮（15–20 分鐘）。老師巡視引導：「這條路線代表什麼解決方法？」「你覺得這樣走下去會怎樣？」搭完後為迷宮取名。</li><br><li>分享與討論：輪流介紹迷宮裡的路線設計，並討論：「你的迷宮裡哪種方法最有效？為什麼？」「如果只會生氣或責怪對方，會發生什麼事？」「你有沒有試過用傾聽來解決衝突？效果如何？」</li><br><li>和平行動計畫：每位孩子說出：「下次遇到衝突，我會先＿＿。」以陪伴句收尾：「衝突不是終點，選擇怎麼走，才決定去哪裡。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「衝突就像一座迷宮——你可以在裡面繞圈圈，也可以找到出口。今天我們要把這個迷宮蓋出來，看看哪條路真的能帶你走出去。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>在討論死路（例如「直接大吵」）時，避免讓孩子覺得生氣是「錯的」，而是引導他們理解：生氣是正常的，但選擇怎麼回應才是關鍵。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果遇到衝突，可以在事後回想：當時你走的是哪條路？那條路帶你到哪裡？如果重來一次，你想試試迷宮裡哪條不一樣的路？</p><p><h3>老師的延伸</h3><br>可在班級出現真實衝突時，引導相關的孩子一起來「看看迷宮」——當時我們走了哪條路？現在可以試試哪條路？讓積木作品成為實際的衝突調解工具。也可製作「班級衝突解決小書」，累積不同情境下的有效策略，成為班級共同的智慧資源。</p><p>---</p><p>## <span class=\"section-label\">【積木系列整體行動轉化】</span></p><p><h3>老師的延伸（跨主題）</h3><br>若一學期內進行多個積木主題，建議在學期末安排一次「積木作品回顧展」，讓孩子把不同主題的作品（透過照片）並排展示，引導討論：「你在哪一個主題學到最多？」「積木幫助你理解了什麼？」讓孩子看見自己一個學期的情緒學習歷程。</p><p><h3>進階版創作建議</h3><br>每組的作品最後可以合體，拼成一個「情緒城市」：有情緒建築、友誼動物園、感恩花園和衝突解決迷宮。讓孩子在這座城市裡走一走，想一想：「我想住在城市的哪個角落？」</p><p></p><p>---</p><p># 附錄：常用引導句型參考</p><p>## 情緒命名句型<br>- 「我現在感覺＿＿，因為＿＿。」<br>- 「我的身體在＿＿的地方有感覺——它在提醒我＿＿。」<br>- 「這個感覺像是＿＿（用比喻），它大概是幾度？」</p><p>## 傾聽回應句型<br>- 「我聽到你說……，是這樣嗎？」<br>- 「那一定很……（情緒詞）。」<br>- 「我在這裡，你可以繼續說。」</p><p>## 情緒界線句型<br>- 「我不喜歡你＿＿，我希望你＿＿。」<br>- 「我現在需要一點空間，等我平靜一下我們再談。」<br>- 「我現在的感受是＿＿，我需要的是＿＿。」</p><p>## 道歉修復句型<br>- 「我剛才＿＿（具體說出行為），我知道這讓你＿＿，下次我會＿＿。」</p><p>## 自我鼓勵句型<br>- 「我允許自己現在有這個感覺。」<br>- 「我值得被溫柔對待。」<br>- 「就算很難，我還是可以慢慢來。」</p><p>---</p><p><em>本手冊完整版包含基礎入門 18 個活動、工具型活動 12 個、HOPE 牌卡活動 41 個、冷靜工具箱 6 個、正念系列 7 個、情境故事 10 個、積木系列 6 個、綜合延伸 8 個，共計 108 個活動。</em></p></div>"}, {"code": "L-A", "name": "情緒建築師", "family": "彩虹綜合", "emoji": "🌈", "time": "40 分鐘", "sel": ["自我覺察", "社會覺察", "人際技巧"], "part": "積木創作", "html": "<div class=\"act-meta\"><p>### 🏗 主題 A：情緒建築師</p><p><h3>SEL 核心能力：自我覺察・社會覺察・人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>學習用非語言方式表達情緒，練習情緒辨識與同理；透過小組合作感受「不同意見→協商→共同完成」的過程。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木、情緒牌卡（可使用情緒迷宮教具內的牌卡）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身提問：「如果情緒是一棟建築，它會長什麼樣子？」可邀請孩子先畫出草圖或口頭說說。老師可舉例啟發聯想：「快樂」可能是明亮的黃色房子，有很多窗戶；「憤怒」可能是紅色、高聳且帶有尖角的塔樓；「害怕」可能是黑暗的小屋，四周有高牆。</li><br><li>將學生分為小組（2–3 人一組），發給每組一張情緒主題卡片（如快樂、憤怒、害怕、驚訝等），任務是用積木建構一座代表該情緒的建築或場景。</li><br><li>小組討論並搭建（15 分鐘）。老師引導提問：「你們的建築有哪些元素能讓人感受到這種情緒？」「這個顏色或形狀有什麼象徵意義？」</li><br><li>各組輪流展示作品，說明如何透過形狀、顏色、結構表達情緒；其他小組猜測這棟建築代表哪種情緒，並說出是從哪些地方看出來的。</li><br><li>以陪伴句收尾：「當你能把情緒蓋出來，你就離理解它更近了一步。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「情緒住在每個人心裡，但它長什麼樣子？今天我們要用積木把它蓋出來——不用說話，只用形狀、顏色和高度，讓別人猜出你在想什麼。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>在分享階段，注意引導孩子說出<strong>合作過程中的不同意見</strong>是如何被解決的——這往往比作品本身更有討論價值。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天你用積木表達了一種情緒。回家後，試著用語言再說一次：「那種情緒感覺像是一棟＿＿，因為＿＿。」說給家人聽，看看他們有沒有類似的感受。</p><p><h3>老師的延伸</h3><br>可於學期末讓各組重新搭建同一個主題，比較和期初的作品有何不同，作為情緒理解成長的視覺紀錄。</p></div>"}, {"code": "L-B", "name": "我的情緒機器人", "family": "彩虹綜合", "emoji": "🌈", "time": "40 分鐘", "sel": ["自我覺察", "自我管理"], "part": "積木創作", "html": "<div class=\"act-meta\"><p>：我的情緒機器人</p><p><h3>SEL 核心能力：自我覺察・自我管理</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過創作個人化的情緒機器人，讓孩子表達自己的情緒需求與調節方式；將抽象的「情緒管理策略」具體化為機器人的功能設計。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木、學習單（機器人設計圖紙）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身提問：「當你感到開心、生氣或難過時，什麼樣的事物或人最能幫助你？」引導孩子列舉幾種情緒調節方法（深呼吸、聽音樂、找人說話、畫畫…）。</li><br><li>介紹概念：「情緒機器人是一個能幫助我們處理情緒的小幫手。今天你要設計一個專屬於你的情緒機器人——它長什麼樣子？它有哪些功能？」</li><br><li>孩子先在學習單上畫出設計草圖，為機器人命名，並寫下至少兩個功能。老師引導思考：「機器人有什麼表情？」「它會做什麼事來幫助你？（例如：播放音樂、幫你深呼吸、陪你說話）」</li><br><li>依照設計圖，用積木搭建機器人（20 分鐘）。</li><br><li>展示與分享：每位孩子介紹機器人的名字、外觀與功能，鼓勵同學互相提問：「這個功能怎麼幫助你放鬆？」</li><br><li>以陪伴句收尾：「你已經知道自己需要什麼了——那就是你最強大的情緒工具。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「如果有一個機器人，專門幫你照顧情緒，你會希望它有什麼能力？今天你就是設計師，設計一個只屬於你的情緒機器人。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>孩子在說明機器人功能時，引導他們連結到<strong>真實生活中自己曾用過的情緒調節方法</strong>，讓創作與生活經驗接地。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把你的機器人功能記下來（或把設計圖帶回家）。這週當你情緒有點亂的時候，試著想一想：「我的機器人現在會幫我做什麼？」然後真的去做那件事。</p><p><h3>老師的延伸</h3><br>可在班級設置「情緒機器人展覽區」，讓孩子看見彼此不同的情緒需求與因應策略，促進同理與互相學習。</p></div>"}, {"code": "L-C", "name": "友誼動物園", "family": "彩虹綜合", "emoji": "🌈", "time": "40 分鐘", "sel": ["社會覺察", "人際技巧"], "part": "積木創作", "html": "<div class=\"act-meta\"><p>：友誼動物園</p><p><h3>SEL 核心能力：社會覺察・人際技巧</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>透過創作「友誼動物」，具體化對好朋友特質的理解；反思自己在友誼中的角色，以及如何成為更好的朋友。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身——友誼接龍：全班輪流說出一個「好朋友應該有的特質」，不能重複。若孩子卡住，老師可引導：「你希望朋友怎麼對待你？」將關鍵字寫在黑板上備用。</li><br><li>提問啟動創作：「如果一隻動物代表最棒的朋友，它會長什麼樣子？」提供幾個範例啟發思考：獅子代表勇敢與保護、烏龜代表有耐心能陪伴、貓頭鷹代表聰明且願意傾聽、狗狗代表忠誠與陪伴。</li><br><li>每位孩子用積木搭建一隻「友誼動物」（15 分鐘），動物設計需反映孩子認為最重要的友誼特質。</li><br><li>為動物取名，並準備回答：「這隻動物代表什麼友誼特質？它會怎麼陪伴你？」</li><br><li>友誼交流會：輪流分享，並引導討論：「你覺得自己最像哪一種友誼動物？」「如果朋友做了讓你傷心的事，你會怎麼辦？」</li><br><li>共同製作「好朋友宣言」：老師整理孩子分享的內容，寫在白板上，全班一起念出。以陪伴句收尾：「你搭出來的，就是你心裡最珍視的那種陪伴。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「好朋友有很多種——有些像獅子，保護你；有些像烏龜，慢慢陪著你。今天我們要把心目中最棒的朋友用積木蓋出來，看看大家想要的友誼長什麼模樣。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>分享階段引導孩子說出「你自己在友誼中扮演什麼角色」，而不只是描述「理想朋友應該怎樣」，可以讓反思更有深度。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>今天你搭了一隻友誼動物。回家後想一想：你目前最好的朋友最像哪一種動物？你自己呢？有沒有一個你想多練習的友誼特質，下週可以試試看？</p><p><h3>老師的延伸</h3><br>可讓全班的友誼動物聚在一起，組成「班級友誼動物園」，引導孩子觀察：我們班的友誼動物有哪些種類？哪些特質最多人重視？這個班級最需要什麼樣的朋友？</p></div>"}, {"code": "L-D", "name": "合作塔", "family": "彩虹綜合", "emoji": "🌈", "time": "15 分鐘", "sel": ["人際技巧", "自我管理", "負責任的決策"], "part": "積木創作", "html": "<div class=\"act-meta\"><p>：合作塔</p><p><h3>SEL 核心能力：人際技巧・自我管理・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>在限時挑戰中體驗溝通、分工與協調的重要性；覺察自己在合作中的情緒反應（壓力、挫折、興奮），並練習在衝突出現時用語言表達。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木、計時器</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身提問：「你覺得要一起完成一件事情時，最重要的是什麼？」引導學生說出溝通、傾聽、尊重意見、分工等關鍵字。</li><br><li>說明任務：「今天我們要進行一個挑戰——每組用積木合作蓋出一座最高的塔！」規則：只能用提供的材料；所有組員都要參與，每人至少放一塊積木；時間到就停止；塔必須能自行站立不倒塌。</li><br><li>小組策略討論（3 分鐘）：討論如何分工，規劃搭建順序。老師提示：「你們打算怎麼讓塔保持穩定？如果塔倒了，要怎麼調整？」</li><br><li>計時建塔挑戰（3–5 分鐘）。老師在旁觀察，鼓勵學生討論協調，若有衝突適時引導用語言表達並尋求共識。</li><br><li>成果展示：測量各組高度，每組回答：「什麼合作方法最有效？」「遇到困難時怎麼解決的？」「下次有什麼想改進的？」</li><br><li>以陪伴句收尾：「最高的塔不一定最厲害，最能一起解決問題的隊伍才最強。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「今天的挑戰很簡單：蓋一座塔。但真正的挑戰是：你們要一起蓋。怎麼分工、怎麼說話、塔倒了怎麼辦——這些才是今天真正要學的。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>塔倒掉的那一刻往往是最好的教學時機——孩子的情緒反應（生氣、沮喪、大笑）可以直接成為討論素材：「剛才塔倒的時候，你的感覺是什麼？你怎麼讓自己繼續？」</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週在學校或家裡找一個需要和別人合作完成的任務，試著在開始前先和對方說：「我們要怎麼分工？」然後看看有沒有比平常更順利。</p><p><h3>老師的延伸</h3><br>可記錄各組的合作過程（口頭描述或拍照），學期末回顧時討論：你們這個學期的「合作塔」有沒有蓋得更好？有沒有學到新的溝通方式？</p></div>"}, {"code": "L-E", "name": "感恩花園", "family": "彩虹綜合", "emoji": "🌈", "time": "40 分鐘", "sel": ["自我覺察", "社會覺察", "人際技巧", "負責任的決策"], "part": "積木創作", "html": "<div class=\"act-meta\"><p>：感恩花園</p><p><h3>SEL 核心能力：自我覺察・社會覺察・人際技巧・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>將「感恩」從抽象概念轉化為具體的積木創作，幫助孩子發現生活中容易被忽略的感恩對象；練習表達感謝，並擬定一個具體的感恩行動。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木、情緒牌卡（可選用）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>暖身——感恩接龍：全班輪流說出一件讓自己感恩的事，不能重複。老師適時引導：「有沒有什麼平常容易忽略、但其實值得感謝的事？」</li><br><li>說明任務：「現在我們要用積木搭建一座『感恩花園』，花園裡每一朵花、每一棵樹，都代表一件讓你感恩的事。」提供顏色對應範例：紅色花代表感謝家人關心，黃色花代表感謝朋友陪伴，綠色葉片代表感謝大自然，讓孩子自由延伸或創造新的象徵。</li><br><li>搭建花園（15–20 分鐘），老師巡視並問：「這朵花代表什麼？」「這個部分是誰讓你感謝的？」搭完後為花園取一個名字。</li><br><li>感恩交流會：輪流分享花園裡的花代表什麼，並討論：「你覺得哪件事最容易忽略，但其實應該感謝？」「除了說謝謝，還有哪些方式可以表達感恩？」</li><br><li>感恩行動計畫：請每位孩子說出一個明天可以做的具體感恩行動（例如：「明天我要對媽媽說謝謝」「我要畫一張感謝卡送給朋友」）。以陪伴句收尾：「當你把感謝說出來、做出來，那份心意就真的到了對方那裡。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「生活裡有很多讓我們感謝的事，但很多時候我們來不及說出口，或根本沒有注意到。今天我們要用積木把那些感謝蓋出來——讓它變得看得見、說得出來。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>感恩花園適合在學期中段進行，當班級氣氛稍微低落或孩子壓力較大時，能有效帶出溫暖與正向連結。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>把今天說出的感恩行動真的做一次。做完之後，回想一下：對方的反應是什麼？你自己心裡有什麼感覺？和說出口之前有什麼不同？</p><p><h3>老師的延伸</h3><br>可延伸為「感恩便利貼牆」：每天或每週讓孩子寫一件感恩的事貼在教室，定期回顧，看看班級的感恩清單越來越豐富的樣子。也可結合 SDGs 主題，將「感謝自然」延伸討論到永續環境的議題。</p><p><h3><span class=\"section-label\">【評量重點】</span></h3><br>學生能說出一件以上自己感謝的人事物；能在積木創作中呈現具體的感恩象徵；能說出一個明天可以行動的具體方式。</p></div>"}, {"code": "L-F", "name": "衝突解決迷宮", "family": "彩虹綜合", "emoji": "🌈", "time": "40 分鐘", "sel": ["自我覺察", "自我管理", "社會覺察", "人際技巧", "負責任的決策"], "part": "積木創作", "html": "<div class=\"act-meta\"><p>：衝突解決迷宮</p><p><h3>SEL 核心能力：自我覺察・自我管理・社會覺察・人際技巧・負責任的決策</h3><br><h3><span class=\"section-label\">【活動目標】</span></h3><br>認識衝突的普遍性，學習不同的衝突解決方法；透過設計「迷宮路線」，讓孩子理解不同選擇會帶來不同結果，培養負責任的決策思維。</p><p><h3><span class=\"section-label\">【教具準備】</span></h3><br>積木、情緒牌卡（可選用）</p><p><h3><span class=\"section-label\">【活動步驟】</span></h3><br><li>破冰——「誰遇過這種情況？」：老師描述幾種常見衝突情境，請孩子舉手：「有人拿走你的東西，沒問過你。」「你和朋友吵架，兩個人都不開心。」「大家都想當隊長，但沒人願意讓步。」引導：「我們每個人都可能遇到衝突，但我們可以學習不同的方法來解決。」</li><br><li>說明任務：「今天我們要用積木搭建一座『衝突解決迷宮』——起點代表衝突開始，終點代表解決辦法。中間的路線，就是各種不同的選擇。」設計說明：迷宮需要有幾條不同的路線，通往不同的出口，例如「冷靜思考」、「傾聽對方」、「說出自己的想法」、「找大人幫忙」；也可以設計死路，例如「直接大吵」→ 無法解決，最終回到起點。</li><br><li>搭建迷宮（15–20 分鐘）。老師巡視引導：「這條路線代表什麼解決方法？」「你覺得這樣走下去會怎樣？」搭完後為迷宮取名。</li><br><li>分享與討論：輪流介紹迷宮裡的路線設計，並討論：「你的迷宮裡哪種方法最有效？為什麼？」「如果只會生氣或責怪對方，會發生什麼事？」「你有沒有試過用傾聽來解決衝突？效果如何？」</li><br><li>和平行動計畫：每位孩子說出：「下次遇到衝突，我會先＿＿。」以陪伴句收尾：「衝突不是終點，選擇怎麼走，才決定去哪裡。」</li></p><p><h3><span class=\"section-label\">【引導語建議】</span></h3><br><em>「衝突就像一座迷宮——你可以在裡面繞圈圈，也可以找到出口。今天我們要把這個迷宮蓋出來，看看哪條路真的能帶你走出去。」</em></p><p><h3><span class=\"section-label\">【老師小提醒】</span></h3><br>在討論死路（例如「直接大吵」）時，避免讓孩子覺得生氣是「錯的」，而是引導他們理解：生氣是正常的，但選擇怎麼回應才是關鍵。</p><p><h3><span class=\"section-label\">【行動轉化】</span></h3><br><h3>孩子的任務</h3><br>這週如果遇到衝突，可以在事後回想：當時你走的是哪條路？那條路帶你到哪裡？如果重來一次，你想試試迷宮裡哪條不一樣的路？</p><p><h3>老師的延伸</h3><br>可在班級出現真實衝突時，引導相關的孩子一起來「看看迷宮」——當時我們走了哪條路？現在可以試試哪條路？讓積木作品成為實際的衝突調解工具。也可製作「班級衝突解決小書」，累積不同情境下的有效策略，成為班級共同的智慧資源。</p><p>---</p><p>## 【積木系列整體</p></div>"}];
