<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記憶建築師｜繽紛小島・直覺操作版</title>
<style>
:root{
  --paper:#eef9ff; --card:#fffdfa; --ink:#344766; --ink-soft:#596e88;
  --kraft:#c9a46e; --coral:#ff7187; --mustard:#ffd05c; --blue:#55a7f7; --leaf:#5fbe9b;
  --line:#c3dbea; --fix:#d98a3d; --cell:clamp(76px,23vw,106px); --n:3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .26 0 0 0 0 .16 0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color:var(--ink);
  font-family:"jf-openhuninn-2.0","Iansui","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:18px; line-height:1.65; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.app{max-width:1000px;margin:0 auto;padding:12px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:.06em}
.brand svg{width:38px;height:38px}
.top-tools{display:flex;gap:8px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  padding:.6em 1.2em;min-height:48px;cursor:pointer;
  background:var(--card);border:2.5px solid var(--ink);
  border-radius:14px 18px 12px 17px / 16px 12px 18px 14px;
  box-shadow:3px 4px 0 rgba(74,58,42,.85);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 rgba(74,58,42,.85)}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}
.btn.primary{background:var(--mustard);font-weight:700}
.btn.big{font-size:1.15rem;padding:.75em 1.8em;min-height:56px}
.btn.small{font-size:.9rem;min-height:38px;padding:.3em .9em;box-shadow:2px 3px 0 rgba(74,58,42,.8)}
.btn.ghost{background:transparent}
.btn:focus-visible,.cell:focus-visible,.tray-blk:focus-visible,.lvl:focus-visible,.deco-opt:focus-visible,.chip:focus-visible,.island:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}

.card{
  background:var(--card);border:2px solid var(--ink);
  border-radius:22px 18px 24px 16px / 18px 24px 16px 22px;
  padding:18px 20px;box-shadow:4px 5px 0 rgba(74,58,42,.16);
}
.soft{color:var(--ink-soft);font-size:.92rem}
.eyebrow{margin:0;color:var(--ink-soft);font-size:.9rem;letter-spacing:.12em}
h1,h2,h3{line-height:1.3;margin:.2em 0 .4em}
h1{font-size:2.2rem;letter-spacing:.12em}

.screen{display:none}
.screen.active{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* village */
.village{width:100%;height:auto;display:block;border:2.5px solid var(--ink);border-radius:18px 22px 16px 24px / 20px 16px 24px 18px;background:#dff5ff}
.village .new-build{animation:buildIn 1s cubic-bezier(.25,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes buildIn{0%{opacity:0;transform:translateY(-34px) scale(.92)}60%{opacity:1}100%{opacity:1;transform:none}}
.village .smoke{animation:smoke 3.2s ease-in-out infinite;transform-box:fill-box}
@keyframes smoke{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-12px)}}
.village .conf{animation:fall 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes fall{0%{transform:translateY(-60px) rotate(0)}100%{transform:translateY(330px) rotate(320deg)}}
.village .sway{animation:sway 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.village .spin{animation:spin 7s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.village .bob{animation:bob 2.8s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.village .wave{animation:wave 3.4s ease-in-out infinite;transform-box:fill-box}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.village .splash{animation:splash 1.3s ease-in-out infinite}
@keyframes splash{0%,100%{opacity:.35}50%{opacity:1}}
.village .beam{animation:beam 2.6s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.25}50%{opacity:.5}}
.village .twinkle{animation:splash 2.2s ease-in-out infinite}
.village .burst{animation:burst 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes burst{0%{transform:scale(.15);opacity:0}15%{opacity:1}70%{transform:scale(1);opacity:.9}100%{transform:scale(1.08);opacity:0}}

/* intro */
.intro{text-align:center;max-width:760px;margin:0 auto}
.intro .story{text-align:left;margin:14px auto;max-width:620px}
.story p{margin:.5em 0}
.howto{list-style:none;padding:0;margin:16px 0 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;counter-reset:s}
.howto li{counter-increment:s;background:#f3e6c9;border:2px dashed var(--line);border-radius:14px 10px 16px 12px;padding:10px 8px;font-size:.88rem;line-height:1.45}
.howto li::before{content:counter(s);display:block;width:28px;height:28px;margin:0 auto 4px;border:2px solid var(--ink);border-radius:50%;background:var(--mustard);font-weight:800;line-height:24px}
.howto b{display:block;font-size:1rem}
@media (max-width:620px){.howto{grid-template-columns:repeat(2,1fr)}}

/* map */
.islands{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px}
.island{flex:0 0 auto;cursor:pointer;padding:.35em .9em;border:2px solid var(--ink);border-radius:999px;font-size:.9rem;background:var(--card);box-shadow:2px 2px 0 rgba(74,58,42,.5)}
.island:disabled{cursor:not-allowed;border:2px dashed var(--line);color:var(--ink-soft);background:rgba(251,245,232,.5);box-shadow:none}
.island.on{background:var(--mustard);font-weight:800}
.island .ok{color:var(--leaf);font-weight:800}
.map-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.map-grid{grid-template-columns:1fr}}
.vc-head,.lc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.vc-note{margin:.7em 0 0}
.progress{height:12px;border:2px solid var(--ink);border-radius:999px;background:#efe2c4;overflow:hidden;margin:6px 0 4px}
.progress span{display:block;height:100%;background:var(--leaf);border-right:2px solid var(--ink)}
.levels{display:grid;gap:8px;margin:8px 0 14px}
.lvl{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;text-align:left;cursor:pointer;
  padding:8px 12px;background:#fffdfa;border:2px solid var(--ink);border-radius:12px 16px 11px 15px;box-shadow:2px 3px 0 rgba(74,58,42,.6)}
.lvl:disabled{cursor:not-allowed;opacity:.45;box-shadow:none;border-style:dashed}
.lvl.next{background:#fbe9b8}
.lvl .num{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;background:#f3e6c9}
.lvl.done .num{background:var(--leaf);color:#fff}
.mini-stars svg{width:18px;height:18px}
.ticket{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;font-weight:700;white-space:nowrap}
.ticket svg{width:26px;height:18px}

/* play */
.play-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.lvl-title{font-weight:800;font-size:1.1rem}
.speech{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.avatar{flex:0 0 64px;width:64px;height:64px;border:2.5px solid var(--ink);border-radius:50% 46% 52% 48%;background:#f3e6c9;overflow:hidden}
.avatar svg{width:100%;height:100%}
.bubble{position:relative;flex:1;background:var(--card);border:2px solid var(--ink);border-radius:18px 14px 20px 12px;padding:10px 14px;min-height:64px}
.bubble::before{content:"";position:absolute;left:-11px;top:20px;border:9px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble .who{display:block;font-size:.85rem;color:var(--ink-soft);font-weight:700}
.steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:.84rem;margin:4px 0 14px}
.steps span{padding:.12em .8em;border:1.5px dashed var(--line);border-radius:999px;color:var(--ink-soft)}
.steps span.on{background:var(--mustard);border:1.5px solid var(--ink);color:var(--ink);font-weight:700}
.steps span.done{border-style:solid;color:var(--ink)}
.stage{min-height:300px}
.msg{min-height:1.6em;text-align:center;color:var(--ink-soft);margin:10px 0 0}
.center{text-align:center}
.task-card{max-width:560px;margin:0 auto;text-align:center}
.task-card h2{font-size:1.6rem}
.vtag{display:inline-block;margin:0 0 8px;padding:.2em .9em;border:2px dashed var(--blue);border-radius:12px;background:#e2ebee;font-size:.95rem}
.think{font-size:1.08rem;margin:14px auto;max-width:520px;padding:6px 10px;background:linear-gradient(transparent 62%, rgba(230,179,62,.35) 62%)}

.blueprint{display:inline-block;background:#e2ebee;
  background-image:linear-gradient(rgba(77,130,176,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(77,130,176,.16) 1px,transparent 1px);
  background-size:14px 14px;border:2.5px solid #3f6f8f;border-radius:10px 14px 12px 16px;padding:10px 14px 16px;
  box-shadow:4px 5px 0 rgba(63,111,143,.25);transform:rotate(-.8deg)}
.bp-head{font-size:.85rem;color:#3f6f8f;letter-spacing:.14em;margin-bottom:8px;font-weight:800;text-align:left}
.bp-grid{display:grid;grid-template-columns:repeat(var(--bn,3),var(--bp));gap:6px}
.blueprint.big{--bp:clamp(72px,22vw,104px)}
.blueprint.big.n4{--bp:clamp(54px,16.5vw,82px)}
.blueprint.small{--bp:42px;padding:8px 10px 10px}
.blueprint.small.n4{--bp:32px}
.blueprint.small .bp-head{font-size:.72rem;margin-bottom:4px}
.bp-cell{width:var(--bp);height:var(--bp);border:2px dashed rgba(63,111,143,.45);border-radius:8px;position:relative}
.bp-cell svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px)}
.blueprint.unroll{animation:unroll .5s ease both;transform-origin:top center}
@keyframes unroll{from{transform:rotate(-.8deg) scaleY(.15);opacity:.2}to{transform:rotate(-.8deg) scaleY(1);opacity:1}}
.rolled{width:150px;margin:6px auto;animation:rollup .55s ease both}
@keyframes rollup{from{transform:scaleY(2.4);opacity:.3}to{transform:none;opacity:1}}

.build-wrap{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.build-wrap.n4{--cell:clamp(58px,17.5vw,90px)}
.build-main{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.ref{text-align:center;font-size:.85rem;color:var(--ink-soft)}
.board{display:grid;grid-template-columns:repeat(var(--n),var(--cell));gap:8px;padding:12px;background:#e8d9b8;border:2.5px solid var(--ink);border-radius:16px 20px 14px 22px / 20px 14px 22px 16px}
.cell{width:var(--cell);height:var(--cell);position:relative;padding:0;cursor:pointer;background:#f8f0de;border:2px dashed #b9a17a;border-radius:12px 10px 13px 11px}
.cell.can-drop:hover,.cell.can-drop:focus-visible{background:#fff6dc;border-color:var(--ink)}
.cell .blk,.cell .ghost{position:absolute;inset:5px;pointer-events:none}
.cell .ghost{opacity:.32}
.cell svg{width:100%;height:100%;display:block}
.cell.sel .blk{transform:translateY(-6px) scale(1.04);filter:drop-shadow(0 6px 0 rgba(74,58,42,.3))}
.cell.mark-fix::after{content:"";position:absolute;inset:-5px;border:4px dashed #c96f22;border-radius:16px;animation:breathe 1.6s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.okmark{position:absolute;right:-6px;top:-8px;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;border:2px solid var(--ink);font-size:.8rem;line-height:20px;font-weight:800;pointer-events:none}
.cell.clue::before{content:"";position:absolute;inset:-6px;border:4px solid var(--clue);border-radius:16px;animation:pulse 1.2s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.05);opacity:1}}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;min-height:calc(var(--cell)*.74 + 26px);
  width:calc(var(--cell)*var(--n) + 8px*(var(--n) - 1) + 28px);max-width:100%;
  padding:10px 12px;border:2px dashed var(--line);border-radius:14px 18px 12px 16px;background:rgba(201,164,110,.12)}
.tray-label{font-size:.8rem;color:var(--ink-soft);margin-bottom:-8px}
.tray-blk{width:calc(var(--cell)*.74);height:calc(var(--cell)*.74);padding:0;border:none;background:none;cursor:pointer;transition:transform .12s}
.tray-blk svg{width:100%;height:100%}
.tray-blk.sel{transform:translateY(-8px) scale(1.06);filter:drop-shadow(0 7px 0 rgba(74,58,42,.3));outline:3px dashed var(--ink);outline-offset:4px;border-radius:16px}
.tray-empty{margin:0;color:var(--ink-soft);font-size:.92rem;text-align:center}
.tools{display:flex;flex-direction:column;gap:12px;min-width:180px}
@media (max-width:760px){.tools{flex-direction:row;flex-wrap:wrap;justify-content:center;width:100%}}
.peek{position:absolute;inset:-6px;z-index:5;background:rgba(244,234,214,.97);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.peek[hidden]{display:none}
.bar{width:220px;height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#efe2c4}
.bar span{display:block;height:100%;background:var(--blue);animation:shrink 4s linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}

/* pass */
.pass{max-width:720px;margin:0 auto;text-align:center}
.tag{display:inline-block;font-size:.85rem;padding:.1em .8em;border:1.5px solid var(--ink);border-radius:999px;background:#f3e6c9}
.ability{font-size:1.12rem;margin:.3em auto .6em;max-width:560px}
.stars-big{display:flex;gap:12px;justify-content:center;margin:6px 0}
.sb svg{width:64px;height:64px}
.sb path{fill:none;stroke:#c4b394;stroke-width:1.4;transition:fill .2s}
.sb.lit path{fill:var(--mustard);stroke:var(--ink)}
.sb.lit{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.sb.dim{opacity:.55}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.star-label{font-weight:800;font-size:1.15rem;margin:.2em 0}
.star-label small{display:block;font-weight:400;font-size:.9rem;color:var(--ink-soft)}
.fade{opacity:0;transform:translateY(8px);transition:opacity .45s, transform .45s;pointer-events:none}
.fade.in{opacity:1;transform:none;pointer-events:auto}
.pass-village{margin:12px 0}
.caption{margin:.5em 0 0;font-weight:700}
.reflect{margin:10px auto;padding:12px;border:2px dashed var(--line);border-radius:16px 12px 18px 14px;max-width:620px}
.reflect .q{margin:0 0 8px;font-weight:800;font-size:1.08rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{cursor:pointer;padding:.35em .9em;border:2px solid var(--ink);border-radius:999px;background:#fffdfa;font-size:.95rem}
.chip.on{background:var(--leaf);color:#fff}
.reply{min-height:1.6em;margin:8px 0 0;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px}

/* party & deco */
.party{max-width:760px;margin:0 auto;text-align:center}
.party .story{text-align:left;max-width:620px;margin:12px auto}
.reward{background:#fbe9b8;border:2px dashed var(--ink);border-radius:14px;padding:8px 12px}
.deco-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.deco-grid{grid-template-columns:1fr}}
.deco-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.deco-opt{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;background:#fffdfa;border:2px solid var(--ink);border-radius:14px 10px 15px 12px;font-size:.9rem}
.deco-opt svg{width:72px;height:56px;border-radius:8px}
.deco-opt.on{background:#fbe9b8;box-shadow:inset 0 0 0 3px var(--mustard);font-weight:800}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(74,58,42,.42);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg[hidden]{display:none}
.modal{max-width:620px;width:100%;max-height:88vh;overflow:auto;animation:fadeIn .25s}
.hint-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.hint-opts .btn{flex-direction:column;gap:0;padding:.7em .6em}
.hint-opts small{font-size:.8rem;color:var(--ink-soft);font-weight:400}
.follow-box{border-top:2px dashed var(--line);margin-top:12px;padding-top:10px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row input[type=range]{flex:1}
details{margin-top:14px;border-top:2px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700}
.log-table{width:100%;border-collapse:collapse;font-size:.78rem;margin:8px 0}
.log-table th,.log-table td{border:1px solid var(--line);padding:3px 4px;text-align:center;white-space:nowrap}
textarea{width:100%;height:90px;font-size:.75rem;font-family:monospace}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
/* Clear, bright toy world with generous touch targets. */
:root{--paper:#eef9ff;--card:#fffdfa;--ink:#344766;--ink-soft:#596e88;--coral:#ff7187;--mustard:#ffd05c;--blue:#55a7f7;--leaf:#58c79c;--line:#c3dbea;--cell:clamp(64px,21vw,100px)}
body{background-image:radial-gradient(circle at 12px 12px,#ffffffc9 3px,transparent 4px),linear-gradient(150deg,#e7f6ff,#fff3fa 70%,#fff9df);background-size:36px 36px,100% 100%;background-attachment:fixed}
.app{max-width:1100px;padding-bottom:36px}.topbar{padding:8px 0}.brand{color:#385997;font-weight:900}.brand svg{width:44px;height:44px}.card{border:3px solid #344766;border-radius:26px;box-shadow:0 7px 0 #c7d9e8;background:#fffdfa}
h1{color:#427bc5;letter-spacing:.07em;font-weight:900;font-size:clamp(2rem,7vw,3.1rem);text-shadow:2px 3px 0 #d9edff}h2{font-weight:900}.intro-badge{display:inline-block;background:#ffe1ef;color:#92516c;border-radius:999px;padding:4px 18px;font-size:.85rem;font-weight:800}.intro .story{background:#f2faff;border-radius:18px;padding:2px 18px}.eyebrow{letter-spacing:.04em}
.btn{border:2.5px solid #344766;border-radius:16px;background:white;box-shadow:0 4px 0 #344766;font-weight:800;min-height:50px}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #344766}.btn.primary{background:linear-gradient(#ffdc78,#ffcb4e);color:#344766}.btn.ghost{background:#fffdfa}.btn.small{min-height:44px;border-radius:13px}.btn:focus-visible,.cell:focus-visible,.tray-blk:focus-visible,.lvl:focus-visible{outline:4px solid #4897ed;outline-offset:3px}.btn:disabled{opacity:.5;box-shadow:none;transform:none}

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-s" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand" id="brandLogo"></div>
    <div class="top-tools">
      <button class="btn small" id="quickSound" type="button"></button>
      <button class="btn small" id="btnSettings" type="button">設定</button>
    </div>
  </header>

  <section id="s-intro" class="screen">
    <div class="card intro">
      <p class="eyebrow">記住一點點，讓小島長大一點點｜50 個小任務</p>
      <div class="intro-badge">小小建築師，準備出發！</div><h1>記憶建築師</h1>
      <div id="introVillage"></div>
      <div class="story">
        <p>昨晚的暴風雨吹過五座小島：小屋村、花園街、彩虹市集、河岸工坊和星光港灣。居民們想重新打造家園，正在找一位<b>記憶建築師</b>。</p>
        <p>建築師的祕訣是：先仔細看設計圖，把它記在腦袋裡，再憑記憶把積木放回去。</p>
        <p>放錯了也沒關係。真正的建築師，也會回頭檢查、慢慢修正。</p>
      </div>
      <ol class="howto">
        <li><b>看藍圖</b>記住顏色和位置</li>
        <li><b>收起藍圖</b>在心裡再看一次</li>
        <li><b>憑記憶重建</b>選積木 → 點格子，也可以拖過去</li>
        <li><b>完成檢查</b>放錯可以再修正</li>
      </ol>
      <button class="btn primary big" data-go="start" id="btnStart" type="button">我願意加入！</button>
    </div>
  </section>

  <section id="s-map" class="screen">
    <div class="islands" id="islands" role="group" aria-label="五座島"></div>
    <div class="map-grid">
      <div class="card">
        <div class="vc-head"><h2 id="mapName"></h2><span id="mapProgress" class="soft"></span></div>
        <div class="progress" aria-hidden="true"><span id="mapBar"></span></div>
        <div id="mapVillage"></div>
        <p class="vc-note" id="mapNote"></p>
      </div>
      <div class="card">
        <div class="lc-head"><h3>建設任務</h3><span id="mapTickets"></span></div>
        <div class="levels" id="levels"></div>
        <button class="btn" data-go="deco" id="btnDeco" type="button">布置這座島</button>
        <p class="soft" id="decoHint"></p>
      </div>
    </div>
  </section>

  <section id="s-play" class="screen">
    <div class="play-head">
      <button class="btn small ghost" data-go="map" type="button">← 回地圖</button>
      <div class="lvl-title" id="lvlTitle"></div>
      <div id="ticketBadge"></div>
    </div>
    <div class="speech"><div class="avatar" id="avatar"></div><div class="bubble" id="bubble" aria-live="polite"></div></div>
    <div id="stage" class="stage"></div>
    <p id="msg" class="msg" aria-live="polite"></p>
  </section>

  <section id="s-pass" class="screen"><div class="card pass" id="passBox"></div></section>
  <section id="s-party" class="screen"><div class="card party" id="partyBox"></div></section>

  <section id="s-deco" class="screen">
    <div class="deco-grid">
      <div class="card">
        <h2 id="decoTitle"></h2>
        <div id="decoVillage"></div>
        <p class="soft">每一類選一款，隨時可以回來換，不用花任何東西。</p>
      </div>
      <div class="card" id="decoPanel"></div>
    </div>
    <div class="actions"><button class="btn primary big" data-go="map" type="button">布置好了</button></div>
  </section>
</div>

<div class="modal-bg" id="modal" hidden><div class="modal card" id="modalBox" role="dialog" aria-modal="true"></div></div>

function freshIsl(i){return{best:Array(10).fill(0),built:Array(10).fill(false),reward:false,deco:Object.assign({},ISL[i].decoDefault)};}
function defaults(){return{isl:ISL.map((_,i)=>freshIsl(i)),cur:0,tickets:3,log:[],sound:true,vol:0.7};}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalize(o){
 const d=defaults();if(!o||typeof o!=='object'||Array.isArray(o))return d;
 d.isl=d.isl.map((f,i)=>{const x=Array.isArray(o.isl)&&o.isl[i]&&typeof o.isl[i]==='object'?o.isl[i]:{};
 f.best=f.best.map((_,k)=>Array.isArray(x.best)&&Number.isInteger(x.best[k])&&x.best[k]>=0&&x.best[k]<=3?x.best[k]:0);
 f.built=f.best.map(v=>v>0);f.reward=f.best.every(v=>v>0)&&x.reward===true;
 if(x.deco&&typeof x.deco==='object')for(const [k,D] of Object.entries(ISL[i].deco))if(D.opts.some(([v])=>v===x.deco[k]))f.deco[k]=x.deco[k];
 if(i===0&&f.best.every(v=>v>0)&&!f.deco.pet)f.deco.pet='cat';return f;});
 d.cur=Number.isInteger(o.cur)&&o.cur>=0&&o.cur<5&&(o.cur===0||d.isl[o.cur-1].best.every(v=>v>0))?o.cur:0;
 d.tickets=Number.isInteger(o.tickets)?Math.max(0,Math.min(999,o.tickets)):3;
 d.sound=typeof o.sound==='boolean'?o.sound:true;d.vol=Number.isFinite(o.vol)?Math.max(0,Math.min(1,o.vol)):.7;
 const num=(v,hi=99999)=>Number.isFinite(v)?Math.max(0,Math.min(hi,Math.round(v))):0;
 if(Array.isArray(o.log))d.log=o.log.filter(l=>l&&typeof l==='object').slice(-500).map(l=>({time:typeof l.time==='string'?l.time.slice(0,50):'',isl:Math.max(1,num(l.isl,5)),lvl:Math.max(1,num(l.lvl,10)),ver:l.ver==='變化版'?'變化版':'原版',stars:Math.max(1,num(l.stars,3)),peeks:num(l.peeks),clues:num(l.clues),errors:num(l.errors),follow:l.follow===1?1:0,obs:num(l.obs),build:num(l.build),strategy:STRATS.some(x=>x[0]===l.strategy)?l.strategy:''}));
 return d;
}

 ctx:null,master:null,nb:null,theme:0,
 init(){try{
   if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;

   os.frequency.setValueAtTime(f,t);if(o.glide)os.frequency.exponentialRampToValueAtTime(o.glide,t+dur*0.6);
   const g=o.g||0.2,a=o.a||0.005;v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+a);
   v.gain.exponentialRampToValueAtTime(0.0001,t+dur);os.connect(v);v.connect(this.master);os.start(t);os.stop(t+dur+0.05);},
 noise(t,dur,o={}){const c=this.ctx,s=c.createBufferSource();s.buffer=this.nb;s.loop=true;
   const fl=c.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1200,t);
   if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur);fl.Q.value=o.q||1;
   const v=c.createGain(),g=o.g||0.12;v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+(o.a||0.005));
   v.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(v);v.connect(this.master);
   s.start(t,Math.random());s.stop(t+dur+0.05);},

   ========================================================= */
const TRANS=[(r,c,n)=>[r,c],(r,c,n)=>[c,n-1-r],(r,c,n)=>[n-1-r,n-1-c],(r,c,n)=>[n-1-c,r],(r,c,n)=>[r,n-1-c],(r,c,n)=>[n-1-r,c],(r,c,n)=>[c,r],(r,c,n)=>[n-1-c,n-1-r]];
const cfgKey=t=>Object.keys(t).map(Number).sort((a,b)=>a-b).map(k=>k+t[k]).join(',');
const lastVariant={};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeVariant(isl,lvl){
  const base=parseCfg(ISL[isl].levels[lvl].cfg),n=ISL[isl].n,pal=ISL[isl].palette,orig=cfgKey(base),lk=isl+'-'+lvl;
  let out=null;
  for(let tries=0;tries<60;tries++){
    const T=TRANS[Math.floor(Math.random()*8)],perm=shuffle(pal),map={};pal.forEach((c,i)=>map[c]=perm[i]);
    const t={};for(const cell in base){const r=Math.floor(cell/n),cc=cell%n,[r2,c2]=T(r,cc,n);t[r2*n+c2]=map[base[cell]];}
    const k=cfgKey(t);if(k!==orig&&k!==lastVariant[lk]){out=t;lastVariant[lk]=k;break;}
  }
  return out||base;
}

  }else if(G.phase==='recall'){
    st.innerHTML=`${stepsHTML(1)}<div class="card task-card"><svg class="rolled" viewBox="0 0 150 60" aria-hidden="true"><g  stroke="${I}" stroke-width="2.5" stroke-linejoin="round"><rect x="20" y="16" width="110" height="28" rx="6" fill="#e2ebee" stroke="#3f6f8f"/><ellipse cx="20" cy="30" rx="8" ry="14" fill="#cfdde3" stroke="#3f6f8f"/><ellipse cx="130" cy="30" rx="8" ry="14" fill="#cfdde3" stroke="#3f6f8f"/><path d="M70 16 V44 M80 16 V44" stroke="#ff7187" stroke-width="3"/></g></svg><p class="think">藍圖收起來了。先在心裡再看一次：<br>${recallText()}</p><button class="btn primary big" data-act="startBuild" type="button">開始建造</button></div>`;
  }else if(G.phase==='build'){
    if(G.clue&&colorAt(G.clue.cell)===G.clue.c)G.clue=null;

    st.innerHTML=`${stepsHTML(2)}<div class="build-wrap ${n===4?'n4':''}" style="--n:${n}">
      ${G.follow?`<div class="ref">${blueprintHTML('small')}<p>參考藍圖</p></div>`:''}
      <div class="build-main">
        <div class="build-help" role="status">${placementHelp()}</div><div class="piece-progress"><b>積木 ${Object.keys(G.placed).length} / ${G.blocks.length}</b><span>${G.sel?'已選積木，點格子放下':G.focusCell!==null?'已選格子，點積木放入':'位置記好了嗎？'}</span></div>
        <div class="board" role="group" aria-label="建造棋盤">${boardHTML()}</div>
        <div class="tray-label">積木盒 · 想取回積木，也可以拖回這裡</div>
        <div class="tray" id="tray">${trayHTML()}</div>

      </div>
      <div class="tools">
        ${G.follow?'':`<button class="btn" data-act="hint" type="button" ${G.busy?'disabled':''}>提示工具箱（${P.tickets}）</button>`}
        <button class="btn" data-act="undo" type="button" ${G.busy||!G.undo.length?'disabled':''}>↶ 上一步</button><button class="btn" data-act="clear" type="button" ${G.busy||!Object.keys(G.placed).length?'disabled':''}>全部收回</button><button class="btn" data-act="help" type="button">怎麼玩？</button><button class="btn" data-act="return" type="button" ${boardSel&&!G.busy?'':'disabled'}>取回積木</button>
        <button class="btn primary" data-act="check" type="button" ${all&&!G.busy?'':'disabled'}>${all?'蓋好了，檢查看看！':'再放 '+(G.blocks.length-Object.keys(G.placed).length)+' 塊就能檢查'}</button>
      </div></div>`;
  }
  restoreStageFocus(focusKey);
}
function boardHTML(){
  let h='';const n=G.n;
  for(let i=0;i<n*n;i++){
    const id=G.placed[i],c=colorAt(i),isSel=G.sel&&G.sel.from==='board'&&G.sel.cell===i,mark=G.marks[i]||'',clue=G.clue&&G.clue.cell===i;
    const cls=['cell'];if(isSel)cls.push('sel');if(G.focusCell===i)cls.push('focused-cell');if(mark)cls.push('mark-'+mark);if(clue)cls.push('clue');if(G.sel&&!isSel)cls.push('can-drop');
    const label=`第${Math.floor(i/n)+1}排第${i%n+1}格，${c?COLORS[c].name+SHAPES[c]+'積木':'空格'}${mark==='fix'?'，再想一想':''}${mark==='ok'?'，放對了':''}${clue?'，線索：這裡要放'+COLORS[G.clue.c].name:''}`;
    h+=`<button class="${cls.join(' ')}" data-cell="${i}" data-occupied="${c?'true':'false'}" type="button" aria-pressed="${isSel||G.focusCell===i}" ${G.busy?'disabled':''} aria-label="${label}" ${clue?`style="--clue:${COLORS[G.clue.c].fill}"`:''}>${c?`<span class="blk">${blockSVG(c,G.blocks[id].tilt)}</span>`:''}${clue&&!c?`<span class="ghost">${blockSVG(G.clue.c)}</span>`:''}${mark==='ok'?'<span class="okmark" aria-hidden="true">✓</span>':''}<span class="coord">${Math.floor(i/n)+1}·${i%n+1}</span></button>`;
  }
  return h;
}
function trayHTML(){
  const used=new Set(Object.values(G.placed)),free=G.blocks.filter(b=>!used.has(b.id));
  if(!free.length)return `<p class="tray-empty">積木都放上去了。<br>看一看，再按「完成檢查」。</p>`;
  return free.map(b=>{const sel=G.sel&&G.sel.from==='tray'&&G.sel.id===b.id;
    return `<button class="tray-blk ${sel?'sel':''}" data-blk="${b.id}" type="button" ${G.busy?'disabled':''} aria-pressed="${sel}" aria-label="${COLORS[b.c].name}${SHAPES[b.c]}積木">${blockSVG(b.c,b.tilt)}<span class="block-name">${COLORS[b.c].name}</span></button>`;}).join('');
}
function placementHelp(){
 if(G.busy)return '再看一次藍圖，等收起來再動手。';
 if(G.sel){const b=G.blocks[G.sel.id];return `已選：${COLORS[b.c].name}${SHAPES[b.c]} · 點格子放下${G.sel.from==='board'?'；點另一塊可以交換':''}。`;}
 if(G.focusCell!==null)return `已選第 ${Math.floor(G.focusCell/G.n)+1} 排、第 ${G.focusCell%G.n+1} 格 · 請點積木盒的積木。`;
 return '① 選積木 ② 點格子 · 也可以直接拖過去！';
}
function canEdit(){return G&&G.phase==='build'&&!G.busy&&$('#s-play').classList.contains('active');}
function pushUndo(){G.undo.push(JSON.stringify({placed:G.placed,marks:G.marks}));if(G.undo.length>60)G.undo.shift();}
function finishEdit(message,sound){G.sel=null;G.focusCell=null;if(G.errors>0&&!G.clue)setBubble('慢慢想一想藍圖裡的位置。可以移動、交換，也可以請提示工具幫忙。');say(message);sound();renderStage();}
function onTray(id){
 if(!canEdit()||!Number.isInteger(id)||!G.blocks[id]||Object.values(G.placed).includes(id))return;
 if(G.focusCell!==null){const cell=G.focusCell;G.sel={from:'tray',id};return onCell(cell);}
 if(G.sel&&G.sel.from==='tray'&&G.sel.id===id){G.sel=null;say('取消選取了。');}
 else{G.sel={from:'tray',id};Snd.select();say('再點一個格子放下積木。');}
 renderStage();
}
function onCell(i){
 if(!canEdit()||!Number.isInteger(i)||i<0||i>=G.n*G.n)return;
 const occ=G.placed[i],sel=G.sel;
 if(!sel){
  if(occ!==undefined){G.sel={from:'board',id:occ,cell:i};G.focusCell=null;Snd.select();say('點另一格就能移動；點另一塊就能交換。也可以按「取回積木」。');}
  else{G.focusCell=G.focusCell===i?null:i;Snd.select();say(G.focusCell===null?'取消選取了。':'格子選好了，點積木盒裡的一塊積木。');}
  renderStage();return;
 }
 if(sel.from==='board'&&sel.cell===i){G.sel=null;G.focusCell=null;say('取消選取了。');renderStage();return;}
 pushUndo();
 if(sel.from==='tray'){G.placed[i]=sel.id;delete G.marks[i];finishEdit(occ!==undefined?'換好了，原來的積木已回到盒子。':'放好了！想修改，點積木再點另一格。',()=>Snd.place());}
 else{if(occ!==undefined)G.placed[sel.cell]=occ;else delete G.placed[sel.cell];G.placed[i]=sel.id;delete G.marks[i];delete G.marks[sel.cell];finishEdit(occ!==undefined?'兩塊積木交換好了！':'移到新位置了！',()=>Snd.slide());}
}
function returnSel(){
 if(!canEdit()||!G.sel||G.sel.from!=='board')return;
 pushUndo();delete G.placed[G.sel.cell];delete G.marks[G.sel.cell];finishEdit('積木回到盒子了。',()=>Snd.pickup());
}
function undo(){if(!canEdit()||!G.undo.length)return;const prev=JSON.parse(G.undo.pop());G.placed=prev.placed;G.marks=prev.marks;finishEdit('回到上一步了。',()=>Snd.pickup());}
function clearBoard(){if(!canEdit()||!Object.keys(G.placed).length)return;pushUndo();G.placed={};G.marks={};finishEdit('積木都收回來了。按「上一步」可以放回去。',()=>Snd.pickup());}
function howTo(){openModal('<h2>小小建築師操作卡</h2><ol class="help-list"><li>先選一塊積木，再點想放的格子。</li><li>也可以先點空格，再選積木；或直接拖過去。</li><li>點棋盤上的積木，再點另一格就會移動；另一格有積木就會交換。</li><li>用「取回積木」或拖回積木盒，就能收回。</li><li>按錯了？按「上一步」就能復原。放好全部積木，再按「檢查看看」。</li></ol><p class="soft">鍵盤：方向鍵移動格子焦點、Enter 選取、Delete 取回積木、Esc 取消選取。</p><button class="btn primary" data-m="close">我知道了！</button>');}

function check(){
  if(!canEdit()||Object.keys(G.placed).length!==G.blocks.length)return;
  let ok=0,wrong=0;G.marks={};G.sel=null;
  // 判分規則：比對「每一格的顏色」是否與藍圖相同，同色積木可以互換
  for(let i=0;i<G.n*G.n;i++){const c=colorAt(i);if(!c)continue;if(G.target[i]===c){ok++;G.marks[i]='ok';}else{wrong++;G.marks[i]='fix';}}
  if(wrong===0)return finish();
  G.errors++;Snd.fix();
  const t=ok>0?`你已經放對 ${ok} 塊了！虛線圈起來的那 ${wrong} 塊，想一想它原本在哪裡。`:'積木都放上去了，這是很好的開始！虛線圈起來的積木，再想一想位置。';
  setBubble(t);say('');renderStage();
}
function calcStars(){
  if(G.follow||G.clues>0)return 1;
  if(G.peeks===0&&G.errors===0)return 3;
  if(G.peeks+G.errors<=2)return 2;
  return 1;
}
function finish(){
  if(!canEdit()||wrongCells().length)return;cancelPeek();G.busy=true;G.phase='done';
  const {isl,lvl}=G,S=P.isl[isl],stars=calcStars(),prev=S.best[lvl],first=!S.built[lvl];
  S.best[lvl]=Math.max(prev,stars);
  if(first)S.built[lvl]=true;
  let reward=false;
  if(S.best.every(v=>v>0)&&!S.reward){P.tickets+=3;S.reward=true;reward=true;if(isl===0&&!S.deco.pet)S.deco.pet='cat';}
  P.log.push({time:new Date().toLocaleString('zh-TW',{hour12:false}),isl:isl+1,lvl:lvl+1,ver:G.variant?'變化版':'原版',stars,peeks:G.peeks,clues:G.clues,errors:G.errors,
    follow:G.follow?1:0,obs:Math.round(G.obsSec),build:Math.round((Date.now()-G.t1)/1000),strategy:''});
  if(P.log.length>500)P.log=P.log.slice(-500);
  save();
  last={isl,lvl,stars,first,best:S.best[lvl],improved:!first&&stars>prev,reward,follow:G.follow,n:G.blocks.length,variant:G.variant};
  runPass(last);
}
function abilityText(r){
  if(r.stars===3)return `你記住了${CN[r.n]}塊積木的顏色和位置，一次就蓋對了！`;
  if(r.stars===2)return '你記住了大部分的位置，還會回頭檢查、自己修正，把作品調整到正確。';
  if(r.follow)return '你一邊看藍圖一邊對照，把每一塊都放到正確的位置。下次可以試試自己記記看！';
  return '你沒有放棄，一步步找到正確的位置，把建築完成了！';
}
async function runPass(r){
  const tok=++passTok;show('pass');
  const Lv=ISL[r.isl].levels[r.lvl],box=$('#passBox');
  let acts='';
  if(r.lvl===9&&r.first)acts+=`<button class="btn primary big" data-go="party" type="button">參加落成慶祝</button>`;
  else if(r.lvl<9)acts+=`<button class="btn primary big" data-go="next" type="button">下一個任務</button>`;
  acts+=`<button class="btn" data-go="retry" type="button">挑戰新設計圖</button><button class="btn" data-go="map" type="button">回地圖</button>`;
  box.innerHTML=`<span class="tag">${ISL[r.isl].name}｜第 ${r.lvl+1} 關｜${Lv.task}${r.variant?'｜變化版':''}</span><h2>重建正確！</h2><p class="ability">${abilityText(r)}</p>
    <div class="stars-big" role="img" aria-label="這次得到 ${r.stars} 顆星">${[0,1,2].map(i=>`<span class="sb" data-i="${i}">${starSVG()}</span>`).join('')}</div>
    <p class="star-label fade" id="starLabel">${LABEL[r.stars][0]}<small>${LABEL[r.stars][1]}</small></p>
    <div class="pass-village fade" id="passVillage"></div>
    <div class="reflect fade" id="reflect"><p class="q">你是怎麼記住的？</p><div class="chips">${STRATS.map(([k,t])=>`<button class="chip" data-strat="${k}" type="button">${t}</button>`).join('')}</div><p class="reply" id="reply" aria-live="polite"></p></div>
    <div class="actions in" id="passActions">${acts}</div>`;
  Snd.theme=r.isl;Snd.success();await sleep(1100);if(tok!==passTok)return;
  for(let i=0;i<3;i++){const el=box.querySelector(`.sb[data-i="${i}"]`);
    if(i<r.stars){el.classList.add('lit');Snd.star(i);await sleep(480);if(tok!==passTok)return;}else el.classList.add('dim');}
  $('#starLabel').classList.add('in');await sleep(600);if(tok!==passTok)return;
  const cap=r.first?`建設成果：${Lv.result}`:`這一關的建設已經完成了。最佳紀錄 ${r.best} 顆星${r.improved?'，這次比之前更獨立了！':'。'}`;
  $('#passVillage').innerHTML=villageSVG(r.isl,{newIdx:r.first?r.lvl:null})+`<p class="caption">${cap}</p>`;
  $('#passVillage').classList.add('in');
  if(r.first){await sleep(200);if(tok!==passTok)return;Snd.build();}
  await sleep(1100);if(tok!==passTok)return;
  $('#reflect').classList.add('in');$('#passActions').classList.add('in');
}

   提示工具箱

function openModal(html){modalReturn=document.activeElement;pausePeek();$('#modalBox').innerHTML=html;$('#modal').hidden=false;const f=$('#modalBox').querySelector('button:not([disabled])');if(f)f.focus();}
function closeModal(){$('#modal').hidden=true;resumePeek();if(modalReturn&&modalReturn.isConnected)modalReturn.focus();modalReturn=null;}
function openHint(){
  if(!canEdit())return;
  const n=P.tickets;
  openModal(`<h3>提示工具箱</h3><p>你有 <b>${n}</b> 張提示券，每張可以換一種幫忙：</p>
    <div class="hint-opts">
      <button class="btn" data-m="peek" type="button" ${n<1?'disabled':''}><b>再看藍圖</b><small>藍圖打開 4 秒</small></button>
      <button class="btn" data-m="clue" type="button" ${n<1?'disabled':''}><b>一塊位置線索</b><small>標出一個還沒放對的位置</small></button>
    </div>
    ${n<1?'<p class="soft">提示券用完了。完成一整座島，會再收到一個工具箱。</p>':''}
    <div class="follow-box"><p>也可以<b>免費</b>選「跟著藍圖一起蓋」：看著藍圖完成，這關會得到一星（合作完工），之後可以再回來挑戰自己記。</p>
      <button class="btn" data-m="follow" type="button">跟著藍圖一起蓋</button></div>
    <div class="actions"><button class="btn primary" data-m="close" type="button">先自己再試試</button></div>`);
}
function cancelPeek(){if(peekState){clearTimeout(peekState.timer);if(G===peekState.owner)G.busy=false;peekState=null;}}
function pausePeek(){if(!peekState||peekState.paused)return;clearTimeout(peekState.timer);peekState.remaining=Math.max(0,peekState.remaining-(Date.now()-peekState.started));peekState.paused=true;const bar=$('#peek .bar span');if(bar)bar.style.animationPlayState='paused';}
function resumePeek(){if(!peekState||!peekState.paused)return;peekState.paused=false;const bar=$('#peek .bar span');if(bar)bar.style.animationPlayState='running';schedulePeek();}
function schedulePeek(){const ps=peekState;if(!ps)return;ps.started=Date.now();ps.timer=setTimeout(()=>{if(peekState!==ps||G!==ps.owner||G.phase!=='build')return;peekState=null;G.busy=false;Snd.hide();say('藍圖收起來了，繼續建造吧！');renderStage();},ps.remaining);}
function doPeek(){
 if(!canEdit()||P.tickets<1)return;
 P.tickets--;save();G.peeks++;G.sel=null;G.focusCell=null;closeModal();G.busy=true;renderStage();
 const pk=$('#peek');pk.innerHTML=blueprintHTML('big',true)+'<div class="bar" aria-hidden="true"><span style="animation-duration:'+(window.__fast?.4:4)+'s"></span></div><p class="soft">藍圖再打開 4 秒</p>';pk.hidden=false;
 Snd.open();say('藍圖打開了，再看一次。');peekState={owner:G,remaining:window.__fast?400:4000,paused:false,timer:null,started:0};schedulePeek();
}

function doClue(){
  if(!canEdit()||P.tickets<1)return;
  const w=wrongCells();
  if(!w.length){closeModal();say('先按「完成檢查」看看吧！');return;}
  P.tickets--;save();G.clues++;
  const cell=w[Math.floor(Math.random()*w.length)];
  G.clue={cell,c:G.target[cell]};G.sel=null;closeModal();Snd.open();
  setBubble(`看看發亮的格子：那裡要放<b>${COLORS[G.clue.c].name}</b>積木。`);say('');renderStage();
}
function doFollow(){
  if(!canEdit())return;G.follow=true;G.clue=null;closeModal();Snd.open();
  setBubble('看著參考藍圖，一塊一塊對好位置。完成後，再回來挑戰自己記也可以喔。');renderStage();
}

function openSettings(){
  const sname=k=>(STRATS.find(s=>s[0]===k)||['',''])[1];
  const rows=P.log.slice(-60).reverse().map(l=>`<tr><td>${esc(l.time)}</td><td>${l.isl||1}</td><td>${l.lvl}</td><td>${esc(l.ver||'原版')}</td><td>${l.stars}</td><td>${l.peeks}</td><td>${l.clues}</td><td>${l.errors}</td><td>${l.follow?'是':''}</td><td>${l.obs}</td><td>${l.build}</td><td>${sname(l.strategy)}</td></tr>`).join('');
  const tsv=['時間\t島\t關卡\t版本\t星等\t再看圖\t位置線索\t錯誤檢查\t跟圖\t觀察秒數\t重建秒數\t記憶方法']
    .concat(P.log.map(l=>[l.time,l.isl||1,l.lvl,l.ver||'原版',l.stars,l.peeks,l.clues,l.errors,l.follow?'是':'',l.obs,l.build,sname(l.strategy)].join('\t'))).join('\n');
  openModal(`<h3>設定</h3>
    <label class="row"><input type="checkbox" id="setSound" ${P.sound?'checked':''}> 開啟音效</label>
    <label class="row">音量 <input type="range" id="setVol" min="0" max="1" step="0.05" value="${P.vol}"></label>
    <button class="btn small" data-m="test" type="button">試聽音效</button>
    <p class="soft">所有重要回饋也有文字與動畫，關掉聲音一樣能玩。</p>
    <details><summary>老師區：試玩紀錄</summary>
      <p class="soft">每關第一次玩是固定的「原版」，方便比較不同孩子；重玩會出現「變化版」（翻轉、旋轉並交換顏色，難度相同）。星等與紀錄用來觀察孩子的記憶策略與求助方式，不作為注意力診斷或療效判定。紀錄只存在這台裝置的瀏覽器裡。</p>
      ${P.log.length?`<div style="overflow-x:auto"><table class="log-table"><thead><tr><th>時間</th><th>島</th><th>關</th><th>版本</th><th>星</th><th>再看圖</th><th>線索</th><th>錯誤檢查</th><th>跟圖</th><th>觀察秒</th><th>重建秒</th><th>記憶方法</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="soft">可複製到試算表（Tab 分隔）：</p><textarea readonly>${esc(tsv)}</textarea>`:'<p>還沒有試玩紀錄。</p>'}
      <div class="actions"><button class="btn small" data-m="export">匯出進度備份</button><button class="btn small" data-m="import">匯入進度備份</button></div><button class="btn small" data-m="reset" type="button">清除全部進度與紀錄</button>
    </details>
    <div class="actions"><button class="btn primary" data-m="close" type="button">完成</button></div>`);
  $('#setSound').addEventListener('change',e=>{P.sound=e.target.checked;Snd.init();Snd.apply();save();setQuick();});
  $('#setVol').addEventListener('input',e=>{P.vol=+e.target.value;Snd.apply();save();});
}

/* =========================================================
   落成慶祝與自由布置
   ========================================================= */
function showParty(isl){
  const I0=ISL[isl],S=P.isl[isl];Snd.theme=isl;
  const names=Object.values(I0.deco).map(x=>x.title).join('、');
  $('#partyBox').innerHTML=`<p class="eyebrow">第${['一','二','三','四','五'][isl]}座島完成</p><h2>${I0.party.title}</h2>${villageSVG(isl,{party:true})}
    <div class="story"><p>${I0.party.story}</p>
    <p class="reward">${S.reward?'你收到一個新的工具箱：<b>提示券 +3</b><br>':''}自由布置也開放了，選${names}，把${I0.name}變成你喜歡的樣子吧！</p></div>
    <div class="actions"><button class="btn primary big" data-go="deco" type="button">開始布置</button>
    ${isl<4?`<button class="btn big" data-go="nextisl" type="button">前往下一座島：${ISL[isl+1].name}</button>`:''}
    <button class="btn" data-go="map" type="button">回地圖</button></div>`;
  show('party');setTimeout(()=>Snd.celebrate(),350);
}
function decoIcon(isl,k,v){
  const D=ISL[isl].deco[k],crop=typeof D.crop==='string'?D.crop:D.crop[v];
  return villageSVG(isl,{all:true,deco:{[k]:v},viewBox:crop});
}
function renderDeco(){
  const i=P.cur,I0=ISL[i],S=P.isl[i];
  $('#decoTitle').textContent=`布置${I0.name}`;
  $('#decoVillage').innerHTML=villageSVG(i);
  $('#decoPanel').innerHTML=Object.entries(I0.deco).map(([k,D])=>`<h3>${D.title}</h3><div class="deco-opts" role="group" aria-label="${D.title}">${D.opts.map(([v,l])=>`<button class="deco-opt ${S.deco[k]===v?'on':''}" data-deco="${k}:${v}" type="button" aria-pressed="${S.deco[k]===v}">${decoIcon(i,k,v)}<span>${l}</span></button>`).join('')}</div>`).join('');
}
function showDeco(){const i=P.cur;if(!islDone(i))return;if(i===0&&!P.isl[0].deco.pet){P.isl[0].deco.pet='cat';save();}renderDeco();show('deco');}

/* =========================================================
   事件
   ========================================================= */
$('#stage').addEventListener('click',e=>{
  if(!G)return;
  const a=e.target.closest('[data-act],[data-cell],[data-blk]');
  if(!a){if(e.target.closest('#tray'))returnSel();return;}if(a.disabled)return;
  if(a.dataset.cell!==undefined)return onCell(+a.dataset.cell);
  if(a.dataset.blk!==undefined)return onTray(+a.dataset.blk);
  const act=a.dataset.act;
  if(act==='toObserve'){G.phase='observe';G.t0=Date.now();setBubble('仔細看設計圖。慢慢看沒關係，看好了再按「我記住了」。');renderStage();}
  else if(act==='memorized'){G.obsSec=(Date.now()-G.t0)/1000;G.phase='build';G.t1=Date.now();Snd.hide();setBubble('藍圖收起來了！先在心裡想一遍，再把積木放回去。');say('選積木再點格子，也可以先點格子，再選積木。');renderStage();}
  else if(act==='startBuild'){G.phase='build';G.t1=Date.now();setBubble(`選一塊積木，再點格子放上去。${CN[G.blocks.length]}塊都放好，就按「完成檢查」。`);renderStage();}
  else if(act==='hint')openHint();
  else if(act==='return')returnSel();
  else if(act==='check')check();
  else if(act==='undo')undo();else if(act==='clear')clearBoard();else if(act==='help')howTo();
});
$('#modalBox').addEventListener('click',e=>{
  const b=e.target.closest('[data-m]');if(!b||b.disabled)return;
  const m=b.dataset.m;
  if(m==='close')closeModal();
  else if(m==='peek')doPeek();
  else if(m==='clue')doClue();
  else if(m==='follow')doFollow();
  else if(m==='export')exportProgress();else if(m==='import')$('#importFile').click();
  else if(m==='test'){Snd.init();Snd.success();}
  else if(m==='reset'){if(confirm('確定要清除所有進度與試玩紀錄嗎？')){const s=P.sound,v=P.vol;passTok++;cancelPeek();G=null;last=null;P=defaults();P.sound=s;P.vol=v;save();closeModal();renderIntro();renderMap();show('map');}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();});
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'),lv=e.target.closest('[data-lvl]'),st=e.target.closest('[data-strat]'),dc=e.target.closest('[data-deco]'),il=e.target.closest('[data-isl]');
  if(il&&!il.disabled){P.cur=+il.dataset.isl;save();renderMap();return;}
  if(lv&&!lv.disabled){startLevel(P.cur,+lv.dataset.lvl);return;}
  if(st){
    document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===st));
    const s=STRATS.find(x=>x[0]===st.dataset.strat);$('#reply').textContent=s[2];Snd.deco();
    if(P.log.length){P.log[P.log.length-1].strategy=s[0];save();}
    return;
  }
  if(dc){const [k,v]=dc.dataset.deco.split(':');P.isl[P.cur].deco[k]=v;save();Snd.deco();renderDeco();return;}
  if(!go)return;
  const g=go.dataset.go;
  if(g==='start'){Snd.init();renderMap();show('map');}
  else if(g==='map'){passTok++;G=null;renderMap();show('map');}
  else if(g==='next'&&last)startLevel(last.isl,last.lvl+1);
  else if(g==='retry'&&last)startLevel(last.isl,last.lvl);
  else if(g==='party'&&last)showParty(last.isl);
  else if(g==='nextisl'&&last){P.cur=Math.min(4,last.isl+1);save();renderMap();show('map');}
  else if(g==='deco'){if(last&&$('#s-party').classList.contains('active'))P.cur=last.isl;showDeco();}
});
$('#quickSound').addEventListener('click',()=>{P.sound=!P.sound;Snd.init();Snd.apply();save();setQuick();if(P.sound)Snd.deco();});
$('#btnSettings').addEventListener('click',openSettings);

// 測試用：只讀取，不影響遊戲
window.__memoryArchitectDebug={target:()=>G&&G.target,blocks:()=>G&&G.blocks.map(b=>b.c),levels:()=>ISL.map(x=>({n:x.n,cfg:x.levels.map(l=>l.cfg)}))};

/* Accessible input, optional pointer dragging, and portable progress backups. */
function restoreStageFocus(key){
 if(!key)return;
 const el=$('#stage '+key)||$('#stage .tray-blk')||$('#stage button:not([disabled])');
 if(el&&!el.disabled)el.focus({preventScroll:true});
}
$('#stage').addEventListener('keydown',e=>{
 const b=e.target.closest('[data-cell]');if(!b||!canEdit())return;const cell=+b.dataset.cell;
 const delta={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
 if(delta){e.preventDefault();const r=Math.max(0,Math.min(G.n-1,Math.floor(cell/G.n)+delta[0])),c=Math.max(0,Math.min(G.n-1,cell%G.n+delta[1]));$('#stage [data-cell="'+(r*G.n+c)+'"]').focus({preventScroll:true});}
 if(['Delete','Backspace'].includes(e.key)&&G.placed[cell]!==undefined){e.preventDefault();G.sel={from:'board',cell,id:G.placed[cell]};returnSel();}
});
document.addEventListener('keydown',e=>{
 if(!$('#modal').hidden){
  if(e.key==='Tab'){const items=[...$('#modalBox').querySelectorAll('button:not([disabled]),input:not([disabled]),textarea,summary')].filter(x=>x.getClientRects().length);if(items.length){const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}return;
 }
 if(e.key==='Escape'&&canEdit()){G.sel=null;G.focusCell=null;say('取消選取了。');renderStage();}
});
let drag=null,suppressClickUntil=0;
const stageEl=$('#stage');
function clearDrag(){if(drag){if(drag.ghost)drag.ghost.remove();stageEl.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));try{stageEl.releasePointerCapture(drag.pointer);}catch(e){}drag=null;}}
stageEl.addEventListener('pointerdown',e=>{
 if(!canEdit()||e.isPrimary===false||e.button!==undefined&&e.button!==0)return;
 const el=e.target.closest('[data-blk],[data-cell]');if(!el||el.disabled)return;
 const board=el.dataset.cell!==undefined,cell=board?+el.dataset.cell:null,id=board?G.placed[cell]:+el.dataset.blk;
 if(id===undefined)return;
 drag={owner:G,pointer:e.pointerId,x:e.clientX,y:e.clientY,id,cell,from:board?'board':'tray',active:false,ghost:null};
});
stageEl.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointer||G!==drag.owner)return;
 if(!drag.active&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<10)return;
 if(!drag.active){drag.active=true;const b=G.blocks[drag.id],el=document.createElement('div');el.className='drag-ghost';el.setAttribute('aria-hidden','true');el.innerHTML=blockSVG(b.c,0);document.body.appendChild(el);drag.ghost=el;try{stageEl.setPointerCapture(e.pointerId);}catch(e){}}
 e.preventDefault();drag.ghost.style.left=(e.clientX-34)+'px';drag.ghost.style.top=(e.clientY-42)+'px';
 stageEl.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
 const hit=document.elementFromPoint(e.clientX,e.clientY),target=hit&&hit.closest('[data-cell],#tray');if(target&&stageEl.contains(target))target.classList.add('drag-over');
},{passive:false});
stageEl.addEventListener('pointerup',e=>{
 if(!drag||e.pointerId!==drag.pointer)return;const item=drag;
 if(!item.active){clearDrag();return;}
 e.preventDefault();const hit=document.elementFromPoint(e.clientX,e.clientY),cell=hit&&hit.closest('[data-cell]'),tray=hit&&hit.closest('#tray');
 clearDrag();suppressClickUntil=Date.now()+450;if(!canEdit()||G!==item.owner)return;
 if(cell&&stageEl.contains(cell)){G.sel={from:item.from,id:item.id,...(item.from==='board'?{cell:item.cell}:{})};G.focusCell=null;onCell(+cell.dataset.cell);}
 else if(tray&&item.from==='board'){G.sel={from:'board',id:item.id,cell:item.cell};returnSel();}
 else{say('積木還在原位。拖到格子中間放下就可以囉！');Snd.select();}
});
stageEl.addEventListener('pointercancel',clearDrag);
stageEl.addEventListener('lostpointercapture',()=>{if(drag&&drag.active)clearDrag();});
stageEl.addEventListener('click',e=>{if(Date.now()<suppressClickUntil&&e.detail>0){suppressClickUntil=0;e.preventDefault();e.stopImmediatePropagation();}},{capture:true});
function exportProgress(){
 const blob=new Blob([JSON.stringify({app:'memory-architect',version:3,data:P},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='memory-architect-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('#importFile').addEventListener('change',e=>{
 const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||data.app!=='memory-architect'||!data.data||!Array.isArray(data.data.isl)||data.data.isl.length!==5)throw Error();passTok++;cancelPeek();clearDrag();G=null;last=null;const sound=P.sound,vol=P.vol;P=normalize(data.data);P.sound=sound;P.vol=vol;save();closeModal();Snd.apply();setQuick();renderMap();show('map');alert('進度已匯入！可以接著建造小島了。');}catch(e){alert('這份檔案無法匯入，請選擇「記憶建築師」匯出的 JSON 備份。');}};reader.onerror=()=>alert('檔案讀取失敗，請再選一次。');reader.readAsText(file);e.target.value='';
});

setQuick();renderIntro();show('intro');
})();
</script>
