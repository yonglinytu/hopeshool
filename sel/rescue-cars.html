<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>救援小車隊｜直覺操作修正版</title>
<style>
:root{
  --ink:#2b2d42; --cream:#fff8e7; --paper:#fffdf6;
  --red:#e63946; --red-d:#b5232f; --blue:#3a86ff; --blue-d:#1f5fc4; --yellow:#ffbe0b; --yellow-d:#d99a00;
  --green:#52b788; --green-d:#2d8a5f; --orange:#fb8500; --sky:#cdeffd; --soft:#5c6078;
  --wood:#d39b5f; --wood-d:#b07a43;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--ink);
  background-color:#d6a26a;
  background-image:
    repeating-linear-gradient(91deg, rgba(120,72,30,.10) 0 2px, transparent 2px 38px),
    repeating-linear-gradient(89deg, rgba(255,235,200,.10) 0 1px, transparent 1px 23px),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='.012 .25' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .27 0 0 0 0 .12 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>");
  font-family:"jf-openhuninn-2.0","Iansui","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:18px;line-height:1.6;-webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
.app{max-width:1060px;margin:0 auto;padding:12px 16px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.15rem;letter-spacing:.08em;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:4px 16px 4px 6px;box-shadow:0 4px 0 var(--ink)}
.brand svg{width:40px;height:40px}
.top-tools{display:flex;gap:8px}

/* 玩具積木按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.55em 1.2em;min-height:50px;cursor:pointer;font-weight:800;
  background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:0 2px 0 var(--ink);transform:translateY(3px)}
.btn.red{background:var(--red);color:#fff}
.btn.yellow{background:var(--yellow)}
.btn.blue{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.big{font-size:1.2rem;padding:.7em 1.8em;min-height:60px;border-radius:20px}
.btn.small{font-size:.9rem;min-height:40px;padding:.3em .9em;box-shadow:0 4px 0 var(--ink)}
.btn.pulse{animation:glowBtn 1.1s ease-in-out infinite}
@keyframes glowBtn{0%,100%{box-shadow:0 5px 0 var(--ink),0 0 0 0 rgba(255,190,11,.9)}50%{box-shadow:0 5px 0 var(--ink),0 0 0 9px rgba(255,190,11,0)}}
@keyframes pulseBtn{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.btn:focus-visible,.tool:focus-visible,.ticket:focus-visible,.deco-opt:focus-visible,.chip:focus-visible,.cellhit:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}

.panel{background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:18px 20px;box-shadow:0 8px 0 var(--ink)}
.soft{color:var(--soft);font-size:.92rem}
h1,h2,h3{line-height:1.25;margin:.2em 0 .45em;font-weight:900}
.screen{display:none}
.screen.active{display:block;animation:hop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* 開場：無線電與隊員證 */
.intro-grid{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:center;max-width:860px;margin:0 auto}
@media (max-width:720px){.intro-grid{grid-template-columns:1fr}}
.walkie{width:100%;max-width:220px;margin:0 auto;display:block}
.walkie .led{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.radio-lines{min-height:220px}
.rline{background:#1f2338;color:#c8f7c5;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;margin:0 0 10px;font-family:inherit;box-shadow:0 5px 0 var(--ink);animation:hop .3s ease}
.rline .who{display:block;color:#ffd166;font-size:.85rem;font-weight:800;letter-spacing:.06em}
.title-blocks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.title-blocks span{display:inline-grid;place-items:center;width:58px;height:58px;font-size:2rem;font-weight:900;color:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.idcard{max-width:520px;margin:16px auto 0;background:var(--cream);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);overflow:hidden}
.idcard .bar{background:var(--red);color:#fff;font-weight:900;letter-spacing:.2em;padding:8px 16px;display:flex;justify-content:space-between;border-bottom:4px solid var(--ink)}
.idcard .body{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px 16px;align-items:center;position:relative}
.idcard .photo{width:110px;height:110px;border:3px solid var(--ink);border-radius:14px;background:var(--sky)}
.idcard label{font-weight:800;font-size:.9rem;color:var(--soft)}
.idcard input{width:100%;padding:.4em .6em;border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:1.1rem}
.idcard .stamp{position:absolute;right:12px;bottom:8px;transform:rotate(-14deg);color:var(--red);border:3px solid var(--red);border-radius:50%;width:76px;height:76px;display:grid;place-items:center;font-weight:900;font-size:.78rem;line-height:1.2;text-align:center;opacity:.85}

/* 任務板 */
.stages{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px}
.stage-chip{flex:0 0 auto;padding:.3em .9em;border:3px dashed rgba(43,45,66,.45);border-radius:999px;font-size:.88rem;font-weight:700;color:var(--soft);background:rgba(255,248,231,.55)}
.stage-chip.on{border:3px solid var(--ink);background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.board-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.board-grid{grid-template-columns:1fr}}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.meter{height:16px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:4px 0 10px}
.meter span{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--green) 0 10px,#6fcf97 10px 20px);border-right:3px solid var(--ink)}
.tickets{display:grid;gap:10px;margin:8px 0 14px}
.ticket{display:grid;grid-template-columns:58px 1fr auto;align-items:stretch;cursor:pointer;text-align:left;padding:0;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);overflow:hidden}
.ticket:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ticket .stub{display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:900;font-size:1.3rem;border-right:3px dashed var(--ink)}
.ticket.done .stub{background:var(--green)}
.ticket.next{background:#fff3c4}
.ticket.next .stub{background:var(--red);animation:pulseBtn 1.4s ease-in-out infinite}
.ticket .mid{padding:6px 10px;line-height:1.3}
.ticket .mid b{display:block;font-size:1rem}
.ticket .mid small{color:var(--soft);font-size:.8rem}
.ticket .right{display:flex;align-items:center;padding:0 8px}
.ticket:disabled{cursor:not-allowed;opacity:.5;box-shadow:none;border-style:dashed}
.ticket:disabled .stub{background:#a8a8b8}
.stk{display:inline-flex;gap:2px}
.stk svg{width:22px;height:22px}

/* 出任務畫面 */
.play-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.play-title{font-weight:900;font-size:1.1rem;background:var(--cream);border:3px solid var(--ink);border-radius:12px;padding:.2em .8em;box-shadow:0 4px 0 var(--ink)}
.say{display:flex;gap:12px;align-items:center;margin-bottom:14px;border:3px solid var(--ink);border-radius:18px;padding:8px 12px;box-shadow:0 5px 0 var(--ink);min-height:76px;background:#fff}
.say .av{flex:0 0 58px;width:58px;height:58px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--sky)}
.say .av svg{width:100%;height:100%}
.say .txt .who{display:block;font-size:.82rem;font-weight:900;letter-spacing:.06em}
.say.radio{background:#1f2338;color:#c8f7c5}
.say.radio .who{color:#ffd166}
.say.car{background:#fff3c4}
.say.car .who{color:var(--red-d)}
.say.resident .who{color:var(--blue-d)}
.say.warn{background:#ffe1e3}
.say.warn .who{color:var(--red-d)}
.play-grid{display:grid;grid-template-columns:minmax(0,540px) minmax(250px,1fr);gap:20px;align-items:start}
@media (max-width:860px){.play-grid{grid-template-columns:1fr}}
.board-wrap{position:relative;width:100%;max-width:540px;aspect-ratio:1/1;margin:0 auto}
.board-wrap svg{position:absolute;inset:0;width:100%;height:100%}
#carLayer,#popLayer{pointer-events:none}
#popLayer{position:absolute;inset:0}
.cellhit{cursor:pointer}
.cellhit:hover{fill:rgba(255,255,255,.18)}
.board-wrap.locked .cellhit{cursor:not-allowed}
.pop{position:absolute;transform:translate(-50%,-50%);width:120px;height:72px;display:grid;place-items:center;animation:popIn 1.2s cubic-bezier(.3,1.7,.5,1) forwards}
.pop svg{position:absolute;inset:0;width:100%;height:100%}
.pop span{position:relative;font-weight:900;font-size:1.25rem;color:var(--ink);white-space:nowrap;text-shadow:0 2px 0 #fff}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-80%) scale(1.08) rotate(4deg);opacity:1}75%{transform:translate(-50%,-90%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-110%) scale(.9);opacity:0}}
.status{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.status span{display:inline-flex;align-items:center;gap:4px;padding:.15em .75em;border:3px solid var(--ink);border-radius:999px;background:#fff;font-size:.88rem;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.status span.on{background:#c7f0d8}
.toolbox h3{display:flex;align-items:center;gap:8px;font-size:1.05rem}
.toolbox h3::before{content:"";width:14px;height:14px;background:var(--orange);border:3px solid var(--ink);border-radius:4px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:58px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);text-align:left;font-size:.95rem;font-weight:800}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tool svg{flex:0 0 42px;width:42px;height:42px}
.tool.on{background:var(--yellow);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tool:disabled{opacity:.4;cursor:not-allowed}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.row-btns .btn{flex:1 1 auto;min-height:46px;padding:.4em .8em;font-size:.95rem}
.count{margin:12px 0 0;font-size:.9rem;font-weight:700}
.count b{font-size:1.1rem}
.thinkbox{margin:10px 0 0;padding:8px 10px;border:3px dashed var(--ink);border-radius:14px;background:#fff8d6;font-size:.95rem}
.thinkbox b{color:var(--red-d)}
.drive{border-top:3px dashed rgba(43,45,66,.35);margin-top:16px;padding-top:12px}
.drive .row-btns .btn.red{flex:2 1 100%;font-size:1.25rem;min-height:62px}

/* 彈出卡片 */
.modal-bg{position:fixed;inset:0;background:rgba(31,35,56,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg[hidden]{display:none}
.modal{max-width:660px;width:100%;max-height:92vh;overflow:auto;animation:hop .3s cubic-bezier(.3,1.5,.5,1)}
.dispatch .dh{display:flex;align-items:center;gap:8px;background:#1f2338;color:#ffd166;margin:-18px -20px 14px;padding:10px 18px;border-bottom:4px solid var(--ink);border-radius:20px 20px 0 0;font-weight:900;letter-spacing:.12em}
.dispatch .dh i{width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff;animation:blink 1s steps(2) infinite}
.caller{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;margin:8px 0}
.caller .av{flex:0 0 58px;width:58px;height:58px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--sky)}
.facts{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.facts li{display:flex;gap:8px;align-items:flex-start;font-size:.95rem}
.facts li b{flex:0 0 auto;background:var(--ink);color:#fff;border-radius:8px;padding:0 .5em;font-size:.82rem;line-height:1.7}
.report{text-align:center;position:relative}
.report .stampbig{position:absolute;right:6px;top:2px;transform:rotate(12deg);color:var(--red);border:4px solid var(--red);border-radius:12px;padding:2px 10px;font-weight:900;font-size:1.2rem;letter-spacing:.15em;animation:stampIn .5s cubic-bezier(.3,1.6,.5,1) .3s both}
@keyframes stampIn{from{transform:rotate(12deg) scale(2.4);opacity:0}to{transform:rotate(12deg) scale(1);opacity:.9}}
.stickers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.sticker{padding:8px 4px;border:3px dashed rgba(43,45,66,.35);border-radius:18px;background:#fff}
.sticker .disc{width:64px;height:64px;margin:0 auto;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;background:#eee;filter:grayscale(1);opacity:.45}
.sticker .disc svg{width:40px;height:40px}
.sticker.got{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.sticker.got .disc{filter:none;opacity:1}
.sticker.new .disc{animation:stick .6s cubic-bezier(.3,1.8,.5,1) both}
@keyframes stick{from{transform:scale(.2) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.sticker b{display:block;font-size:.95rem;margin-top:4px}
.sticker small{display:block;font-size:.78rem;color:var(--soft);line-height:1.35}
.badge-row{display:flex;gap:10px;align-items:center;margin:6px auto;padding:8px 12px;border:3px dashed rgba(43,45,66,.35);border-radius:16px;max-width:560px;font-size:.92rem;text-align:left;background:#fff}
.badge-row.got{border:3px solid var(--ink);background:#c7f0d8}
.badge-row svg{flex:0 0 40px;width:40px;height:40px}
.reflect{margin:10px auto;padding:10px;border:3px dashed var(--ink);border-radius:16px;background:#fff8d6}
.reflect .q{margin:0 0 8px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{cursor:pointer;padding:.3em .85em;border:3px solid var(--ink);border-radius:999px;background:#fff;font-size:.9rem;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.chip.on{background:var(--green);color:#fff}
.reply{min-height:1.5em;margin:8px 0 0;color:var(--soft)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px}
.party{max-width:800px;margin:0 auto;text-align:center}
.party .story{text-align:left;max-width:660px;margin:12px auto}
.reward{background:#fff3c4;border:3px dashed var(--ink);border-radius:14px;padding:8px 12px}
.diorama{width:100%;height:auto;display:block;border:4px solid var(--ink);border-radius:18px;background:var(--sky)}
.diorama .new-build{animation:dropIn .9s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dropIn{0%{opacity:0;transform:translateY(-60px)}60%{opacity:1}100%{opacity:1;transform:none}}
.diorama .spin{animation:spin 5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.diorama .sway{animation:sway 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.diorama .twinkle{animation:blink 1.2s steps(2) infinite}
.diorama .conf{animation:fall 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes fall{0%{transform:translateY(-60px) rotate(0)}100%{transform:translateY(330px) rotate(320deg)}}
.diorama .bounce{animation:bounce 1s ease-in-out infinite;transform-box:fill-box}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.deco-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.deco-grid{grid-template-columns:1fr}}
.deco-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.deco-opt{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-size:.9rem;font-weight:700}
.deco-opt svg{width:76px;height:58px}
.deco-opt.on{background:var(--yellow);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row input[type=range]{flex:1}
details{margin-top:14px;border-top:3px dashed rgba(43,45,66,.3);padding-top:8px}
summary{cursor:pointer;font-weight:800}
.log-table{width:100%;border-collapse:collapse;font-size:.78rem;margin:8px 0}
.log-table th,.log-table td{border:1px solid #ccc;padding:3px 4px;text-align:center;white-space:nowrap}
textarea{width:100%;height:90px;font-size:.75rem;font-family:monospace}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

/* v3：直接選方向，點原路旋轉；停車後可直接修路 */
.easy-palette{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.easy-road{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:86px;padding:5px 3px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-size:15px;font-weight:800;cursor:pointer}
.easy-road svg{width:52px;height:48px}.easy-road.on{background:#fff0bc;box-shadow:inset 0 0 0 3px var(--yellow),0 4px 0 var(--ink)}
.easy-road.erase{grid-column:span 3;min-height:43px;flex-direction:row;background:#fff0f3}
.easy-road.erase.on{background:#ffcad4;box-shadow:inset 0 0 0 2px #e63946,0 4px 0 var(--ink)}
.easy-road:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}.easy-road:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.easy-help{font-size:14px;line-height:1.75;margin:13px 0 8px;background:#fff3c9;border:2px dashed #d99a00;border-radius:12px;padding:9px 11px;min-height:64px}
.legacy-tools{display:none!important}.cellhit{touch-action:manipulation}#roadPreview{pointer-events:none}
@media(max-width:820px){.easy-palette{grid-template-columns:repeat(3,minmax(0,1fr))}.play-grid>div:last-child{margin-top:4px}}


#mobileControls{display:none}
@media(max-width:860px){
 #s-play{padding-bottom:170px}.legacy-tools,#roadPalette,#editHelp{display:none!important}
 #mobileControls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:700px;padding:9px 10px calc(10px + env(safe-area-inset-bottom));background:#fff8e7f5;border:3px solid var(--ink);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -4px 18px #2b2d4230;z-index:25}
 #mobileControls .easy-road{min-height:58px;font-size:12px;gap:0;padding:2px;box-shadow:0 2px 0 var(--ink)}
 #mobileControls .easy-road svg{width:35px;height:30px}#mobileControls .easy-road.erase{grid-column:auto;font-size:12px;flex-direction:column}
 #mobileControls .mobile-drive{background:#e63946;color:#fff;font-size:16px;line-height:1.3;font-weight:900}
 #mobileControls .easy-road.on{background:#ffdf72;box-shadow:inset 0 0 0 2px #d99a00}
 .modal-bg{z-index:50}
}
.return-btn{position:fixed;top:16px;left:16px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,253,248,.88);border:1px solid rgba(84,62,42,.16);color:#2a1a0a;font-size:.82rem;font-weight:600;text-decoration:none;box-shadow:0 4px 14px rgba(66,45,28,.10);backdrop-filter:blur(8px);transition:background .18s,transform .18s;font-family:inherit}
.return-btn:hover{background:#fffdf8;transform:translateY(-1px)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>

  say:'石頭擋了兩個地方。繞一點路也沒關係，只要送得到就好。',thanks:'種子送到了，田伯說繞路的風景也很好！',

  q:'拿木板、修橋、拿包裹，哪一件事要先做？',map:['.S...','.T...','WWbWW','....G','...P.']},

  say:'這次地圖很空曠，你可以設計自己的路線。成功以後，試試看再找一條不一樣的！',thanks:'物資送到了，這是你自己設計的路線！',
  q:'如果不能走上次的路，你會從哪裡開始改？',map:['..P..','....G','.R...','S....','....W']},
 {name:'救援站落成任務',who:'all',cargo:'派對物資',sug:5,sDir:'E',gEntry:'W',
  say:'大家要來救援站開派對！這裡有兩個工具站，拿木板修橋，把最後一批物資送到吧！',thanks:'物資都送到了，救援站要開派對囉！',
  q:'有兩個工具站，你想去哪一個？為什麼？',map:['.P.W.','.T.W.','S..BG','.T.W.','F..W.']}
];
const LEVEL_NAMES=['草地救援站','森林修橋隊','山谷運輸隊','小鎮合作隊','海島救援隊'];
const BASE_STEPS=['車庫立起來了','車庫蓋上屋頂，掛上招牌','小輪開進車庫','工具倉庫堆滿木板','信號塔亮起燈','花田開花了','風車轉起來了','居民的小屋蓋好了','廣場放上長椅','掛上旗子，救援站落成！'];
const STRATS=[
 ['goal','我先看終點在哪裡','從終點往回想，是很聰明的方法！'],
 ['block','我先找出障礙物','先知道哪裡不能走，路就好排了。'],
 ['tool','我先想木板要去哪裡拿','先想好順序，事情就不會漏掉。'],
 ['try','我一邊試車一邊修','試試看、再修一修，就是工程師的做法。'],
 ['finger','我先用手指走一遍','用手指走一遍，可以先發現斷掉的地方。'],
 ['own','我有自己的方法','太好了！可以說給隊長或同學聽聽看。']
];
const DECO={
  car:{title:'小輪的車色',opts:[['red','番茄紅'],['gold','金黃'],['sky','晴空藍']]},
  roof:{title:'基地屋頂',opts:[['coral','珊瑚紅'],['ocean','海洋藍'],['forest','森林綠']]},
  pet:{title:'基地夥伴',opts:[['dog','小狗'],['cat','小貓'],['rabbit','小兔']]}
};
const CARC={red:'#e63946',gold:'#ffbe0b',sky:'#3a86ff'};
const ROOFC={coral:'#ff6b6b',ocean:'#3a86ff',forest:'#2d8a5f'};

function parseLevel(i){const L=LV[i],t=[];let s=null,g=null;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const ch=L.map[r][c];t.push(ch);if(ch==='S')s=r*N+c;if(ch==='G')g=r*N+c;}
  return {t,s,g};}
const buildable=ch=>'.TPBb'.includes(ch);

/* =========================================================
   進度保存（與第一版不同的保存位置，兩版可並存）
   ========================================================= */
const KEY='rescueCars.v2';
function freshLv(){return{rescue:false,parcel:false,strategy:false,routes:[],roads:{}};}
function defaults(){return{lv:LV.map(()=>freshLv()),cur:0,name:'',memberNo:Math.floor(Math.random()*90+10),introSeen:false,deco:{car:'red',roof:'coral',pet:'dog'},unlockedDeco:false,log:[],sound:true,vol:0.7};}
function normalize(o){
 const d=defaults();if(!o||typeof o!=='object'||Array.isArray(o))return d;
 if(Array.isArray(o.lv))d.lv=d.lv.map((f,i)=>{const a=o.lv[i];if(!a||typeof a!=='object')return f;
  f.rescue=a.rescue===true;f.parcel=f.rescue&&a.parcel===true;f.strategy=f.rescue&&a.strategy===true;
  f.routes=Array.isArray(a.routes)?[...new Set(a.routes.filter(x=>typeof x==='string'&&/^\d+(?:-\d+)*$/.test(x)&&x.split('-').every(v=>+v<25)))].slice(0,500):[];
  const terrain=parseLevel(i).t,roads=a.roads;
  if(roads&&typeof roads==='object'&&!Array.isArray(roads))for(const [k,t]of Object.entries(roads)){
   const c=Number(k);if(!/^\d+$/.test(k)||!Number.isInteger(c)||c<0||c>=25||!buildable(terrain[c])||!t||!['s','c'].includes(t.k)||!Number.isInteger(t.r)||t.r<0||t.r>3)continue;
   if(Object.keys(f.roads).length>=MAXROAD)continue;if('Bb'.includes(terrain[c]))f.roads[c]={k:'s',r:terrain[c]==='B'?0:1};else f.roads[c]={k:t.k,r:t.r%(t.k==='s'?2:4)};
  }return f;});
 let unlocked=true;d.lv.forEach(l=>{if(!unlocked){l.rescue=l.parcel=l.strategy=false;l.routes=[];}unlocked=unlocked&&l.rescue;});
 d.cur=Number.isInteger(o.cur)&&o.cur>=0&&o.cur<LV.length&&(o.cur===0||d.lv[o.cur-1].rescue)?o.cur:0;
 d.name=typeof o.name==='string'?o.name.trim().slice(0,8):'';
 d.memberNo=Number.isInteger(o.memberNo)&&o.memberNo>=10&&o.memberNo<=99?o.memberNo:d.memberNo;
 d.introSeen=o.introSeen===true;d.sound=typeof o.sound==='boolean'?o.sound:d.sound;
 d.vol=Number.isFinite(o.vol)?Math.min(1,Math.max(0,o.vol)):d.vol;
 if(o.deco&&typeof o.deco==='object')for(const k of Object.keys(DECO))if(DECO[k].opts.some(x=>x[0]===o.deco[k]))d.deco[k]=o.deco[k];
 d.unlockedDeco=d.lv.every(x=>x.rescue);
 if(Array.isArray(o.log))d.log=o.log.filter(l=>l&&typeof l==='object').slice(-500).map(l=>({time:typeof l.time==='string'?l.time.slice(0,40):'',lvl:Number.isInteger(l.lvl)&&l.lvl>=1&&l.lvl<=10?l.lvl:1,result:typeof l.result==='string'?l.result.slice(0,40):'',roads:Number.isInteger(l.roads)?Math.max(0,Math.min(25,l.roads)):0,parcel:l.parcel===1?1:0,newRoute:l.newRoute==='是'?'是':l.newRoute==='否'?'否':'',hints:Number.isInteger(l.hints)?Math.max(0,l.hints):0,strategy:STRATS.some(x=>x[0]===l.strategy)?l.strategy:''}));
 return d;
}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function load(){try{const s=localStorage.getItem(KEY);if(s)return normalize(JSON.parse(s));}catch(e){}return defaults();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
let P=load();
const allDone=()=>P.lv.every(x=>x.rescue);
const callName=()=>P.name?`隊員${esc(P.name)}`:'新隊員';

/* =========================================================
   音效（程式合成：無線電、喇叭、木頭玩具聲）
   ========================================================= */
const Snd={
 ctx:null,master:null,nb:null,
 init(){try{if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();this.master=this.ctx.createGain();this.master.connect(this.ctx.destination);
   const len=this.ctx.sampleRate*2,b=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nb=b;}
   if(this.ctx.state==='suspended')this.ctx.resume();this.apply();}catch(e){}},
 apply(){if(this.master)this.master.gain.value=P.sound?P.vol*0.9:0;},
 play(fn){if(!this.ctx||!P.sound||P.vol<=0)return;try{fn(this.ctx.currentTime+0.02);}catch(e){}},
 osc(f,t,dur,o={}){const c=this.ctx,os=c.createOscillator(),v=c.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.glide)os.frequency.exponentialRampToValueAtTime(o.glide,t+dur*0.7);
   const g=o.g||0.2,a=o.a||0.005;v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+a);v.gain.exponentialRampToValueAtTime(0.0001,t+dur);
   if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);fl.connect(v);}else os.connect(v);v.connect(this.master);os.start(t);os.stop(t+dur+0.05);},
 noise(t,dur,o={}){const c=this.ctx,s=c.createBufferSource();s.buffer=this.nb;s.loop=true;const fl=c.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1200,t);
   if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur);fl.Q.value=o.q||1;const v=c.createGain(),g=o.g||0.12;v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+(o.a||0.005));
   v.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(v);v.connect(this.master);s.start(t,Math.random());s.stop(t+dur+0.05);},
 mar(f,t,g=0.2,dur=0.5){this.osc(f,t,dur,{g});this.osc(f*4,t,0.08,{g:g*0.22});this.osc(f*2.01,t,0.18,{g:g*0.12});},
 wood(f,t,g=0.3){this.osc(f,t,0.12,{type:'triangle',g});this.osc(f*3.1,t,0.04,{g:g*0.4});this.noise(t,0.025,{g:g*0.5,f:2600,q:2.5});},
 radio(){this.play(t=>{this.noise(t,0.22,{g:0.07,f:2200,q:0.8});this.osc(1320,t+0.24,0.07,{type:'square',g:0.04});this.osc(1320,t+0.36,0.07,{type:'square',g:0.04});});},
 select(){this.play(t=>this.wood(880,t,0.18));},
 place(){this.play(t=>{this.wood(420,t,0.32);this.wood(620,t+0.05,0.15);});},
 rotate(){this.play(t=>{this.wood(700,t,0.16);this.wood(820,t+0.07,0.14);});},

function pegFace(o){
  let s=`<path d="M10 60 Q10 44 30 42 Q50 44 50 60Z" fill="${o.body}"/>`;
  if(o.pony)s+=`<circle cx="45" cy="18" r="6" fill="${o.hair}"/>`;

  s+=`<circle cx="30" cy="26" r="16" fill="${o.skin}"/>`;
  if(!o.hat)s+=`<path d="M14 25 Q14 9 30 9 Q46 9 46 25 Q40 16 30 16 Q20 16 14 25Z" fill="${o.hair}"/>`;
  if(o.hat==='cap')s+=`<path d="M14 20 Q15 6 30 6 Q45 6 46 20Z" fill="${o.hatc}"/><path d="M38 19 H55" stroke-width="4"/><path d="M27 11 h6 M30 8 v6" stroke="#fff" stroke-width="2.4"/>`;

  s+=o.beard?`<path d="M20 33 Q30 42 40 33" fill="#fff" stroke-width="2.4"/>`:`<path d="M25 33 Q30 37 35 33" fill="none" stroke-width="2.6"/>`;
  s+=`<circle cx="19" cy="32" r="2.6" fill="#ff8fa3" stroke="none"/><circle cx="41" cy="32" r="2.6" fill="#ff8fa3" stroke="none"/>`;

  return s;
}

/* =========================================================
   試車：先模擬整趟行程，再逐格播放
   ========================================================= */
function simulate(){
  const L=LV[G.i];let pos=G.s,dir=L.sDir,plank=false,parcel=false,usedPlank=false;
  const visited=new Set([G.s]),steps=[];
  while(true){
    const r=Math.floor(pos/N),c=pos%N,nr=r+DIRS[dir][0],nc=c+DIRS[dir][1];
    if(nr<0||nr>=N||nc<0||nc>=N)return {steps,ok:false,reason:'edge',at:pos,dir};
    const nx=nr*N+nc,ch=G.t[nx];
    if(ch==='G'){
      if(dir!==OPP[L.gEntry])return {steps,ok:false,reason:'goalside',at:nx,dir};
      if(L.needPlank&&!plank)return {steps,ok:false,reason:'needplank',at:nx,dir};
      steps.push({cell:nx,entry:OPP[dir],exit:null,goal:true});
      return {steps,ok:true,parcel,plank,usedPlank};
    }
    if(visited.has(nx))return {steps,ok:false,reason:'loop',at:nx,dir};
    if(!buildable(ch))return {steps,ok:false,reason:'obstacle',at:nx,dir,ch};
    const rd=G.roads[nx];
    if(!rd)return {steps,ok:false,reason:'noroad',at:nx,dir};
    if((ch==='B'||ch==='b')&&(rd.k!=='s'||(ch==='B'?rd.r%2!==0:rd.r%2!==1)))return {steps,ok:false,reason:'bridgeside',at:nx,dir};
    const cs=conns(rd),entry=OPP[dir];
    if(!cs.includes(entry))return {steps,ok:false,reason:(ch==='B'||ch==='b')?'bridgeside':'mismatch',at:nx,dir};
    const exit=cs[0]===entry?cs[1]:cs[0];
    const step={cell:nx,entry,exit,ev:[]};
    if(ch==='B'||ch==='b'){if(!plank)return {steps,ok:false,reason:'bridge',at:nx,dir};plank=false;usedPlank=true;step.ev.push('repair');}
    if(ch==='T'&&!plank){plank=true;step.ev.push('plank');}
    if(ch==='P'&&!parcel){parcel=true;step.ev.push('parcel');}
    steps.push(step);visited.add(nx);pos=nx;dir=exit;
  }
}

/* =========================================================
   路線提示（自動求解，顯示一條參考路線 6 秒）
   ========================================================= */
function solveAll(i,limit){
  const pl=parseLevel(i),L=LV[i],res=[];limit=limit||4000;
  const sr=Math.floor(pl.s/N),sc=pl.s%N;
  function dfs(r,c,dir,plank,parcel,visited,path){
    if(res.length>=limit)return;
    const nr=r+DIRS[dir][0],nc=c+DIRS[dir][1];if(nr<0||nr>=N||nc<0||nc>=N)return;
    const idx=nr*N+nc,ch=pl.t[idx];
    if(ch==='G'){if(dir===OPP[L.gEntry]&&(!L.needPlank||plank))res.push({path:path.slice(),parcel});return;}
    if(!buildable(ch)||visited.has(idx)||path.length>=MAXROAD)return;
    let pk=plank,pa=parcel;
    if(ch==='B'||ch==='b'){if(!pk)return;if((ch==='B')!==(dir==='E'||dir==='W'))return;pk=false;visited.add(idx);path.push({cell:idx,entry:OPP[dir],exit:dir});dfs(nr,nc,dir,pk,pa,visited,path);path.pop();visited.delete(idx);return;}
    if(ch==='T')pk=true;if(ch==='P')pa=true;
    visited.add(idx);
    for(const d of ['N','E','S','W'])if(d!==OPP[dir]){path.push({cell:idx,entry:OPP[dir],exit:d});dfs(nr,nc,d,pk,pa,visited,path);path.pop();}
    visited.delete(idx);
  }
  dfs(sr,sc,L.sDir,false,false,new Set([pl.s]),[]);
  return res;
}

function parcelLimit(i){if(_plim[i]===undefined){const s=solveAll(i,4000).filter(x=>x.parcel);_plim[i]=s.length?Math.min(...s.map(x=>x.path.length)):LV[i].sug;}return _plim[i];}
function routeToRoads(path){const roads={};path.forEach(p=>{if(p.exit===OPP[p.entry])roads[p.cell]={k:'s',r:(p.entry==='W'||p.entry==='E')?0:1};else{const opts=[['N','E'],['E','S'],['S','W'],['W','N']];roads[p.cell]={k:'c',r:opts.findIndex(o=>o.includes(p.entry)&&o.includes(p.exit))};}});return roads;}
function showHint(){

}

  s+=g(1,`<path d="M30 142 L115 100 L210 142Z" fill="${roof}"/><rect x="78" y="118" width="62" height="18" rx="4" fill="#ffbe0b"/><text x="109" y="132" font-size="12" text-anchor="middle" font-weight="900" fill="${I}" stroke="none" letter-spacing="1">救援站</text>`);
  s+=g(3,block(214,170,50,36,'#e63946','#b5232f')+`<path d="M208 172 L239 150 L270 172Z" fill="#ffbe0b"/><rect x="222" y="182" width="34" height="8" rx="2" fill="#e9b872" stroke-width="2"/><rect x="222" y="192" width="34" height="8" rx="2" fill="#d39b5f" stroke-width="2"/>`);
  s+=g(8,`<ellipse cx="240" cy="224" rx="40" ry="9" fill="#fff3c4"/><rect x="222" y="206" width="36" height="5" rx="2" fill="#d39b5f"/><rect x="222" y="214" width="36" height="6" rx="2" fill="#d39b5f"/><path d="M226 220 V228 M254 220 V228" fill="none"/>`);
  s+=g(2,sideCar(84,222,carc));
  if(done>=10){let fl=`<path d="M115 100 Q245 160 374 116" fill="none" stroke-width="2.4"/>`;const cols=['#e63946','#ffbe0b','#3a86ff','#52b788','#fb8500'];
    for(let k=1;k<11;k++){const t=k/11,u=1-t,x=u*u*115+2*u*t*245+t*t*374,y=u*u*100+2*u*t*160+t*t*116;fl+=`<path class="sway" d="M${f1(x-8)} ${f1(y)} L${f1(x+8)} ${f1(y+1)} L${f1(x)} ${f1(y+17)}Z" fill="${cols[k%5]}" stroke-width="2" style="animation-delay:${k*.15}s"/>`;}
    s+=g(9,fl+peg(178,262,{body:'#e63946',hat:'cap',hatc:'#e63946',wave:o.party})+peg(206,262,{body:'#52b788',hat:'straw'})+peg(292,262,{body:'#ffbe0b',pony:1,hair:'#6b4a32',h:26,wave:o.party})+peg(320,262,{body:'#9b7fc0',bun:1,hair:'#e8e4da'}));}
  if(P.unlockedDeco||o.all)s+=pet(d.pet,432,280);
  s+='</g>';
  if(o.party){const cols=['#e63946','#ffbe0b','#3a86ff','#52b788','#fb8500'];for(let k=0;k<28;k++){const x=(Math.random()*470+5).toFixed(0),w=(5+Math.random()*4).toFixed(1);s+=`<rect class="conf" x="${x}" y="-10" width="${w}" height="${(w*1.6).toFixed(1)}" fill="${cols[k%5]}" stroke="${I}" stroke-width="1" style="animation-delay:${(Math.random()*3).toFixed(2)}s;animation-duration:${(2.4+Math.random()*1.6).toFixed(2)}s"/>`;}}
  return s+'</svg>';
}

/* =========================================================
   畫面：開場、任務板、派對、布置、設定
   ========================================================= */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('#s-'+id).classList.add('active');window.scrollTo(0,0);}
function setQuick(){$('#quickSound').textContent=P.sound?'音效：開':'音效：關';$('#quickSound').setAttribute('aria-pressed',P.sound?'true':'false');}
function brand(){$('#brandLogo').innerHTML=carFaceSVG(CARC[P.deco.car])+'<span>救援小車隊</span>';}
let introTok=0;
async function runIntro(){
  const tok=++introTok,box=$('#radioLines');box.innerHTML='';$('#idArea').innerHTML='';
  $('#walkie').innerHTML=walkieSVG();$('#btnSkip').hidden=false;
  const back=P.introSeen;
  const lines=back?[['阿輪隊長',`滋滋……${callName()}，歡迎歸隊。`],['阿輪隊長','小輪已經加滿油，出勤單在任務板上。完畢。']]
    :[['阿輪隊長','滋滋……呼叫、呼叫！這裡是草地救援站指揮中心。'],['阿輪隊長','暴風雨把村莊的路吹斷了，田伯、小穗和莓莓奶奶都在等物資。'],['阿輪隊長','指揮中心需要一位路線規劃員，和救援車「小輪」搭檔出勤。完畢。'],['小輪','叭叭！我是小輪。路線交給你規劃，我負責開。走不通的話，我會自己安全停車，等你修好再出發。']];
  for(const [who,t] of lines){if(tok!==introTok)return;Snd.radio();const el=document.createElement('p');el.className='rline';el.innerHTML=`<span class="who">${who}</span>${t}`;box.appendChild(el);await sleep(1400);}
  if(tok!==introTok)return;showId();
}
function skipIntro(){introTok++;const box=$('#radioLines');box.innerHTML=`<p class="rline"><span class="who">阿輪隊長</span>呼叫、呼叫！指揮中心需要一位路線規劃員，和救援車「小輪」搭檔出勤。完畢。</p>`;showId();}
function showId(){
  $('#btnSkip').hidden=true;
  $('#idArea').innerHTML=`<div class="idcard"><div class="bar"><span>救援隊員證</span><span>No.${P.memberNo}</span></div>
    <div class="body"><div class="photo">${carFaceSVG(CARC[P.deco.car]).replace('<svg','<svg style="width:100%;height:100%"')}</div>
    <div><label for="memberInput">隊員名字（可以不填）</label><input id="memberInput" maxlength="8" value="${esc(P.name||'')}" placeholder="寫上你的名字" autocomplete="off">
    <p class="soft" style="margin:.4em 0 0">搭檔：小輪｜所屬：草地救援站</p></div><div class="stamp">草地<br>救援站</div></div></div>
    <div class="actions"><button class="btn red big" data-go="start" type="button">${P.introSeen?'回到任務板':'領取隊員證，報到！'}</button></div>`;
}
function stickersRow(S){return `<span class="stk" aria-label="救援${S.rescue?'有':'沒有'}、包裹${S.parcel?'有':'沒有'}、省路${S.strategy?'有':'沒有'}、雙路線${S.routes.length>=2?'有':'沒有'}">${stickerMini('rescue',S.rescue)}${stickerMini('parcel',S.parcel)}${stickerMini('strategy',S.strategy)}${stickerMini('badge',S.routes.length>=2)}</span>`;}
function renderMap(){
  const done=P.lv.filter(x=>x.rescue).length;
  $('#stages').innerHTML=LEVEL_NAMES.map((n,k)=>`<span class="stage-chip ${k===0?'on':''}">第${['一','二','三','四','五'][k]}站．${n}${k?'（籌備中）':''}</span>`).join('');
  $('#mapProgress').textContent=`救援進度 ${done} / 10`;$('#mapBar').style.width=(done*10)+'%';
  $('#mapScene').innerHTML=baseSVG({newIdx:newBase});newBase=undefined;
  $('#memberName').textContent=`${P.name?'隊員'+P.name:'新隊員'}｜搭檔：小輪`;
  const nextI=P.lv.findIndex(x=>!x.rescue);
  $('#mapNote').textContent=done===0?'暴風雨過後，救援站只剩一堆木板。完成出勤單，基地就會一塊一塊搭起來！'
    :(nextI>=0?`基地新增：${BASE_STEPS[done-1]}。下一張出勤單：${LV[nextI].name}`:'草地救援站落成了！每張出勤單都可以再接一次，挑戰包裹章、省路章和第二條路線。');
  $('#tickets').innerHTML=LV.map((L,k)=>{const S=P.lv[k],unlocked=k===0||P.lv[k-1].rescue,isNext=k===nextI;
    const whoName=L.who==='all'?'全村居民':PEOPLE[L.who].name;
    return `<button class="ticket ${S.rescue?'done':''} ${isNext?'next':''}" data-lvl="${k}" type="button" ${unlocked?'':'disabled'} aria-label="出勤單 ${k+1}，${L.name}${unlocked?'':'，待命中'}"><span class="stub">${String(k+1).padStart(2,'0')}</span><span class="mid"><b>${L.name}</b><small>${unlocked?`${whoName}｜送${L.cargo}`:'待命中'}</small></span><span class="right">${unlocked?stickersRow(S):''}</span></button>`;}).join('');
  $('#btnDeco').disabled=!P.unlockedDeco;
  $('#decoHint').textContent=P.unlockedDeco?'選小輪的車色、基地屋頂和基地夥伴，免費隨時更換。':'完成十張出勤單後，就能布置基地和小輪。';
}
function showParty(){
  $('#partyBox').innerHTML=`<p class="soft" style="margin:0;font-weight:800;letter-spacing:.12em">第一站完成</p><h2>草地救援站落成派對！</h2>${baseSVG({party:true})}
    <div class="story"><p>田伯、小穗和莓莓奶奶都來到救援站。小輪按了好大一聲喇叭：「叭叭——！」</p>
    <p>阿輪隊長拍拍小輪說：「我們鋪的路有的彎、有的繞，可是每一條都把東西送到了大家手上。能幫上忙的路，就是好路。」</p>
    <p class="reward">你可以自由布置了：<b>小輪的車色、基地屋頂、基地夥伴</b>。<br>每張出勤單也都可以再接一次，挑戰包裹章、省路章和第二條路線。</p></div>
    <div class="actions"><button class="btn yellow big" data-go="deco" type="button">開始布置</button><button class="btn" data-go="map" type="button">回任務板</button></div>`;
  show('party');setTimeout(()=>Snd.celebrate(),350);
}
function decoIcon(k,v){
  if(k==='car')return carFaceSVG(CARC[v]);
  if(k==='roof')return baseSVG({all:true,deco:{roof:v},viewBox:'26 94 196 116'});
  return baseSVG({all:true,deco:{pet:v},viewBox:'392 236 74 58'});
}
function renderDeco(){
  $('#decoScene').innerHTML=baseSVG();
  $('#decoPanel').innerHTML=Object.entries(DECO).map(([k,D0])=>`<h3>${D0.title}</h3><div class="deco-opts" role="group" aria-label="${D0.title}">${D0.opts.map(([v,l])=>`<button class="deco-opt ${P.deco[k]===v?'on':''}" data-deco="${k}:${v}" type="button" aria-pressed="${P.deco[k]===v}">${decoIcon(k,v)}<span>${l}</span></button>`).join('')}</div>`).join('');
}
function openSettings(){
  clearTimeout(reportTimer);reportSeq++;if(D&&D.state==='driving'){D.state='paused';modalPausedDrive=D;renderDrive();}
  const sname=k=>(STRATS.find(s=>s[0]===k)||['',''])[1];
  const rows=P.log.slice(-60).reverse().map(l=>`<tr><td>${esc(l.time)}</td><td>${l.lvl}</td><td>${esc(l.result)}</td><td>${l.roads}</td><td>${l.parcel?'有':''}</td><td>${l.newRoute}</td><td>${l.hints}</td><td>${sname(l.strategy)}</td></tr>`).join('');
  const tsv=['時間\t關卡\t試車結果\t已鋪道路\t包裹\t新路線\t提示次數\t找路方法'].concat(P.log.map(l=>[l.time,l.lvl,l.result,l.roads,l.parcel?'有':'',l.newRoute,l.hints,sname(l.strategy)].join('\t'))).join('\n');
  openModal(`<h3>設定</h3>
    <label class="row"><input type="checkbox" id="setSound" ${P.sound?'checked':''}> 開啟音效</label>
    <label class="row">音量 <input type="range" id="setVol" min="0" max="1" step="0.05" value="${P.vol}"></label>
    <button class="btn small" data-m="test" type="button">試聽音效</button>
    <label class="row">隊員名字 <input id="setName" maxlength="8" value="${esc(P.name||'')}" style="flex:1;padding:.3em .5em;border:3px solid ${I};border-radius:10px"></label>
    <p class="soft">所有重要回饋也有文字、圖示或動畫，關掉聲音一樣能玩。名字只存在這台裝置的瀏覽器裡。</p>
    <details><summary>進度備份</summary>
      <p class="soft">進度自動存在這台裝置的瀏覽器裡，不會跨裝置同步。可以匯出備份檔，換電腦時再匯入。</p>
      <div class="row-btns"><button class="btn small" data-m="export" type="button">匯出進度</button><button class="btn small" data-m="import" type="button">匯入進度</button></div>
    </details>
    <details><summary>老師區：試車紀錄</summary>
      <p class="soft">每次按「出發」都會記錄一筆，包含停車原因。任務章與徽章用來看見孩子的規劃與修正過程，不作為注意力診斷或療效判定。</p>
      ${P.log.length?`<div style="overflow-x:auto"><table class="log-table"><thead><tr><th>時間</th><th>關</th><th>結果</th><th>道路</th><th>包裹</th><th>新路線</th><th>提示</th><th>找路方法</th></tr></thead><tbody>${rows}</tbody></table></div><p class="soft">可複製到試算表（Tab 分隔）：</p><textarea readonly>${esc(tsv)}</textarea>`:'<p>還沒有試車紀錄。</p>'}
      <button class="btn small" data-m="reset" type="button">清除全部進度與紀錄</button>
    </details>
    <div class="actions"><button class="btn yellow" data-m="close" type="button">完成</button></div>`);
  $('#setSound').addEventListener('change',e=>{P.sound=e.target.checked;Snd.init();Snd.apply();save();setQuick();});
  $('#setVol').addEventListener('input',e=>{P.vol=+e.target.value;Snd.apply();save();});
  $('#setName').addEventListener('change',e=>{P.name=e.target.value.trim().slice(0,8);save();if($('#s-map').classList.contains('active'))renderMap();});
}
function exportProgress(){
  try{const blob=new Blob([JSON.stringify({app:'rescue-cars-v2',version:2,data:P},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='救援小車隊進度.json';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}catch(e){alert('這個瀏覽器無法匯出檔案。');}
}
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!/^rescue-cars/.test(o.app)||!o.data||!Array.isArray(o.data.lv)||o.data.lv.length!==LV.length)throw 0;const s=P.sound,v=P.vol;endDrive();G=null;introTok++;P=normalize(o.data);P.sound=s;P.vol=v;save();closeModal();Snd.apply();setQuick();brand();renderMap();show('map');alert('進度匯入完成！');}
    catch(err){alert('這個檔案不是救援小車隊的進度備份。');}e.target.value='';};
  rd.readAsText(f);
});

/* =========================================================
   事件
   ========================================================= */
$('#board').addEventListener('click',e=>{const c=e.target.closest('[data-cell]');if(c)onCell(+c.dataset.cell);});
$('#board').addEventListener('keydown',e=>{const c=e.target.closest('[data-cell]');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();onCell(+c.dataset.cell);}});
document.querySelectorAll('.tool[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
$('#s-play').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;
  ({turnSel,undo,clear:clearRoads,go:startDrive,pause:togglePause,workshop:backToWorkshop,replay})[a.dataset.act]();});
function chooseEasy(e){if(e.target.closest('[data-mobile-drive]')){if(D&&['driving','paused'].includes(D.state))togglePause();else startDrive();return;}const b=e.target.closest('[data-easy]');if(!b||b.disabled||!G)return;const [k,r]=b.dataset.easy.split(':');G.tool=k;if(k==='s')G.rotS=+r;if(k==='c')G.rotC=+r;G.selected=null;Snd.select();renderTools();renderBoard();}
$('#roadPalette').addEventListener('click',chooseEasy);$('#mobileControls').addEventListener('click',chooseEasy);
function showPreview(i){if(!G||D||G.roads[i]||!buildable(G.t[i])||G.tool==='erase')return;const [x,y]=cellXY(i),ch=G.t[i],k='Bb'.includes(ch)?'s':G.tool,r='Bb'.includes(ch)?(ch==='B'?0:1):(k==='s'?G.rotS:G.rotC),p=$('#roadPreview');if(p)p.innerHTML=`<g transform="translate(${x} ${y})" opacity=".5">${woodTile(i,k,r)}</g>`;}
$('#board').addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const c=e.target.closest('[data-cell]');if(c)showPreview(+c.dataset.cell);});
$('#board').addEventListener('pointerout',()=>{const p=$('#roadPreview');if(p)p.innerHTML='';});
$('#board').addEventListener('focusin',e=>{const c=e.target.closest('[data-cell]');if(c)showPreview(+c.dataset.cell);});
$('#board').addEventListener('focusout',()=>{const p=$('#roadPreview');if(p)p.innerHTML='';});
$('#btnHint').addEventListener('click',showHint);
$('#btnBrief').addEventListener('click',()=>{if(G&&!D)showBrief();});
$('#btnSkip').addEventListener('click',skipIntro);
$('#modalBox').addEventListener('click',e=>{
  const st=e.target.closest('[data-strat]');
  if(st){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===st));const s=STRATS.find(x=>x[0]===st.dataset.strat);$('#reply').textContent=s[2];Snd.deco();if(P.log.length){P.log[P.log.length-1].strategy=s[0];save();}return;}
  const r=e.target.closest('[data-r]');
  if(r){const k=r.dataset.r,i=G.i;closeModal();
    if(k==='next'){startLevel(i+1);}
    else if(k==='again'){backToWorkshop();speak('回到工坊了。試試看用不一樣的路線完成救援？','lun');}
    else if(k==='party'){endDrive();showParty();}
    else{endDrive();G=null;renderMap();show('map');}
    return;}
  const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;
  if(m==='close'){closeModal();if(G&&!D)speak('收到。先看地圖：車庫在哪裡、目的地在哪裡、哪裡過不去？完畢。','lun');}
  else if(m==='test'){Snd.init();Snd.horn();}
  else if(m==='export')exportProgress();
  else if(m==='import')$('#importFile').click();
  else if(m==='reset'){if(confirm('確定要清除所有進度與紀錄嗎？')){const s=P.sound,v=P.vol;endDrive();G=null;introTok++;P=defaults();P.sound=s;P.vol=v;save();closeModal();brand();show('intro');runIntro();}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!$('#modalBox .report'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&!$('#modal').hidden){const items=Array.from($('#modalBox').querySelectorAll('button:not([disabled]),input:not([disabled]),textarea,summary')).filter(el=>el.getClientRects().length);if(items.length){const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}if(e.key==='Escape'&&!$('#modal').hidden&&!$('#modalBox .report'))closeModal();});
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'),lv=e.target.closest('[data-lvl]'),dc=e.target.closest('[data-deco]');
  if(lv&&!lv.disabled){startLevel(+lv.dataset.lvl);return;}
  if(dc){const [k,v]=dc.dataset.deco.split(':');P.deco[k]=v;save();Snd.deco();brand();renderDeco();return;}
  if(!go)return;const g=go.dataset.go;
  if(g==='start'){Snd.init();const inp=$('#memberInput');if(inp)P.name=inp.value.trim().slice(0,8);P.introSeen=true;save();introTok++;renderMap();show('map');}
  else if(g==='map'){endDrive();G=null;renderMap();show('map');}
  else if(g==='deco'){if(P.unlockedDeco){renderDeco();show('deco');}}
});
$('#quickSound').addEventListener('click',()=>{P.sound=!P.sound;Snd.init();Snd.apply();save();setQuick();if(P.sound)Snd.deco();});
$('#btnSettings').addEventListener('click',openSettings);

// 測試用：唯讀查詢與求解，不影響遊戲
window.__rescueDebug={inspect:()=>({level:G&&G.i,roads:G&&JSON.parse(JSON.stringify(G.roads)),drive:D&&D.state,progress:JSON.parse(JSON.stringify(P))}),simulate:()=>G&&simulate(),solve:(i,lim)=>solveAll(i,lim).map(s=>({cells:s.path.map(p=>p.cell),parcel:s.parcel,len:s.path.length})),
  roadsFor:(i,k)=>{const s=solveAll(i,4000);return routeToRoads(s[k].path);},state:()=>D&&D.state,cur:()=>G&&G.i};

setQuick();brand();show('intro');runIntro();
})();
</script>
