<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23138a68'/%3E%3Crect x='8' y='11' width='16' height='12' rx='3' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='13' cy='17' r='1.8' fill='white'/%3E%3Ccircle cx='19' cy='17' r='1.8' fill='white'/%3E%3Cpath d='M16 11V7' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* 永齡機器人課務系統 — 介面樣式（沿用永齡課輔系統的設計語言） */
:root {
  color-scheme: light;
  --page: #f6f5f2; --surface: #ffffff; --surface-2: #faf9f7; --surface-3: #f1efea;
  --ink: #1b2027; --ink-2: #4f5762; --muted: #6f7680; --line: #e4e1da; --line-2: #eeebe5;
  --accent: #2563c9; --accent-ink: #ffffff; --accent-soft: #e8f0fc; --accent-line: #b9cff2;
  --brand: #138a68; --brand-soft: #e1f3ec;
  --side: #17212c; --side-2: #1f2b38; --side-ink: #e8edf3; --side-muted: #94a3b4;
  --good: #0f7a0f; --good-soft: #e3f4e3; --warn: #8a5a00; --warn-soft: #fdf1d6;
  --serious: #b04a1b; --serious-soft: #fbe6da; --critical: #c22f2f; --critical-soft: #f9e0e0; --neutral-soft: #ecebe7;
  --mark-good: #0ca30c; --mark-warn: #fab219; --mark-serious: #ec835a; --mark-critical: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #c98500; --s5: #e87ba4; --s6: #4a3aa7; --s7: #008300; --s8: #e34948;
  --grid: #e3e0d9;
  --shadow: 0 1px 2px rgba(20,24,31,.06), 0 2px 8px rgba(20,24,31,.04); --shadow-lg: 0 10px 40px rgba(20,24,31,.18);
  --radius: 10px;
  --font: "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f1215; --surface: #181c21; --surface-2: #1d2228; --surface-3: #232930;
    --ink: #eef1f4; --ink-2: #c0c7cf; --muted: #929aa3; --line: #2c333b; --line-2: #262c33;
    --accent: #5b93ea; --accent-ink: #0d1116; --accent-soft: #1b2a41; --accent-line: #2e4a73;
    --brand: #3cc497; --brand-soft: #15302a; --side: #0b1016; --side-2: #141b23;
    --good: #4cc44c; --good-soft: #15301a; --warn: #f2bf4f; --warn-soft: #33290f;
    --serious: #f0956b; --serious-soft: #3a2218; --critical: #f07676; --critical-soft: #3c1a1c; --neutral-soft: #2a2f35;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s7: #2aa52a; --s8: #e66767;
    --grid: #2a3037; --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 10px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f1215; --surface: #181c21; --surface-2: #1d2228; --surface-3: #232930;
  --ink: #eef1f4; --ink-2: #c0c7cf; --muted: #929aa3; --line: #2c333b; --line-2: #262c33;
  --accent: #5b93ea; --accent-ink: #0d1116; --accent-soft: #1b2a41; --accent-line: #2e4a73;
  --brand: #3cc497; --brand-soft: #15302a; --side: #0b1016; --side-2: #141b23;
  --good: #4cc44c; --good-soft: #15301a; --warn: #f2bf4f; --warn-soft: #33290f;
  --serious: #f0956b; --serious-soft: #3a2218; --critical: #f07676; --critical-soft: #3c1a1c; --neutral-soft: #2a2f35;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s7: #2aa52a; --s8: #e66767;
  --grid: #2a3037; --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 10px 40px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); } .small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.row { display: flex; align-items: center; gap: 8px; } .row.wrap { flex-wrap: wrap; } .row.top { align-items: flex-start; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.sp { flex: 1; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }

/* 版面 */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; z-index: 30; }
.side-head { padding: 18px 16px 12px; border-bottom: 1px solid rgba(255,255,255,.07); }
.brand { display: flex; gap: 10px; align-items: center; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; flex: none; display: grid; place-items: center; background: linear-gradient(135deg, #1fb487, #0f7a5c); color: #fff; }
.brand-mark svg.i { width: 20px; height: 20px; }
.brand-text b { display: block; font-size: 15px; letter-spacing: .5px; }
.brand-text span { display: block; font-size: 11.5px; color: var(--side-muted); }
.term-select { margin-top: 12px; width: 100%; background: var(--side-2); color: var(--side-ink); border: 1px solid rgba(255,255,255,.09); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
.nav { flex: 1; overflow-y: auto; padding: 10px 10px 16px; }
.nav-label { font-size: 11px; color: var(--side-muted); letter-spacing: 1px; padding: 14px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: var(--side-ink); font-size: 14px; position: relative; }
.nav a:hover { background: rgba(255,255,255,.06); text-decoration: none; }
.nav a.active { background: rgba(60,196,151,.16); color: #fff; }
.nav a.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: #3cc497; }
.nav a .badge { margin-left: auto; background: #e0612a; color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; line-height: 18px; font-weight: 700; }
.nav a .badge.soft { background: rgba(255,255,255,.14); color: var(--side-ink); }
.side-foot { padding: 10px 12px 14px; border-top: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 6px; }
.who { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #34465a; font-weight: 700; font-size: 13px; flex: none; }
.who-text { min-width: 0; line-height: 1.3; flex: 1; }
.who-text b { display: block; font-size: 13px; }
.who-text span { font-size: 11.5px; color: var(--side-muted); }
.sync { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--side-muted); padding: 2px 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mark-good); flex: none; }
.dot.busy { background: #5b93ea; animation: pulse 1.2s infinite; } .dot.err { background: var(--mark-critical); }
@keyframes pulse { 50% { opacity: .35; } }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: inherit; cursor: pointer; }
.icon-btn:hover { background: rgba(127,127,127,.16); }
.side .icon-btn { color: var(--side-muted); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); padding: 12px 28px; display: flex; align-items: center; gap: 12px; min-height: 62px; }
.topbar .burger { display: none; }
.page-title { min-width: 0; }
.page-title h1 { font-size: 19px; font-weight: 700; }
.page-title .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.content { padding: 20px 28px 96px; max-width: 1280px; width: 100%; }
.demo-banner { background: var(--warn-soft); color: var(--ink); font-size: 12.5px; padding: 7px 28px; border-bottom: 1px solid var(--line-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* 元件 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 14px 18px 0; }
.card-head h3 { font-size: 15px; font-weight: 700; }
.card-head .sub { font-size: 12px; color: var(--muted); }
.card-body { padding: 12px 18px 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.section-title { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
.section-title .n { width: 22px; height: 22px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 13.5px; white-space: nowrap; }
.btn:hover { background: var(--surface-3); text-decoration: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); }
.btn.danger { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 35%, var(--line)); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }
.btn.lg { height: 42px; font-size: 15px; }
.input, .select, .textarea { height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 10px; outline: none; min-width: 0; width: 100%; }
.textarea { height: auto; min-height: 70px; padding: 8px 10px; resize: vertical; line-height: 1.65; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.sm, .select.sm { height: 28px; font-size: 12.5px; padding: 0 6px; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
label.field > span { font-weight: 600; }
.field .hint { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--neutral-soft); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.serious { background: var(--serious-soft); color: var(--serious); } .chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.brand { background: var(--brand-soft); color: var(--brand); }
.chip.outline { background: transparent; border: 1px solid var(--line); font-weight: 500; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.pill.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { white-space: nowrap; border: 0; background: transparent; padding: 0 12px; height: 32px; cursor: pointer; font-size: 13px; color: var(--ink-2); border-left: 1px solid var(--line-2); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.stat { padding: 14px 16px; }
.stat .label { font-size: 12.5px; color: var(--ink-2); }
.stat .value { font-size: 24px; font-weight: 700; margin-top: 2px; line-height: 1.25; }
.stat .value small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.stat .foot { font-size: 12px; color: var(--muted); margin-top: 2px; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12.5px; background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 9px 10px; white-space: nowrap; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--surface-2); }
.tbl .num { text-align: right; } .tbl .c { text-align: center; }
.tbl-wrap { overflow: auto; max-width: 100%; }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.callout { border-radius: 8px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 13px; line-height: 1.7; }
.callout.warn { background: var(--warn-soft); border-color: transparent; }
.callout.accent { background: var(--accent-soft); border-color: transparent; }
.callout.good { background: var(--good-soft); border-color: transparent; }
.divider { height: 1px; background: var(--line-2); margin: 12px 0; }
.scrim { position: fixed; inset: 0; background: rgba(15,18,22,.38); z-index: 60; }
.modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; background: var(--surface); border-radius: 14px; z-index: 62; box-shadow: var(--shadow-lg); }
.modal.wide { width: min(760px, calc(100vw - 32px)); }
.modal-body { padding: 20px 22px; }
.modal-body h3 { font-size: 17px; margin-bottom: 10px; }
.modal-foot { padding: 0 22px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--shadow-lg); max-width: min(560px, calc(100vw - 32px)); animation: toast-in .18s ease; }
.toast.err { background: var(--critical); color: #fff; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* 登入 */
.boot { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.boot-card { width: min(420px, 100%); }
.boot-icon { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #1fb487, #0f7a5c); color: #fff; }
.boot-icon svg.i { width: 26px; height: 26px; }
.role-pick { display: grid; gap: 10px; }
.role-pick button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: flex; gap: 12px; align-items: center; }
.role-pick button:hover { border-color: var(--accent); background: var(--accent-soft); }
.role-pick b { display: block; font-size: 15px; }

/* 課堂卡片 */
.jcard { display: block; color: inherit; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; box-shadow: var(--shadow); padding: 12px 16px; }
.jcard:hover { text-decoration: none; border-color: var(--accent-line); }
.jcard.done { border-left-color: var(--mark-good); }
.jcard.todo { border-left-color: var(--mark-serious); }
.jcard.prepared { border-left-color: var(--s1); }
.jcard.off { border-left-color: var(--line); background: var(--surface-2); box-shadow: none; border-style: dashed; border-left-style: solid; }
.jcard h4 { font-size: 15.5px; font-weight: 700; }
.jcard h4 small { font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin-left: 6px; }
.jmeta { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.jexcerpt { font-size: 13px; color: var(--ink-2); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }

/* 課堂編輯 */
.kchips { display: flex; flex-wrap: wrap; gap: 6px; }
.kchip { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 13.5px; display: inline-flex; align-items: center; gap: 4px; }
.kchip.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.kchip.taken { opacity: .45; }
.kchip.dashed { border-style: dashed; background: transparent; color: var(--ink-2); }
.gcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); }
.gcard + .gcard { margin-top: 10px; }
.dimchip { display: inline-flex; align-items: center; gap: 2px; height: 30px; padding: 0 4px 0 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px; }
.dimchip button { border: 0; background: transparent; color: inherit; cursor: pointer; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.dimchip button:hover { background: rgba(127,127,127,.18); }
.radar-tbl td { vertical-align: top; }
.radar-tbl td.nm { font-weight: 700; white-space: nowrap; padding-top: 14px; }
.radar-tbl select { width: 64px; }
.radar-tbl .prev { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.radar-tbl .prev.up { color: var(--good); } .radar-tbl .prev.down { color: var(--serious); }
.radar-tbl tr.cm td { padding-top: 0; }
.radar-tbl tr.sep td { border-bottom: 1px solid var(--line); }
.savebar { position: fixed; bottom: 0; left: 240px; right: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 28px; display: flex; gap: 10px; align-items: center; z-index: 25; box-shadow: 0 -4px 16px rgba(20,24,31,.06); }
.savebar .state { font-size: 13px; color: var(--muted); }
.savebar .state.dirty { color: var(--warn); font-weight: 600; }
.cmt { border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); }
.cmt.sw { background: var(--brand-soft); border-color: transparent; }
.cmt + .cmt { margin-top: 8px; }
.cmt-b { white-space: pre-wrap; margin-top: 4px; line-height: 1.7; }
.prewrap { white-space: pre-wrap; line-height: 1.7; }

/* 學生 */
.story { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 16px; }
.story-item { position: relative; padding-bottom: 16px; }
.story-item::before { content: ""; position: absolute; left: -22px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); border: 2px solid var(--surface); }
.story-item .when { font-size: 12.5px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
svg.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
svg.chart .lbl { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
.trend-up { color: var(--good); font-weight: 700; } .trend-down { color: var(--serious); font-weight: 700; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; transform: translateX(-100%); transition: transform .2s ease; }

<body>
<div id="root"></div>
<div class="toasts" id="toasts"></div>
<script src="config.js"></script>
<script>window.DemoServer = (function () {
var DEMO_MODE = true;
/* 模擬 Google Apps Script 環境（試用模式與自動測試用）。正式上線時不會用到。 */
var __DB = { sheets: {}, props: {} };
var __mail = [];
var __cache = {};

function __Sheet(name) { this.name = name; }
__Sheet.prototype._g = function () { return __DB.sheets[this.name]; };
__Sheet.prototype.getDataRange = function () {
  var g = this._g();
  return { getValues: function () { return g.length ? g.map(function (r) { return r.slice(); }) : [['']]; } };
};
__Sheet.prototype.clearContents = function () { __DB.sheets[this.name] = []; return this; };
__Sheet.prototype.setFrozenRows = function () { return this; };
__Sheet.prototype.getLastRow = function () { return this._g().length; };
__Sheet.prototype.getRange = function (r, c, nr, nc) {
  var self = this;
  nr = nr || 1; nc = nc || 1;
  return {
    setNumberFormat: function () { return this; },
    setValues: function (vals) {
      var g = self._g();
      for (var i = 0; i < nr; i++) {
        var row = g[r - 1 + i] || (g[r - 1 + i] = []);
        for (var j = 0; j < nc; j++) {
          var v = vals[i][j];
          if (typeof v === 'string' && v.charAt(0) === "'") v = v.slice(1);
          row[c - 1 + j] = v == null ? '' : v;
        }
      }
      var w = 0;
      g.forEach(function (x) { if (x) w = Math.max(w, x.length); });
      for (var k = 0; k < g.length; k++) {
        if (!g[k]) g[k] = [];
        for (var q = 0; q < w; q++) if (g[k][q] == null) g[k][q] = '';
      }
      return this;
    },
    getValues: function () {
      var g = self._g(), out = [];
      for (var i = 0; i < nr; i++) { var row = []; for (var j = 0; j < nc; j++) row.push(((g[r - 1 + i] || [])[c - 1 + j]) ?? ''); out.push(row); }
      return out;
    }
  };
};
var __SS = {
  getSheetByName: function (n) { return __DB.sheets[n] ? new __Sheet(n) : null; },
  insertSheet: function (n) { __DB.sheets[n] = []; return new __Sheet(n); }
};
var SpreadsheetApp = { getActiveSpreadsheet: function () { return __SS; }, openById: function () { return __SS; } };
var CacheService = {
  getScriptCache: function () {
    return {
      get: function (k) { var o = __cache[k]; if (!o) return null; if (o.exp < Date.now()) { delete __cache[k]; return null; } return o.v; },
      put: function (k, v, ttl) { __cache[k] = { v: String(v), exp: Date.now() + (ttl || 600) * 1000 }; },
      remove: function (k) { delete __cache[k]; }
    };
  }
};
var PropertiesService = {
  getScriptProperties: function () {
    return {
      getProperty: function (k) { return Object.prototype.hasOwnProperty.call(__DB.props, k) ? __DB.props[k] : null; },
      setProperty: function (k, v) { __DB.props[k] = String(v); return this; },
      deleteProperty: function (k) { delete __DB.props[k]; return this; },
      getProperties: function () { return Object.assign({}, __DB.props); }
    };
  }
};
var LockService = { getScriptLock: function () { return { waitLock: function () {}, releaseLock: function () {} }; } };
var Utilities = {
  getUuid: function () {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  }
};
var MailApp = { sendEmail: function (o) { __mail.push(o); } };
var Session = { getEffectiveUser: function () { return { getEmail: function () { return __DB.owner || ''; } }; } };
var ContentService = {
  MimeType: { JSON: 'json' },
  createTextOutput: function (s) { return { setMimeType: function () { return this; }, getContent: function () { return s; } }; }
};

/**
 * 永齡機器人課務系統 — 雲端主機（Google Apps Script）
 *
 * 用法（詳見「部署說明.md」）：
 *   1. 開一份新的 Google 試算表 → 擴充功能 → Apps Script，把這整份貼進 Code.gs
 *   2. 在編輯器上方選 setup → 執行（第一次會要求授權），會建立所有工作表，並把你設成督導
 *   3. 部署 → 新增部署作業 → 類型「網頁應用程式」：執行身分「我」、存取權「所有人」
 *   4. 把部署網址（結尾 /exec）填進網頁旁邊的 config.js
 *
 * 資料都存在這份試算表裡，社工／督導也可以直接打開試算表查看。
 * 「雷達分數」工作表是系統自動產生的長表（一位學生一個維度一列），方便做樞紐分析；請不要手動修改它。
 */

var APP = { name: '永齡機器人課務系統', version: '1.0.0' };
var SHEET_ID = ''; // 留空：使用綁定的試算表；若是獨立專案，填入試算表 ID

var ROLES = ['老師', '社工', '督導'];
var TOKEN_DAYS = 30;
var SHARED_HOURS = 12;

/* ───────── 資料表定義：[程式欄位, 試算表標題] ───────── */
var TABLES = {
  people: { sheet: '人員', cols: [['email', 'Email'], ['name', '姓名'], ['role', '角色（老師／社工／督導）'], ['sites', '據點（逗號分隔，空白＝全部）'], ['active', '啟用'], ['note', '備註']] },
  sites: { sheet: '據點', cols: [['id', 'id'], ['name', '名稱'], ['day', '上課日'], ['order', '排序'], ['active', '啟用']] },
  students: { sheet: '學生', cols: [['id', 'id'], ['name', '姓名'], ['siteId', '據點id'], ['grade', '年級'], ['status', '狀態'], ['note', '備註'], ['createdAt', '建立時間']] },
  lessons: {
    sheet: '課堂紀錄',
    cols: [['id', 'id'], ['siteId', '據點id'], ['term', '學期'], ['seq', '序號'], ['date', '日期'], ['status', '狀態'], ['topic', '課程主題'],
      ['goals', '教學原理／目標設定'], ['timeline', '課程時間'], ['execution', '課堂執行紀錄'], ['indicators', '評量指標'],
      ['groups', '分組（系統用）'], ['groupNote', '能力分類／分組說明'], ['qualitative', '質性觀察'], ['radar', '雷達分析（系統用）'],
      ['radarNote', '雷達備註'], ['management', '班級經營'], ['slides', '簡報連結'], ['attendance', '出席（系統用）'],
      ['updatedAt', '更新時間'], ['updatedBy', '更新者']],
    json: { groups: [], radar: { dims: [], rows: [] }, attendance: [] }
  },
  scores: { sheet: '雷達分數', cols: [['lessonId', '課堂id'], ['site', '據點'], ['term', '學期'], ['seq', '序號'], ['date', '日期'], ['studentId', '學生id'], ['student', '學生'], ['dim', '維度'], ['score', '分數'], ['comment', '評語']] },
  comments: { sheet: '回饋留言', cols: [['id', 'id'], ['lessonId', '課堂id'], ['email', 'Email'], ['name', '姓名'], ['role', '角色'], ['text', '內容'], ['at', '時間']] },
  settings: { sheet: '設定', cols: [['key', 'key'], ['value', 'value'], ['note', '說明']] }
};

var DEFAULT_SETTINGS = {
  terms: { value: '', note: '學期清單，逗號分隔，例如 114-2,115-1' },
  currentTerm: { value: '', note: '目前學期' },
  defaultDims: { value: '合作,理解,組裝,口語表達,解決問題', note: '新課堂的預設雷達維度' },
  scoreMax: { value: '5', note: '雷達分數滿分' }
};

/* ───────── 進入點 ───────── */
function doGet() {
  return json_({ ok: true, app: APP.name, version: APP.version });
}

function doPost(e) {
  var req = {};
  try { req = JSON.parse((e && e.postData && e.postData.contents) || '{}'); } catch (x) { return json_({ ok: false, error: '請求格式錯誤', code: 'bad' }); }
  return json_(handle(req));
}

function json_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function handle(req) {
  try {
    var fn = ROUTES[req.action];
    if (!fn) throw err_('不認得的動作：' + req.action, 'bad');
    var open = { ping: 1, 'login.request': 1, 'login.verify': 1, 'demo.login': 1 };
    if (open[req.action]) return fn(req);
    var me = auth_(req.token);
    var write = !/^(load|logout)$/.test(req.action);
    if (!write) return fn(req, me);
    var lock = LockService.getScriptLock();
    lock.waitLock(20000);
    try { return fn(req, me); } finally { lock.releaseLock(); }
  } catch (x) {
    var out = { ok: false, error: (x && x.message) || String(x), code: (x && x.code) || 'error' };
    if (x && x.current) out.current = x.current;
    return out;
  }
}

var ROUTES = {
  ping: function () { return { ok: true, app: APP.name, version: APP.version }; },
  'login.request': loginRequest_,
  'login.verify': loginVerify_,
  'demo.login': demoLogin_,
  logout: function (req) { props_().deleteProperty('tok_' + req.token); return { ok: true }; },
  load: function (req, me) { return load_(me); },
  'lesson.save': lessonSave_,
  'lesson.createMany': lessonCreateMany_,
  'lesson.delete': lessonDelete_,
  'comment.add': commentAdd_,
  'comment.delete': commentDelete_,
  'student.save': studentSave_,
  'student.delete': studentDelete_,
  'student.merge': studentMerge_,
  'site.save': siteSave_,
  'site.delete': siteDelete_,
  'person.save': personSave_,
  'person.delete': personDelete_,
  'settings.save': settingsSave_,
  'import': import_
};

/* ───────── 初始化（在編輯器手動執行一次） ───────── */
function setup() {
  Object.keys(TABLES).forEach(function (k) { sheet_(k); });
  var people = read_('people');
  var email = '';
  try { email = Session.getEffectiveUser().getEmail(); } catch (x) {}
  if (!people.length && email) {
    people.push({ email: email.toLowerCase(), name: '督導', role: '督導', sites: '', active: 'TRUE', note: '執行 setup 的人（請改成真實姓名）' });
    write_('people', people);
  }
  var st = read_('settings');
  var have = {};
  st.forEach(function (r) { have[r.key] = 1; });
  Object.keys(DEFAULT_SETTINGS).forEach(function (k) {
    if (!have[k]) {
      var v = DEFAULT_SETTINGS[k].value;
      if (k === 'currentTerm' || k === 'terms') v = termOf_(today_());
      st.push({ key: k, value: v, note: DEFAULT_SETTINGS[k].note });
    }
  });
  write_('settings', st);
  return '完成：已建立工作表' + (email ? '，督導帳號：' + email : '');
}

/* ───────── 登入：Email 驗證碼 ───────── */
function loginRequest_(req) {
  var email = String(req.email || '').trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw err_('Email 格式不對');
  var people = read_('people');
  if (!people.length) throw err_('系統還沒初始化：請督導在 Apps Script 執行 setup');
  var p = findPerson_(email, people);
  if (!p) throw err_('這個 Email 不在人員名單上，請社工或督導幫你加入');
  if (!p.active) throw err_('這個帳號已停用，請聯絡社工或督導');
  var cache = CacheService.getScriptCache();
  if (cache.get('otpwait_' + email)) throw err_('剛剛已經寄過了，請等一分鐘再重新寄送');
  var code = String(Math.floor(100000 + Math.random() * 900000));
  cache.put('otp_' + email, JSON.stringify({ code: code, tries: 0 }), 600);
  cache.put('otpwait_' + email, '1', 55);
  MailApp.sendEmail({
    to: email,
    subject: '【' + APP.name + '】登入驗證碼 ' + code,
    name: APP.name,
    htmlBody: '<div style="font-family:sans-serif;line-height:1.8">' + esc_(p.name) + ' 你好：<br>你的登入驗證碼是<br>' +
      '<div style="font-size:28px;font-weight:700;letter-spacing:6px;margin:8px 0">' + code + '</div>' +
      '10 分鐘內有效。如果不是你本人要登入，請忽略這封信。</div>'
  });
  return { ok: true };
}

function loginVerify_(req) {
  var email = String(req.email || '').trim().toLowerCase();
  var cache = CacheService.getScriptCache();
  var raw = cache.get('otp_' + email);
  if (!raw) throw err_('驗證碼已過期，請重新寄送');
  var o = JSON.parse(raw);
  if (o.tries >= 5) { cache.remove('otp_' + email); throw err_('錯誤太多次，請重新寄送驗證碼'); }
  if (String(req.code || '').trim() !== o.code) {
    o.tries++;
    cache.put('otp_' + email, JSON.stringify(o), 600);
    throw err_('驗證碼不對，還可以再試 ' + (5 - o.tries) + ' 次');
  }
  cache.remove('otp_' + email);
  var p = findPerson_(email);
  if (!p || !p.active) throw err_('這個帳號已停用');
  return { ok: true, token: newToken_(email, !!req.shared), me: pub_(p) };
}

function demoLogin_(req) {
  if (typeof DEMO_MODE === 'undefined' || !DEMO_MODE) throw err_('不認得的動作', 'bad');
  var people = read_('people');
  var p = people.filter(function (x) { return x.role === req.role; })[0];
  if (!p) throw err_('試用資料裡沒有這個角色');
  var me = findPerson_(p.email);
  return { ok: true, token: newToken_(me.email, true), me: pub_(me) };
}

function newToken_(email, shared) {
  var tok = (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, '');
  var ms = shared ? SHARED_HOURS * 3600e3 : TOKEN_DAYS * 86400e3;
  var pr = props_();
  pr.setProperty('tok_' + tok, JSON.stringify({ email: email, exp: Date.now() + ms }));
  // 順手清掉過期的
  var all = pr.getProperties();
  Object.keys(all).forEach(function (k) {
    if (k.indexOf('tok_') !== 0) return;
    try { if (JSON.parse(all[k]).exp < Date.now()) pr.deleteProperty(k); } catch (x) { pr.deleteProperty(k); }
  });
  return tok;
}

function auth_(token) {
  if (!token) throw err_('請先登入', 'auth');
  var raw = props_().getProperty('tok_' + token);
  if (!raw) throw err_('登入已過期，請重新登入', 'auth');
  var s = JSON.parse(raw);
  if (s.exp < Date.now()) { props_().deleteProperty('tok_' + token); throw err_('登入已過期，請重新登入', 'auth'); }
  var p = findPerson_(s.email);
  if (!p || !p.active) throw err_('這個帳號已停用', 'auth');
  return p;
}

function findPerson_(email, people) {
  email = String(email || '').toLowerCase();
  var row = (people || read_('people')).filter(function (r) { return String(r.email).toLowerCase() === email; })[0];
  if (!row) return null;
  var role = ROLES.indexOf(row.role) >= 0 ? row.role : '老師';
  var siteList = String(row.sites || '').split(/[,，、\s]+/).filter(String);
  var sites = null;
  if (siteList.length) {
    var all = read_('sites');
    sites = [];
    siteList.forEach(function (s) {
      all.forEach(function (x) { if (x.id === s || x.name === s) sites.push(x.id); });
    });
  }
  return {
    email: email, name: row.name || email, role: role, admin: role !== '老師',
    sites: sites, active: !/^(false|否|0|停用|no)$/i.test(String(row.active || 'TRUE'))
  };
}

function pub_(p) { return { email: p.email, name: p.name, role: p.role, admin: p.admin, sites: p.sites }; }

function canSite_(me, siteId) { return me.admin || !me.sites || me.sites.indexOf(siteId) >= 0; }

function needAdmin_(me, what) { if (!me.admin) throw err_((what || '這個動作') + '只有社工／督導可以做', 'perm'); }

/* ───────── 讀取全部 ───────── */
function load_(me) {
  var sites = read_('sites'), students = read_('students'), lessons = read_('lessons'), comments = read_('comments');
  if (!me.admin && me.sites) {
    sites = sites.filter(function (s) { return canSite_(me, s.id); });
    students = students.filter(function (s) { return canSite_(me, s.siteId); });
    lessons = lessons.filter(function (l) { return canSite_(me, l.siteId); });
    var ids = {};
    lessons.forEach(function (l) { ids[l.id] = 1; });
    comments = comments.filter(function (c) { return ids[c.lessonId]; });
  }
  var out = {
    ok: true, me: pub_(me), sites: sites, students: students, lessons: lessons, comments: comments,
    settings: settingsObj_(), server: { version: APP.version, now: new Date().toISOString() }
  };
  if (me.admin) out.people = read_('people');
  return out;
}

/* ───────── 課堂紀錄 ───────── */
var LESSON_TEXT = ['term', 'seq', 'date', 'status', 'topic', 'goals', 'timeline', 'execution', 'indicators', 'groupNote', 'qualitative', 'radarNote', 'management', 'slides'];

function cleanLesson_(l) {
  var o = {};
  LESSON_TEXT.forEach(function (k) { o[k] = l[k] == null ? '' : String(l[k]); });
  o.date = normDate_(o.date);
  if (o.slides && !/^https?:\/\//i.test(o.slides)) o.slides = '';
  o.siteId = String(l.siteId || '');
  o.groups = Array.isArray(l.groups) ? l.groups.map(function (g) {
    return { name: String(g.name || ''), members: (g.members || []).map(String), note: String(g.note || '') };
  }) : [];
  var r = l.radar || {};
  o.radar = {
    dims: (r.dims || []).map(function (d) { return String(d).trim(); }).filter(String),
    rows: (r.rows || []).map(function (x) {
      var sc = {};
      Object.keys(x.scores || {}).forEach(function (d) {
        var v = x.scores[d];
        if (v !== '' && v != null && !isNaN(Number(v))) sc[d] = Number(v);
      });
      return { sid: String(x.sid || ''), scores: sc, comment: String(x.comment || '') };
    }).filter(function (x) { return x.sid; })
  };
  o.attendance = Array.isArray(l.attendance) ? l.attendance.map(String) : [];
  return o;
}

function lessonSave_(req, me) {
  var l = req.lesson || {};
  var sites = read_('sites');
  if (!sites.some(function (s) { return s.id === l.siteId; })) throw err_('找不到這個據點');
  if (!canSite_(me, l.siteId)) throw err_('你沒有這個據點的權限', 'perm');
  var lessons = read_('lessons');
  var idx = -1;
  if (l.id) lessons.forEach(function (x, i) { if (x.id === l.id) idx = i; });
  if (idx >= 0) {
    var cur = lessons[idx];
    if (!canSite_(me, cur.siteId)) throw err_('你沒有這個據點的權限', 'perm');
    if (req.expect != null && String(req.expect) !== String(cur.updatedAt || '')) {
      var e = err_('這堂課剛剛被 ' + (cur.updatedBy || '別人') + ' 更新過，請先看一下最新內容', 'conflict');
      e.current = cur;
      throw e;
    }
  }
  var o = cleanLesson_(l);
  o.id = idx >= 0 ? lessons[idx].id : (l.id || uid_('L'));
  var now = new Date();
  if (idx >= 0 && String(lessons[idx].updatedAt || '') >= now.toISOString()) now = new Date(Date.parse(lessons[idx].updatedAt) + 1);
  o.updatedAt = now.toISOString(); // 保證每次存檔的時間都不一樣，衝突偵測才不會漏
  o.updatedBy = me.name;
  if (idx >= 0) lessons[idx] = o; else lessons.push(o);
  write_('lessons', lessons);
  rebuildScores_(lessons);
  return { ok: true, lesson: o };
}

/** 一次排好多堂（只建新的空白課堂） */
function lessonCreateMany_(req, me) {
  var list = req.lessons || [];
  if (!list.length || list.length > 40) throw err_('一次最多排 40 堂');
  var siteIds = {};
  read_('sites').forEach(function (s) { siteIds[s.id] = 1; });
  var lessons = read_('lessons');
  var now = new Date().toISOString();
  var made = list.map(function (l) {
    if (!siteIds[l.siteId]) throw err_('找不到這個據點');
    if (!canSite_(me, l.siteId)) throw err_('你沒有這個據點的權限', 'perm');
    var o = cleanLesson_(l);
    o.id = uid_('L');
    o.updatedAt = now;
    o.updatedBy = me.name;
    return o;
  });
  write_('lessons', lessons.concat(made));
  return { ok: true, lessons: made };
}

function lessonDelete_(req, me) {
  var lessons = read_('lessons');
  var l = lessons.filter(function (x) { return x.id === req.id; })[0];
  if (!l) throw err_('找不到這堂課');
  if (!canSite_(me, l.siteId)) throw err_('你沒有這個據點的權限', 'perm');
  lessons = lessons.filter(function (x) { return x.id !== req.id; });
  write_('lessons', lessons);
  write_('comments', read_('comments').filter(function (c) { return c.lessonId !== req.id; }));
  rebuildScores_(lessons);
  return { ok: true };
}

function mergeInLesson_(l, from, to) {
  var uniq = function (a) { var s = {}; return a.filter(function (x) { if (s[x]) return false; s[x] = 1; return true; }); };
  l.attendance = uniq((l.attendance || []).map(function (x) { return x === from ? to : x; }));
  (l.groups || []).forEach(function (g) { g.members = uniq((g.members || []).map(function (x) { return x === from ? to : x; })); });
  var rows = (l.radar && l.radar.rows) || [];
  var hasTo = rows.some(function (r) { return r.sid === to; });
  if (hasTo) {
    var f = rows.filter(function (r) { return r.sid === from; })[0];
    var t = rows.filter(function (r) { return r.sid === to; })[0];
    if (f) {
      Object.keys(f.scores || {}).forEach(function (d) { if (t.scores[d] == null) t.scores[d] = f.scores[d]; });
      if (f.comment && t.comment.indexOf(f.comment) < 0) t.comment = (t.comment ? t.comment + '\n' : '') + f.comment;
    }
    l.radar.rows = rows.filter(function (r) { return r.sid !== from; });
  } else rows.forEach(function (r) { if (r.sid === from) r.sid = to; });
}

/* ───────── 試算表存取 ───────── */
function ss_() { return SHEET_ID ? SpreadsheetApp.openById(SHEET_ID) : SpreadsheetApp.getActiveSpreadsheet(); }
function props_() { return PropertiesService.getScriptProperties(); }

function sheet_(key) {
  var t = TABLES[key];
  var ss = ss_();
  var sh = ss.getSheetByName(t.sheet);
  if (!sh) {
    sh = ss.insertSheet(t.sheet);
    var head = [t.cols.map(function (c) { return c[1]; })];
    sh.getRange(1, 1, 1, t.cols.length).setValues(head);
    sh.setFrozenRows(1);
  }
  return sh;
}

function read_(key) {
  var t = TABLES[key];
  var values = sheet_(key).getDataRange().getValues();
  if (values.length < 1) return [];
  var head = values[0].map(function (h) { return String(h).trim(); });
  var pos = t.cols.map(function (c) { return head.indexOf(c[1]); });
  var out = [];
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    if (row.every(function (v) { return v === '' || v == null; })) continue;
    var o = {};
    t.cols.forEach(function (c, i) {
      var v = pos[i] >= 0 ? row[pos[i]] : '';
      if (v instanceof Date) v = dateStr_(v);
      else if (v == null) v = '';
      else v = String(v);
      if (t.json && c[0] in t.json) {
        try { v = v ? JSON.parse(v) : JSON.parse(JSON.stringify(t.json[c[0]])); } catch (x) { v = JSON.parse(JSON.stringify(t.json[c[0]])); }
      }
      o[c[0]] = v;
    });
    if (key === 'people') o.email = String(o.email).trim().toLowerCase();
    out.push(o);
  }
  return out;
}

function write_(key, rows) {
  var t = TABLES[key];
  var sh = sheet_(key);
  var data = [t.cols.map(function (c) { return c[1]; })];
  rows.forEach(function (o) {
    data.push(t.cols.map(function (c) {
      var v = o[c[0]];
      if (t.json && c[0] in t.json) v = JSON.stringify(v == null ? t.json[c[0]] : v);
      if (v == null) v = '';
      if (typeof v === 'number' && key === 'scores') return v;
      v = String(v);
      if (v.length > 49000) throw err_('「' + c[1] + '」內容太長（試算表一格最多約 5 萬字）');
      if (/^[=+\-@]/.test(v)) v = "'" + v;
      return v;
    }));
  });
  sh.clearContents();
  var range = sh.getRange(1, 1, data.length, t.cols.length);
  range.setNumberFormat('@');
  range.setValues(data);
}

/* ───────── 小工具 ───────── */
function err_(msg, code) { var e = new Error(msg); e.code = code || 'error'; return e; }
function uid_(p) { return p + Utilities.getUuid().replace(/-/g, '').slice(0, 10); }
function esc_(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pad_(n) { return (n < 10 ? '0' : '') + n; }
function dateStr_(d) {
  if (d.getHours() || d.getMinutes() || d.getSeconds()) return d.toISOString();
  return d.getFullYear() + '-' + pad_(d.getMonth() + 1) + '-' + pad_(d.getDate());
}
function today_() { return dateStr_(new Date(new Date().setHours(0, 0, 0, 0))); }
function normDate_(s) {
  s = String(s || '').trim();
  var m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  return m ? m[1] + '-' + pad_(+m[2]) + '-' + pad_(+m[3]) : '';
}
/** 民國學年：8 月～隔年 1 月是第 1 學期，2～7 月是第 2 學期 */
function termOf_(ymd) {
  var m = String(ymd).match(/^(\d{4})-(\d{2})/);
  if (!m) return '';
  var y = +m[1], mo = +m[2];
  if (mo >= 8) return (y - 1911) + '-1';
  if (mo === 1) return (y - 1912) + '-1';
  return (y - 1912) + '-2';
}

  const step = Math.ceil(n / 12);
  labels.forEach((lb, i) => { if (i % step === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(lb)}</text>`; });
  series.forEach((s) => {
    let d = "", pen = false;
    s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(i)},${y(v)}`; pen = true; });
    g += `<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:${s.bold ? 3 : 1.8};stroke-linejoin:round;${s.bold ? "" : "opacity:.85"}"/>`;
    s.values.forEach((v, i) => { if (v != null) g += `<circle cx="${x(i)}" cy="${y(v)}" r="${s.bold ? 3.5 : 2.5}" style="fill:${s.color}"><title>${esc(s.label)}・${esc(labels[i])}：${v}</title></circle>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="分數趨勢圖" style="width:100%;height:auto;display:block">${g}</svg>`;
}
function sparkSVG(values) {
  const v = values.filter((x) => x != null);
  if (v.length < 2) return '<span class="muted small">–</span>';
  const W = 90, H = 24, lo = 1, hi = 5;
  const pts = v.map((x, i) => `${(i * W) / (v.length - 1)},${H - 2 - ((x - lo) * (H - 4)) / (hi - lo)}`);
  return `<svg viewBox="-2 -2 ${W + 4} ${H + 4}" width="${W}" height="${H}" aria-hidden="true"><polyline points="${pts.join(" ")}" style="fill:none;stroke:var(--s1);stroke-width:1.8"/></svg>`;
}

    if (v === "save") { if (!(await saveLesson())) return; }
    if (v === "save" || v === "leave") { E.dirty = false; location.hash = target; }
    return;
  }

  route();
});
window.addEventListener("beforeunload", (e) => { if (E && E.dirty) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("focus", async () => {

function route() {

}

function similar(a, b) {
  if (a === b || a.length !== b.length || a.length < 2) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) diff++;
  return diff === 1 && a[0] === b[0];
}

/* 從 Excel 匯入人員：欄位要有 Email，姓名、角色、據點可有可無 */
function importPeople() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".xlsx,.xls,.csv";
  inp.onchange = async () => {
    const f = inp.files[0];
    if (!f) return;
    let rows = [], hasSites = false;
    try {
      const XLSX = await loadXLSX();
      const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
      wb.SheetNames.forEach((n) => {
        const a = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: "" });
        const hi = a.findIndex((r) => r.some((c) => /e-?mail|信箱/i.test(String(c))));
        if (hi < 0) return;
        const head = a[hi].map((c) => String(c).trim());
        const ci = (re) => head.findIndex((c) => re.test(c));
        const cE = ci(/e-?mail|信箱/i), cN = ci(/姓名|名字/), cR = ci(/角色|身分|職稱/), cS = ci(/據點/);
        if (cS >= 0) hasSites = true;
        a.slice(hi + 1).forEach((r) => {
          const email = String(r[cE] || "").trim().toLowerCase();
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || rows.some((x) => x.email === email)) return;
          const rr = String(cR >= 0 ? r[cR] : "").trim();
          const role = /督導/.test(rr) ? "督導" : /社工/.test(rr) ? "社工" : "老師";
          rows.push({ email, name: String(cN >= 0 ? r[cN] : "").trim() || email, role, sites: cS >= 0 ? String(r[cS] || "").trim() : null });
        });
      });
    } catch (e) { return toast("讀不到這個檔案：" + e.message, true); }
    if (!rows.length) return toast("檔案裡找不到 Email 欄位或有效的 Email", true);
    const people = D().people || [];
    const exist = (e) => people.find((p) => String(p.email).toLowerCase() === e);
    const v = await modal({
      title: `匯入 ${rows.length} 位人員`, wide: true,
      body: `<p class="small ink2" style="margin-top:0">已經在名單上的人會更新姓名和角色；「課輔老師」會當成「老師」。${hasSites ? "" : "檔案沒有據點欄，新增的人預設看得到全部據點。"}</p>
        <table class="tbl"><thead><tr><th>姓名</th><th>Email</th><th>角色</th><th></th></tr></thead><tbody>
        ${rows.map((r) => `<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.email)}</td><td><span class="chip ${r.role !== "老師" ? "brand" : ""}">${esc(r.role)}</span></td><td>${exist(r.email) ? '<span class="chip">更新</span>' : '<span class="chip good">新增</span>'}</td></tr>`).join("")}
        </tbody></table>`,
      buttons: [{ label: "取消", value: null }, { label: "匯入", value: "ok", cls: "primary" }]
    });
    if (v !== "ok") return;
    const fails = [];
    for (const r of rows) {
      const old = exist(r.email);
      const isMe = r.email === S.me.email;
      const person = { origEmail: old ? old.email : "", email: r.email, name: r.name, role: isMe ? S.me.role : r.role,
        sites: r.sites != null ? r.sites : (old ? old.sites : ""), active: old ? !/^(false|否|0|停用|no)$/i.test(String(old.active)) : true, note: old && !/執行 setup/.test(old.note) ? old.note : "" };
      try { await api("person.save", { person }); } catch (e) { fails.push(`${r.name}：${e.message}`); }
    }
    await reload();
    route();
    if (fails.length) modal({ title: "有幾位沒有匯入成功", body: `<div class="small prewrap">${esc(fails.join("\n"))}</div>` });
    else toast(`已匯入 ${rows.length} 位人員，他們現在可以用自己的 Email 登入了`);
  };
  inp.click();
}

/* ═════════════ Excel 匯入（舊紀錄） ═════════════ */
let xlsxP = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return (xlsxP = xlsxP || new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = XLSX_URL;
    s.onload = () => res(window.XLSX);
    s.onerror = () => { xlsxP = null; rej(new Error("Excel 工具載入失敗，請檢查網路後再試一次")); };
    document.head.appendChild(s);
  }));
}
const NAME_RE = /^[一-鿿]{2,4}$/;
const SCORE_RE = /^([^\d：:➡→（(]{1,10}?)\s*[：:]?\s*(\d(?:\.\d+)?)\s*分?$/;
function parseRadarText(text) {
  const out = { dims: [], rows: [], note: "" };
  const notes = [];
  const lines = String(text || "").split(/\r?\n/).map((s) => s.replace(/[　\t]/g, " ").trim());
  const next = (i) => { for (let j = i + 1; j < lines.length; j++) if (lines[j]) return lines[j]; return ""; };
  let cur = null;
  for (let i = 0; i < lines.length; i++) {
    const s = lines[i];
    if (!s) continue;
    const m = s.match(SCORE_RE);
    if (m && cur && !cur.done && +m[2] <= 10) {
      const d = m[1].trim();
      cur.scores[d] = +m[2];
      if (!out.dims.includes(d)) out.dims.push(d);
      continue;
    }
    if (NAME_RE.test(s) && SCORE_RE.test(next(i))) { cur = { name: s, scores: {}, comment: "", done: false }; out.rows.push(cur); continue; }
    if (cur && !cur.done && (/^[➡→]/.test(s) || /^[（(]/.test(s) || Object.keys(cur.scores).length)) {
      cur.comment = s.replace(/^[➡→]\s*/, "").replace(/^[（(]/, "").replace(/[）)]$/, "").trim();
      cur.done = true;
      continue;
    }
    notes.push(s);
  }
  out.note = notes.join("\n");
  out.rows.forEach((r) => delete r.done);
  return out;
}
function parseGroupText(text) {
  const groups = [];
  String(text || "").split(/\r?\n/).forEach((line) => {
    const m = line.trim().match(/^(第[一二三四五六七八九十\d]+組|[A-Za-zＡ-Ｚ]組)\s*(?:[（(][^）)]*[）)])?\s*[-－—：:]\s*(.*)$/);
    if (!m) return;
    const names = m[2].split(/[、,，\s]+/).map((t) => t.trim()).filter((t) => NAME_RE.test(t));
    if (names.length) groups.push({ name: m[1], names });
  });
  return groups;
}
function parseLessonSheet(XLSX, name, ws) {
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
  const hi = rows.findIndex((r) => r.some((c) => String(c).includes("日期")) && r.some((c) => String(c).includes("課程主題")));
  if (hi < 0) return null;
  const head = rows[hi].map((c) => String(c).replace(/\s/g, ""));
  const col = (...keys) => { for (const k of keys) { const i = head.findIndex((c) => c.includes(k)); if (i >= 0) return i; } return -1; };
  const C = { seq: col("序號"), date: col("日期"), topic: col("課程主題"), goals: col("教學原理", "目標設定"), timeline: col("課程時間"), execution: col("執行紀錄"), indicators: col("評量指標"), groupNote: col("能力分類", "分組"), qualitative: col("質性觀察"), radar: col("雷達"), management: col("班級經營"), slides: col("簡報") };
  if (C.seq < 0) C.seq = 0;
  const tm = name.match(/(\d{3})\s*-\s*([12])/);
  const sm = name.match(/[-－]\s*([^-－]+?)\s*$/);
  const sheet = { name, term: tm ? `${tm[1]}-${tm[2]}` : "", site: sm ? sm[1].replace(/課堂紀錄/, "").trim() : name.trim(), lessons: [], names: new Set(), warnings: [] };
  const get = (row, k) => (C[k] >= 0 ? row[C[k]] : "");
  const txt = (v) => String(v ?? "").replace(/\r\n/g, "\n").trim();
  const seen = {};
  for (let r = hi + 1; r < rows.length; r++) {
    const row = rows[r];
    const seqCell = txt(get(row, "seq"));
    if (/範例/.test(seqCell)) continue;
    const sn = seqCell.match(/(\d+)/);
    if (!sn) continue;
    const L = { seq: sn[1], date: "", status: "", topic: txt(get(row, "topic")) };
    const dv = get(row, "date");
    if (typeof dv === "number" && dv > 20000) { const p = XLSX.SSF.parse_date_code(dv); L.date = `${p.y}-${pad(p.m)}-${pad(p.d)}`; }
    else if (dv instanceof Date) L.date = ymd(dv);
    else if (txt(dv)) {
      const m = txt(dv).match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
      if (m) L.date = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
      else { if (!L.topic) L.topic = txt(dv); if (/颱風|停課|放假|取消|停班/.test(txt(dv))) L.status = "停課"; }
    }
    if (/代課/.test(L.topic)) L.status = "代課";
    ["goals", "timeline", "execution", "indicators", "groupNote", "qualitative", "management"].forEach((k) => (L[k] = txt(get(row, k))));
    const sl = txt(get(row, "slides"));
    L.slides = /^https?:\/\//i.test(sl) ? sl : "";
    if (sl && !L.slides) L.management = (L.management ? L.management + "\n" : "") + "（簡報：" + sl + "）";
    const rad = parseRadarText(get(row, "radar"));
    L.radarParsed = rad;
    L.radarNote = rad.note;
    if (txt(get(row, "radar")) && !rad.rows.length) L.radarNote = txt(get(row, "radar"));
    L.groupsParsed = parseGroupText(L.groupNote);
    const names = new Set([...rad.rows.map((x) => x.name), ...L.groupsParsed.flatMap((g) => g.names)]);
    L.names = [...names];
    L.names.forEach((n) => sheet.names.add(n));
    const key = L.seq;
    if (seen[key]) sheet.warnings.push(`「第${L.seq}次」出現兩次（${fmtDate(seen[key])}、${fmtDate(L.date)}），匯入後可以在課堂裡改序號`);
    seen[key] = L.date || "?";
    sheet.lessons.push(L);
  }
  const ds = sheet.lessons.map((l) => l.date).filter(Boolean).sort();
  sheet.dateTerm = ds.length ? termOf(ds[0]) : "";
  if (!sheet.term) sheet.term = sheet.dateTerm;
  sheet.names = [...sheet.names];
  return sheet;
}

  setTop("匯入 Excel", "把以前的「機器人課程列表與紀錄」Excel 匯進系統");
  const c = $("#content");

      renderImportPreview(sheets);

  };
}
function renderImportPreview(sheets) {
  const pv = $("#imp-preview");
  const siteNames = () => [...new Set([...D().sites.map((s) => s.name), ...sheets.map((s) => s.site)])];
  // 每個據點所有的名字（含名冊上已有的），找出只差一個字的
  const bySite = {};
  sheets.forEach((s) => { (bySite[s.site] = bySite[s.site] || new Set()); s.names.forEach((n) => bySite[s.site].add(n)); });
  const pairs = [];
  Object.entries(bySite).forEach(([site, set]) => {
    const exist = D().students.filter((x) => siteById(x.siteId)?.name === site).map((x) => x.name);
    const all = [...new Set([...set, ...exist])];
    const freq = (n) => sheets.filter((s) => s.site === site).reduce((a, s) => a + s.lessons.filter((l) => l.names.includes(n)).length, 0);
    all.forEach((a, i) => all.slice(i + 1).forEach((b) => { if (similar(a, b)) { const [keep, drop] = freq(a) >= freq(b) ? [a, b] : [b, a]; pairs.push({ site, keep, drop, fk: freq(keep), fd: freq(drop) }); } }));
  });
  pv.innerHTML = `<div class="section-title" style="margin-top:4px">找到 ${sheets.length} 張工作表</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>匯入</th><th>工作表</th><th>據點</th><th>學期</th><th class="num">堂數</th><th class="num">有紀錄</th><th>孩子</th></tr></thead><tbody>
    ${sheets.map((s, i) => `<tr><td class="c"><input type="checkbox" data-inc="${i}" checked></td><td>${esc(s.name)}</td>
      <td><input class="input sm" data-site="${i}" value="${esc(s.site)}" list="site-list" style="width:90px"></td>
      <td><input class="input sm" data-term="${i}" value="${esc(s.term)}" style="width:72px">${s.dateTerm && s.dateTerm !== s.term ? `<div class="small" style="color:var(--warn);max-width:200px">日期在 ${esc(s.lessons.find((l) => l.date)?.date.slice(0, 7))}，照學年算是 <b>${esc(s.dateTerm)}</b> <button class="btn sm" data-useterm="${i}">改成 ${esc(s.dateTerm)}</button></div>` : ""}</td>
      <td class="num">${s.lessons.length}</td><td class="num">${s.lessons.filter((l) => l.execution || l.radarParsed.rows.length).length}</td>
      <td class="small">${s.names.map(esc).join("、") || "–"}${s.warnings.map((w) => `<div style="color:var(--warn)">${icon("alert", "sm")} ${esc(w)}</div>`).join("")}</td></tr>`).join("")}
    </tbody></table></div>
    <datalist id="site-list">${siteNames().map((n) => `<option value="${esc(n)}">`).join("")}</datalist>
    ${pairs.length ? `<div class="callout warn mt12"><b>這些名字只差一個字，是同一個孩子嗎？</b><div class="small ink2">勾起來的會當成同一人（用比較常出現的寫法）；兄弟姊妹名字很像的話，就不要勾。之後也可以在「名冊與分組」再合併。</div>
      <div class="stack mt8" style="gap:4px">${pairs.map((p, i) => `<label class="row small"><input type="checkbox" data-pair="${i}">${esc(p.site)}：把「${esc(p.drop)}」（${p.fd} 堂）當成「<b>${esc(p.keep)}</b>」（${p.fk} 堂）</label>`).join("")}</div></div>` : ""}
    <div class="row wrap mt12"><label class="field"><span>如果系統裡已經有同一個據點、同一學期、同一次的課堂</span><select class="select" id="imp-dup" style="width:auto"><option value="skip">保留系統裡的，略過 Excel 的</option><option value="over">用 Excel 的覆蓋</option></select></label></div>
    <div class="row mt16"><span class="sp"></span><button class="btn primary lg" id="imp-go">${icon("upload", "sm")}開始匯入</button></div>`;
  $$("[data-useterm]", pv).forEach((b) => (b.onclick = () => { const i = +b.dataset.useterm; $(`[data-term="${i}"]`, pv).value = sheets[i].dateTerm; b.parentElement.innerHTML = `已改成 ${esc(sheets[i].dateTerm)}`; }));
  $("#imp-go").onclick = () => doImport(sheets, pairs);
}
async function doImport(sheets, pairs) {
  const pv = $("#imp-preview");
  const alias = {};
  $$("[data-pair]", pv).forEach((cb) => { if (cb.checked) { const p = pairs[+cb.dataset.pair]; alias[p.site + "|" + p.drop] = p.keep; } });
  const dup = $("#imp-dup").value;
  const out = { sites: [], students: [], lessons: [], terms: [] };
  const siteId = {};
  D().sites.forEach((s) => (siteId[s.name] = s.id));
  const stuId = {};
  D().students.forEach((s) => (stuId[s.siteId + "|" + s.name] = s.id));
  let skipped = 0;
  sheets.forEach((s, i) => {
    if (!$(`[data-inc="${i}"]`, pv).checked) return;
    const siteName = $(`[data-site="${i}"]`, pv).value.trim() || s.site;
    const term = $(`[data-term="${i}"]`, pv).value.trim() || s.term;
    if (!siteId[siteName]) { siteId[siteName] = uid("S"); out.sites.push({ id: siteId[siteName], name: siteName, order: String(D().sites.length + out.sites.length + 1) }); }
    const sid = siteId[siteName];
    if (term && !out.terms.includes(term)) out.terms.push(term);
    const kid = (name) => {
      const real = alias[s.site + "|" + name] || name;
      const k = sid + "|" + real;
      if (!stuId[k]) { stuId[k] = uid("K"); out.students.push({ id: stuId[k], name: real, siteId: sid }); }
      return stuId[k];
    };
    s.lessons.forEach((L) => {
      const exist = D().lessons.find((x) => x.siteId === sid && x.term === term && x.seq === L.seq && (x.date || "") === (L.date || ""));
      if (exist && dup === "skip") { skipped++; return; }
      const radar = { dims: L.radarParsed.dims, rows: [] };
      L.radarParsed.rows.forEach((r) => { const id = kid(r.name); const ex = radar.rows.find((x) => x.sid === id); if (ex) { Object.assign(ex.scores, r.scores); ex.comment = [ex.comment, r.comment].filter(Boolean).join("\n"); } else radar.rows.push({ sid: id, scores: r.scores, comment: r.comment }); });
      const groups = L.groupsParsed.map((g) => ({ name: g.name, members: [...new Set(g.names.map(kid))], note: "" }));
      const attendance = [...new Set(L.names.map(kid))];
      out.lessons.push({ id: exist ? exist.id : uid("L"), siteId: sid, term, seq: L.seq, date: L.date, status: L.status, topic: L.topic, goals: L.goals, timeline: L.timeline, execution: L.execution, indicators: L.indicators, groups, groupNote: L.groupNote, qualitative: L.qualitative, radar, radarNote: L.radarNote, management: L.management, slides: L.slides, attendance });
    });
  });
  if (!out.lessons.length && !out.students.length) return toast(skipped ? `全部 ${skipped} 堂都已經在系統裡了，沒有新的可以匯入` : "沒有勾選要匯入的工作表", true);
  const b = $("#imp-go"); b.disabled = true; b.textContent = "匯入中…";
  try {
    const r = await api("import", out);
    await reload();
    pv.innerHTML = `<div class="callout good"><b>${icon("check", "sm")} 匯入完成</b>：${r.count.lessons} 堂課、${out.students.length} 位新學生${out.sites.length ? `、${out.sites.length} 個新據點` : ""}${skipped ? `；略過 ${skipped} 堂已經存在的課` : ""}。</div>
      <div class="row wrap mt12">${[...new Set(out.lessons.map((l) => l.siteId))].map((id) => `<a class="btn" href="#/site/${id}">看 ${esc(siteById(id)?.name || "")} 的課堂</a>`).join("")}<a class="btn" href="#/roster">檢查名冊</a><a class="btn" href="#/people">設定老師帳號</a></div>`;
    renderNav();
  } catch (e) { toast(e.message, true); b.disabled = false; b.innerHTML = icon("upload", "sm") + "開始匯入"; }
}

/* ═════════════ Excel 匯出 ═════════════ */
function radarText(l) {
  const parts = l.radar.rows.map((r) => [stuName(r.sid), ...l.radar.dims.filter((d) => r.scores[d] != null).map((d) => `${d}${r.scores[d]}`), ...Object.keys(r.scores).filter((d) => !l.radar.dims.includes(d)).map((d) => `${d}${r.scores[d]}`), r.comment ? "➡ " + r.comment : ""].filter(Boolean).join("\n"));
  if (l.radarNote) parts.push(l.radarNote);
  return parts.join("\n\n");
}
function groupText(l) {
  const gt = l.groups.map((g) => `${g.name}：${g.members.map(stuName).join("、")}`).join("\n");
  if (!l.groupNote) return gt;
  if (!gt || l.groups.every((g) => g.members.every((m) => l.groupNote.includes(stuName(m))))) return l.groupNote;
  return gt + "\n" + l.groupNote;
}
function viewExport() {
  setTop("匯出 Excel", "下載成跟原本一樣格式的 Excel，給成果報告或總會使用");
  const c = $("#content");
  const ts = terms();
  c.innerHTML = `<div class="card"><div class="card-body stack" style="padding-top:18px">
    <div class="grid g2"><label class="field"><span>學期</span><select class="select" id="ex-term">${ts.map((t) => `<option ${t === S.term ? "selected" : ""}>${esc(t)}</option>`).join("")}<option value="*" ${S.term === "*" ? "selected" : ""}>全部學期</option></select></label>
    <div class="field"><span style="font-weight:600;font-size:12.5px;color:var(--ink-2)">據點</span><div class="row wrap" style="min-height:34px">${activeSites().map((s) => `<label class="row small" style="gap:4px;margin-right:10px"><input type="checkbox" class="ex-site" value="${s.id}" checked>${esc(s.name)}</label>`).join("")}</div></div></div>
    <div class="callout small">會產生：每個據點一張「課堂紀錄」工作表（欄位和原本的 Excel 一樣，多了「狀態」和「社工回饋」）、一張「雷達分數」長表（一個孩子一個維度一列，方便做樞紐分析或圖表），以及「學生名冊」。</div>
    <div><button class="btn primary lg" id="ex-go">${icon("download", "sm")}下載 Excel</button></div></div></div>`;
  $("#ex-go").onclick = async () => {
    const b = $("#ex-go"); b.disabled = true;
    try {
      const XLSX = await loadXLSX();
      const term = $("#ex-term").value;
      const sids = $$(".ex-site").filter((x) => x.checked).map((x) => x.value);
      const wb = buildExport(XLSX, term, sids);
      if (!wb.SheetNames.length) { toast("這個學期還沒有資料", true); return; }
      const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      const url = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
      const a = document.createElement("a");
      a.href = url; a.download = `機器人課程紀錄_${term === "*" ? "全部學期" : term}_${today()}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("已下載");
    } catch (e) { toast(e.message, true); } finally { b.disabled = false; }
  };
}
function buildExport(XLSX, term, sids) {
  const wb = XLSX.utils.book_new();
  const used = new Set();
  const sheetName = (n) => { let s = n.replace(/[\\/?*[\]:]/g, "").slice(0, 31); let k = 2; while (used.has(s)) s = n.slice(0, 28) + "_" + k++; used.add(s); return s; };
  const head = ["序號", "日期", "課程主題", "【教學原理／目標設定】", "【課程時間】", "【課堂執行紀錄】", "【評量指標】", "【能力分類】", "【質性觀察】", "【雷達分析】", "【班級經營】", "簡報播放版", "狀態", "社工回饋"];
  const long = [["據點", "學期", "序號", "日期", "課程主題", "學生", "維度", "分數", "評語"]];
  sids.forEach((sid) => {
    const site = siteById(sid);
    const byTerm = {};
    termLessons(sid, term).forEach((l) => (byTerm[l.term] = byTerm[l.term] || []).push(l));
    Object.keys(byTerm).sort().forEach((t) => {
      const aoa = [head];
      byTerm[t].forEach((l) => {
        aoa.push([`第${l.seq}次`, l.date, l.topic, l.goals, l.timeline, l.execution, l.indicators, groupText(l), l.qualitative, radarText(l), l.management, l.slides, l.status || (hasRecord(l) ? "已上課" : ""),
          lessonComments(l.id).map((c) => `${c.name}（${fmtTime(c.at)}）：${c.text}`).join("\n")]);
        l.radar.rows.forEach((r) => {
          const ds = Object.keys(r.scores);
          (ds.length ? ds : [""]).forEach((d, i) => long.push([site.name, l.term, +l.seq || l.seq, l.date, l.topic, stuName(r.sid), d, d ? r.scores[d] : "", i === 0 ? r.comment : ""]));
        });
      });
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = [8, 11, 20, 34, 30, 50, 22, 28, 40, 44, 34, 24, 8, 34].map((w) => ({ wch: w }));
      XLSX.utils.book_append_sheet(wb, ws, sheetName(`${t} 課堂紀錄-${site.name}`));
    });
  });
  if (!wb.SheetNames.length) return wb;
  const ws2 = XLSX.utils.aoa_to_sheet(long);
  ws2["!cols"] = [8, 8, 6, 11, 22, 10, 12, 6, 60].map((w) => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws2, "雷達分數");
  const roster = [["據點", "姓名", "年級", "狀態", "備註"], ...D().students.filter((s) => sids.includes(s.siteId)).map((s) => [siteById(s.siteId)?.name || "", s.name, s.grade, s.status, s.note])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(roster), "學生名冊");
  return wb;
}
