<!doctype html>

<html lang="zh-Hant"><head><meta name="yonglin-edition" content="2026-10-29-v1.0"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>希望數學群島｜第10島完整故事版</title>

<meta name="claude:viewport-fit-sides" content="cover">







<style>

/* 版面：首頁＝第10島公園地圖＋場所清單＋花瓣留言牆；場所頁＝紙張卡片：插畫裁切 → 路線 → 對話 → 任務（教具＋作答）→ 老師備課 */

:root{

  --bg:#f3f1e6; --paper:#fdf8ee; --soft:#eceedd; --ink:#24483a; --muted:#6b6d5c;

  --accent:#a9563b; --line:#d9dcc4; --good:#2f6b45;

  --rail:#7b5b45; --tie:#b89a7b;

  --sky-night:#33476b; --sky-dawn:#f2c7a5; --sky-day:#cfe6ea; --sky-dusk:#efb48d;

  --ticket:#f7e7c4; --ticket-ink:#4a3b2b;

  --face:#fffdf6; --engine:#c4513a; --car:#3f7d63; --on-ink:#fdf8ee;

  --water:#8cc6dc; --juice-a:#f2a33a; --juice-b:#e9d36b; --cake:#efd3a0; --cake-top:#f1a8b4; --berry:#d8434f;

  --pick:#a9563b; --pick-2:#3f7d63; --wood:#d7b07c; --wood-dark:#9b7149;

  --bill-1000:#9fbfe2; --bill-100:#e9a29b; --coin:#d5d9dc; --coin-gold:#e3c25c;

  --font-ui:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;

  --font-hand:"Iansui","LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;

}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --bg:#141d18; --paper:#1d2a23; --soft:#27372e; --ink:#e7eee4; --muted:#a9b5a6;

  --accent:#e08a6c; --line:#3a4d41; --good:#8fd0a3;

  --rail:#b9927a; --tie:#6d5a48;

  --sky-night:#0f1a30; --sky-dawn:#6b4f45; --sky-day:#2e4a52; --sky-dusk:#6a4636;

  --ticket:#3b3424; --ticket-ink:#f1e2c4;

  --face:#26342c; --engine:#d8664d; --car:#5aa184; --on-ink:#1d2a23;

  --water:#4f8fa8; --juice-a:#d48a2c; --juice-b:#bfa94a; --cake:#a88d5f; --cake-top:#b76f7c; --berry:#e2606a;

  --pick:#e08a6c; --pick-2:#5aa184; --wood:#8b6a45; --wood-dark:#c49a6c;

  --bill-1000:#5f80a6; --bill-100:#a8625b; --coin:#8d969b; --coin-gold:#b8973b;

  color-scheme:dark;

}}

:root[data-theme="dark"]{

  --bg:#141d18; --paper:#1d2a23; --soft:#27372e; --ink:#e7eee4; --muted:#a9b5a6;

  --accent:#e08a6c; --line:#3a4d41; --good:#8fd0a3;

  --rail:#b9927a; --tie:#6d5a48;

  --sky-night:#0f1a30; --sky-dawn:#6b4f45; --sky-day:#2e4a52; --sky-dusk:#6a4636;

  --ticket:#3b3424; --ticket-ink:#f1e2c4;

  --face:#26342c; --engine:#d8664d; --car:#5aa184; --on-ink:#1d2a23;

  --water:#4f8fa8; --juice-a:#d48a2c; --juice-b:#bfa94a; --cake:#a88d5f; --cake-top:#b76f7c; --berry:#e2606a;

  --pick:#e08a6c; --pick-2:#5aa184; --wood:#8b6a45; --wood-dark:#c49a6c;

  --bill-1000:#5f80a6; --bill-100:#a8625b; --coin:#8d969b; --coin-gold:#b8973b;

  color-scheme:dark;

}

[hidden]{display:none!important}

body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.7;

  padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

button,input,textarea{font:inherit;color:inherit}

button{cursor:pointer}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.card{max-width:780px;margin:0 auto;background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 1px 0 var(--line)}

.body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}

@media (max-width:520px){.body{padding:16px}}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

.head>div:first-child{min-width:0;flex:1 1 260px}

.head-btns{display:flex;gap:8px;flex-wrap:wrap}

.kicker{color:var(--accent);font-size:12px;letter-spacing:1px;margin:0}

h1{font-size:26px;font-weight:500;margin:2px 0 0;text-wrap:balance;line-height:1.35}

h2{font-size:19px;font-weight:500;margin:0;text-wrap:balance}

.sub{margin:4px 0 0;color:var(--muted);font-size:14px}

.btn{min-height:44px;padding:8px 16px;border:1px solid var(--ink);background:transparent;border-radius:22px;font-size:14px;display:inline-flex;align-items:center;gap:6px}

.btn.primary{background:var(--ink);color:var(--on-ink)}

.btn.icon{padding:8px 12px}

.btn svg{width:18px;height:18px}

.btn:disabled{opacity:.45;cursor:default}

.small{font-size:12px;color:var(--muted)}



/* 首頁地圖 */

.map{position:relative;aspect-ratio:3/2;max-width:100%;overflow:hidden;background:var(--soft)}

.map img{display:block;width:100%;height:100%;object-fit:cover}

.map-title{position:absolute;left:14px;top:12px;background:color-mix(in srgb,var(--paper) 88%,transparent);border-radius:12px;padding:4px 12px}

.map-title b{display:block;font-size:clamp(16px,3.4vw,24px);font-weight:600;letter-spacing:2px}

.map-title span{font-size:12px;color:var(--muted)}

.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;padding:4px 10px 4px 5px;border:2px solid var(--ink);border-radius:20px;background:var(--paper);font-size:12px;line-height:1.3;white-space:nowrap;box-shadow:0 2px 0 var(--ink)}

.pin i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:11px}

.pin.done i{background:var(--good)}

.pin:hover{transform:translate(-50%,-50%) scale(1.06)}

@media (max-width:520px){.pin{font-size:10px;padding:2px 7px 2px 3px}.pin i{width:16px;height:16px;font-size:10px}.pin .pin-name{max-width:5em;overflow:hidden;text-overflow:ellipsis}}

.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}

.place{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;text-align:left;background:var(--soft);border:0;border-radius:14px;padding:10px 12px}

.place .t{min-width:0}

.place b{display:block;font-weight:500}

.place span{font-size:12px;color:var(--muted)}

.stamp{font-family:var(--font-hand);color:var(--accent);border:2px solid var(--accent);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;font-size:13px;transform:rotate(-12deg);opacity:.85}

.place .day{font-size:12px;color:var(--muted)}



/* 場所頁 */

.banner{position:relative;height:170px;overflow:hidden;background:var(--soft)}

.banner img{position:absolute;max-width:none;height:auto}

.banner .crumb{position:absolute;left:16px;bottom:10px;right:16px;color:#fff;font-size:13px;text-shadow:0 1px 3px rgb(0 0 0 / .75)}

.route{background:var(--soft);border-radius:14px;padding:10px 12px 8px}

.route svg{display:block;width:100%;height:auto;overflow:visible}

.tick-t{font-size:10px;fill:var(--muted);text-anchor:middle;font-variant-numeric:tabular-nums}

.stop-t{font-size:10px;fill:var(--muted);text-anchor:middle}

.stop-t.cur{fill:var(--ink);font-weight:700}

.rail{stroke:var(--rail);stroke-width:1.6}

.tie{stroke:var(--tie);stroke-width:2}

.stopdot{fill:var(--accent)}

.path-line{stroke:var(--muted);stroke-width:2;stroke-dasharray:3 5;fill:none}

.sd{fill:var(--paper);stroke:var(--ink);stroke-width:2}

.sd.done{fill:var(--ink)}

.sd.cur{fill:var(--accent);stroke:var(--accent)}

.mover{transition:transform 1s ease-in-out}

.engine{fill:var(--engine)}.car{fill:var(--car)}.wheel{fill:var(--ink)}.win{fill:var(--sky-day)}

.now{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px;font-size:14px}

.now b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

.slider{display:flex;flex-direction:column;gap:4px;margin-top:8px}

.slider input{width:100%;accent-color:var(--accent)}

.slider output{font-size:18px;text-align:center;font-variant-numeric:tabular-nums}



.talk{display:flex;flex-direction:column;gap:10px}

.line{display:flex;gap:10px;align-items:flex-start}

.fc{flex:none;width:44px;height:44px;border-radius:50%;background:var(--soft);overflow:hidden}

.fc svg{display:block;width:100%;height:100%}

.say{min-width:0;flex:1;background:var(--soft);border-radius:4px 16px 16px 16px;padding:8px 14px}

.say .who{display:block;font-size:12px;color:var(--muted)}

.say p{margin:0}

.line.kid .say{background:transparent;border:1px solid var(--line)}

.line.me{justify-content:flex-end}

.line.me .say{flex:0 1 auto;background:var(--ink);color:var(--on-ink);border-radius:16px 4px 16px 16px}

.line.fb .say{background:transparent;border:1px dashed var(--accent)}

.line.ok .say{border-color:var(--good)}



.task{display:flex;flex-direction:column;gap:12px}

.demo{background:var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}

.demo:empty{display:none}

.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;width:100%}

.demo svg{max-width:100%;height:auto;display:block}

.cap{font-size:14px;text-align:center;margin:0}

.wbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.wbtn{min-height:40px;padding:6px 14px;border:1px solid var(--ink);background:var(--paper);border-radius:20px;font-size:14px}

.wbtn:disabled{opacity:.4;cursor:default}

.choices{display:flex;flex-wrap:wrap;gap:9px}

.choices button{min-height:44px;padding:7px 14px;background:var(--paper);border:1px solid var(--muted);border-radius:10px;text-align:left;font-size:15px}

.choices button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

.choices button:disabled{cursor:default}

.choices.col{flex-direction:column}

.fields{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

.fields label{display:flex;align-items:center;gap:6px;font-size:15px}

.fields input{width:88px;min-height:46px;border:1px solid var(--muted);border-radius:8px;background:var(--paper);padding:6px 8px;font-size:20px;text-align:center;font-variant-numeric:tabular-nums}

.period{display:flex;gap:6px}

.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

.note{font-family:var(--font-hand);background:var(--ticket);color:var(--ticket-ink);padding:10px 18px;transform:rotate(-1.5deg);font-size:20px;box-shadow:2px 3px 0 var(--line);line-height:1.5}

.note pre{font:inherit;margin:0;text-align:right;font-size:24px;line-height:1.35}

.note hr{border:0;border-top:2px solid currentColor;margin:2px 0;opacity:.7}

.board{border-radius:10px;overflow:hidden;min-width:220px;background:var(--ink);color:var(--on-ink);font-variant-numeric:tabular-nums}

.board div{display:grid;grid-template-columns:1fr auto;gap:16px;padding:6px 14px;border-top:1px solid color-mix(in srgb,var(--on-ink) 25%,transparent)}

.board div:first-child{border-top:0;font-size:12px;opacity:.8}

.board b{font-weight:600;letter-spacing:1px}

.tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.tag{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:20px;font-variant-numeric:tabular-nums;transform:rotate(var(--r,0deg))}

.tag small{display:block;font-size:12px;color:var(--muted)}

.pv{display:grid;grid-template-columns:auto repeat(4,minmax(46px,64px));gap:4px;align-items:center;font-variant-numeric:tabular-nums}

.pv>span{text-align:center;font-size:12px;color:var(--muted)}

.pv>b{text-align:center;background:var(--paper);border-radius:8px;padding:4px 0;font-size:24px;font-weight:500;transition:background .3s}

.pv>b.hl{background:var(--accent);color:var(--on-ink)}

.pv>b.warn{outline:2px dashed var(--accent)}

.pv>em{font-style:normal;font-size:13px;padding-right:6px}

.money{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:460px}

.bill{display:inline-grid;place-items:center;width:46px;height:24px;border-radius:3px;font-size:11px;font-weight:700;color:#2b2622;transition:transform .4s,opacity .4s}

.b1000{background:var(--bill-1000)}.b100{background:var(--bill-100)}

.coin{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--coin);font-size:10px;font-weight:700;color:#2b2622}

.coin.c10{width:28px;height:28px}

.odo{display:flex;gap:4px}

.odo b{display:grid;place-items:center;width:44px;height:56px;border-radius:8px;background:var(--ink);color:var(--on-ink);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;transition:transform .2s}

.odo b.blank{background:var(--paper);color:var(--muted);border:1px dashed var(--muted)}

.odo b.flip{transform:rotateX(90deg)}

.parts{display:grid;gap:6px;width:min(100%,320px)}

.parts button{display:flex;justify-content:space-between;border:1px dashed var(--muted);background:var(--paper);border-radius:8px;padding:6px 12px;font-variant-numeric:tabular-nums}

.parts button.shown{border-style:solid;border-color:var(--ink)}

.slice{cursor:pointer}

.pick,.cakeb.pick,.soft-f.pick{fill:var(--pick)}.pick2,.cakeb.pick2,.soft-f.pick2{fill:var(--pick-2)}

.cakeb{fill:var(--cake);stroke:var(--paper);stroke-width:3}

.cake-top{fill:var(--cake-top)}

.berry{fill:var(--berry)}

.eaten,.cakeb.eaten{fill:transparent;stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.5}

.lbl{font-size:13px;fill:var(--ink);text-anchor:middle}

.lbl-s{font-size:11px;fill:var(--muted);text-anchor:middle}

.ink-s{stroke:var(--ink)}.ink-f{fill:var(--ink)}.acc-s{stroke:var(--accent)}.acc-f{fill:var(--accent)}.good-s{stroke:var(--good)}

.paper-f{fill:var(--paper)}.soft-f{fill:var(--soft)}.water{fill:var(--water)}.juice-a{fill:var(--juice-a)}.juice-b{fill:var(--juice-b)}

.wood-f{fill:var(--wood)}.wood-s{stroke:var(--wood-dark)}

.ribbon{fill:var(--accent);opacity:.75;transition:transform .9s ease-in-out}

.pawn{transition:transform .25s ease-out}

.spin{transition:transform 1s ease-in-out;transform-box:fill-box;transform-origin:center}

.ctrls{display:flex;flex-direction:column;gap:6px;width:min(100%,360px)}

.ctrls label{display:flex;justify-content:space-between;gap:10px;font-size:14px}

.ctrls input[type=range]{width:100%;accent-color:var(--accent)}

.stopwatch{display:flex;flex-direction:column;align-items:center;gap:10px}

.tries{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

.tries span{background:var(--paper);border-radius:12px;padding:2px 10px;font-size:14px;font-variant-numeric:tabular-nums}

textarea{width:100%;min-height:84px;border:1px solid var(--muted);border-radius:10px;background:var(--paper);padding:10px 12px;font-family:var(--font-hand);font-size:20px;resize:vertical}

.starters{display:flex;flex-wrap:wrap;gap:6px}

.starters button{border:1px dashed var(--muted);background:transparent;border-radius:14px;padding:4px 10px;font-size:13px}

.tickets{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:6px 0}

.ticket{position:relative;width:min(100%,250px);background:var(--wood);color:var(--ticket-ink);padding:14px 18px 14px;border-radius:4px 6px 5px 3px;box-shadow:2px 3px 0 var(--line);margin-top:18px;border:2px solid var(--wood-dark)}

.ticket::before,.ticket::after{content:"";position:absolute;top:-20px;width:2px;height:20px;background:var(--wood-dark)}.ticket::before{left:22%}.ticket::after{right:22%}

.ticket small{display:block;font-size:11px;letter-spacing:1px;opacity:.75}

.ticket p{margin:4px 0 0;font-family:var(--font-hand);font-size:19px;line-height:1.5;overflow-wrap:anywhere}

.empty{color:var(--muted);font-size:14px;text-align:center;margin:0}

.log{width:100%;border-collapse:collapse;font-size:13px}

.log th,.log td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}

.log th{font-weight:500;color:var(--muted)}

.table-wrap{overflow-x:auto}

details.teacher{border-top:1px solid var(--line);padding-top:10px;font-size:14px;color:var(--muted)}

details.teacher summary{cursor:pointer;color:var(--ink)}

details.teacher dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0}

details.teacher dt{color:var(--accent);white-space:nowrap}

details.teacher dd{margin:0}

.skin{fill:#f2cba7}.hair{fill:#3a2b23}.gray{fill:#d3cfc8}.capc{fill:var(--ink)}.capb{fill:var(--accent)}.eye{fill:#2b2622}.cheek{fill:#ee9c94;opacity:.5}.mus{fill:#6b5a4c}.chef{fill:#ffffff;stroke:#c9c3b8}.band{fill:#d8434f}

.vg{display:grid;grid-template-columns:repeat(5,1.05em);justify-content:end;font-size:26px;line-height:1.35;text-align:center;font-variant-numeric:tabular-nums}

.vg .rule{grid-column:1/-1;border-top:2px solid currentColor;height:0;margin:3px 0}

.vbox{background:var(--paper);border-radius:10px;padding:8px 18px}

.note .cap,.vbox .cap{font-family:var(--font-ui);font-size:12px;opacity:.75;text-align:left;margin:0 0 2px}

.pool{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:440px;min-height:28px}

.boxes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}

.bx{min-width:70px;background:var(--paper);border:2px solid var(--wood-dark);border-radius:6px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}

.bx>div{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:110px;min-height:20px}

.bx small{font-size:11px;color:var(--muted)}

.bx.jug{border-color:var(--water);border-radius:6px 6px 14px 14px}.bx.part{border-style:dashed}

.tm{display:inline-block;width:16px;height:16px;border-radius:50% 46% 52% 48%;background:var(--berry);position:relative;flex:none}

.tm::after{content:"";position:absolute;top:-2px;left:5px;width:6px;height:5px;background:var(--pick-2);border-radius:50% 50% 30% 30%}

.wc{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:3px;background:var(--water);font-style:normal;font-size:10px;color:var(--ink)}

.bundle{display:inline-grid;place-items:center;width:20px;height:40px;border-radius:5px;background:var(--berry);color:#fff;font-style:normal;font-size:10px;font-weight:700;box-shadow:inset 0 0 0 2px rgb(0 0 0 / .15)}

.hand-t{font-family:var(--font-hand);font-size:26px;fill:var(--ticket-ink);text-anchor:middle}

table.menu{border-collapse:collapse;margin:0 auto;background:var(--paper);font-variant-numeric:tabular-nums}

table.menu caption{font-size:13px;color:var(--muted);padding-bottom:4px}

table.menu th,table.menu td{border:1px solid var(--line);padding:0;text-align:center;min-width:56px}

table.menu td{padding:6px 10px;transition:background .2s}

table.menu th button{width:100%;min-height:36px;border:0;background:var(--soft);padding:4px 8px;font-size:14px}

table.menu th button.on{background:var(--ink);color:var(--on-ink)}

table.menu td.lane{background:color-mix(in srgb,var(--accent) 12%,transparent)}

table.menu td.hit{background:var(--accent);color:var(--on-ink);font-weight:700}

.yk{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:180px}

.ykb{display:inline-block;width:12px;height:24px;border-radius:4px 4px 3px 3px;background:var(--paper);border:1.5px solid var(--ink);position:relative}

.ykb::before{content:"";position:absolute;left:-1px;right:-1px;top:-4px;height:5px;background:var(--berry);border-radius:2px}

.ykb.used{opacity:.25}

.tenbox{display:grid;grid-template-columns:repeat(5,34px);gap:6px;padding:10px;background:var(--paper);border:2px solid var(--wood-dark);border-radius:8px}

.tenbox i{display:block;width:34px;height:26px;border-radius:8px;transition:opacity .3s,transform .3s}

.sushi{background:linear-gradient(var(--paper) 0 55%,var(--juice-a) 55%);border:2px solid var(--ink)}

.cookie{background:var(--wood);border:2px solid var(--wood-dark);border-radius:50%!important}

.tenbox i.gone{opacity:.15;transform:scale(.7)}

.spk{display:inline-grid;place-items:center;width:28px;height:28px;margin-left:6px;vertical-align:middle;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--ink);padding:0}

const X0=20,X1=380,xOf=t=>X0+(X1-X0)*t/24;

let trainT=0,visited=[];

function pad2(n){return String(n).padStart(2,'0');}

function hm(t){let h=Math.floor(t+1e-6),m=Math.round((t-h)*60);if(m===60){h++;m=0;}return[h,m];}

function t24(t){const[h,m]=hm(t);return m?`${h}時${m}分`:`${h}時`;}

function t12(t){const[h,m]=hm(t);const mm=m?`${m}分`:'';if(h===0)return'一天剛開始';if(h===24)return'一天結束';if(h<12)return`上午${h}時${mm}`;if(h===12)return`中午12時${mm}`;return`下午${h-12}時${mm}`;}

H.t24=t24;H.t12=t12;

function initDay(){trainT=0;visited=[];

  $('#route').innerHTML=`<svg id="track" viewBox="0 0 400 92" role="img" aria-label="0時到24時的鐵軌，小火車停在現在的時刻"></svg>

    <div class="slider" id="sliderBox" hidden><label for="hourSlider" class="small">拉拉看：把小火車開到不同的時刻</label>

  $('#hourSlider').addEventListener('input',()=>{const h=+$('#hourSlider').value;$('#sliderOut').textContent=`${h}時 ＝ ${t12(h)}`;moveTrain(h,t12(h));SFX.play('tick');});

  drawTrack();

}

function drawTrack(){

  let s=`<defs><linearGradient id="sky" x1="0" x2="1">

    <stop offset="0" style="stop-color:var(--sky-night)"/><stop offset=".22" style="stop-color:var(--sky-night)"/>

    <stop offset=".3" style="stop-color:var(--sky-dawn)"/><stop offset=".4" style="stop-color:var(--sky-day)"/>

    <stop offset=".7" style="stop-color:var(--sky-day)"/><stop offset=".78" style="stop-color:var(--sky-dusk)"/>

    <stop offset=".88" style="stop-color:var(--sky-night)"/><stop offset="1" style="stop-color:var(--sky-night)"/></linearGradient></defs>`;

  s+=`<rect x="${X0}" y="6" width="${X1-X0}" height="40" rx="8" fill="url(#sky)" opacity=".75"/>`;

  s+=`<circle cx="${xOf(12)}" cy="18" r="6" style="fill:#f4c34a"/>`;

  [2,22.5].forEach(h=>{s+=`<path d="M${xOf(h)-4} 14 a7 7 0 1 0 8 9 a5.5 5.5 0 1 1 -8 -9z" style="fill:#f6efd6"/>`;});

  for(let h=0;h<=24;h++){const x=xOf(h);s+=`<line class="tie" x1="${x}" y1="51" x2="${x}" y2="61"/>`;}

  s+=`<line class="rail" x1="${X0-6}" y1="53" x2="${X1+6}" y2="53"/><line class="rail" x1="${X0-6}" y1="59" x2="${X1+6}" y2="59"/>`;

  for(let h=0;h<=24;h+=3)s+=`<text class="tick-t" x="${xOf(h)}" y="76">${h}</text>`;

  s+=`<text class="tick-t" x="${X1+6}" y="88" style="text-anchor:end">時</text>`;

  visited.forEach(v=>{s+=`<circle class="stopdot" cx="${xOf(v)}" cy="66" r="2.6"/>`;});

  s+=`<g class="mover" id="train" style="transform:translate(${xOf(trainT)}px,0px)">

      <rect class="car" x="-26" y="38" width="15" height="12" rx="2"/><rect class="win" x="-23" y="41" width="9" height="4" rx="1"/>

      <rect class="engine" x="-9" y="36" width="20" height="14" rx="2"/><rect class="engine" x="-6" y="31" width="5" height="6"/>

      <rect class="win" x="2" y="39" width="6" height="5" rx="1"/>

      <circle class="wheel" cx="-22" cy="51" r="2.6"/><circle class="wheel" cx="-15" cy="51" r="2.6"/><circle class="wheel" cx="-4" cy="51" r="3"/><circle class="wheel" cx="6" cy="51" r="3"/></g>`;

  $('#track').innerHTML=s;

}

function moveTrain(t,label){trainT=t;const g=$('#train');if(g)g.style.transform=`translate(${xOf(t)}px,0px)`;

function mountWidget(w){

  const c=typeof w==='function'?w():w;

      <label for="ticketText" class="small">我的學習小記</label><textarea id="ticketText" maxlength="120" placeholder="用自己的話寫，寫錯字也沒關係"></textarea>`;

  }

  h+='<div class="actions" id="acts"></div>';

  box.innerHTML=h;

  const acts=$('#acts');

  if(st.type==='fields'){

    acts.innerHTML=`<button type="button" class="btn primary" id="checkBtn">說給${P.keeperShort||P.keeper}聽</button>`;

  }else if(st.type==='choice'){

    $$('[data-o]',box).forEach(b=>b.onclick=()=>pickChoice(st,+b.dataset.o,b));

  }else if(st.type==='explain'){

    $$('[data-o]',box).forEach(b=>b.onclick=()=>{

      SFX.play('tap');$$('[data-o]',box).forEach(x=>{x.setAttribute('aria-pressed',String(x===b));x.disabled=true;});

      const o=st.opts[+b.dataset.o];logIt(st,o[0],true);log[st.id].how=/不太|不確定/.test(o[0])?'尚待口頭說明':'選擇自己的方法（待口頭確認）';

      addLine('你',esc(o[0]));addLine(st.who||P.keeper,o[1],'fb ok');SFX.play('ok');showNext();});

  }else if(st.type==='feel')setupFeel(st);

  else if(st.type==='ticket')setupTicket();

}

function logIt(st,ans,ok){

  const r=log[st.id]||(log[st.id]={label:st.label,first:ans,tries:0,how:''});

  r.tries++;if(ok)r.how=r.tries===1?(st.observe?'操作後答出':'自行答出'):'提示後完成';

}

function pickChoice(st,i,btn){

  const o=st.opts[i],box=$('#stepBox');

  if(st.observe&&!ctl?.explored){addLine(P.keeper,st.observeMessage||'先操作看看，再回答。','fb');return;}



  $$('[data-o]',box).forEach(x=>x.setAttribute('aria-pressed',String(x===btn)));

  addLine('你',esc(o[0]));logIt(st,o[0],!!o[1]);

  if(o[1]){

    if(/不確定/.test(o[0]))log[st.id].how='尚未確定，跟著觀察';

    SFX.play('ok');

    if(o[2])addLine(st.who||P.keeper,o[2],'fb ok');

    (st.ok||[]).forEach(([w,t])=>addLine(w,t,'ok'));

    $$('[data-o]',box).forEach(x=>x.disabled=true);

    if(st.after)st.after(ctl,H);

    showNext();

  }else{SFX.play('retry');addLine(st.who||P.keeper,o[2],'fb');tries++;

    if(st.onWrong)st.onWrong(ctl,H,tries);}

}

function checkFields(st){

  const box=$('#stepBox');

  const vals=st.fields.map((f,i)=>{const v=$('#f'+i).value.trim();return v===''?null:Number(v);});

  const pb=$('[data-p][aria-pressed="true"]',box),p=pb?pb.dataset.p:'';

  if(vals.some(v=>v===null)||(st.period&&!p)){SFX.play('retry');addLine(st.who||P.keeper,st.period&&!p?'先選上午或下午，再把每一格填完整。':'把每一格填完整，再確認答案。','fb');return;}



  if(st.observe&&!ctl?.explored){addLine(P.keeper,st.observeMessage||'先操作看看，再回答。','fb');return;}

  const said=st.say?st.say(p,vals):(p||'')+st.fields.map((f,i)=>(st.pre&&st.pre[i]?st.pre[i]:'')+vals[i]+f).join(' ');

  addLine('你',esc(said));

  const msg=st.check(p,vals,ctl);

  if(!msg){logIt(st,said,true);SFX.play('ok');(st.ok||[]).forEach(([w,t])=>addLine(w,t,'ok'));lock();if(st.after)st.after(ctl,H);showNext();}

  else{

    tries++;logIt(st,said,false);

    if(tries>=3){

      SFX.play('next');addLine(st.who||P.keeper,'我們一起想一想：'+st.reveal,'fb');

      log[st.id].how='跟著解說完成（尚待再試）';

      lock();if(st.after)st.after(ctl,H);showNext();

    }else{SFX.play('retry');addLine(st.who||P.keeper,msg,'fb');if(st.onWrong)st.onWrong(ctl,H,tries,vals);}

  }

  function lock(){$$('input,[data-p]',box).forEach(x=>x.disabled=true);const c=$('#checkBtn');if(c)c.remove();}

}

function showNext(){

  const sc=P.scenes[si],last=stepI>=sc.steps.length-1,lastScene=si>=P.scenes.length-1;

  $('#acts').innerHTML=`<button type="button" class="btn primary" id="nextBtn">${last?(lastScene?'看今天的紀錄':(P.route==='day'?'坐到下一站 →':'走到下一站 →')):'下一步 →'}</button>`;

  $('#nextBtn').onclick=()=>{SFX.play('next');if(!last){stepI++;renderStep();}else if(!lastScene)startScene(si+1);};

  $('#nextBtn').focus({preventScroll:true});

}



/* ---------- 秒的量感 ---------- */

function setupFeel(st){

  let t0=0,running=false;const feel=[];

  const btn=$('#feelBtn'),msg=$('#feelMsg');

  btn.onclick=()=>{

    if(!$('#feelMsg'))return;

    if(!running){running=true;t0=performance.now();btn.textContent='到了！';msg.textContent='閉上眼睛，在心裡慢慢數⋯⋯';SFX.play('tick');

      const hand=$('#secHand');if(hand)hand.style.opacity='0';return;}

    running=false;const s=(performance.now()-t0)/1000;feel.push(s);SFX.play('ok');

    const hand=$('#secHand');if(hand){hand.style.opacity='1';hand.setAttribute('transform',`rotate(${(s%60)*6})`);}

    btn.textContent='再試一次';

    msg.textContent=Math.abs(s-30)<=2?`你的30秒是 ${s.toFixed(1)} 秒，好準！`:`你的30秒是 ${s.toFixed(1)} 秒。${s<30?'比30秒短一點，下次可以數慢一點。':'比30秒長一點，下次可以數快一點。'}`;

    $('#feelTries').innerHTML=feel.map((v,i)=>`<span>第${i+1}次 ${v.toFixed(1)} 秒</span>`).join('');

    log[st.id]={label:st.label,first:feel[0].toFixed(1)+'秒',tries:feel.length,how:'量感練習，沒有對錯'};

    if(feel.length===1){addLine(P.keeper,'每個人心裡的30秒都不一樣長。秒針就是大家約好的那把尺。','fb ok');showNext();}

  };

}

function setupTicket(){

function vgrid(rows,op,ans,carry){

  const cell=(d)=>`<span>${d===undefined||d===' '?'':d}</span>`;

  const padL=s=>s.padStart(4,' ').split('');

  let h='<div class="vg">';

  if(carry)h+='<span></span>'+padL(carry).map(d=>`<span style="font-size:14px;opacity:.75">${d===' '?'':d}</span>`).join('');

  rows.forEach((r,i)=>{h+=cell(i===rows.length-1?op:'')+padL(r).map(cell).join('');});

  h+='<span class="rule"></span>';

  if(ans!==undefined)h+=cell('')+padL(ans).map(cell).join('');

  return h+'</div>';

}

/* ---------- 時間車站 ---------- */

function clockSVG(h,m,sec){

  let s='<svg viewBox="-60 -60 120 120" width="150" height="150" role="img" aria-label="鐘面">';

  s+='<circle r="56" style="fill:var(--face);stroke:var(--ink);stroke-width:3"/>';

  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?50:46;s+=`<line x1="${(Math.sin(a)*r1).toFixed(1)}" y1="${(-Math.cos(a)*r1).toFixed(1)}" x2="${(Math.sin(a)*53).toFixed(1)}" y2="${(-Math.cos(a)*53).toFixed(1)}" class="ink-s" stroke-width="1"/>`;}

  for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;s+=`<text x="${(Math.sin(a)*38).toFixed(1)}" y="${(-Math.cos(a)*38+4.5).toFixed(1)}" class="lbl">${i}</text>`;}

  s+=`<line x1="0" y1="0" x2="0" y2="-26" class="ink-s" stroke-width="5" stroke-linecap="round" transform="rotate(${((h%12)+m/60)*30})"/>`;

  s+=`<line x1="0" y1="0" x2="0" y2="-42" class="ink-s" stroke-width="3" stroke-linecap="round" transform="rotate(${m*6})"/>`;

  if(sec!==undefined)s+=`<line id="secHand" x1="0" y1="8" x2="0" y2="-47" class="acc-s" stroke-width="1.6" stroke-linecap="round" transform="rotate(${sec*6})"/>`;

  return s+'<circle r="3" class="ink-f"/></svg>';

}

W.cup=(o)=>({

  html:(()=>{

    const X=60,Y=20,Wd=90,Hh=220,k=Hh/1000;let s=`<svg viewBox="0 0 210 260" width="210" role="img" aria-label="量杯，刻度到1000毫升" id="cupSvg">`;

    s+=`<g id="liq"></g>`;

    s+=`<path d="M${X} ${Y-6} V${Y+Hh} Q${X} ${Y+Hh+8} ${X+8} ${Y+Hh+8} H${X+Wd-8} Q${X+Wd} ${Y+Hh+8} ${X+Wd} ${Y+Hh} V${Y-6}" class="ink-s" stroke-width="2.5" fill="none"/>`;

    s+=`<path d="M${X+Wd} ${Y+30} q26 0 26 40 q0 40 -26 40" class="ink-s" stroke-width="2.5" fill="none"/>`;

    for(let v=50;v<=1000;v+=50){const y=Y+Hh-v*k,big=v%100===0;s+=`<line x1="${X}" y1="${y}" x2="${X+(big?22:12)}" y2="${y}" class="ink-s" stroke-width="${big?1.6:1}"/>`;if(big)s+=`<text x="${X-6}" y="${y+4}" class="lbl-s" style="text-anchor:end">${v}</text>`;}

    s+=`<text x="${X+Wd/2}" y="${Y-10}" class="lbl-s">毫升</text></svg>`;

    return`<div class="row">${s}<div class="ctrls" style="width:auto">${(o.pours||[]).map((p,i)=>`<button type="button" class="wbtn" data-p="${i}">${p[0]}</button>`).join('')}<p class="cap" id="cupCap">${o.pours?'量杯是空的。':'一小格是50毫升。'}</p></div></div>`;

  })(),

  mount(box,H){

    const X=60,Y=20,Wd=90,Hh=220,k=Hh/1000,layers=[];let level=0;

    function draw(){if(!box.isConnected)return;let s='',base=0;layers.forEach(l=>{s+=`<rect x="${X+1.5}" y="${(Y+Hh-(base+l.h)*k).toFixed(1)}" width="${Wd-3}" height="${(l.h*k).toFixed(1)}" class="${l.cls}" opacity=".85"/>`;base+=l.h;});box.querySelector('#liq').innerHTML=s;}

    function pour(amount,cls){return new Promise(res=>{const l={h:0,cls};layers.push(l);H.SFX.play('pour');const t0=performance.now(),dur=H.$('#cupCap',box)&&matchMedia('(prefers-reduced-motion: reduce)').matches?1:900;

      (function f(t){const p=Math.min(1,(t-t0)/dur);l.h=amount*p;draw();if(p<1)requestAnimationFrame(f);else{level+=amount;res();}})(t0);});}

    if(o.value){layers.push({h:o.value,cls:'water'});level=o.value;draw();}

    const used=new Set();

    box.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.p;if(used.has(i))return;used.add(i);b.disabled=true;const p=o.pours[i];await pour(p[1],p[2]);

      H.$('#cupCap',box).textContent=used.size<o.pours.length?'倒好一種了，再倒另一種。':'兩種都倒進去了。看看水面在哪裡？';});

    return{async pourAll(){for(let i=0;i<(o.pours||[]).length;i++){if(!box.isConnected)return;if(!used.has(i)){used.add(i);box.querySelector(`[data-p="${i}"]`).disabled=true;await pour(o.pours[i][1],o.pours[i][2]);}}}};

  }

});

W.jug=()=>({

    s+=`<path d="M${X} ${Y} V${Y+Hh} H${X+Wd} V${Y}" class="ink-s" stroke-width="2.5" fill="none"/><path d="M${X-4} ${Y} H${X+Wd+4}" class="acc-s" stroke-width="3"/>`;

    return`<div class="row">${s}</svg><div class="ctrls" style="width:auto;align-items:center"><button type="button" class="wbtn" id="jugBtn">倒一杯100毫升</button><p class="cap" id="jugCap">水壺是空的。</p></div></div>`;})(),

W.ruler=(o)=>({

  html:(()=>{const px=5.4,x0=22;let s=`<svg viewBox="0 0 420 120" width="420" role="img" aria-label="直尺，刻度到7公分" id="rul">`;

    s+=`<rect x="8" y="48" width="404" height="62" rx="4" class="wood-f wood-s" stroke-width="1.5"/>`;

    s+=`<g id="hl"></g>`;

    for(let mm=0;mm<=70;mm++){const x=x0+mm*px,len=mm%10===0?20:mm%5===0?14:9;s+=`<line x1="${x.toFixed(1)}" y1="48" x2="${x.toFixed(1)}" y2="${48+len}" class="ink-s" stroke-width="${mm%10===0?1.4:1}"/>`;if(mm%10===0)s+=`<text x="${x.toFixed(1)}" y="86" class="lbl">${mm/10}</text>`;}

    s+=`<text x="400" y="104" class="lbl-s" style="text-anchor:end">公分</text>`;

    if(o.mode==='ribbon')s+=`<g id="rib" class="ribbon"><rect x="${x0+o.from*px}" y="26" width="${(o.to-o.from)*px}" height="16" rx="3"/></g><text id="ribT" x="${x0+o.from*px}" y="20" class="lbl-s" style="text-anchor:start">頭在${o.from}毫米</text><text id="ribE" x="${x0+o.to*px}" y="20" class="lbl-s" style="text-anchor:end">尾巴在${o.to}毫米</text>`;

    s+='</svg>';

    const btn=o.mode==='count'?'<button type="button" class="wbtn" id="rBtn">數一個小間隔</button>':'<button type="button" class="wbtn" id="rBtn" hidden>把緞帶移到0對齊</button>';

    return`<div style="width:100%;overflow-x:auto">${s}</div><div class="wbtns">${btn}</div><p class="cap" id="rCap">${o.mode==='count'?'0到1公分之間，有幾個小間隔？':(o.cap||'緞帶沒有對齊0。')}</p>`;})(),

  mount(box,H){

    const px=5.4,x0=22;let k=0;

    if(o.mode==='count'){

      const paint=()=>{if(!box.isConnected)return;let s='';for(let i=0;i<k;i++)s+=`<rect x="${x0+i*px+.6}" y="49" width="${px-1.2}" height="10" class="pick" opacity=".75"/>`;box.querySelector('#hl').innerHTML=s;

        H.$('#rCap',box).textContent=k<10?`數了 ${k} 個小間隔`:'數了10個小間隔：1公分＝10毫米。';H.$('#rBtn',box).disabled=k>=10;};

      H.$('#rBtn',box).onclick=()=>{if(k<10){k++;H.SFX.play('tick');paint();}};

      return{async countAll(){while(k<10&&box.isConnected){k++;H.SFX.play('tick');paint();await H.wait(90);}}};

    }

    const btn=H.$('#rBtn',box);let moved=false;

    function slide(){const g=box.querySelector('#rib');g.style.transform=moved?'':`translateX(${-o.from*px}px)`;moved=!moved;H.SFX.play('swoosh');

      box.querySelector('#ribT').style.opacity=moved?0:1;box.querySelector('#ribE').style.opacity=moved?0:1;

      H.$('#rCap',box).textContent=moved?`移到0以後，尾巴在${o.to-o.from}毫米。`:'緞帶沒有對齊0。';btn.textContent=moved?'移回原來的位置':'把緞帶移到0對齊';}

    btn.onclick=slide;

    return{offer(){btn.hidden=false;},slideTo0(){btn.hidden=false;if(!moved)slide();}};

  }

});

W.numline=(o)=>({

  html:(()=>{const x0=24,sp=17;let s=`<svg viewBox="0 0 390 96" width="390" role="img" aria-label="0到${o.max}的數線" id="nl">`;

W.circle=()=>({

  html:`<svg viewBox="0 0 260 210" width="260" role="img" aria-label="圓、圓心、半徑和直徑" id="cir"></svg>

    <div class="ctrls"><label for="cr">改變半徑<span id="crv"></span></label><input type="range" id="cr" min="2" max="5" step="1" value="4"></div>

  mount(box,H){

    let r=4;const angles=[-40];

    function draw(){const R=r*20,cx=130,cy=100;let s=`<circle cx="${cx}" cy="${cy}" r="${R}" class="ink-s" stroke-width="2.5" fill="none"/>`;

      s+=`<line x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}" class="good-s" stroke-width="2.5"/><text x="${cx+R*.5}" y="${cy+16}" class="lbl-s">直徑</text>`;

      const cyc=cy+R*.62,hx=Math.sqrt(R*R-(R*.62)**2);s+=`<line x1="${cx-hx}" y1="${cyc}" x2="${cx+hx}" y2="${cyc}" class="acc-s" stroke-width="2" stroke-dasharray="5 4"/><text x="${cx}" y="${cyc-6}" class="lbl-s">不是直徑（沒有通過圓心）</text>`;

      angles.forEach((a,i)=>{const t=a*Math.PI/180;s+=`<line x1="${cx}" y1="${cy}" x2="${(cx+R*Math.cos(t)).toFixed(1)}" y2="${(cy+R*Math.sin(t)).toFixed(1)}" class="ink-s" stroke-width="2"/>`;if(i===0)s+=`<text x="${(cx+R*.55*Math.cos(t)+12).toFixed(1)}" y="${(cy+R*.55*Math.sin(t)).toFixed(1)}" class="lbl-s">半徑</text>`;});

      s+=`<circle cx="${cx}" cy="${cy}" r="3.5" class="ink-f"/><text x="${cx-10}" y="${cy-8}" class="lbl-s">圓心</text>`;

      H.$('#cirCap',box).textContent=`半徑${r}公分，直徑${2*r}公分。畫了${angles.length}條半徑，每一條都一樣長。（圖形為示意）`;}

    H.$('#cr',box).oninput=e=>{r=+e.target.value;H.SFX.play('tick');draw();};

    H.$('#addR',box).onclick=()=>{angles.push(Math.round(Math.random()*360));H.SFX.play('pencil');draw();};

W.compass=()=>({

  html:`<svg viewBox="0 0 260 230" width="260" role="img" aria-label="用圓規畫圓" id="cps"></svg>

/* ================= 第6島的新教具 ================= */

const TM='<i class="tm" aria-hidden="true"></i>';

const WC='<i class="wc" aria-hidden="true">1</i>';



/* 分裝（每盒k個）與平分（發給p家），item: tomato｜water */

W.pack=(o)=>({

  html:`<div class="pool" id="pool" aria-label="還沒裝的"></div><div class="boxes" id="boxes"></div>

    <div class="wbtns"><button type="button" class="wbtn" id="pkBtn"></button><button type="button" class="wbtn" id="pkExtra" hidden></button></div><p class="cap" id="pkCap"></p>`,

  mount(box,H){

    const isW=o.item==='water',icon=isW?WC:TM,deal=o.mode==='deal';

    let pool=o.total,boxes=deal?Array(o.groups).fill(0):[],extra=0,busy=false;

    const label=deal?`每家發1${isW?'公升':'顆'}`:(isW?`倒滿一個水壺（${o.size}公升）`:`裝一盒（${o.size}顆）`);

    function render(){

      if(!box.isConnected)return;

      H.$('#pool',box).innerHTML=pool?Array(pool).fill(icon).join(''):'<span class="small">都分完了</span>';

      H.$('#boxes',box).innerHTML=boxes.map((n,i)=>`<div class="bx${isW?' jug':''}"><small>${deal?`第${i+1}家`:(isW?`水壺${i+1}`:`第${i+1}盒`)}</small><div>${Array(n).fill(icon).join('')}</div></div>`).join('')+(extra?`<div class="bx jug part"><small>水壺${boxes.length+1}</small><div>${Array(extra).fill(icon).join('')}</div></div>`:'');

      const b=H.$('#pkBtn',box);b.textContent=label;

      if(deal){b.disabled=pool<o.groups;H.$('#pkCap',box).textContent=pool<o.groups?`每家${boxes[0]}${isW?'公升':'顆'}，${pool?`剩${pool}${isW?'公升':'顆'}`:'剛好分完'}。`:`一輪發給${o.groups}家，每家1${isW?'公升':'顆'}。`;}

      else{b.disabled=pool<o.size;H.$('#pkCap',box).textContent=pool>=o.size?`還有${pool}${isW?'公升':'顆'}。`:`裝了${boxes.length}${isW?'個水壺':'盒'}，${pool?`剩${pool}${isW?'公升':'顆'}，不夠${isW?'倒滿一壺':'裝一盒'}`:'剛好裝完'}。`;

        const x=H.$('#pkExtra',box);x.hidden=!(isW&&pool>0&&pool<o.size);x.textContent=`剩下的${pool}公升，也要拿一個水壺裝`;}

    }

    function step(){if(deal){if(pool<o.groups)return false;boxes=boxes.map(n=>n+1);pool-=o.groups;}else{if(pool<o.size)return false;boxes.push(o.size);pool-=o.size;}H.SFX.play(isW?'drip':'tap');render();return true;}

    H.$('#pkBtn',box).onclick=step;

    H.$('#pkExtra',box).onclick=()=>{extra=pool;pool=0;H.SFX.play('pour');render();H.$('#pkCap',box).textContent=`一共用了${boxes.length+1}個水壺，最後一個只裝${extra}公升。`;};

    render();

    return{async all(){if(busy)return;busy=true;while(box.isConnected&&step())await H.wait(160);busy=false;}};

  }

});



/* 定位板平分：先分十位、拆開、再分個位 */

W.share=(o)=>({

  html:`<div class="pool" id="shPool"></div><div class="boxes" id="shPlates"></div>

    <div class="wbtns"><button type="button" class="wbtn" id="shT">先分十位（一捆10顆）</button><button type="button" class="wbtn" id="shX" hidden>把剩下的捆拆成一顆一顆</button><button type="button" class="wbtn" id="shO" disabled>再分個位</button></div><p class="cap" id="shCap"></p>`,

  mount(box,H){

    let t=Math.floor(o.n/10),u=o.n%10,pt=0,pu=0,stage=0;const BD='<i class="bundle" aria-hidden="true">10</i>';

    function render(){if(!box.isConnected)return;

      H.$('#shPool',box).innerHTML=(t||u)?Array(t).fill(BD).join('')+Array(u).fill(TM).join(''):'<span class="small">都分完了</span>';

      H.$('#shPlates',box).innerHTML=Array.from({length:o.p},(_,i)=>`<div class="bx"><small>第${i+1}家</small><div>${Array(pt).fill(BD).join('')}${Array(pu).fill(TM).join('')}</div><small>${pt*10+pu}顆</small></div>`).join('');

      H.$('#shT',box).disabled=stage>0;H.$('#shX',box).hidden=!(stage===1&&t>0);H.$('#shO',box).disabled=!(stage===1&&t===0)&&stage!==2;

      if(stage===2)H.$('#shO',box).disabled=true;}

    function tens(){if(stage>0)return;pt=Math.floor(t/o.p);t-=pt*o.p;stage=1;H.SFX.play('tap');render();

      H.$('#shCap',box).textContent=t?`每家${pt}捆，還剩${t}捆。剩下的捆分不完，可以拆開嗎？`:`每家${pt}捆，十位剛好分完。`;}

    function open(){if(t<=0)return;u+=t*10;t=0;H.SFX.play('paper');render();H.$('#shCap',box).textContent=`拆開以後，一顆一顆的有${u}顆。`;}

    function ones(){if(stage!==1||t>0)return;const k=Math.floor(u/o.p);pu=k;u-=k*o.p;stage=2;H.SFX.play('ok');render();

      H.$('#shCap',box).textContent=`每家${pt}捆和${pu}顆，是${pt*10+pu}顆${u?`，剩${u}顆`:''}。`;}

    H.$('#shT',box).onclick=tens;H.$('#shX',box).onclick=open;H.$('#shO',box).onclick=ones;render();

    return{async all(){if(stage===0){tens();await H.wait(450);}if(t>0){open();await H.wait(450);}if(stage===1)ones();}};

  }

});



/* 除法直式（小安寫到一半） */

W.longdiv=(o)=>({html:(()=>{

/* 價目表／時刻表：點列、點欄，交叉格亮起來 */

W.table=(o)=>({

  html:`<div class="table-wrap"><table class="menu" id="menu"><caption>${o.title}</caption><thead><tr><th></th>${o.cols.map((c,j)=>`<th><button type="button" data-c="${j}">${c}</button></th>`).join('')}</tr></thead>

    <tbody>${o.rows.map((r,i)=>`<tr><th><button type="button" data-r="${i}">${r}</button></th>${o.data[i].map((v,j)=>`<td data-i="${i}" data-j="${j}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="cap" id="mCap">${o.cols.length>1?'先點一列，再點一欄，看看交叉的格子。':'點一列看看。'}</p>`,

  mount(box,H){

    function paint(){box.querySelectorAll('td').forEach(td=>{const i=+td.dataset.i,j=+td.dataset.j;td.className=(i===r&&j===c)?'hit':(i===r||j===c)?'lane':'';});

      box.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('on',+b.dataset.r===r));box.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',+b.dataset.c===c&&o.cols.length>1));

      if(r>=0&&c>=0)H.$('#mCap',box).textContent=`${o.cols.length>1?o.cols[c]:''}${o.rows[r]}：${o.data[r][c]}`;}

    box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{r=+b.dataset.r;H.SFX.play('tick');paint();});

    box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{c=+b.dataset.c;H.SFX.play('tick');paint();});

  }

});



/* 磅秤 */

W.scale=(o)=>({

  html:(()=>{const R=86;let s=`<svg viewBox="-110 -110 220 230" width="220" role="img" aria-label="磅秤，最多${o.max}公克">`;

    s+=`<rect x="-70" y="96" width="140" height="18" rx="6" class="ink-f" opacity=".15"/><circle r="${R+12}" class="paper-f ink-s" stroke-width="3"/>`;

    const step=o.minor||50;for(let g=0;g<o.max;g+=step){const a=g/o.max*2*Math.PI,big=g%(o.major||100)===0,r1=big?R-14:R-8;

      s+=`<line x1="${(Math.sin(a)*r1).toFixed(1)}" y1="${(-Math.cos(a)*r1).toFixed(1)}" x2="${(Math.sin(a)*R).toFixed(1)}" y2="${(-Math.cos(a)*R).toFixed(1)}" class="ink-s" stroke-width="${big?1.6:1}"/>`;

      if(big)s+=`<text x="${(Math.sin(a)*(R-28)).toFixed(1)}" y="${(-Math.cos(a)*(R-28)+4).toFixed(1)}" class="lbl-s">${g}</text>`;}

    s+=`<text x="0" y="30" class="lbl-s">公克</text><g id="needle" style="transition:transform .9s cubic-bezier(.3,1.4,.5,1)"><line x1="0" y1="10" x2="0" y2="${-R+6}" class="acc-s" stroke-width="3" stroke-linecap="round"/></g><circle r="5" class="ink-f"/></svg>`;

  mount(box,H){

  }

/* 天平：1公斤 和 100公克砝碼 */

W.balance=()=>({

  html:`<svg viewBox="0 0 300 170" width="300" role="img" aria-label="天平，左邊是1公斤，右邊放100公克"><path d="M150 160 V60" class="ink-s" stroke-width="5"/><path d="M120 162 H180" class="ink-s" stroke-width="6" stroke-linecap="round"/>

/* 圍籬：封閉與有缺口 */

/* 方格紙：圍出長方形，數周長、數面積 */

W.grid=(o)=>{const U=o.u||'公分';return{

  html:`<svg viewBox="0 0 330 230" width="330" role="img" aria-label="一格是1平方${U}的方格紙" id="gd"></svg>

    ${o.edit?`<div class="ctrls"><label for="gw">長<span id="gwv"></span></label><input type="range" id="gw" min="1" max="9" value="${o.w}"><label for="gh">寬<span id="ghv"></span></label><input type="range" id="gh" min="1" max="6" value="${o.h}"></div>`:''}

    <div class="wbtns"><button type="button" class="wbtn" id="gF">沿著邊數一圈（周長）</button><button type="button" class="wbtn" id="gT">數裡面的格子（面積）</button></div><p class="cap" id="gCap">一小格的邊長是1${U}。</p>`,

  mount(box,H){

    let w=o.w,h=o.h,mode='',busy=0;const c=30,ox=15,oy=15;

    function draw(k){if(!box.isConnected)return;let s='';

      for(let i=0;i<=10;i++)s+=`<line x1="${ox+i*c}" y1="${oy}" x2="${ox+i*c}" y2="${oy+7*c}" class="ink-s" opacity=".18"/>`;

      for(let j=0;j<=7;j++)s+=`<line x1="${ox}" y1="${oy+j*c}" x2="${ox+10*c}" y2="${oy+j*c}" class="ink-s" opacity=".18"/>`;

      s+=`<rect x="${ox}" y="${oy}" width="${w*c}" height="${h*c}" class="soft-f" opacity=".9"/><rect x="${ox}" y="${oy}" width="${w*c}" height="${h*c}" fill="none" class="ink-s" stroke-width="3"/>`;

      if(mode==='T'){let n=0;for(let j=0;j<h;j++)for(let i=0;i<w;i++){n++;if(n>k)break;s+=`<rect x="${ox+i*c+3}" y="${oy+j*c+3}" width="${c-6}" height="${c-6}" class="pick2" opacity=".55"/><text x="${ox+i*c+c/2}" y="${oy+j*c+c/2+4}" class="lbl-s" style="fill:var(--ink)">${n}</text>`;}}

      if(mode==='F'){const pts=[];for(let i=0;i<w;i++)pts.push([i+.5,0,'h']);for(let j=0;j<h;j++)pts.push([w,j+.5,'v']);for(let i=w-1;i>=0;i--)pts.push([i+.5,h,'h']);for(let j=h-1;j>=0;j--)pts.push([0,j+.5,'v']);

        pts.slice(0,k).forEach(([x,y,d],n)=>{const X=ox+x*c,Y=oy+y*c;s+=d==='h'?`<line x1="${X-c/2+3}" y1="${Y}" x2="${X+c/2-3}" y2="${Y}" class="acc-s" stroke-width="5" stroke-linecap="round"/>`:`<line x1="${X}" y1="${Y-c/2+3}" x2="${X}" y2="${Y+c/2-3}" class="acc-s" stroke-width="5" stroke-linecap="round"/>`;

          s+=`<text x="${X+(d==='v'?(x===0?-9:9):0)}" y="${Y+(d==='h'?(y===0?-5:14):4)}" class="lbl-s" style="fill:var(--accent)">${n+1}</text>`;});}

      box.querySelector('#gd').innerHTML=s;

      if(o.edit){H.$('#gwv',box).textContent=w+U;H.$('#ghv',box).textContent=h+U;}}

    async function run(m){if(busy)return;busy=1;mode=m;const N=m==='T'?w*h:2*(w+h);

      for(let k=1;k<=N&&box.isConnected;k++){draw(k);H.SFX.play('tick');await H.wait(N>30?60:110);}

      if(box.isConnected)H.$('#gCap',box).textContent=m==='T'?`裡面有${w*h}格，面積是${w*h}平方${U}。`:`沿著邊繞一圈是${2*(w+h)}${U}，這是周長。`;busy=0;}

    H.$('#gF',box).onclick=()=>run('F');H.$('#gT',box).onclick=()=>run('T');

    if(o.edit){H.$('#gw',box).oninput=e=>{w=+e.target.value;mode='';H.SFX.play('tick');draw(0);H.$('#gCap',box).textContent=`長${w}${U}、寬${h}${U}。`;};

      H.$('#gh',box).oninput=e=>{h=+e.target.value;mode='';H.SFX.play('tick');draw(0);H.$('#gCap',box).textContent=`長${w}${U}、寬${h}${U}。`;};}

    draw(0);

    return{set(a,b){w=a;h=b;if(o.edit){H.$('#gw',box).value=a;H.$('#gh',box).value=b;}run('T');},fence(){run('F');},tiles(){run('T');}};

  }

}};



/* 切割重組：長方形剪成兩個三角形 */

W.cut=()=>({

  html:(()=>{const c=24,ox=60,oy=20;let s=`<svg viewBox="0 0 380 150" width="380" role="img" aria-label="長5公分、寬4公分的長方形，沿對角線剪開">`;

    for(let i=0;i<=12;i++)s+=`<line x1="${ox+i*c}" y1="${oy}" x2="${ox+i*c}" y2="${oy+4*c}" class="ink-s" opacity=".15"/>`;for(let j=0;j<=4;j++)s+=`<line x1="${ox}" y1="${oy+j*c}" x2="${ox+12*c}" y2="${oy+j*c}" class="ink-s" opacity=".15"/>`;

    s+=`<polygon points="${ox+5*c},${oy} ${ox+5*c},${oy+4*c} ${ox},${oy+4*c}" class="pick2 ink-s" stroke-width="2" opacity=".85"/>`;

const KD='<i class="kd" aria-hidden="true"></i>';



/* 分裝／平分（沒有餘數）：可指定單位與容器名稱 */

W.pack=(o)=>({

  html:`<div class="pool" id="pool"></div><div class="boxes" id="boxes"></div>

    <div class="wbtns"><button type="button" class="wbtn" id="pkBtn"></button></div><p class="cap" id="pkCap"></p>`,

  mount(box,H){

    const icon=o.item==='kid'?KD:TM,u=o.u||'顆',bx=o.b||'盒',deal=o.mode==='deal';

    let pool=o.total,boxes=deal?Array(o.groups).fill(0):[],busy=false;

    function render(){if(!box.isConnected)return;

      H.$('#pool',box).innerHTML=pool?Array(pool).fill(icon).join(''):'<span class="small">都分好了</span>';

      H.$('#boxes',box).innerHTML=boxes.map((n,i)=>`<div class="bx"><small>第${i+1}${bx}</small><div>${Array(n).fill(icon).join('')}</div></div>`).join('');

      const b=H.$('#pkBtn',box);

      if(deal){b.textContent=`每${bx}放1${u}`;b.disabled=pool<o.groups;H.$('#pkCap',box).textContent=pool?`還有${pool}${u}。`:`分好了，每${bx}${boxes[0]}${u}。`;}

      else{b.textContent=o.fill||`裝滿一${bx}（${o.size}${u}）`;b.disabled=pool<o.size;H.$('#pkCap',box).textContent=pool?`還有${pool}${u}。`:`剛好用了${boxes.length}${bx}。`;}}

    function step(){if(deal){if(pool<o.groups)return false;boxes=boxes.map(n=>n+1);pool-=o.groups;}else{if(pool<o.size)return false;boxes.push(o.size);pool-=o.size;}H.SFX.play('tap');render();return true;}

    H.$('#pkBtn',box).onclick=step;render();

    return{async all(){if(busy)return;busy=true;while(box.isConnected&&step())await H.wait(160);busy=false;}};

  }

});



/* 估算：在數線上找最接近的整十 */

W.bottles=(o)=>({

    async function pour(){fa=1;fb=0;draw();H.SFX.play('pour');for(let i=1;i<=20&&box.isConnected;i++){fa=1-i/20;fb=i/20*(4/5);draw();await H.wait(45);}

/* 天平：兩樣東西比重 */

/* 圍欄：找平行、找垂直 */

/* 數邊、數角 */

W.sides=()=>({

  html:`<svg viewBox="0 0 340 160" width="340" role="img" aria-label="三角形和四邊形" id="sd"></svg>

    <div class="wbtns"><button type="button" class="wbtn" data-k="e">數邊</button><button type="button" class="wbtn" data-k="a">數角</button></div><p class="cap" id="sdCap">三角形的牌子和四邊形的牌子。</p>`,

  mount(box,H){

    function draw(){if(!box.isConnected)return;let s=poly(T,'soft-f ink-s')+poly(Q,'soft-f ink-s');

      [T,Q].forEach(P=>{P.forEach((p,i)=>{const q=P[(i+1)%P.length];

        if(k==='e'){s+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" class="acc-s" stroke-width="5"/><circle cx="${(p[0]+q[0])/2}" cy="${(p[1]+q[1])/2}" r="10" class="paper-f acc-s" stroke-width="2"/><text x="${(p[0]+q[0])/2}" y="${(p[1]+q[1])/2+4}" class="lbl-s" style="fill:var(--accent);font-weight:700">${i+1}</text>`;}

        if(k==='a'){s+=`<circle cx="${p[0]}" cy="${p[1]}" r="12" class="pick2" opacity=".55"/><text x="${p[0]}" y="${p[1]+4}" class="lbl-s" style="font-weight:700">${i+1}</text>`;}});});

      H.$('#sdCap',box).textContent=k==='e'?'三角形有3條邊，四邊形有4條邊。':'三角形有3個角，四邊形有4個角。';});

    draw();return{show(x){k=x;draw();}};

  }

});

/* 鐘面：5個一數 */

W.clock5=(h,m,note)=>({

  html:`<div class="row"><svg viewBox="-75 -75 150 150" width="190" height="190" role="img" aria-label="鐘面" id="ck5"></svg>${note||''}</div>

  mount(box,H){

      for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?51:47;s+=`<line x1="${(Math.sin(a)*r1).toFixed(1)}" y1="${(-Math.cos(a)*r1).toFixed(1)}" x2="${(Math.sin(a)*54).toFixed(1)}" y2="${(-Math.cos(a)*54).toFixed(1)}" class="ink-s" stroke-width="1"/>`;}

      for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;s+=`<text x="${(Math.sin(a)*38).toFixed(1)}" y="${(-Math.cos(a)*38+4.5).toFixed(1)}" class="lbl">${i}</text>`;

        if(show&&i<=show){s+=`<text x="${(Math.sin(a)*67).toFixed(1)}" y="${(-Math.cos(a)*67+4).toFixed(1)}" class="lbl-s" style="fill:var(--accent);font-weight:700">${i*5===60?0:i*5}</text>`;}}

      s+=`<line x1="0" y1="0" x2="0" y2="-26" class="ink-s" stroke-width="5" stroke-linecap="round" transform="rotate(${((h%12)+m/60)*30})"/><line x1="0" y1="0" x2="0" y2="-44" class="acc-s" stroke-width="3" stroke-linecap="round" transform="rotate(${m*6})"/><circle r="3" class="ink-f"/>`;

      box.querySelector('#ck5').innerHTML=s;}

    H.$('#ck5B',box).onclick=async()=>{const tgt=Math.max(1,Math.round(m/5));for(let i=1;i<=12&&box.isConnected;i++){show=i;draw();H.SFX.play('tick');await H.wait(i<=tgt?260:60);}

      if(box.isConnected)H.$('#ck5Cap',box).textContent=`長針指著${m/5===0?12:m/5}，5個一數是${m}分。`;};

  }

});



/* ================= 第2島的教具 ================= */

const DK='<i class="duck" aria-hidden="true"></i>';

const SH='<i class="shl" aria-hidden="true"></i>';



/* 十格框：湊成10 */

W.tenFrame=(a,b)=>({

  html:`<div class="row"><div class="tf" id="tf1"></div><div class="tf" id="tf2"></div></div>

    <div class="wbtns"><button type="button" class="wbtn" id="tfBtn">湊成10</button></div><p class="cap" id="tfCap">紅色${a}個，綠色${b}個。</p>`,

  mount(box,H){

    let moved=0;

    function draw(){if(!box.isConnected)return;const f1=[],f2=[];

      for(let i=0;i<10;i++)f1.push(i<a?'a':i<a+moved?'b':'');for(let i=0;i<10;i++)f2.push(i<b-moved?'b':'');

      H.$('#tf1',box).innerHTML=f1.map(c=>`<i class="${c}"></i>`).join('');H.$('#tf2',box).innerHTML=f2.map(c=>`<i class="${c}"></i>`).join('');}

    async function go(){if(moved)return;const need=Math.min(10-a,b);for(let k=1;k<=need&&box.isConnected;k++){moved=k;draw();H.SFX.play('tick');await H.wait(260);}

      if(box.isConnected){H.SFX.play('ok');H.$('#tfCap',box).textContent=`${a}和${need}湊成10，還剩${b-need}。10和${b-need}是${10+b-need}。`;}}

    H.$('#tfBtn',box).onclick=go;draw();return{go};

  }

});



/* 兩條鴨子船：換個順序數 */

W.ducks=(l,r)=>({

  html:`<div class="row" id="dk"></div><div class="wbtns"><button type="button" class="wbtn" id="dkBtn">換個順序數</button></div><p class="cap" id="dkCap">先數左邊，再數右邊：${l}＋${r}＝${l+r}。</p>`,

  mount(box,H){

/* ================= 第7島的教具 ================= */

const ZH='零一二三四五六七八九';

function read4(x,lead){const d=String(x).padStart(4,'0').split('').map(Number),u=['千','百','十',''];let s='',zero=false,started=false;

  for(let i=0;i<4;i++){if(d[i]===0){if(started)zero=true;continue;}

    if(zero||(!started&&!lead&&i>0))s+='零';zero=false;

    s+=(i===2&&d[i]===1&&!started&&lead)?'十':ZH[d[i]]+u[i];started=true;}

  return s;}

function readZh(n){if(n===0)return'零';const hi=Math.floor(n/10000),lo=n%10000;

  if(!hi)return read4(lo,true);return read4(hi,true)+'萬'+(lo?read4(lo,false):'');}

const PLACE=['千萬','百萬','十萬','萬','千','百','十','個'];



/* 大數定位板：四位一節讀、取概數 */

W.pvbig=(o)=>{const ds=String(o.n).split(''),names=PLACE.slice(8-ds.length);const ri=o.round?names.indexOf(o.round):-1;

  return{html:`<div class="pv" style="grid-template-columns:auto repeat(${ds.length},minmax(28px,42px))" id="pb"><span></span>${names.map((n,i)=>`<span data-c="${i}">${n}</span>`).join('')}<em>${o.label||''}</em>${ds.map((d,i)=>`<b data-c="${i}">${d}</b>`).join('')}</div>

    <div class="wbtns"><button type="button" class="wbtn" id="pbRead">四位一節讀讀看</button>${ri>=0?`<button type="button" class="wbtn" id="pbNext">找${o.round}位的下一位</button><button type="button" class="wbtn" data-m="r">四捨五入</button><button type="button" class="wbtn" data-m="u">無條件進入</button><button type="button" class="wbtn" data-m="d">無條件捨去</button>`:''}</div><p class="cap" id="pbCap">${o.cap||'先從個位往左，四位一節。'}</p>`,

  mount(box,H){

    const cells=()=>box.querySelectorAll('#pb b[data-c]');

    const clr=()=>box.querySelectorAll('#pb [data-c]').forEach(c=>c.classList.remove('hl','warn'));

    H.$('#pbRead',box).onclick=()=>{clr();const cut=ds.length-4;cells().forEach((c,i)=>{if(i<cut)c.classList.add('hl');});H.SFX.play('pencil');

      const hi=Math.floor(o.n/10000),lo=o.n%10000;H.$('#pbCap',box).textContent=hi?`左邊一節是 ${hi}，讀「${readZh(hi)}萬」；右邊一節是 ${String(lo).padStart(4,'0')}。合起來讀作：${readZh(o.n)}。`:`讀作：${readZh(o.n)}。`;};

    if(ri>=0){const unit=10**(ds.length-1-ri);

      H.$('#pbNext',box).onclick=()=>{clr();cells()[ri].classList.add('hl');cells()[ri+1].classList.add('warn');H.SFX.play('tick');

        H.$('#pbCap',box).textContent=`要取到${o.round}位，看的是下一位（${names[ri+1]}位）：${ds[ri+1]}。`;};

      box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=b.dataset.m,base=Math.floor(o.n/unit)*unit,next=+ds[ri+1];

        const r=m==='d'?base:m==='u'?(o.n%unit?base+unit:base):(next>=5?base+unit:base);H.SFX.play('ok');

        const why=m==='r'?(next>=5?`下一位是${next}，5以上要進1`:`下一位是${next}，4以下捨去`):m==='u'?'後面只要不是0，就進1':'後面全部捨去';

        H.$('#pbCap',box).textContent=`${b.textContent}：${why}，變成 ${r}，大約是 ${r/unit}${o.round==='個'?'':o.round}。`;});}

    return{read(){H.$('#pbRead',box).click();},next(){H.$('#pbNext',box).click();}};

  }};};

W.bigcmp=(la,a,lb,b)=>{const A=String(a),B=String(b),L=Math.max(A.length,B.length),names=PLACE.slice(8-L);const pa=A.padStart(L,' '),pb=B.padStart(L,' ');

          if(box.isConnected)H.$('#bcCap',box).textContent=`前面都一樣，比到${names[i]}位：${pa[i]} 和 ${pb[i]} 不一樣，${big}比較多。後面的數字不用再看了。`;break;}}

/* 披薩：幾個披薩平分給幾個人 */

const PCOL=['var(--berry)','var(--water)','var(--juice-a)','#7fb36a','#8e7bb5','#e08aa0'];

function pieSVG(cx,cy,r,k,fill){let s='';for(let j=0;j<k;j++){const a0=-Math.PI/2+j*2*Math.PI/k,a1=a0+2*Math.PI/k;const f=fill(j);

  s+=`<path d="M${cx} ${cy} L${(cx+r*Math.cos(a0)).toFixed(1)} ${(cy+r*Math.sin(a0)).toFixed(1)} A${r} ${r} 0 0 1 ${(cx+r*Math.cos(a1)).toFixed(1)} ${(cy+r*Math.sin(a1)).toFixed(1)}Z" style="fill:${f||'#f6e2b3'}" class="ink-s" stroke-width="2"/>`;}return s;}

W.pizzas=(o)=>({

  html:`<svg viewBox="0 0 340 120" width="340" role="img" aria-label="${o.n}個披薩" id="pz7"></svg><div class="wbtns"><button type="button" class="wbtn" id="pzBtn">平分給${o.k}個人</button></div><p class="cap" id="pzCap">${o.n}個披薩，要平分給${o.k}個人。</p>`,

  mount(box,H){let on=false;const r=44,gap=(340-o.n*2*r)/(o.n+1);

    function draw(){if(!box.isConnected)return;let s='';for(let i=0;i<o.n;i++){const cx=gap+r+i*(2*r+gap);s+=on?pieSVG(cx,60,r,o.k,j=>PCOL[j%PCOL.length]):`<circle cx="${cx}" cy="60" r="${r}" style="fill:#f6e2b3" class="ink-s" stroke-width="2"/><circle cx="${cx-12}" cy="50" r="5" style="fill:var(--berry)"/><circle cx="${cx+14}" cy="68" r="5" style="fill:var(--berry)"/><circle cx="${cx+4}" cy="40" r="4" style="fill:#7fb36a"/>`;}box.querySelector('#pz7').innerHTML=s;}

    H.$('#pzBtn',box).onclick=()=>{on=true;H.SFX.play('cut');draw();H.$('#pzCap',box).textContent=o.n===1?`1個披薩切成${o.k}片，每人拿1片，就是${o.k}分之1個。`:`每個披薩都切成${o.k}片，每人從每個披薩拿1片（同一個顏色）。每人拿到${o.n}個${o.k}分之1，就是${o.k}分之${o.n}個。`;};

    draw();return{share(){H.$('#pzBtn',box).click();}};

  }

});



/* 一片一片的披薩：拼成一整個 */

W.slices=(o)=>({

  html:`<svg viewBox="0 0 340 120" width="340" role="img" aria-label="${o.total}片披薩" id="sl7"></svg><div class="wbtns"><button type="button" class="wbtn" id="slBtn">${o.k}片拼成1個</button></div><p class="cap" id="slCap">每片是${o.k}分之1個披薩，一共${o.total}片。</p>`,

  mount(box,H){let on=false;const n=Math.ceil(o.total/o.k),r=40,gap=(340-n*2*r)/(n+1);

    function draw(){if(!box.isConnected)return;let s='';

      if(!on){for(let i=0;i<o.total;i++){const c=i%6,row=Math.floor(i/6);s+=`<g transform="translate(${30+c*52} ${20+row*52})">${pieSVG(0,0,34,o.k,j=>j===0?'#f6e2b3':'none')}</g>`;}

        s=s.replace(/style="fill:none" class="ink-s" stroke-width="2"/g,'style="fill:none;stroke:none"');}

      else for(let i=0;i<n;i++){const left=o.total-i*o.k;s+=pieSVG(gap+r+i*(2*r+gap),60,r,o.k,j=>j<left?(left>=o.k?'var(--juice-a)':'var(--berry)'):'none');}

    H.$('#slBtn',box).onclick=()=>{on=true;H.SFX.play('ok');draw();const w=Math.floor(o.total/o.k),r2=o.total%o.k;

      H.$('#slCap',box).textContent=`${o.total}片裡，每${o.k}片拼成1個：拼出${w}個，還剩${r2}片。${o.k}分之${o.total}個＝${w}又${o.k}分之${r2}個。`;};

/* 操場跑圈：公尺和公里 */

W.track=(o)=>({

  html:`<svg viewBox="0 0 340 150" width="340" role="img" aria-label="一圈${o.lap}公尺的操場" id="tk"><rect x="40" y="25" width="260" height="100" rx="50" fill="none" style="stroke:#d9a07a" stroke-width="16"/><rect x="40" y="25" width="260" height="100" rx="50" fill="none" style="stroke:#fff" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="72" y="45" width="196" height="60" rx="30" style="fill:#b6d68a"/><text x="170" y="80" class="lbl" id="tkN">0 圈</text><circle id="tkR" r="8" class="acc-f"/></svg>

    <div class="wbtns"><button type="button" class="wbtn" id="tkBtn">跑一圈（${o.lap}公尺）</button><button type="button" class="wbtn" id="tkRst">重來</button></div><p class="cap" id="tkCap">操場跑一圈是${o.lap}公尺。</p>`,

  mount(box,H){let laps=0,busy=false;const pt=t=>{const P=2*(160)+Math.PI*100;let d=t*P;const R=50;

      if(d<160)return[90+d,25];d-=160;if(d<Math.PI*R){const a=-Math.PI/2+d/R;return[250+R*Math.cos(a),75+R*Math.sin(a)];}d-=Math.PI*R;

      if(d<160)return[250-d,125];d-=160;const a=Math.PI/2+d/R;return[90+R*Math.cos(a),75+R*Math.sin(a)];};

    function put(t){const[x,y]=pt(t%1);const c=box.querySelector('#tkR');c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1));}

    function cap(){const m=laps*o.lap,km=Math.floor(m/1000),r=m%1000;H.$('#tkN',box).textContent=`${laps} 圈`;

      H.$('#tkCap',box).textContent=`跑了${laps}圈，一共${m}公尺`+(km?`＝${km}公里${r?r+'公尺':''}`:'')+'。'+(m===1000?'剛好1000公尺，就是1公里！':'');}

    async function run(){if(busy||!box.isConnected)return;busy=true;H.SFX.play('swoosh');for(let i=1;i<=24&&box.isConnected;i++){put(i/24);await H.wait(28);}laps++;if(box.isConnected)cap();busy=false;}

    H.$('#tkBtn',box).onclick=run;H.$('#tkRst',box).onclick=()=>{laps=0;put(0);cap();H.$('#tkCap',box).textContent=`操場跑一圈是${o.lap}公尺。`;};put(0);

    return{async laps(n){for(let i=0;i<n;i++)await run();}};

  }

});

/* 積木：數一數有幾個1立方公分 */

function isoCubes(stacks,opt){const c=15,hs=15,P=(x,y,z,ox,oy)=>[ox+(x-y)*c,oy+(x+y)*hs/2-z*hs];let s='',n=0;

  stacks.forEach((st,si)=>{const[l,w,h]=st.size,ox=st.ox,oy=st.oy;const list=[];

    for(let z=0;z<h;z++)for(let y=0;y<w;y++)for(let x=0;x<l;x++)list.push([x,y,z]);

    list.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])||a[2]-b[2]);

    list.forEach(([x,y,z])=>{const gz=opt.split?z*10:0;const q=(a,b,d)=>{const p=P(a,b,d,ox,oy-gz);return p[0].toFixed(1)+','+p[1].toFixed(1);};

      const col=opt.color?opt.color(si,z):st.color||'var(--juice-a)';

      s+=`<polygon points="${q(x,y,z+1)} ${q(x+1,y,z+1)} ${q(x+1,y+1,z+1)} ${q(x,y+1,z+1)}" style="fill:${opt.top||'#fff6e4'}" class="ink-s" stroke-width="1.5"/>`+

         `<polygon points="${q(x+1,y,z)} ${q(x+1,y+1,z)} ${q(x+1,y+1,z+1)} ${q(x+1,y,z+1)}" style="fill:${opt.side||'#c9a06c'}" class="ink-s" stroke-width="1.5"/>`+

         `<polygon points="${q(x,y+1,z)} ${q(x+1,y+1,z)} ${q(x+1,y+1,z+1)} ${q(x,y+1,z+1)}" style="fill:${col}" class="ink-s" stroke-width="1.5"/>`;n++;});

    if(st.name)s+=`<text x="${ox}" y="${oy+(l+w)*hs/2+22}" class="lbl-s">${st.name}</text>`;});

  return s;}

W.cubes=(o)=>({

  html:`<svg viewBox="0 0 340 ${o.h||170}" width="340" role="img" aria-label="${o.alt||'積木'}" id="cb"></svg><div class="wbtns">${o.btns.map((b,i)=>`<button type="button" class="wbtn" data-b="${i}">${b[0]}</button>`).join('')}</div><p class="cap" id="cbCap">${o.cap}</p>`,

  mount(box,H){let opt={};

    function draw(){if(!box.isConnected)return;box.querySelector('#cb').innerHTML=isoCubes(o.stacks,opt);}

    box.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const k=o.btns[+b.dataset.b];opt=k[2]||{};H.SFX.play(k[3]||'hop');draw();H.$('#cbCap',box).textContent=k[1];});

});

/* 燈塔的光：旋轉角 */

W.turn=()=>({

  html:`<svg viewBox="-110 -105 220 210" width="230" role="img" aria-label="燈塔的光從12點方向開始轉" id="tn"></svg>

/* 布丁裝盒、裝箱 */

W.packs=(o)=>({

  html:`<svg viewBox="0 0 340 170" width="340" role="img" aria-label="${o.n}個${o.item}" id="pk8"></svg>

    <div class="wbtns"><button type="button" class="wbtn" id="pk1">每${o.a}個裝1盒</button><button type="button" class="wbtn" id="pk2">每${o.b}盒裝1箱</button></div><p class="cap" id="pkCap">${o.n}個${o.item}。</p>`,

  mount(box,H){let st=0;const boxes=o.n/o.a,crates=boxes/o.b;

    const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="5" style="fill:#f2c25b" class="ink-s" stroke-width="1.5"/><path d="M${x-4} ${y-2} q4 -5 8 0" style="fill:#a9563b"/>`;

    const bx=(x,y)=>{let s=`<rect x="${x}" y="${y}" width="${o.a*11+6}" height="18" rx="3" style="fill:#fbe3e6" class="ink-s" stroke-width="1.5"/>`;for(let i=0;i<o.a;i++)s+=dot(x+8+i*11,y+9);return s;};

    function draw(){if(!box.isConnected)return;let s='';

      if(st===0){for(let i=0;i<o.n;i++)s+=dot(20+(i%12)*26,20+Math.floor(i/12)*30);}

      else if(st===1){const w=o.a*11+12;const per=Math.floor(320/w);for(let i=0;i<boxes;i++)s+=bx(12+(i%per)*w,14+Math.floor(i/per)*26);}

      else{const cw=150;for(let c=0;c<crates;c++){const X=14+c*(cw+20);s+=`<rect x="${X}" y="10" width="${cw}" height="150" rx="6" style="fill:#c9a06c" class="ink-s" stroke-width="2.5"/>`;

        for(let i=0;i<o.b;i++)s+=bx(X+8+(i%2)*70,18+Math.floor(i/2)*34);}}

      box.querySelector('#pk8').innerHTML=s;}

    H.$('#pk1',box).onclick=()=>{st=1;H.SFX.play('paper');draw();H.$('#pkCap',box).textContent=`${o.n}÷${o.a}＝${boxes}，裝成${boxes}盒。`;};

    H.$('#pk2',box).onclick=()=>{if(st<1){H.$('#pkCap',box).textContent=`先裝成盒，才能裝箱喔。`;return;}st=2;H.SFX.play('ok');draw();H.$('#pkCap',box).textContent=`${boxes}盒，每${o.b}盒裝1箱：${boxes}÷${o.b}＝${crates}箱。合起來寫：（${o.n}÷${o.a}）÷${o.b}＝${crates}。`;};

    draw();return{box(){H.$('#pk1',box).click();},crate(){H.$('#pk2',box).click();}};

  }

});

/* 四邊形：找平行的對邊 */

W.quads=()=>({

  html:`<svg viewBox="0 0 345 165" width="345" role="img" aria-label="甲乙丙三個四邊形" id="qd8"></svg>

/* 數線上的分數 */

W.fline=(o)=>({

  html:`<svg viewBox="0 0 350 110" width="350" role="img" aria-label="0到${o.max}的數線" id="fl8"></svg>

  mount(box,H){let on=false;const x0=25,U=300/o.max;

/* 小數直式：小數點要對齊 */

  html:`<div class="vbox"><div id="da"></div></div><div class="wbtns"><button type="button" class="wbtn" id="daBtn">把小數點對齊</button></div><p class="cap" id="daCap">${o.cap}</p>`,

/* 1平方公尺 */

W.m2=()=>({

/* ================= 第10島的教具 ================= */



/* 植樹：間隔數和棵數 */

W.trees=(o)=>({

  html:`<svg viewBox="0 0 350 ${o.closed?190:130}" width="350" role="img" aria-label="${o.closed?'圓形花圃':'一條步道'}" id="tr10"></svg><div class="wbtns"><button type="button" class="wbtn" id="trBtn">每${o.gap}公尺種一棵</button></div><p class="cap" id="trCap">${o.cap}</p>`,

  mount(box,H){let n=-1;const k=o.len/o.gap;

    const tree=(x,y)=>`<g transform="translate(${x} ${y})"><rect x="-2.5" y="0" width="5" height="12" style="fill:#7a5536"/><circle cy="-8" r="11" style="fill:#6fae4f" class="ink-s" stroke-width="1.5"/></g>`;

    function draw(){if(!box.isConnected)return;let s='';

      if(!o.closed){const x0=25,U=300/o.len;s+=`<line x1="${x0}" y1="80" x2="${x0+300}" y2="80" style="stroke:#e8cf98" stroke-width="12" stroke-linecap="round"/><text x="${x0}" y="118" class="lbl-s">0</text><text x="${x0+300}" y="118" class="lbl-s">${o.len}公尺</text>`;

        for(let i=0;i<k;i++){s+=`<path d="M${x0+i*o.gap*U+4} 98 h${o.gap*U-8}" class="acc-s" stroke-width="2"/>`;if(n>=0)s+=`<text x="${x0+(i+.5)*o.gap*U}" y="112" class="lbl-s" style="fill:var(--accent);font-size:10px">${o.gap}公尺</text>`;}

        if(n>=0)for(let i=0;i<=Math.min(n,k);i++)s+=tree(x0+i*o.gap*U,64);}

      else{const cx=175,cy=95,R=70;s+=`<circle cx="${cx}" cy="${cy}" r="${R}" style="fill:#cde3ad;stroke:#e8cf98" stroke-width="10"/><text x="${cx}" y="${cy+5}" class="lbl-s">一圈${o.len}公尺</text>`;

        if(n>=0)for(let i=0;i<Math.min(n,k);i++){const t=-Math.PI/2+i*2*Math.PI/k;s+=tree(cx+R*Math.cos(t),cy+R*Math.sin(t)+4);const t2=t+Math.PI/k;s+=`<text x="${cx+(R+20)*Math.cos(t2)}" y="${cy+(R+20)*Math.sin(t2)+4}" class="lbl-s" style="fill:var(--accent);font-size:10px">${o.gap}</text>`;}}

      box.querySelector('#tr10').innerHTML=s;}

    H.$('#trBtn',box).onclick=async()=>{const N=o.closed?k:k;for(let i=0;i<=N&&box.isConnected;i++){n=i;draw();H.SFX.play('tick');await H.wait(220);}

      if(box.isConnected)H.$('#trCap',box).textContent=o.closed?`繞一圈，有${k}段，種了${k}棵：最後一段的終點，就是第一棵樹，不用再種。`:`${o.len}÷${o.gap}＝${k}段，可是頭和尾都要種：樹比段數多1棵，一共${k+1}棵。`;};

    draw();return{plant(){H.$('#trBtn',box).click();}};

  }

});

W.area2=(o)=>({

      if(st>=1){for(let i=0;i<o.a[1];i++)s+=`<rect x="${X+i*cw}" y="${Y}" width="${cw}" height="${Hh}" style="fill:${i<o.a[0]?'#f7e7a6':'none'}" class="ink-s" stroke-width="1.5"/>`;}

      if(st>=2){for(let j=0;j<o.b[1];j++)s+=`<line x1="${X}" y1="${Y+j*rh}" x2="${X+Wd}" y2="${Y+j*rh}" class="ink-s" stroke-width="1" stroke-dasharray="4 3"/>`;

/* 撕下三個角拼一拼 */

W.tear=(o)=>({

  html:`<svg viewBox="0 0 350 200" width="350" role="img" aria-label="三角形" id="te10"></svg><div class="wbtns">${o.tris.map((t,i)=>`<button type="button" class="wbtn" data-t="${i}">撕下${t.name}的三個角</button>`).join('')}</div><p class="cap" id="teCap">每個三角形的三個角，塗上三種顏色。</p>`,

  mount(box,H){let on=-1;const C=['var(--berry)','var(--juice-a)','var(--water)'];

    const ang=(p,q,r)=>{const a=Math.atan2(q[1]-p[1],q[0]-p[0]),b=Math.atan2(r[1]-p[1],r[0]-p[0]);let d=b-a;while(d<=-Math.PI)d+=2*Math.PI;while(d>Math.PI)d-=2*Math.PI;return[a,d];};

    const wedge=(c,a0,d,r,col)=>{const a1=a0+d,sw=d>0?1:0,big=Math.abs(d)>Math.PI?1:0;return`<path d="M${c[0]} ${c[1]} L${(c[0]+r*Math.cos(a0)).toFixed(1)} ${(c[1]+r*Math.sin(a0)).toFixed(1)} A${r} ${r} 0 ${big} ${sw} ${(c[0]+r*Math.cos(a1)).toFixed(1)} ${(c[1]+r*Math.sin(a1)).toFixed(1)}Z" style="fill:${col}" opacity=".85"/>`;};

    function draw(){if(!box.isConnected)return;let s='';

      o.tris.forEach((t,ti)=>{const P=t.pts;s+=`<polygon points="${P.map(p=>p.join(',')).join(' ')}" class="soft-f ink-s" stroke-width="2"/>`;

        for(let i=0;i<3;i++){const[a,d]=ang(P[i],P[(i+1)%3],P[(i+2)%3]);s+=wedge(P[i],a,d,16,C[i]);}

        s+=`<text x="${t.label[0]}" y="${t.label[1]}" class="lbl">${t.name}</text>`;});

      if(on>=0){const P=o.tris[on].pts,c=[175,185];let a0=Math.PI;s+=`<line x1="80" y1="185" x2="270" y2="185" class="ink-s" stroke-width="2"/>`;

        for(let i=0;i<3;i++){const[,d]=ang(P[i],P[(i+1)%3],P[(i+2)%3]);const dd=Math.abs(d);s+=wedge(c,a0,dd,40,C[i]);a0+=dd;}

        s+=`<text x="175" y="132" class="lbl-s" style="fill:var(--accent)">拼成一條直線：180度</text>`;}

      box.querySelector('#te10').innerHTML=s;}

    box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{on=+b.dataset.t;H.SFX.play('paper');draw();H.$('#teCap',box).textContent=`${o.tris[on].name}的三個角拼在一起，剛好拼成一條直線（平角）：三個角加起來是180度。`;});

    draw();return{show(i){box.querySelector(`[data-t="${i}"]`).click();}};

  }

});



/* 三根竹籤：能不能圍成三角形 */

W.sticks=(o)=>({

  html:`<svg viewBox="0 0 340 170" width="340" role="img" aria-label="三根竹籤" id="sk10"></svg><div class="wbtns">${o.sets.map((s,i)=>`<button type="button" class="wbtn" data-s="${i}">${s.join('、')}公分</button>`).join('')}</div><p class="cap" id="skCap">選一組竹籤，圍圍看。</p>`,

  mount(box,H){

    function show(i){const[a,b,c]=o.sets[i].slice().sort((x,y)=>x-y);const u=30,X=30,Y=140;let s=`<line x1="${X}" y1="${Y}" x2="${X+c*u}" y2="${Y}" style="stroke:#a8774d" stroke-width="7" stroke-linecap="round"/><text x="${X+c*u/2}" y="${Y+22}" class="lbl-s">${c}</text>`;

      if(a+b>c){const x=(a*a-b*b+c*c)/(2*c),y=Math.sqrt(a*a-x*x);const T=[X+x*u,Y-y*u];s+=`<line x1="${X}" y1="${Y}" x2="${T[0]}" y2="${T[1]}" style="stroke:#c9a06c" stroke-width="7" stroke-linecap="round"/><line x1="${X+c*u}" y1="${Y}" x2="${T[0]}" y2="${T[1]}" style="stroke:#e9b44c" stroke-width="7" stroke-linecap="round"/>`;

        s+=`<text x="${X+x*u/2-10}" y="${Y-y*u/2}" class="lbl-s">${a}</text><text x="${(T[0]+X+c*u)/2+12}" y="${Y-y*u/2}" class="lbl-s">${b}</text>`;H.SFX.play('ok');H.$('#skCap',box).textContent=`${a}＋${b}＝${a+b}，比${c}長，可以圍成三角形。`;}

      else{s+=`<line x1="${X}" y1="${Y}" x2="${X+a*u*.97}" y2="${Y-a*u*.25}" style="stroke:#c9a06c" stroke-width="7" stroke-linecap="round"/><line x1="${X+c*u}" y1="${Y}" x2="${X+c*u-b*u*.97}" y2="${Y-b*u*.25}" style="stroke:#e9b44c" stroke-width="7" stroke-linecap="round"/><text x="${X+a*u/2}" y="${Y-a*u*.12-12}" class="lbl-s">${a}</text><text x="${X+c*u-b*u/2}" y="${Y-b*u*.12-12}" class="lbl-s">${b}</text>`;

        H.SFX.play('retry');H.$('#skCap',box).textContent=`${a}＋${b}＝${a+b}，${a+b===c?'剛好等於':'比'+c+'短'}${a+b===c?c:''}，兩根短的碰不到一起，圍不成三角形。`;}

      box.querySelector('#sk10').innerHTML=s;}

    box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>show(+b.dataset.s));

/* 披薩：圓心角和扇形 */

W.sectors=(o)=>({

  html:`<svg viewBox="0 0 340 170" width="340" role="img" aria-label="大小兩個披薩" id="se10"></svg><div class="wbtns"><button type="button" class="wbtn" id="seBtn">量圓心角</button></div><p class="cap" id="seCap">${o.cap}</p>`,

/* 水箱：放進石頭 */

W.tank=(o)=>({

  mount(box,H){let h=o.h0,in_=false;const X=60,Y=170,Wd=180,S=8;

    function draw(){if(!box.isConnected)return;let s=`<rect x="${X}" y="${Y-h*S}" width="${Wd}" height="${h*S}" style="fill:#9fd3dc" opacity=".8"/>`;

      if(in_)s+=`<path d="M${X+60} ${Y} q10 -36 40 -30 q30 6 24 30Z" style="fill:#8d969b" class="ink-s" stroke-width="2"/>`;

      s+=`<path d="M${X} ${Y-160} V${Y} H${X+Wd} V${Y-160}" fill="none" class="ink-s" stroke-width="3"/>`;

const tree=(x,y)=>`<g transform="translate(${x} ${y})"><rect x="-2.5" y="0" width="5" height="10" style="fill:#7a5536"/><circle cy="-7" r="9" style="fill:#6fae4f" class="ink-s" stroke-width="1.2"/></g>`;

// 一條步道：mode = both（兩端都種）、none（兩端都不種）、one（起點種、終點不種）；two = 道路兩旁。

function rowSVG(len,gap,mode,two){

 const k=len/gap,x0=30,U=290/len,road=two?92:72,H=two?165:125;let s=`<svg viewBox="0 0 350 ${H}" width="350" role="img" aria-label="長${len}公尺的步道，每${gap}公尺一個間隔">`;

 s+=`<rect x="${x0}" y="${road-8}" width="290" height="16" rx="8" style="fill:#e8cf98"/>`;

 for(let i=0;i<k;i++)s+=`<text x="${x0+(i+.5)*gap*U}" y="${road+5}" class="lbl-s" style="font-size:10px;fill:var(--accent)">${gap}公尺</text>`;

 if(mode==='none'){[x0-14,x0+290+14].forEach(x=>s+=`<rect x="${x-11}" y="${road-30}" width="22" height="22" style="fill:#d9b994" class="ink-s"/><path d="M${x-14} ${road-30} l14 -10 l14 10z" style="fill:#a8774d"/><text x="${x}" y="${road+22}" class="lbl-s" style="font-size:10px">涼亭</text>`);}

 if(mode==='one')s+=`<rect x="${x0+290+2}" y="${road-26}" width="6" height="34" style="fill:#7a5536"/><text x="${x0+290+5}" y="${road+22}" class="lbl-s" style="font-size:10px">大門</text>`;

 const pos=[];for(let i=0;i<=k;i++){if(mode==='none'&&(i===0||i===k))continue;if(mode==='one'&&i===k)continue;pos.push(i);}

 pos.forEach(i=>{s+=tree(x0+i*gap*U,road-18);if(two)s+=tree(x0+i*gap*U,road+28);});

 s+=`<text x="${x0}" y="${H-6}" class="lbl-s">0</text><text x="${x0+290}" y="${H-6}" class="lbl-s">${len}公尺</text>`;

 return s+'</svg>';}

function squareSVG(side,gap){

 const k=side/gap,X=95,Y=25,S=160,u=S/side;let s=`<svg viewBox="0 0 350 215" width="350" role="img" aria-label="每邊${side}公尺的正方形花圃"><rect x="${X}" y="${Y}" width="${S}" height="${S}" style="fill:#cde3ad;stroke:#e8cf98" stroke-width="8"/>`;

 const pts=[];for(let i=0;i<k*4;i++){const side_=Math.floor(i/k),t=(i%k)*gap*u;pts.push(side_===0?[X+t,Y]:side_===1?[X+S,Y+t]:side_===2?[X+S-t,Y+S]:[X,Y+S-t]);}

 pts.forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r="7" style="fill:#f7d774" class="ink-s" stroke-width="1.5"/>`);

 s+=`<text x="${X+S/2}" y="${Y+S/2+5}" class="lbl-s">每邊${side}公尺</text><text x="${X+S/2}" y="${Y+S+28}" class="lbl-s">黃色圓點是燈</text>`;

 return s+'</svg>';}

const multiples=(n,max)=>Array.from({length:Math.floor(max/n)},(_,i)=>(i+1)*n);

const factors=n=>Array.from({length:n},(_,i)=>i+1).filter(d=>n%d===0);

function colCalc(units,rows,sumRow){return `<div class="t10-col"><span></span>${units.map(u=>`<b>${u}</b>`).join('')}${rows.map(r=>`<span>${r[0]||''}</span>${r.slice(1).map(v=>`<span>${v}</span>`).join('')}`).join('')}<span class="rule"></span>${sumRow?`<span></span>${sumRow.map(v=>`<span>${v}</span>`).join('')}`:''}</div>`;}

function boxPath(x,y,l,w,h,u,fill){const d=w*u*.5,L=l*u,Hh=h*u;

 return `<polygon points="${x},${y} ${x+L},${y} ${x+L},${y-Hh} ${x},${y-Hh}" style="fill:${fill}" class="ink-s" stroke-width="1.6"/>`+

  `<polygon points="${x},${y-Hh} ${x+L},${y-Hh} ${x+L+d},${y-Hh-d} ${x+d},${y-Hh-d}" style="fill:#fff6e4" class="ink-s" stroke-width="1.6"/>`+

  `<polygon points="${x+L},${y} ${x+L+d},${y-d} ${x+L+d},${y-Hh-d} ${x+L},${y-Hh}" style="fill:#c9a06c" class="ink-s" stroke-width="1.6"/>`;}

const lab=(x,y,t,anchor)=>`<text x="${x}" y="${y}" class="lbl-s"${anchor?` style="text-anchor:${anchor}"`:''}>${t}</text>`;

function stepBoxSVG(){const u=19,x=50,y=190;let s=`<svg viewBox="0 0 350 225" width="350" role="img" aria-label="兩個貨箱疊成階梯形">`;

 s+=boxPath(x,y,10,3,5,u,'#e9c98f')+boxPath(x+4*u,y-5*u,6,3,3,u,'#f1d9a8');

 s+=lab(x+5*u,y+18,'10公分')+lab(x-6,y-2.5*u+4,'5公分','end')+lab(x+2*u,y-5*u-6,'4公分')+lab(x+7*u+14,y-8*u-14,'6公分')+lab(x+10*u+3*u*.5+8,y-4*u,'8公分','start')+lab(x+10*u+16,y+2,'3公分','start');

 return s+'</svg>';}

function cupsSVG(a,b){const cup=(x,v,stone)=>{const Y=175,S=0.15;let s=`<rect x="${x}" y="${Y-v*S}" width="70" height="${v*S}" style="fill:#9fd3dc" opacity=".85"/>`;

  if(stone)s+=`<path d="M${x+18} ${Y} q8 -34 30 -26 q18 8 10 26Z" style="fill:#8d969b" class="ink-s" stroke-width="1.5"/>`;

  s+=`<path d="M${x} ${Y-160} V${Y} H${x+70} V${Y-160}" fill="none" class="ink-s" stroke-width="2.5"/>`;

  for(let m=100;m<=1000;m+=100)s+=`<line x1="${x+70}" y1="${Y-m*S}" x2="${x+62}" y2="${Y-m*S}" class="ink-s"/>${m%200===0?`<text x="${x+74}" y="${Y-m*S+4}" class="lbl-s" style="font-size:9px;text-anchor:start">${m}</text>`:''}`;

  return s;};

 return `<svg viewBox="0 0 350 200" width="350" role="img" aria-label="量杯的水面從${a}毫公升升到${b}毫公升">${cup(45,a,false)}${cup(205,b,true)}${lab(80,196,'放石頭前')}${lab(240,196,'放石頭後')}</svg>`;}

function jamBarSVG(split){const X=40,Y=20,W_=270,H_=90;let s=`<svg viewBox="0 0 350 140" width="350" role="img" aria-label="一罐果醬分成5份，塗色4份${split?'，每份再分成3小份':''}"><rect x="${X}" y="${Y}" width="${W_}" height="${H_}" style="fill:#fffdf6" class="ink-s" stroke-width="2"/>`;

 if(split){for(let j=1;j<3;j++)s+=`<line x1="${X}" y1="${Y+j*H_/3}" x2="${X+W_}" y2="${Y+j*H_/3}" class="ink-s" stroke-width="1.2" stroke-dasharray="5 4"/>`;

  for(let i=0;i<4;i++)s+=`<rect x="${X+i*W_/5}" y="${Y}" width="${W_/5}" height="${H_/3}" style="fill:#7a2a3a" opacity=".55"/>`;}

 s+=lab(X+W_/2,Y+H_+22,split?'整罐變成15小份，每瓶分到深色的4小份':'整罐平分成5份，有4份是果醬');return s+'</svg>';}

function eighthSVG(){const cx=175,cy=95,r=75;let s=`<svg viewBox="0 0 350 190" width="350" role="img" aria-label="圓形紙平分成8份，塗色1份"><circle cx="${cx}" cy="${cy}" r="${r}" style="fill:#fff6e4" class="ink-s" stroke-width="2"/>`;
