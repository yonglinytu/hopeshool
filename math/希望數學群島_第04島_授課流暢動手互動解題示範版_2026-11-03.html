    <rect x="30" y="30" width="96" height="96" rx="4" class="soft-f ink-s" stroke-width="3"/><text x="78" y="84" class="lbl">小安</text>


    <rect x="170" y="46" width="160" height="80" rx="4" class="soft-f ink-s" stroke-width="3"/><text x="250" y="92" class="lbl">小晴</text>


    <g id="cdL" opacity="0"><text x="78" y="22" class="lbl-s" style="fill:var(--accent)">6公分</text><text x="78" y="144" class="lbl-s" style="fill:var(--accent)">6公分</text><text x="16" y="82" class="lbl-s" style="fill:var(--accent)">6</text><text x="140" y="82" class="lbl-s" style="fill:var(--accent)">6</text>


      <text x="250" y="38" class="lbl-s" style="fill:var(--accent)">8公分</text><text x="250" y="144" class="lbl-s" style="fill:var(--accent)">8公分</text><text x="158" y="90" class="lbl-s" style="fill:var(--accent)">5</text><text x="344" y="90" class="lbl-s" style="fill:var(--accent)">5</text></g>

  mount(box,H){H.$('#cdBtn',box).onclick=()=>{box.querySelector('#cdL').setAttribute('opacity','1');H.SFX.play('pencil');H.$('#cdCap',box).textContent='正方形的四條邊都是6公分。長方形上面和下面都是8公分，左邊和右邊都是5公分。';};


    return{show(){H.$('#cdBtn',box).click();}};}

/* 兩個水壺：倒過去比容量；用同一個杯子量 */


W.bottles=(o)=>({


  html:`<svg viewBox="0 0 320 190" width="320" role="img" aria-label="甲水壺高高瘦瘦，乙水壺矮矮胖胖" id="bt"></svg>


    <div class="wbtns">${o.cups?'<button type="button" class="wbtn" id="btC">用同一個杯子量</button>':'<button type="button" class="wbtn" id="btP">把甲裝滿，倒進乙</button>'}</div><p class="cap" id="btCap">${o.cups?'同一個小杯子，量量看各裝幾杯。':'甲高高瘦瘦，乙矮矮胖胖。'}</p>`,


  mount(box,H){


    const A={x:60,y:20,w:50,h:150},B={x:180,y:80,w:110,h:90};let fa=1,fb=0,cups=null;


    function draw(){if(!box.isConnected)return;let s='';


      [[A,fa,'甲'],[B,fb,'乙']].forEach(([b,f,n])=>{s+=`<rect x="${b.x}" y="${b.y+b.h*(1-f)}" width="${b.w}" height="${b.h*f}" class="water" opacity=".8"/><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6" fill="none" class="ink-s" stroke-width="3"/><text x="${b.x+b.w/2}" y="${b.y+b.h+16}" class="lbl">${n}</text>`;});


      if(cups)s+=`<text x="${A.x+A.w/2}" y="${A.y-4}" class="lbl" style="fill:var(--accent)">${cups[0]}杯</text><text x="${B.x+B.w/2}" y="${B.y-6}" class="lbl" style="fill:var(--accent)">${cups[1]}杯</text>`;


      box.querySelector('#bt').innerHTML=s;}


    async function pour(){fa=1;fb=0;draw();H.SFX.play('pour');for(let i=1;i<=20&&box.isConnected;i++){fa=1-i/20;fb=i/20*(4/5);draw();await H.wait(45);}


      if(box.isConnected)H.$('#btCap',box).textContent='甲的水全部倒進乙，乙還沒有滿。乙裝得比較多。';}


    if(!o.cups){fa=1;fb=0;H.$('#btP',box).onclick=pour;}


    else{fa=1;fb=1;H.$('#btC',box).onclick=()=>{cups=[4,5];H.SFX.play('drip');draw();H.$('#btCap',box).textContent='用同一個杯子：甲裝了4杯，乙裝了5杯。';};}


    draw();return{pour,cups(){if(o.cups)H.$('#btC',box).click();}};


  }


});





/* 天平：兩樣東西比重 */


W.balance2=(pairs)=>({


  html:`<svg viewBox="0 0 300 170" width="300" role="img" aria-label="天平" id="b2"></svg>


    <div class="wbtns">${pairs.map((p,i)=>`<button type="button" class="wbtn" data-pr="${i}">比${p[0]}和${p[1]}</button>`).join('')}</div><p class="cap" id="b2Cap">選一組放上天平。</p>`,


  mount(box,H){


    let cur=-1;


    function draw(){if(!box.isConnected)return;const p=pairs[cur]||['','',0];const tilt=cur<0?0:(p[2]>0?-10:10);


      let s=`<path d="M150 160 V60" class="ink-s" stroke-width="5"/><path d="M120 162 H180" class="ink-s" stroke-width="6" stroke-linecap="round"/>


        <g style="transition:transform .6s;transform-origin:150px 60px;transform:rotate(${tilt}deg)"><line x1="40" y1="60" x2="260" y2="60" class="ink-s" stroke-width="5" stroke-linecap="round"/>


        <path d="M40 60 L18 100 H62 Z" class="soft-f ink-s" stroke-width="2"/><path d="M260 60 L238 100 H282 Z" class="soft-f ink-s" stroke-width="2"/>


        ${cur<0?'':`<text x="40" y="94" class="lbl" style="font-weight:700">${p[0]}</text><text x="260" y="94" class="lbl" style="font-weight:700">${p[1]}</text>`}</g><circle cx="150" cy="60" r="6" class="ink-f"/>`;


      box.querySelector('#b2').innerHTML=s;}


    function pick(i){cur=i;H.SFX.play('swoosh');draw();const p=pairs[i];H.$('#b2Cap',box).textContent=`天平往${p[2]>0?p[0]:p[1]}那邊沉下去：${p[2]>0?p[0]:p[1]}比較重。`;}


    box.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>pick(+b.dataset.pr));draw();


    return{pick};


  }


});

const same=(v,arr)=>arr.length===v.length&&arr.every((x,i)=>x===v[i]);





const PLACES=[
