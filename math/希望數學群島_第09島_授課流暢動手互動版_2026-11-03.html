/* 操場跑圈：公尺和公里 */
W.track=(o)=>({
  html:`<svg viewBox="0 0 340 150" width="340" role="img" aria-label="一圈${o.lap}公尺的操場" id="tk"><rect x="40" y="25" width="260" height="100" rx="50" fill="none" style="stroke:#d9a07a" stroke-width="16"/><rect x="40" y="25" width="260" height="100" rx="50" fill="none" style="stroke:#fff" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="72" y="45" width="196" height="60" rx="30" style="fill:#b6d68a"/><text x="170" y="80" class="lbl" id="tkN">0 圈</text><circle id="tkR" r="8" class="acc-f"/></svg>

  mount(box,H){let laps=0,busy=false;const pt=t=>{const P=2*(160)+Math.PI*100;let d=t*P;const R=50;
      if(d<160)return[90+d,25];d-=160;if(d<Math.PI*R){const a=-Math.PI/2+d/R;return[250+R*Math.cos(a),75+R*Math.sin(a)];}d-=Math.PI*R;
      if(d<160)return[250-d,125];d-=160;const a=Math.PI/2+d/R;return[90+R*Math.cos(a),75+R*Math.sin(a)];};
    function put(t){const[x,y]=pt(t%1);const c=box.querySelector('#tkR');c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1));}

    H.$('#tkBtn',box).onclick=run;H.$('#tkRst',box).onclick=()=>{laps=0;put(0);cap();H.$('#tkCap',box).textContent=`操場跑一圈是${o.lap}公尺。`;};put(0);

/* 積木：數一數有幾個1立方公分 */
function isoCubes(stacks,opt){const c=15,hs=15,P=(x,y,z,ox,oy)=>[ox+(x-y)*c,oy+(x+y)*hs/2-z*hs];let s='',n=0;
  stacks.forEach((st,si)=>{const[l,w,h]=st.size,ox=st.ox,oy=st.oy;const list=[];
    for(let z=0;z<h;z++)for(let y=0;y<w;y++)for(let x=0;x<l;x++)list.push([x,y,z]);
    list.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])||a[2]-b[2]);
    list.forEach(([x,y,z])=>{const gz=opt.split?z*10:0;const q=(a,b,d)=>{const p=P(a,b,d,ox,oy-gz);return p[0].toFixed(1)+','+p[1].toFixed(1);};
      const col=opt.color?opt.color(si,z):st.color||'var(--juice-a)';
      s+=`<polygon points="${q(x,y,z+1)} ${q(x+1,y,z+1)} ${q(x+1,y+1,z+1)} ${q(x,y+1,z+1)}" style="fill:${opt.top||'#fff6e4'}" class="ink-s" stroke-width="1.5"/>`+
         `<polygon points="${q(x+1,y,z)} ${q(x+1,y+1,z)} ${q(x+1,y+1,z+1)} ${q(x+1,y,z+1)}" style="fill:${opt.side||'#c9a06c'}" class="ink-s" stroke-width="1.5"/>`+
         `<polygon points="${q(x,y+1,z)} ${q(x+1,y+1,z)} ${q(x+1,y+1,z+1)} ${q(x,y+1,z+1)}" style="fill:${col}" class="ink-s" stroke-width="1.5"/>`;n++;});
    if(st.name)s+=`<text x="${ox}" y="${oy+(l+w)*hs/2+22}" class="lbl-s">${st.name}</text>`;});
  return s;}
W.cubes=(o)=>({
  html:`<svg viewBox="0 0 340 ${o.h||170}" width="340" role="img" aria-label="${o.alt||'積木'}" id="cb"></svg><div class="wbtns">${o.btns.map((b,i)=>`<button type="button" class="wbtn" data-b="${i}">${b[0]}</button>`).join('')}</div><p class="cap" id="cbCap">${o.cap}</p>`,
  mount(box,H){let opt={};
    function draw(){if(!box.isConnected)return;box.querySelector('#cb').innerHTML=isoCubes(o.stacks,opt);}

/* 燈塔的光：旋轉角 */
W.turn=()=>({

  w:()=>W.fold({name:'長方形',pts:[[50,50],[250,50],[250,160],[50,160]],axes:[{label:'直的中線',a:[150,30],b:[150,180]},{label:'橫的中線',a:[30,105],b:[270,105]},{label:'對角線',a:[50,50],b:[250,160]}]}),
  steps:[
   {id:'r1a',type:'choice',label:'對角線也是？',q:'小安說長方形的對角線也是對稱軸。你同意嗎？按「沿對角線對摺」。',
    opts:[['同意',0,'沿對角線對摺，兩邊對不上喔。看看虛線。'],['不同意，對角線不是對稱軸',1],['我還不確定',1,'三種對摺都試試看。']],after:c=>c.fold(2),ok:[['小安','對角線對摺會歪掉，疊不起來。']]},
   {id:'r1b',type:'fields',label:'長方形幾條',q:'長方形一共有幾條對稱軸？',fields:['條'],
    check:(p,[a])=>a===2?null:a===4?'正方形才有4條。長方形的對角線不是。':'直的中線和橫的中線，都試試看。',reveal:'長方形有2條對稱軸：直的中線、橫的中線。',ok:[['珊瑚博士','對摺以後完全疊合，才是對稱軸。']]}
  ],
  teacher:[['目標','認識線對稱圖形，找出對稱軸（可能不只一條）。'],['迷思','以為長方形的對角線是對稱軸。'],['實物','剪下長方形紙片，實際對摺。']]},
 {short:'平行四邊形',title:'第二站　斜斜的磁磚',topic:'不是線對稱的圖形',
  talk:[['珊瑚博士','觀察站地上的磁磚是平行四邊形。'],['小晴','平行四邊形兩邊一樣長、一樣斜，一定是線對稱圖形！']],
  w:()=>W.fold({name:'平行四邊形',pts:[[30,160],[190,160],[270,50],[110,50]],axes:[{label:'直的線',a:[150,30],b:[150,180]},{label:'橫的線',a:[20,105],b:[280,105]},{label:'對角線',a:[30,160],b:[270,50]}]}),
  steps:[
   {id:'r2a',type:'choice',label:'平行四邊形對稱？',q:'每一條線都對摺看看。平行四邊形是線對稱圖形嗎？',
    opts:[['不是，找不到可以完全疊合的對摺線',1],['是',0,'三條線都試試看，虛線有沒有和原來的形狀重疊？'],['我還不確定',1,'三條線都對摺看看。']],after:c=>c.fold(0),ok:[['小晴','怎麼摺都疊不起來。它的對邊一樣長，但不是線對稱。']]}
  ],
  teacher:[['目標','能判斷一個圖形是不是線對稱圖形。'],['迷思','以為平行四邊形是線對稱圖形。'],['提醒','讓孩子實際剪下來對摺，再和別人的摺法比較。']]},
 {short:'海星',title:'第三站　五隻手的海星',topic:'正多邊形的對稱軸',
  talk:[['珊瑚博士','這隻海星的身體，可以看成一個正五邊形。'],['小安','它有幾條對稱軸呢？']],
  w:()=>W.fold({name:'正五邊形',pts:PENTA,axes:PENTA.map((p,i)=>{const q=[300-0,0];const c=[150,108];const dx=c[0]-p[0],dy=c[1]-p[1];return{label:`第${i+1}條線`,a:[+(p[0]-dx*.2).toFixed(2),+(p[1]-dy*.2).toFixed(2)],b:[+(c[0]+dx*1.05).toFixed(2),+(c[1]+dy*1.05).toFixed(2)]};}),cap:'每一條線，都從一個角穿過中心。'}),
  steps:[
   {id:'r3a',type:'fields',label:'正五邊形幾條',q:'把每一條線都對摺看看。正五邊形有幾條對稱軸？',fields:['條'],
    check:(p,[a])=>a===5?null:a===1?'不只一條喔，每一條線都試試看。':'從每一個角穿過中心，都對摺看看。',reveal:'正五邊形有5條對稱軸。',after:c=>c.fold(1),ok:[['珊瑚博士','正五邊形5條，正六邊形呢？回去可以剪剪看。']]}
  ],
  teacher:[['目標','知道常見的線對稱圖形：等腰三角形、長方形、正方形、菱形、正多邊形、圓。'],['延伸','對應點的連線和對稱軸互相垂直；給一半的圖形，請孩子畫出另一半。']]},
 {short:'立體',title:'第四站　研究站的容器',topic:'柱和錐',
  talk:[['珊瑚博士','這些是研究站的容器形狀。'],['小晴','乙和甲都有圓，所以它們是同一類。']],
  w:()=>W.solids9(),
  steps:[
   {id:'r4a',type:'choice',label:'怎麼分類',q:'按「把底面塗上顏色」。如果分成「柱」和「錐」兩類，哪兩個是錐？',
    opts:[['乙和丁',1],['甲和乙',0,'甲有兩個一樣的底面，乙只有一個底面和一個尖尖的頂點，不一樣喔。'],['丙和丁',0,'丙上下各有一個三角形底面，是柱。']],after:c=>c.show(),ok:[['小晴','有兩個一樣的底面是柱，一個底面加一個頂點是錐。']]}
  ],
  teacher:[['目標','認識圓柱、圓錐、角柱、角錐，依外觀大致分類。'],['實物','剪下附件摺出立體形體；展開圖只當操作工具。']]},
 cardScene('珊瑚博士','今天你找到了好多對稱軸，還分出了柱和錐。')
 ]},

/* ======================= 研究站餐廳 ======================= */
{id:'cafe',name:'研究站餐廳',zone:'A本・東邊',unit:'分數（四）',day:'星期四',keeper:'廚師阿樂',pin:[81.7,56],
 story:'切蛋糕',intro:'廚師阿樂做了海綿蛋糕。蛋糕可以切得更細，也可以把小塊合成大塊。',
 source:'A本 秘技一「擴分」、秘技二「約分」',limit:'教學順序：真分數 → 假分數 → 帶分數；約分從較小、偶數的數字開始。',
 starters:['分子分母同乘一個數','分子分母同除一個數','帶分數的整數部分不用動'],
 bye:'謝謝你！蛋糕切得剛剛好。',
 scenes:[
 {short:'擴分',title:'第一站　切得更細',topic:'擴分',
  talk:[['廚師阿樂','這條蛋糕平分成3塊，小晴拿了2塊，是3分之2條。'],['小安','要換成更細的切法：分子分母都加2，3分之2＝5分之4！']],
  w:()=>W.bar2({n:3,k:2,to:12,btn:'每一塊再切成4小塊',cap:'上面是3分之2條。',after:'每一塊切成4小塊：全部3×4＝12小塊，拿的2塊變成2×4＝8小塊。3分之2＝12分之8。'}),
  steps:[
   {id:'c1a',type:'choice',label:'都加2？',q:'小安說分子分母都加2，3分之2＝5分之4。你同意嗎？',
    opts:[['同意',0,'5分之4比3分之2大喔。切得更細，拿的量不會變。'],['不同意，要同時乘一樣的數',1],['我還不確定',1,'按「每一塊再切成4小塊」看看。']],
    after:c=>c.go(),ok:[['小安','每一塊切成4小塊，分子分母都乘4。']]},
   {id:'c1b',type:'fields',label:'3分之2＝12分之幾',q:'3分之2＝12分之幾？',pre:['3分之2＝12分之'],fields:[''],
    check:(p,[a])=>a===8?null:a===4?'不是加2，是乘4：2×4＝？':'每一塊切成4小塊，2塊變成幾小塊？',reveal:'分子分母同乘4：3分之2＝12分之8。',ok:[['廚師阿樂','分子分母同乘一個比1大的整數，叫做擴分。']]}
  ],
  teacher:[['目標','擴分：分子和分母同乘一個比1大的整數，得到等值分數。'],['迷思','分子分母同加一個數。'],['提醒','搭配圖示：一大份切成n小份，分母、分子都變成n倍。']]},
 {short:'約分',title:'第二站　合成大塊',topic:'約分',
  talk:[['廚師阿樂','另一條蛋糕切成10小塊，剩下8塊，是10分之8條。'],['小晴','約分就是變簡單：分子分母都減2，10分之8＝8分之6。']],
  w:()=>W.bar2({n:10,k:8,to:5,btn:'每2小塊合成1大塊',cap:'上面是10分之8條。',after:'每2小塊合成1大塊：10小塊變成5大塊，8小塊變成4大塊。10分之8＝5分之4。'}),
  steps:[
   {id:'c2a',type:'choice',label:'都減2？',q:'小晴說約分是分子分母都減2。你同意嗎？',
    opts:[['同意',0,'8分之6和10分之8一樣大嗎？合合看就知道。'],['不同意，要同時除以一樣的數',1],['我還不確定',1,'按「每2小塊合成1大塊」看看。']],
    after:c=>c.go(),ok:[['小晴','每2小塊合成1大塊，分子分母都除以2。']]},
   {id:'c2b',type:'fields',label:'10分之8約分',q:'10分之8＝幾分之幾？（分子分母同除以2）',pre:['10分之8＝',''],fields:['分之',''],
    check:(p,[a,b])=>a===5&&b===4?null:a===8&&b===6?'這是都減2，不是除以2。':'10÷2＝？8÷2＝？',say:(p,[a,b])=>`${a}分之${b}`,
    reveal:'分子分母同除以2：10分之8＝5分之4。',ok:[['廚師阿樂','分子分母同除以一個比1大的整數，叫做約分。2是8和10的公因數。']]}
  ],
  teacher:[['目標','約分：分子和分母同除以一個比1大的整數；連結公因數。'],['迷思','分子分母同減一個數。'],['提醒','約分比擴分難，從較小、偶數的數字開始。']]},
 {short:'帶分數',title:'第三站　一條半多一點',topic:'帶分數的擴分',
  talk:[['廚師阿樂','還有1又5分之2條蛋糕。要換成十分之幾的切法。'],['小安','整數也要乘2：1又5分之2＝2又10分之4！']],
  w:()=>W.html(`<svg viewBox="0 0 340 70" width="340" role="img" aria-label="1條完整的蛋糕和5分之2條">${barSVG(10,10,150,40,[.2,.2,.2,.2,.2],()=>'pick')}${barSVG(180,10,150,40,[.2,.2,.2,.2,.2],i=>i<2?'pick':'')}</svg><p class="cap">1條完整的，再加5分之2條。</p>`),
  steps:[
   {id:'c3a',type:'choice',label:'整數也乘2？',q:'小安說整數也要乘2，變成2又10分之4。你同意嗎？',
    opts:[['同意',0,'切得更細，完整的那1條還是1條，不會變成2條。'],['不同意，整數部分不用變',1],['我還不確定',1,'看看圖：完整的那一條，切細以後還是幾條？']],
    ok:[['小安','完整的1條還是1條，只有5分之2要換成10分之4。']]},
   {id:'c3b',type:'fields',label:'換成十分之幾',q:'1又5分之2＝幾又10分之幾？',pre:['','又',''],fields:['','分之',''],
    check:(p,[a,b,c])=>a===1&&b===10&&c===4?null:a===2?'整數部分不用乘。':b!==10?'題目要換成10分之幾。':'5分之2，分子分母同乘2。',say:(p,[a,b,c])=>`${a}又${b}分之${c}`,
    reveal:'1又5分之2＝1又10分之4（只有真分數的部分要擴分）。',ok:[['廚師阿樂','換成假分數算也可以：5分之7＝10分之14＝1又10分之4。']]}
  ],
  teacher:[['目標','帶分數的擴分與約分：整數部分不需改變。'],['提醒','可透過假分數推導，讓孩子理解為什麼整數部分不用擴分。']]},
 cardScene('廚師阿樂','今天你幫我切蛋糕、合蛋糕，擴分和約分都會了。')
 ]},

/* ======================= 潮汐站 ======================= */
{id:'tide',name:'潮汐站',zone:'B本・東南邊海岸',unit:'小數（三）、小數（四）',day:'星期五',keeper:'潮汐姐姐',pin:[70.7,79],
 story:'量海水',intro:'潮汐站的儀器量得很精細，可以量到小數點後第四位。潮汐姐姐說：位數多，不代表數字大。',
 source:'B本 小數（三）秘技一「認識多位小數」、秘技二「多位小數的比較」、秘技四「小數的乘法（乘數是小數）」；小數（四）秘技一「商為三位小數的整數除法」',limit:'多位小數以三位小數為主；小數乘法以兩位小數互乘為原則；除法的商最多三位小數，不出現循環小數。',
 starters:['從最高位開始比','乘以比1小的數，會變小','不夠除，就補上小數點和0'],
 bye:'謝謝你！今天的潮汐紀錄都完成了。',
 scenes:[
 {short:'比大小',title:'第一站　早上和下午的潮位',topic:'多位小數的比較',
  talk:[['潮汐姐姐','早上的潮位是 2.6527 公尺，下午是 2.656 公尺。'],['小安','2.6527 小數點後面有4位，比較多位，所以早上比較高！']],
  w:()=>W.dcmp4('早上','2.6527','下午','2.656'),
  steps:[

    opts:[['下午的 2.656 公尺',1],['早上的 2.6527 公尺',0,'位數多不代表比較大。從個位開始，一位一位比。'],['一樣高',0,'比到千分位就不一樣了。']],after:c=>c.run(),ok:[['小安','比到千分位：6比2大，下午比較高。']]}
  ],
  teacher:[['目標','多位小數的比較：小數點對齊，從最高位比。'],['迷思','以為小數點後面位數越多，數就越大。'],['實物','定位板，標出千分位、萬分位。']]},
 {short:'乘以0.1',title:'第二站　縮小的模型',topic:'乘數是小數',
  talk:[['潮汐姐姐','潮汐站的模型，是真的大小乘以0.1。真的柱子高5公尺。'],['小安','乘法會變大，5×0.1一定比5大！']],

  steps:[
   {id:'t2a',type:'fields',label:'5×0.1',q:'5×0.1＝？模型的柱子高幾公尺？',pre:['5×0.1＝'],fields:['公尺'],decimal:true,
    check:(p,[a])=>near(a,0.5)?null:near(a,50)?'乘以0.1，不是乘以10。':near(a,5.1)?'這是加，不是乘。':'5個0.1是多少？',reveal:'5×0.1就是5個0.1，是0.5公尺。',ok:[['小安','乘以比1小的數，答案會比原來小。']]},
   {id:'t2b',type:'choice',label:'5×1.1',q:'那 5×1.1 呢？答案會比5大還是小？',
    opts:[['比5大',1],['比5小',0,'1.1比1大。乘以比1大的數，答案會比原來大。']],ok:[['潮汐姐姐','5×1.1＝5.5。乘以比1大的數變大，比1小的數變小。']]}
  ],
  teacher:[['目標','整數乘以小數：理解乘以比1小的數、比1大的數，結果的變化。'],['迷思','以為乘法一定會變大。'],['提醒','先從0.1、0.01開始，再到0.2、1、1.1，觀察乘數變化對結果的影響。']]},
 {short:'小數乘法',title:'第三站　浮標的重量',topic:'小數乘以小數',
  talk:[['潮汐姐姐','一個浮標重1.25公斤，大浮標是它的1.3倍重。'],['小晴','1.25×1.3，我先把小數點對齊再算。']],
  w:()=>W.dmul({a:'1.25',b:'1.3',cap:'小晴想先把小數點對齊。'}),

   {id:'t3a',type:'choice',label:'小數點對齊？',q:'小數乘法，要先把小數點對齊嗎？',

   {id:'t3b',type:'fields',label:'1.25×1.3',q:'1.25×1.3＝？',pre:['1.25×1.3＝'],fields:['公斤'],decimal:true,

    reveal:'125×13＝1625；2位＋1位＝3位小數：1.625公斤。',ok:[['潮汐姐姐','大浮標重1.625公斤。']]}

  teacher:[['目標','用直式處理乘數是小數的計算。'],['迷思','計算乘法時想把小數點對齊。'],['提醒','先布題整數乘法（125×13），再講解125與1.25、13與1.3的關係。']]},
 {short:'除不盡？',title:'第四站　平分一公升海水',topic:'商為三位小數的整數除法',
  talk:[['潮汐姐姐','1公升海水，平分到8個試管。每個試管裝幾公升？'],['小晴','1比8小，不能除。答案是0！']],
  w:()=>W.longdiv({label:'1÷8，不夠除就補上小數點和0',divisor:'8',dividend:'1.000',quot:'0.125',qStart:0,rows:[{s:'8',end:2},{s:'20',end:3,rule:1,from:1,to:3},{s:'16',end:3},{s:'40',end:4,rule:1,from:2,to:4},{s:'40',end:4},{s:'0',end:4,rule:1,from:3,to:4}]}),

   {id:'t4b',type:'fields',label:'1÷8',q:'1÷8＝？每個試管裝幾公升？',pre:['1÷8＝'],fields:['公升'],decimal:true,
