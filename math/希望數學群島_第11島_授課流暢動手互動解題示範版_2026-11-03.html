/* 植樹：間隔數和棵數 */

W.trees=(o)=>({

  html:`<svg viewBox="0 0 350 ${o.closed?190:130}" width="350" role="img" aria-label="${o.closed?'圓形花圃':'一條步道'}" id="tr10"></svg><div class="wbtns"><button type="button" class="wbtn" id="trBtn">每${o.gap}公尺種一棵</button></div><p class="cap" id="trCap">${o.cap}</p>`,

  mount(box,H){let n=-1;const k=o.len/o.gap;

    const tree=(x,y)=>`<g transform="translate(${x} ${y})"><rect x="-2.5" y="0" width="5" height="12" style="fill:#7a5536"/><circle cy="-8" r="11" style="fill:#6fae4f" class="ink-s" stroke-width="1.5"/></g>`;

    function draw(){if(!box.isConnected)return;let s='';

      if(!o.closed){const x0=25,U=300/o.len;s+=`<line x1="${x0}" y1="80" x2="${x0+300}" y2="80" style="stroke:#e8cf98" stroke-width="12" stroke-linecap="round"/><text x="${x0}" y="118" class="lbl-s">0</text><text x="${x0+300}" y="118" class="lbl-s">${o.len}公尺</text>`;

        for(let i=0;i<k;i++){s+=`<path d="M${x0+i*o.gap*U+4} 98 h${o.gap*U-8}" class="acc-s" stroke-width="2"/>`;if(n>=0)s+=`<text x="${x0+(i+.5)*o.gap*U}" y="112" class="lbl-s" style="fill:var(--accent);font-size:10px">${o.gap}公尺</text>`;}

        if(n>=0)for(let i=0;i<=Math.min(n,k);i++)s+=tree(x0+i*o.gap*U,64);}

      else{const cx=175,cy=95,R=70;s+=`<circle cx="${cx}" cy="${cy}" r="${R}" style="fill:#cde3ad;stroke:#e8cf98" stroke-width="10"/><text x="${cx}" y="${cy+5}" class="lbl-s">一圈${o.len}公尺</text>`;

        if(n>=0)for(let i=0;i<Math.min(n,k);i++){const t=-Math.PI/2+i*2*Math.PI/k;s+=tree(cx+R*Math.cos(t),cy+R*Math.sin(t)+4);const t2=t+Math.PI/k;s+=`<text x="${cx+(R+20)*Math.cos(t2)}" y="${cy+(R+20)*Math.sin(t2)+4}" class="lbl-s" style="fill:var(--accent);font-size:10px">${o.gap}</text>`;}}

      box.querySelector('#tr10').innerHTML=s;}

    H.$('#trBtn',box).onclick=async()=>{const N=o.closed?k:k;for(let i=0;i<=N&&box.isConnected;i++){n=i;draw();H.SFX.play('tick');await H.wait(220);}

      if(box.isConnected)H.$('#trCap',box).textContent=o.closed?`繞一圈，有${k}段，種了${k}棵：最後一段的終點，就是第一棵樹，不用再種。`:`${o.len}÷${o.gap}＝${k}段，可是頭和尾都要種：樹比段數多1棵，一共${k+1}棵。`;};

    draw();return{plant(){H.$('#trBtn',box).click();}};

  }

});



/* 摺紙：分數乘以分數 */

W.area2=(o)=>({

  html:`<svg viewBox="0 0 260 180" width="260" role="img" aria-label="一張紙" id="ar10"></svg><div class="wbtns"><button type="button" class="wbtn" id="a2a">先取${o.a[1]}分之${o.a[0]}</button><button type="button" class="wbtn" id="a2b">再取它的${o.b[1]}分之${o.b[0]}</button></div><p class="cap" id="a2Cap">一整張紙。</p>`,

  mount(box,H){let st=0;const X=30,Y=15,Wd=200,Hh=150;

    function draw(){if(!box.isConnected)return;let s=`<rect x="${X}" y="${Y}" width="${Wd}" height="${Hh}" style="fill:#fffdf6" class="ink-s" stroke-width="2.5"/>`;const cw=Wd/o.a[1],rh=Hh/o.b[1];

      if(st>=1){for(let i=0;i<o.a[1];i++)s+=`<rect x="${X+i*cw}" y="${Y}" width="${cw}" height="${Hh}" style="fill:${i<o.a[0]?'#f7e7a6':'none'}" class="ink-s" stroke-width="1.5"/>`;}

      if(st>=2){for(let j=0;j<o.b[1];j++)s+=`<line x1="${X}" y1="${Y+j*rh}" x2="${X+Wd}" y2="${Y+j*rh}" class="ink-s" stroke-width="1" stroke-dasharray="4 3"/>`;

        for(let i=0;i<o.a[0];i++)for(let j=0;j<o.b[0];j++)s+=`<rect x="${X+i*cw+2}" y="${Y+j*rh+2}" width="${cw-4}" height="${rh-4}" class="pick" opacity=".85"/>`;}

      box.querySelector('#ar10').innerHTML=s;}

    H.$('#a2a',box).onclick=()=>{st=Math.max(st,1);H.SFX.play('paper');draw();H.$('#a2Cap',box).textContent=`黃色是這張紙的${o.a[1]}分之${o.a[0]}。`;};

    H.$('#a2b',box).onclick=()=>{st=2;H.SFX.play('paper');draw();const n=o.a[0]*o.b[0],d=o.a[1]*o.b[1];H.$('#a2Cap',box).textContent=`整張紙被分成${o.a[1]}×${o.b[1]}＝${d}格，紅色有${o.a[0]}×${o.b[0]}＝${n}格：${o.a[1]}分之${o.a[0]}×${o.b[1]}分之${o.b[0]}＝${d}分之${n}。比原來的還小。`;};

    draw();return{go(){st=1;H.$('#a2b',box).click();}};

  }

});



/* 撕下三個角拼一拼 */

W.tear=(o)=>({

  html:`<svg viewBox="0 0 350 200" width="350" role="img" aria-label="三角形" id="te10"></svg><div class="wbtns">${o.tris.map((t,i)=>`<button type="button" class="wbtn" data-t="${i}">撕下${t.name}的三個角</button>`).join('')}</div><p class="cap" id="teCap">每個三角形的三個角，塗上三種顏色。</p>`,

  mount(box,H){let on=-1;const C=['var(--berry)','var(--juice-a)','var(--water)'];

    const ang=(p,q,r)=>{const a=Math.atan2(q[1]-p[1],q[0]-p[0]),b=Math.atan2(r[1]-p[1],r[0]-p[0]);let d=b-a;while(d<=-Math.PI)d+=2*Math.PI;while(d>Math.PI)d-=2*Math.PI;return[a,d];};

    const wedge=(c,a0,d,r,col)=>{const a1=a0+d,sw=d>0?1:0,big=Math.abs(d)>Math.PI?1:0;return`<path d="M${c[0]} ${c[1]} L${(c[0]+r*Math.cos(a0)).toFixed(1)} ${(c[1]+r*Math.sin(a0)).toFixed(1)} A${r} ${r} 0 ${big} ${sw} ${(c[0]+r*Math.cos(a1)).toFixed(1)} ${(c[1]+r*Math.sin(a1)).toFixed(1)}Z" style="fill:${col}" opacity=".85"/>`;};

    function draw(){if(!box.isConnected)return;let s='';

      o.tris.forEach((t,ti)=>{const P=t.pts;s+=`<polygon points="${P.map(p=>p.join(',')).join(' ')}" class="soft-f ink-s" stroke-width="2"/>`;

        for(let i=0;i<3;i++){const[a,d]=ang(P[i],P[(i+1)%3],P[(i+2)%3]);s+=wedge(P[i],a,d,16,C[i]);}

        s+=`<text x="${t.label[0]}" y="${t.label[1]}" class="lbl">${t.name}</text>`;});

      if(on>=0){const P=o.tris[on].pts,c=[175,185];let a0=Math.PI;s+=`<line x1="80" y1="185" x2="270" y2="185" class="ink-s" stroke-width="2"/>`;

        for(let i=0;i<3;i++){const[,d]=ang(P[i],P[(i+1)%3],P[(i+2)%3]);const dd=Math.abs(d);s+=wedge(c,a0,dd,40,C[i]);a0+=dd;}

        s+=`<text x="175" y="132" class="lbl-s" style="fill:var(--accent)">拼成一條直線：180度</text>`;}

      box.querySelector('#te10').innerHTML=s;}

    box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{on=+b.dataset.t;H.SFX.play('paper');draw();H.$('#teCap',box).textContent=`${o.tris[on].name}的三個角拼在一起，剛好拼成一條直線（平角）：三個角加起來是180度。`;});

    draw();return{show(i){box.querySelector(`[data-t="${i}"]`).click();}};

  }

});



/* 三根竹籤：能不能圍成三角形 */

W.sticks=(o)=>({

  html:`<svg viewBox="0 0 340 170" width="340" role="img" aria-label="三根竹籤" id="sk10"></svg><div class="wbtns">${o.sets.map((s,i)=>`<button type="button" class="wbtn" data-s="${i}">${s.join('、')}公分</button>`).join('')}</div><p class="cap" id="skCap">選一組竹籤，圍圍看。</p>`,

  mount(box,H){

    function show(i){const[a,b,c]=o.sets[i].slice().sort((x,y)=>x-y);const u=30,X=30,Y=140;let s=`<line x1="${X}" y1="${Y}" x2="${X+c*u}" y2="${Y}" style="stroke:#a8774d" stroke-width="7" stroke-linecap="round"/><text x="${X+c*u/2}" y="${Y+22}" class="lbl-s">${c}</text>`;

      if(a+b>c){const x=(a*a-b*b+c*c)/(2*c),y=Math.sqrt(a*a-x*x);const T=[X+x*u,Y-y*u];s+=`<line x1="${X}" y1="${Y}" x2="${T[0]}" y2="${T[1]}" style="stroke:#c9a06c" stroke-width="7" stroke-linecap="round"/><line x1="${X+c*u}" y1="${Y}" x2="${T[0]}" y2="${T[1]}" style="stroke:#e9b44c" stroke-width="7" stroke-linecap="round"/>`;

        s+=`<text x="${X+x*u/2-10}" y="${Y-y*u/2}" class="lbl-s">${a}</text><text x="${(T[0]+X+c*u)/2+12}" y="${Y-y*u/2}" class="lbl-s">${b}</text>`;H.SFX.play('ok');H.$('#skCap',box).textContent=`${a}＋${b}＝${a+b}，比${c}長，可以圍成三角形。`;}

      else{s+=`<line x1="${X}" y1="${Y}" x2="${X+a*u*.97}" y2="${Y-a*u*.25}" style="stroke:#c9a06c" stroke-width="7" stroke-linecap="round"/><line x1="${X+c*u}" y1="${Y}" x2="${X+c*u-b*u*.97}" y2="${Y-b*u*.25}" style="stroke:#e9b44c" stroke-width="7" stroke-linecap="round"/><text x="${X+a*u/2}" y="${Y-a*u*.12-12}" class="lbl-s">${a}</text><text x="${X+c*u-b*u/2}" y="${Y-b*u*.12-12}" class="lbl-s">${b}</text>`;

        H.SFX.play('retry');H.$('#skCap',box).textContent=`${a}＋${b}＝${a+b}，${a+b===c?'剛好等於':'比'+c+'短'}${a+b===c?c:''}，兩根短的碰不到一起，圍不成三角形。`;}

      box.querySelector('#sk10').innerHTML=s;}

    box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>show(+b.dataset.s));

    return{show};

  }

});



/* 披薩：圓心角和扇形 */

W.sectors=(o)=>({

  html:`<svg viewBox="0 0 340 170" width="340" role="img" aria-label="大小兩個披薩" id="se10"></svg><div class="wbtns"><button type="button" class="wbtn" id="seBtn">量圓心角</button></div><p class="cap" id="seCap">${o.cap}</p>`,

  mount(box,H){let on=false;

    function pie(cx,cy,r,deg,name){const a=-Math.PI/2,b=a+deg*Math.PI/180;let s=`<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:#f6e2b3" class="ink-s" stroke-width="2"/><path d="M${cx} ${cy} L${cx} ${cy-r} A${r} ${r} 0 ${deg>180?1:0} 1 ${(cx+r*Math.cos(b)).toFixed(1)} ${(cy+r*Math.sin(b)).toFixed(1)}Z" style="fill:#e9763a" class="ink-s" stroke-width="2"/>`;

      if(on)s+=`<path d="M${cx} ${cy-14} A14 14 0 ${deg>180?1:0} 1 ${(cx+14*Math.cos(b)).toFixed(1)} ${(cy+14*Math.sin(b)).toFixed(1)}" fill="none" class="acc-s" stroke-width="3"/><text x="${cx-14}" y="${cy+18}" class="lbl-s" style="fill:var(--accent);font-weight:700">${deg}°</text>`;

      return s+`<text x="${cx}" y="${cy+r+18}" class="lbl-s">${name}</text>`;}

    function draw(){if(!box.isConnected)return;box.querySelector('#se10').innerHTML=pie(80,78,40,o.deg,'小披薩')+pie(240,78,70,o.deg,'大披薩');}

    H.$('#seBtn',box).onclick=()=>{on=true;H.SFX.play('pencil');draw();H.$('#seCap',box).textContent=`兩塊披薩的圓心角都是${o.deg}度，都是${360/o.deg}分之1個圓。可是大披薩的半徑比較長，那一塊（扇形）比較大。圓心角一樣，扇形不一定一樣大。`;};

    draw();return{show(){H.$('#seBtn',box).click();}};

  }

});



/* 投籃：比率和百分率 */

W.pct=(o)=>({

  html:`<svg viewBox="0 0 340 120" width="340" role="img" aria-label="${o.n}次投籃" id="pc10"></svg><div class="wbtns"><button type="button" class="wbtn" id="pcBtn">換成100份來看</button></div><p class="cap" id="pcCap">${o.cap}</p>`,

  mount(box,H){let on=false;

    function draw(){if(!box.isConnected)return;let s='';

      if(!on){for(let i=0;i<o.n;i++){const x=24+(i%10)*30,y=30+Math.floor(i/10)*40;s+=`<circle cx="${x}" cy="${y}" r="11" style="fill:${i<o.k?'#e9763a':'#fffdf6'}" class="ink-s" stroke-width="1.5"/>`+(i<o.k?`<path d="M${x-5} ${y} l4 4 l7 -8" fill="none" style="stroke:#fff" stroke-width="2.5"/>`:'');}}

      else{const v=o.k*100/o.n;for(let i=0;i<100;i++){const c=Math.floor(i/10),r=i%10;s+=`<rect x="${70+c*10}" y="${8+r*10}" width="10" height="10" style="fill:${i<v?'#e9763a':'#fffdf6'}" class="ink-s" stroke-width=".6"/>`;}}

      box.querySelector('#pc10').innerHTML=s;}

    H.$('#pcBtn',box).onclick=()=>{on=true;H.SFX.play('ok');draw();const v=o.k*100/o.n;H.$('#pcCap',box).textContent=`${o.n}次裡進${o.k}次，比率是${o.n}分之${o.k}＝${o.k/o.n}。換成100份，就是100份裡的${v}份：${v}%。`;};

    draw();return{go(){H.$('#pcBtn',box).click();}};

  }

});

  mount(box,H){let on=false;

/* 水箱：放進石頭 */

W.tank=(o)=>({

  html:`<svg viewBox="0 0 300 190" width="300" role="img" aria-label="長${o.l}公分、寬${o.w}公分的水箱" id="tk10"></svg><div class="wbtns"><button type="button" class="wbtn" id="tkBtn">把石頭放進去</button></div><p class="cap" id="tkCap">水箱底面長${o.l}公分、寬${o.w}公分，水深${o.h0}公分。</p>`,

  mount(box,H){let h=o.h0,in_=false;const X=60,Y=170,Wd=180,S=8;

    function draw(){if(!box.isConnected)return;let s=`<rect x="${X}" y="${Y-h*S}" width="${Wd}" height="${h*S}" style="fill:#9fd3dc" opacity=".8"/>`;

      if(in_)s+=`<path d="M${X+60} ${Y} q10 -36 40 -30 q30 6 24 30Z" style="fill:#8d969b" class="ink-s" stroke-width="2"/>`;

      s+=`<path d="M${X} ${Y-160} V${Y} H${X+Wd} V${Y-160}" fill="none" class="ink-s" stroke-width="3"/>`;

      for(let i=0;i<=18;i+=2)s+=`<line x1="${X+Wd}" y1="${Y-i*S}" x2="${X+Wd+8}" y2="${Y-i*S}" class="ink-s"/><text x="${X+Wd+12}" y="${Y-i*S+4}" class="lbl-s" style="text-anchor:start;font-size:10px">${i}</text>`;

      if(in_)s+=`<line x1="${X-10}" y1="${Y-o.h0*S}" x2="${X+Wd}" y2="${Y-o.h0*S}" class="acc-s" stroke-dasharray="5 4" stroke-width="2"/><text x="${X-14}" y="${Y-(o.h0+o.rise/2)*S+4}" class="lbl-s" style="text-anchor:end;fill:var(--accent)">上升${o.rise}</text>`;

      box.querySelector('#tk10').innerHTML=s;}

    H.$('#tkBtn',box).onclick=async()=>{if(in_)return;in_=true;H.SFX.play('drip');for(let i=1;i<=15&&box.isConnected;i++){h=o.h0+o.rise*i/15;draw();await H.wait(40);}

      if(box.isConnected)H.$('#tkCap',box).textContent=`水面從${o.h0}公分升到${o.h0+o.rise}公分，上升${o.rise}公分。石頭把水「擠上去」的那一層：${o.l}×${o.w}×${o.rise}＝${o.l*o.w*o.rise}立方公分，就是石頭的體積。`;};

    draw();return{go(){H.$('#tkBtn',box).click();}};

  }

});



/* ================= 第11島的教具 ================= */



/* 短除法：最大公因數、最小公倍數 */

W.shortdiv=(o)=>({

  html:`<div class="vbox"><div id="sd11"></div></div><div class="wbtns"><button type="button" class="wbtn" id="sdBtn">用質數一層一層除</button></div><p class="cap" id="sdCap">${o.a}和${o.b}，找一個兩個數都能整除的質數。</p>`,

  mount(box,H){let k=0;const steps=[];let a=o.a,b=o.b;for(const p of [2,3,5,7,11,13]){while(a%p===0&&b%p===0){steps.push([p,a,b]);a/=p;b/=p;}}const last=[a,b];

    function draw(){if(!box.isConnected)return;let h='<div style="display:grid;grid-template-columns:30px 44px 44px;font:600 20px/1.6 var(--hand,inherit);text-align:center">';

      steps.slice(0,k).forEach(([p,x,y])=>{h+=`<span style="border-right:2px solid var(--ink);color:var(--accent)">${p}</span><span style="border-bottom:2px solid var(--ink)">${x}</span><span style="border-bottom:2px solid var(--ink)">${y}</span>`;});

      const cur=k<steps.length?[steps[k][1],steps[k][2]]:last;h+=`<span></span><span>${cur[0]}</span><span>${cur[1]}</span></div>`;H.$('#sd11',box).innerHTML=h;}

    H.$('#sdBtn',box).onclick=async()=>{for(k=0;k<=steps.length&&box.isConnected;k++){draw();H.SFX.play('pencil');await H.wait(450);}k=steps.length;

      if(!box.isConnected)return;const g=steps.reduce((m,s)=>m*s[0],1);H.$('#sdCap',box).textContent=`除到${last[0]}和${last[1]}互質（除了1沒有別的公因數）就停。左邊相乘：${steps.map(s=>s[0]).join('×')}＝${g}，是最大公因數。左邊和下面全部相乘：${g}×${last[0]}×${last[1]}＝${g*last[0]*last[1]}，是最小公倍數。`;};

    k=0;H.$('#sd11',box).innerHTML=`<div style="font:600 20px/1.6 inherit;text-align:center">${o.a}　${o.b}</div>`;

    return{run(){H.$('#sdBtn',box).click();}};

  }

});



/* 圓形圖 */

W.pie=(o)=>({

  html:`<svg viewBox="0 0 340 190" width="340" role="img" aria-label="${o.title}圓形圖" id="pi11"></svg><div class="wbtns">${o.data.map((d,i)=>`<button type="button" class="wbtn" data-i="${i}">${d[0]}</button>`).join('')}</div><p class="cap" id="piCap">${o.title}，一共${o.data.reduce((s,d)=>s+d[1],0)}人。點項目看看。</p>`,

  mount(box,H){const tot=o.data.reduce((s,d)=>s+d[1],0);const C=['#d9534a','#e9b44c','#5b9bb5','#7fb36a','#8e7bb5','#e08aa0'];let sel=-1;

    function draw(){if(!box.isConnected)return;const cx=100,cy=95,R=80;let a=-Math.PI/2,s='';

      o.data.forEach((d,i)=>{const da=d[1]/tot*2*Math.PI,b=a+da,off=i===sel?8:0,mx=Math.cos(a+da/2)*off,my=Math.sin(a+da/2)*off;

        s+=`<path d="M${cx+mx} ${cy+my} L${(cx+mx+R*Math.cos(a)).toFixed(1)} ${(cy+my+R*Math.sin(a)).toFixed(1)} A${R} ${R} 0 ${da>Math.PI?1:0} 1 ${(cx+mx+R*Math.cos(b)).toFixed(1)} ${(cy+my+R*Math.sin(b)).toFixed(1)}Z" style="fill:${C[i%6]}" class="ink-s" stroke-width="1.5"/>`;

        s+=`<rect x="200" y="${22+i*26}" width="14" height="14" style="fill:${C[i%6]}"/><text x="220" y="${34+i*26}" class="lbl-s" style="text-anchor:start">${d[0]} ${d[1]}人${sel>=0?'（'+Math.round(d[1]/tot*100)+'%）':''}</text>`;a=b;});

      box.querySelector('#pi11').innerHTML=s;}

/* 多邊形切成三角形 */

W.polysplit=(o)=>({

  html:`<svg viewBox="0 0 300 220" width="300" role="img" aria-label="${o.name}" id="ps11"></svg><div class="wbtns"><button type="button" class="wbtn" data-m="v">從一個頂點切</button>${o.center?'<button type="button" class="wbtn" data-m="c">從中間一點切</button>':''}</div><p class="cap" id="psCap">${o.name}，有${o.n}個角。</p>`,

  mount(box,H){let m='';const cx=150,cy=112,R=95;const P=o.pts||Array.from({length:o.n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/o.n;return[cx+R*Math.cos(a),cy+R*Math.sin(a)];});

    const C=['#f7e7a6','#cde3ad','#d5e8f0','#fbe3e6','#e7cfb2','#e3d7f0'];

    function draw(){if(!box.isConnected)return;let s='';

      if(m==='v'){for(let i=1;i<o.n-1;i++)s+=`<polygon points="${[P[0],P[i],P[i+1]].map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" style="fill:${C[i%6]}" class="ink-s" stroke-width="1.5"/>`;}

      else if(m==='c'){for(let i=0;i<o.n;i++)s+=`<polygon points="${[[cx,cy],P[i],P[(i+1)%o.n]].map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" style="fill:${C[i%6]}" class="ink-s" stroke-width="1.5"/>`;s+=`<circle cx="${cx}" cy="${cy}" r="16" fill="none" class="acc-s" stroke-width="3"/>`;}

      s+=`<polygon points="${P.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${m?'none':'#fffdf6'}" class="ink-s" stroke-width="3"/>`;

      box.querySelector('#ps11').innerHTML=s;}

    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{m=b.dataset.m;H.SFX.play('cut');draw();const n=o.n;

      H.$('#psCap',box).textContent=m==='v'?`從一個頂點切，切成${n-2}個三角形：180×${n-2}＝${180*(n-2)}度。`:`從中間切，切成${n}個三角形：180×${n}＝${180*n}，可是中間那一圈（360度）不是${o.name}的角，要減掉：${180*n}－360＝${180*n-360}度。`;});

    draw();return{v(){box.querySelector('[data-m="v"]').click();},c(){box.querySelector('[data-m="c"]').click();}};

  }

});

 // Use real hundred-part and degree grids for the drawing lessons.

 function pieGrid(parts,filled,title){const cx=150,cy=142,r=110;let svg='<svg viewBox="0 0 300 285" width="300" role="img" aria-label="'+title+'"><circle cx="150" cy="142" r="110" fill="#fffdf5" stroke="currentColor" stroke-width="1.4"/>';

  const xy=(a,rad=r)=>[cx+rad*Math.sin(a),cy-rad*Math.cos(a)];

  if(filled){const [x,y]=xy(filled/parts*2*Math.PI);svg+='<path d="M150 142 L150 32 A110 110 0 '+(filled>parts/2?1:0)+' 1 '+x+' '+y+' Z" fill="#8bb7a1"/>';}

  for(let k=0;k<parts;k++){const a=k/parts*2*Math.PI,[x,y]=xy(a),[ix,iy]=xy(a,parts===100?0:(k%10===0?94:103));svg+='<line x1="'+ix+'" y1="'+iy+'" x2="'+x+'" y2="'+y+'" stroke="currentColor" stroke-width="'+(parts===100?.45:k%10===0?1.1:.5)+'"/>';}

  return svg+'<text x="150" y="278" class="lbl-s">'+title+'</text></svg>';}
