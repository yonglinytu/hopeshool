const BL=c=>`<i class="bln ${c||''}" aria-hidden="true"></i>`;



/* 一束一束的氣球：幾個十、幾個一；可以把10個一綁成一束 */

W.bunches=(o)=>({

  html:`<div class="blkrow" id="bn"></div><div class="pv" style="grid-template-columns:auto repeat(2,minmax(46px,64px))" id="bnpv"></div>

    <div class="wbtns"><button type="button" class="wbtn" id="bnBtn">10個綁成一束</button></div><p class="cap" id="bnCap"></p>`,

  mount(box,H){

    const st={t:o.t,u:o.u};

    function draw(){if(!box.isConnected)return;H.$('#bn',box).innerHTML=Array(st.t).fill(`<span class="bunch">${BL().repeat(10)}</span>`).join('')+Array(st.u).fill(BL('y')).join('');

      H.$('#bnpv',box).innerHTML=`<span></span><span>十位</span><span>個位</span><em>氣球</em><b>${st.t}</b><b class="${st.u>9?'warn':''}">${st.u}</b>`;

      H.$('#bnBtn',box).disabled=st.u<10;H.$('#bnCap',box).textContent=st.u>9?`一個一個的有${st.u}個，可以綁成一束。`:`${st.t}束（${st.t}個十），${st.u}個一。`;}

    H.$('#bnBtn',box).onclick=()=>{if(st.u<10)return;st.u-=10;st.t++;H.SFX.play('ok');draw();};draw();

    return{tie(){H.$('#bnBtn',box).click();}};

  }

});



/* 幾個一數：圈出數過的數 */

W.skip=(o)=>({

  html:`<div class="cal" style="grid-template-columns:repeat(10,1fr);width:min(100%,360px)" id="sk">${Array.from({length:o.max},(_,i)=>`<b data-n="${i+1}">${i+1}</b>`).join('')}</div>

    <div class="wbtns"><button type="button" class="wbtn" id="skBtn">${o.by}個一數</button></div><p class="cap" id="skCap">從${o.by}開始，${o.by}個一數。</p>`,

  mount(box,H){

    let busy=false;

    H.$('#skBtn',box).onclick=async()=>{if(busy)return;busy=true;box.querySelectorAll('#sk b').forEach(b=>b.classList.remove('hl'));const seq=[];

      for(let n=o.by;n<=o.max&&box.isConnected;n+=o.by){box.querySelector(`#sk [data-n="${n}"]`).classList.add('hl');seq.push(n);H.SFX.play('tick');H.$('#skCap',box).textContent=seq.join('、');await H.wait(240);}

      if(box.isConnected)H.$('#skCap',box).textContent=seq.join('、')+`。個位一直是${[...new Set(seq.map(n=>n%10))].join('、')}。`;busy=false;};

    return{run(){H.$('#skBtn',box).click();}};

  }

});



/* 一個配一個：比多少 */

  html:`<svg viewBox="0 0 360 150" width="360" role="img" aria-label="木馬和小朋友" id="mt"></svg>

    <div class="wbtns"><button type="button" class="wbtn" id="mtBtn">一個配一個</button></div><p class="cap" id="mtCap">上面是木馬，下面是排隊的小朋友。</p>`,

/* 繩子拉直 */

W.ropes=()=>({

  html:`<svg viewBox="0 0 340 150" width="340" role="img" aria-label="一條彎彎的紅繩子和一條直直的藍繩子" id="rp"></svg>

  mount(box,H){

    let k=0;

    function draw(){if(!box.isConnected)return;const amp=34*(1-k),len=200+80*k;

      let d=`M30 60`;for(let i=1;i<=40;i++){const x=30+len*i/40,y=60-amp*Math.sin(i/40*Math.PI*3);d+=` L${x.toFixed(1)} ${y.toFixed(1)}`;}

      box.querySelector('#rp').innerHTML=`<line x1="30" y1="20" x2="30" y2="140" class="ink-s" stroke-dasharray="3 4"/><path d="${d}" fill="none" class="acc-s" stroke-width="6" stroke-linecap="round"/><line x1="30" y1="120" x2="250" y2="120" style="stroke:var(--water)" stroke-width="6" stroke-linecap="round"/><text x="30" y="14" class="lbl-s" style="text-anchor:start">起點對齊</text>`;}

    H.$('#rpBtn',box).onclick=async()=>{H.SFX.play('swoosh');for(let i=1;i<=20&&box.isConnected;i++){k=i/20;draw();await H.wait(40);}

      if(box.isConnected)H.$('#rpCap',box).textContent='拉直以後，紅繩子比藍繩子長！';};

    draw();return{pull(){H.$('#rpBtn',box).click();}};

  }

});

function observe(factory,selector,ready){return ()=>{const w=factory();return{html:w.html,mount(box,H){const c=w.mount?w.mount(box,H)||{}:{};let touched=false;const touch=e=>{if(e.target.closest(selector))touched=true;};box.addEventListener('click',touch);box.addEventListener('input',touch);Object.defineProperty(c,'explored',{get:()=>touched&&(!ready||ready(box))});return c;}};};}

function method(id,q,opts){change(id,{type:'explain',q,label:q,opts,after:null,ok:[]});}

function gate(id,selector,ready,own=false){const st=question(id);const sc=PLACES.flatMap(p=>p.scenes).find(sc=>sc.steps.includes(st));st.w=observe(st.w||sc.w,selector,ready);st.observe=true;st.observeMessage='先按上面的按鈕看看，再回答。';st.qaAction=selector;}

function correctClaim(id,q,opts,ok){change(id,{q,label:q,opts,after:null,ok:ok||[]});}

function standardRecord(st){return log[st.id]||(log[st.id]={id:st.id,label:st.label||st.q,first:'',last:'',tries:0,how:'',kind:st.type,viewedExplanation:false,operationUsed:false});}

logIt=function(st,answer,ok){const r=standardRecord(st);if(!r.first)r.first=answer;r.last=answer;r.tries++;r.operationUsed=r.operationUsed||!!st.observe||widgetWasUsed;

 if(ok)r.how=r.tries>1?RECORD_STATUS.hint:r.operationUsed?RECORD_STATUS.observed:RECORD_STATUS.self;

 return r;

};

function guardObservation(st){if(st.observe&&!ctl?.explored){addLine(P.keeper,st.observeMessage||'先操作上面的教具，觀察後再回答。','fb');return false;}return true;}

function lockAnswer(){const box=$('#stepBox');$$('input,[data-p],[data-o]',box).forEach(x=>x.disabled=true);}

 if(!text){const chosen=st.opts?.find(o=>o[1]===1&&!uncertainText(o[0]));text=[chosen?.[0],...(st.ok||[]).map(x=>x[1])].filter(Boolean).join(' ');}

}

  if(uncertainText(o[0])){r.how=RECORD_STATUS.uncertain;SFX.play('next');addLine(P.keeper,'先一起觀察，再說說你的發現。','fb');}

  else SFX.play('ok');

  if(o[2])addLine(st.who||P.keeper,o[2],uncertainText(o[0])?'fb':'fb ok');

  (st.ok||[]).forEach(([w,t])=>addLine(w,t,uncertainText(o[0])?'fb':'ok'));

  lockAnswer();if(st.after)st.after(ctl,H);showNext();

 const said=st.say?st.say(p,vals):(p||'')+st.fields.map((f,i)=>(st.pre?.[i]||'')+vals[i]+f).join(' ');

 addLine('你',esc(said));const msg=st.check(p,vals,ctl);logIt(st,said,!msg);
