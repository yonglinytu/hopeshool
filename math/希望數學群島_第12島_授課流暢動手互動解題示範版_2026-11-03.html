/* 操場跑圈：公尺和公里 */

W.track=(o)=>({

  html:`<svg viewBox="0 0 340 150" width="340" role="img" aria-label="一圈${o.lap}公尺的操場" id="tk"><rect x="40" y="25" width="260" height="100" rx="50" fill="none" style="stroke:#d9a07a" stroke-width="16"/><rect x="40" y="25" width="260" height="100" rx="50" fill="none" style="stroke:#fff" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="72" y="45" width="196" height="60" rx="30" style="fill:#b6d68a"/><text x="170" y="80" class="lbl" id="tkN">0 圈</text><circle id="tkR" r="8" class="acc-f"/></svg>

    <div class="wbtns"><button type="button" class="wbtn" id="tkBtn">跑一圈（${o.lap}公尺）</button><button type="button" class="wbtn" id="tkRst">重來</button></div><p class="cap" id="tkCap">操場跑一圈是${o.lap}公尺。</p>`,

  mount(box,H){let laps=0,busy=false;const pt=t=>{const P=2*(160)+Math.PI*100;let d=t*P;const R=50;

      if(d<160)return[90+d,25];d-=160;if(d<Math.PI*R){const a=-Math.PI/2+d/R;return[250+R*Math.cos(a),75+R*Math.sin(a)];}d-=Math.PI*R;

      if(d<160)return[250-d,125];d-=160;const a=Math.PI/2+d/R;return[90+R*Math.cos(a),75+R*Math.sin(a)];};

    function put(t){const[x,y]=pt(t%1);const c=box.querySelector('#tkR');c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1));}

    function cap(){const m=laps*o.lap,km=Math.floor(m/1000),r=m%1000;H.$('#tkN',box).textContent=`${laps} 圈`;

      H.$('#tkCap',box).textContent=`跑了${laps}圈，一共${m}公尺`+(km?`＝${km}公里${r?r+'公尺':''}`:'')+'。'+(m===1000?'剛好1000公尺，就是1公里！':'');}

    async function run(){if(busy||!box.isConnected)return;busy=true;H.SFX.play('swoosh');for(let i=1;i<=24&&box.isConnected;i++){put(i/24);await H.wait(28);}laps++;if(box.isConnected)cap();busy=false;}

    H.$('#tkBtn',box).onclick=run;H.$('#tkRst',box).onclick=()=>{laps=0;put(0);cap();H.$('#tkCap',box).textContent=`操場跑一圈是${o.lap}公尺。`;};put(0);

    return{async laps(n){for(let i=0;i<n;i++)await run();}};

  }

});



/* 步道路線：公里和公尺的加減 */

W.route=(o)=>({

  html:`<svg viewBox="0 0 340 110" width="340" role="img" aria-label="步道路線" id="rt"></svg><div class="wbtns"><button type="button" class="wbtn" id="rtBtn">${o.sub?'借1公里換成1000公尺':'合起來，再換一換'}</button></div><p class="cap" id="rtCap">${o.cap}</p>`,

  mount(box,H){let st=0;

    function draw(){if(!box.isConnected)return;const pts=o.stops.map((n,i)=>[30+i*(280/(o.stops.length-1)),62+(i%2?-14:10)]);let s=`<path d="M${pts.map(p=>p.join(' ')).join(' L')}" fill="none" style="stroke:#b9975f" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 12"/>`;

      pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="9" class="paper-f ink-s" stroke-width="2.5"/><text x="${p[0]}" y="${p[1]+30}" class="lbl-s">${o.stops[i]}</text>`;});

      o.segs.forEach((g,i)=>{const a=pts[i],b=pts[i+1];s+=`<text x="${(a[0]+b[0])/2}" y="${Math.min(a[1],b[1])-12}" class="lbl-s" style="fill:var(--accent)">${g[0]}公里${g[1]}公尺</text>`;});

      box.querySelector('#rt').innerHTML=s;}

    H.$('#rtBtn',box).onclick=()=>{if(st)return;st=1;H.SFX.play('ok');H.$('#rtCap',box).textContent=o.after;};

    draw();return{go(){H.$('#rtBtn',box).click();}};

  }

});



/* 積木：數一數有幾個1立方公分 */

function isoCubes(stacks,opt){const c=15,hs=15,P=(x,y,z,ox,oy)=>[ox+(x-y)*c,oy+(x+y)*hs/2-z*hs];let s='',n=0;

  stacks.forEach((st,si)=>{const[l,w,h]=st.size,ox=st.ox,oy=st.oy;const list=[];

    for(let z=0;z<h;z++)for(let y=0;y<w;y++)for(let x=0;x<l;x++)list.push([x,y,z]);

    list.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])||a[2]-b[2]);

    list.forEach(([x,y,z])=>{const gz=opt.split?z*10:0;const q=(a,b,d)=>{const p=P(a,b,d,ox,oy-gz);return p[0].toFixed(1)+','+p[1].toFixed(1);};

      const col=opt.color?opt.color(si,z):st.color||'var(--juice-a)';

      s+=`<polygon points="${q(x,y,z+1)} ${q(x+1,y,z+1)} ${q(x+1,y+1,z+1)} ${q(x,y+1,z+1)}" style="fill:${opt.top||'#fff6e4'}" class="ink-s" stroke-width="1.5"/>`+

         `<polygon points="${q(x+1,y,z)} ${q(x+1,y+1,z)} ${q(x+1,y+1,z+1)} ${q(x+1,y,z+1)}" style="fill:${opt.side||'#c9a06c'}" class="ink-s" stroke-width="1.5"/>`+

         `<polygon points="${q(x,y+1,z)} ${q(x+1,y+1,z)} ${q(x+1,y+1,z+1)} ${q(x,y+1,z+1)}" style="fill:${col}" class="ink-s" stroke-width="1.5"/>`;n++;});

    if(st.name)s+=`<text x="${ox}" y="${oy+(l+w)*hs/2+22}" class="lbl-s">${st.name}</text>`;});

  return s;}

W.cubes=(o)=>({

  html:`<svg viewBox="0 0 340 ${o.h||170}" width="340" role="img" aria-label="${o.alt||'積木'}" id="cb"></svg><div class="wbtns">${o.btns.map((b,i)=>`<button type="button" class="wbtn" data-b="${i}">${b[0]}</button>`).join('')}</div><p class="cap" id="cbCap">${o.cap}</p>`,

  mount(box,H){let opt={};

    function draw(){if(!box.isConnected)return;box.querySelector('#cb').innerHTML=isoCubes(o.stacks,opt);}

    box.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const k=o.btns[+b.dataset.b];opt=k[2]||{};H.SFX.play(k[3]||'hop');draw();H.$('#cbCap',box).textContent=k[1];});

    draw();return{b(i){box.querySelector(`[data-b="${i}"]`).click();}};

  }

});



/* 長條圖 */

W.bars=(o)=>({

  html:(()=>{const X0=44,Y0=150,Hh=120,max=o.max,bw=Math.min(46,250/o.cats.length-14),gapx=270/o.cats.length;let s=`<svg viewBox="0 0 340 190" width="340" role="img" aria-label="${o.title}長條圖" id="br"><text x="8" y="14" class="lbl-s" style="text-anchor:start">（${o.unit}）</text>`;

    for(let v=0;v<=max;v+=o.step){const y=Y0-v/max*Hh;s+=`<line x1="${X0}" y1="${y}" x2="330" y2="${y}" class="ink-s" opacity="${v?.18:.8}"/><text x="${X0-6}" y="${y+4}" class="lbl-s" style="text-anchor:end">${v}</text>`;}

    o.cats.forEach((c,i)=>{const x=X0+gapx*i+(gapx-bw)/2,h=o.vals[i]/max*Hh;s+=`<rect x="${x}" y="${Y0-h}" width="${bw}" height="${h}" class="${i%2?'pick2':'pick'}" opacity=".9"/><text x="${x+bw/2}" y="${Y0+18}" class="lbl-s">${c}</text>`;});

    s+=`<line x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y0-Hh-6}" class="ink-s" stroke-width="2"/><g id="brG"></g><text x="190" y="186" class="lbl-s">${o.title}</text></svg>`;

    return s+`<div class="wbtns">${o.cats.map((c,i)=>`<button type="button" class="wbtn" data-i="${i}">${c}畫橫線</button>`).join('')}</div><p class="cap" id="brCap">一格是${o.step}${o.unit}。</p>`;})(),

  mount(box,H){const X0=44,Y0=150,Hh=120,gapx=270/o.cats.length,bw=Math.min(46,250/o.cats.length-14);

    box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,y=Y0-o.vals[i]/o.max*Hh,x=X0+gapx*i+(gapx-bw)/2;H.SFX.play('pencil');

      box.querySelector('#brG').innerHTML=`<line x1="${X0}" y1="${y}" x2="${x+bw}" y2="${y}" class="acc-s" stroke-width="2" stroke-dasharray="5 4"/><circle cx="${X0}" cy="${y}" r="4" class="acc-f"/>`;

      H.$('#brCap',box).textContent=`${o.cats[i]}的長條頂端對到 ${o.vals[i]}：${o.cats[i]}有${o.vals[i]}${o.unit}。（一格是${o.step}${o.unit}，不是1${o.unit}喔）`;});

    return{show(i){box.querySelector(`[data-i="${i}"]`).click();}};

  }

});



/* 折線圖 */

W.lineChart=(o)=>({

  html:(()=>{const X0=44,Y0=150,Hh=120,lo=o.min,hi=o.max,sp=270/(o.xs.length-1)*.92;const px=i=>X0+16+i*sp,py=v=>Y0-(v-lo)/(hi-lo)*Hh;

    let s=`<svg viewBox="0 0 340 190" width="340" role="img" aria-label="${o.title}折線圖" id="lc"><text x="8" y="14" class="lbl-s" style="text-anchor:start">（${o.unit}）</text>`;

    for(let v=lo;v<=hi;v+=o.step){const y=py(v);s+=`<line x1="${X0}" y1="${y}" x2="330" y2="${y}" class="ink-s" opacity="${v===lo?.8:.18}"/><text x="${X0-6}" y="${y+4}" class="lbl-s" style="text-anchor:end">${v}</text>`;}

    s+=`<path d="M${o.ys.map((v,i)=>px(i)+' '+py(v)).join(' L')}" fill="none" class="acc-s" stroke-width="3"/>`;

    o.ys.forEach((v,i)=>{s+=`<circle cx="${px(i)}" cy="${py(v)}" r="4.5" class="acc-f"/><text x="${px(i)}" y="${Y0+18}" class="lbl-s">${o.xs[i]}</text>`;});

    s+=`<line x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y0-Hh-6}" class="ink-s" stroke-width="2"/><g id="lcG"></g><text x="190" y="186" class="lbl-s">${o.title}</text></svg>`;

    return s+`<div class="wbtns"><button type="button" class="wbtn" id="lcHi">找最高點</button><button type="button" class="wbtn" id="lcD">每一段變了多少</button></div><p class="cap" id="lcCap">${o.cap}</p>`;})(),

  mount(box,H){const X0=44,Y0=150,Hh=120,sp=270/(o.xs.length-1)*.92;const px=i=>X0+16+i*sp,py=v=>Y0-(v-o.min)/(o.max-o.min)*Hh;

    H.$('#lcHi',box).onclick=()=>{const m=o.ys.indexOf(Math.max(...o.ys));H.SFX.play('pencil');box.querySelector('#lcG').innerHTML=`<circle cx="${px(m)}" cy="${py(o.ys[m])}" r="10" fill="none" class="acc-s" stroke-width="2.5"/><line x1="${X0}" y1="${py(o.ys[m])}" x2="${px(m)}" y2="${py(o.ys[m])}" class="ink-s" stroke-dasharray="4 4"/>`;

      H.$('#lcCap',box).textContent=`最高點在${o.xs[m]}，是${o.ys[m]}${o.unit}。`;};

    H.$('#lcD',box).onclick=()=>{H.SFX.play('pencil');let s='';const ds=[];for(let i=0;i<o.ys.length-1;i++){const d=o.ys[i+1]-o.ys[i];ds.push(d);s+=`<text x="${(px(i)+px(i+1))/2}" y="${Math.min(py(o.ys[i]),py(o.ys[i+1]))-10}" class="lbl-s" style="fill:${d>0?'var(--accent)':'var(--water)'};font-weight:700">${d>0?'+':''}${d}</text>`;}

      box.querySelector('#lcG').innerHTML=s;H.$('#lcCap',box).textContent=o.xs.slice(0,-1).map((x,i)=>`${x}到${o.xs[i+1]}：${ds[i]>0?'上升'+ds[i]:'下降'+(-ds[i])}`).join('；')+'。線越陡，變得越多。';};

    return{high(){H.$('#lcHi',box).click();},diffs(){H.$('#lcD',box).click();}};

  }

});



/* 燈塔的光：旋轉角 */

W.turn=()=>({

  html:`<svg viewBox="-110 -105 220 210" width="230" role="img" aria-label="燈塔的光從12點方向開始轉" id="tn"></svg>

    <div class="wbtns"><button type="button" class="wbtn" data-t="90">順時針轉到3</button><button type="button" class="wbtn" data-t="180">轉到6</button><button type="button" class="wbtn" data-t="360">轉一整圈</button><button type="button" class="wbtn" data-t="-90">逆時針轉到9</button></div><p class="cap" id="tnCap">光從12的方向開始（始邊）。</p>`,

  mount(box,H){let deg=0,busy=false;

    function draw(d){if(!box.isConnected)return;const R=80,t=(d-90)*Math.PI/180;let s='<circle r="92" class="paper-f ink-s" stroke-width="2"/>';

      for(let k=1;k<=12;k++){const a=(k*30-90)*Math.PI/180;s+=`<text x="${(78*Math.cos(a)).toFixed(1)}" y="${(78*Math.sin(a)+5).toFixed(1)}" class="lbl-s">${k}</text>`;}

      if(d){const big=Math.abs(d)>180?1:0,sw=d>0?1:0,r=34,e=Math.abs(d)>=360?[-0.01,-r]:[r*Math.cos(t),r*Math.sin(t)];

        s+=`<path d="M0 0 L0 ${-r} A${r} ${r} 0 ${big} ${sw} ${e[0].toFixed(2)} ${e[1].toFixed(2)}Z" class="acc-f" opacity=".3"/>`;}

      s+=`<line x1="0" y1="0" x2="0" y2="-62" class="ink-s" stroke-width="3" stroke-dasharray="5 4"/><path d="M0 0 L${(62*Math.cos(t-.12)).toFixed(1)} ${(62*Math.sin(t-.12)).toFixed(1)} L${(62*Math.cos(t+.12)).toFixed(1)} ${(62*Math.sin(t+.12)).toFixed(1)}Z" style="fill:#f7e7a6" class="ink-s" stroke-width="1.5"/><line x1="0" y1="0" x2="${(62*Math.cos(t)).toFixed(1)}" y2="${(62*Math.sin(t)).toFixed(1)}" class="acc-s" stroke-width="3"/><circle r="7" style="fill:#e9b44c" class="ink-s" stroke-width="2"/>`;

      box.querySelector('#tn').innerHTML=s;}

    const names={90:'直角，90度',180:'平角，180度',360:'周角，360度','-90':'直角，90度'};

    box.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{if(busy)return;busy=true;const to=+b.dataset.t;H.SFX.play('swoosh');

      for(let i=1;i<=20&&box.isConnected;i++){deg=to*i/20;draw(deg);await H.wait(30);}

      if(box.isConnected)H.$('#tnCap',box).textContent=`${to>0?'順時針':'逆時針'}轉到${to===360?'12（回到原來的地方）':to===180?'6':to>0?'3':'9'}：從始邊轉到終邊，轉了一個${names[to]}。`;busy=false;});

    draw(0);return{to(d){box.querySelector(`[data-t="${d}"]`).click();}};

  }

});



/* 量角器：內圈、外圈 */

W.protractor=(o)=>({

  html:`<svg viewBox="0 0 340 200" width="340" role="img" aria-label="用量角器量一個角" id="pt"></svg><div class="wbtns"><button type="button" class="wbtn" id="ptBtn">從邊對著的0開始數</button></div><p class="cap" id="ptCap">角的頂點對準量角器的中心，一條邊對準0度線。</p>`,

  mount(box,H){const cx=170,cy=170,R=140;let on=false;

    function draw(){if(!box.isConnected)return;let s=`<path d="M${cx-R} ${cy} A${R} ${R} 0 0 1 ${cx+R} ${cy}Z" style="fill:#e3f1f3" class="ink-s" stroke-width="2" opacity=".95"/>`;

      for(let d=0;d<=180;d+=5){const a=Math.PI-d*Math.PI/180,l=d%10?6:12;s+=`<line x1="${(cx+R*Math.cos(a)).toFixed(1)}" y1="${(cy-R*Math.sin(a)).toFixed(1)}" x2="${(cx+(R-l)*Math.cos(a)).toFixed(1)}" y2="${(cy-(R-l)*Math.sin(a)).toFixed(1)}" class="ink-s"/>`;

        if(d%30===0){s+=`<text x="${(cx+(R-24)*Math.cos(a)).toFixed(1)}" y="${(cy-(R-24)*Math.sin(a)+4).toFixed(1)}" class="lbl-s" style="font-size:11px">${d}</text>`;

          s+=`<text x="${(cx+(R-48)*Math.cos(a)).toFixed(1)}" y="${(cy-(R-48)*Math.sin(a)+4).toFixed(1)}" class="lbl-s" style="font-size:11px;fill:${on?'var(--accent)':'var(--muted)'};font-weight:${on?700:400}">${180-d}</text>`;}}

      if(on){const a1=o.deg*Math.PI/180;s+=`<path d="M${cx+R-48} ${cy} A${R-48} ${R-48} 0 0 0 ${(cx+(R-48)*Math.cos(a1)).toFixed(1)} ${(cy-(R-48)*Math.sin(a1)).toFixed(1)}" fill="none" class="acc-s" stroke-width="5" opacity=".5"/>`;}

      const a=o.deg*Math.PI/180;s+=`<line x1="${cx}" y1="${cy}" x2="${cx+R+14}" y2="${cy}" class="ink-s" stroke-width="3.5"/><line x1="${cx}" y1="${cy}" x2="${(cx+(R+14)*Math.cos(a)).toFixed(1)}" y2="${(cy-(R+14)*Math.sin(a)).toFixed(1)}" class="ink-s" stroke-width="3.5"/><circle cx="${cx}" cy="${cy}" r="4" class="acc-f"/>`;

      s+=`<text x="${cx-R+4}" y="${cy+20}" class="lbl-s" style="text-anchor:start">外圈</text><text x="${cx+R-4}" y="${cy+20}" class="lbl-s" style="text-anchor:end;fill:var(--accent)">內圈從這邊的0開始</text>`;

      box.querySelector('#pt').innerHTML=s;}

    H.$('#ptBtn',box).onclick=()=>{on=true;H.SFX.play('pencil');draw();H.$('#ptCap',box).textContent=`角的一條邊對著右邊的0，所以看內圈：0、10、20⋯⋯數到另一條邊，是${o.deg}度。外圈的${180-o.deg}是從左邊數的。`;};

    draw();return{show(){H.$('#ptBtn',box).click();}};

  }

});



/* ================= 第8島的教具 ================= */



/* 布丁裝盒、裝箱 */

W.packs=(o)=>({

  html:`<svg viewBox="0 0 340 170" width="340" role="img" aria-label="${o.n}個${o.item}" id="pk8"></svg>

    <div class="wbtns"><button type="button" class="wbtn" id="pk1">每${o.a}個裝1盒</button><button type="button" class="wbtn" id="pk2">每${o.b}盒裝1箱</button></div><p class="cap" id="pkCap">${o.n}個${o.item}。</p>`,

  mount(box,H){let st=0;const boxes=o.n/o.a,crates=boxes/o.b;

    const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="5" style="fill:#f2c25b" class="ink-s" stroke-width="1.5"/><path d="M${x-4} ${y-2} q4 -5 8 0" style="fill:#a9563b"/>`;

    const bx=(x,y)=>{let s=`<rect x="${x}" y="${y}" width="${o.a*11+6}" height="18" rx="3" style="fill:#fbe3e6" class="ink-s" stroke-width="1.5"/>`;for(let i=0;i<o.a;i++)s+=dot(x+8+i*11,y+9);return s;};

    function draw(){if(!box.isConnected)return;let s='';

      if(st===0){for(let i=0;i<o.n;i++)s+=dot(20+(i%12)*26,20+Math.floor(i/12)*30);}

      else if(st===1){const w=o.a*11+12;const per=Math.floor(320/w);for(let i=0;i<boxes;i++)s+=bx(12+(i%per)*w,14+Math.floor(i/per)*26);}

      else{const cw=150;for(let c=0;c<crates;c++){const X=14+c*(cw+20);s+=`<rect x="${X}" y="10" width="${cw}" height="150" rx="6" style="fill:#c9a06c" class="ink-s" stroke-width="2.5"/>`;

        for(let i=0;i<o.b;i++)s+=bx(X+8+(i%2)*70,18+Math.floor(i/2)*34);}}

      box.querySelector('#pk8').innerHTML=s;}

    H.$('#pk1',box).onclick=()=>{st=1;H.SFX.play('paper');draw();H.$('#pkCap',box).textContent=`${o.n}÷${o.a}＝${boxes}，裝成${boxes}盒。`;};

    H.$('#pk2',box).onclick=()=>{if(st<1){H.$('#pkCap',box).textContent=`先裝成盒，才能裝箱喔。`;return;}st=2;H.SFX.play('ok');draw();H.$('#pkCap',box).textContent=`${boxes}盒，每${o.b}盒裝1箱：${boxes}÷${o.b}＝${crates}箱。合起來寫：（${o.n}÷${o.a}）÷${o.b}＝${crates}。`;};

    draw();return{box(){H.$('#pk1',box).click();},crate(){H.$('#pk2',box).click();}};

  }

});



/* 平行線：斜放也是平行 */

W.plines=()=>({

  html:`<svg viewBox="0 0 340 170" width="340" role="img" aria-label="兩條斜斜的線" id="pl"><g id="plG" style="transition:transform .7s;transform-origin:170px 85px;transform:rotate(-18deg)">

    <line x1="45" y1="60" x2="295" y2="60" class="ink-s" stroke-width="4" stroke-linecap="round"/><line x1="45" y1="110" x2="295" y2="110" class="ink-s" stroke-width="4" stroke-linecap="round"/><g id="plM"></g></g></svg>

/* 撕下三個角拼一拼 */

W.tear=(o)=>({

  html:`<svg viewBox="0 0 350 200" width="350" role="img" aria-label="三角形" id="te10"></svg><div class="wbtns">${o.tris.map((t,i)=>`<button type="button" class="wbtn" data-t="${i}">撕下${t.name}的三個角</button>`).join('')}</div><p class="cap" id="teCap">每個三角形的三個角，塗上三種顏色。</p>`,

  mount(box,H){let on=-1;const C=['var(--berry)','var(--juice-a)','var(--water)'];

    const ang=(p,q,r)=>{const a=Math.atan2(q[1]-p[1],q[0]-p[0]),b=Math.atan2(r[1]-p[1],r[0]-p[0]);let d=b-a;while(d<=-Math.PI)d+=2*Math.PI;while(d>Math.PI)d-=2*Math.PI;return[a,d];};

    const wedge=(c,a0,d,r,col)=>{const a1=a0+d,sw=d>0?1:0,big=Math.abs(d)>Math.PI?1:0;return`<path d="M${c[0]} ${c[1]} L${(c[0]+r*Math.cos(a0)).toFixed(1)} ${(c[1]+r*Math.sin(a0)).toFixed(1)} A${r} ${r} 0 ${big} ${sw} ${(c[0]+r*Math.cos(a1)).toFixed(1)} ${(c[1]+r*Math.sin(a1)).toFixed(1)}Z" style="fill:${col}" opacity=".85"/>`;};

    function draw(){if(!box.isConnected)return;let s='';

        for(let i=0;i<3;i++){const[a,d]=ang(P[i],P[(i+1)%3],P[(i+2)%3]);s+=wedge(P[i],a,d,16,C[i]);}

        s+=`<text x="${t.label[0]}" y="${t.label[1]}" class="lbl">${t.name}</text>`;});

      if(on>=0){const P=o.tris[on].pts,c=[175,185];let a0=Math.PI;s+=`<line x1="80" y1="185" x2="270" y2="185" class="ink-s" stroke-width="2"/>`;

        for(let i=0;i<3;i++){const[,d]=ang(P[i],P[(i+1)%3],P[(i+2)%3]);const dd=Math.abs(d);s+=wedge(c,a0,dd,40,C[i]);a0+=dd;}

        s+=`<text x="175" y="132" class="lbl-s" style="fill:var(--accent)">拼成一條直線：180度</text>`;}

      box.querySelector('#te10').innerHTML=s;}

    box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{on=+b.dataset.t;H.SFX.play('paper');draw();H.$('#teCap',box).textContent=`${o.tris[on].name}的三個角拼在一起，剛好拼成一條直線（平角）：三個角加起來是180度。`;});

  }

});

/* 短除法：最大公因數、最小公倍數 */

W.shortdiv=(o)=>({

  html:`<div class="vbox"><div id="sd11"></div></div><div class="wbtns"><button type="button" class="wbtn" id="sdBtn">用質數一層一層除</button></div><p class="cap" id="sdCap">${o.a}和${o.b}，找一個兩個數都能整除的質數。</p>`,

  mount(box,H){let k=0;const steps=[];let a=o.a,b=o.b;for(const p of [2,3,5,7,11,13]){while(a%p===0&&b%p===0){steps.push([p,a,b]);a/=p;b/=p;}}const last=[a,b];

    function draw(){if(!box.isConnected)return;let h='<div style="display:grid;grid-template-columns:30px 44px 44px;font:600 20px/1.6 var(--hand,inherit);text-align:center">';

      steps.slice(0,k).forEach(([p,x,y])=>{h+=`<span style="border-right:2px solid var(--ink);color:var(--accent)">${p}</span><span style="border-bottom:2px solid var(--ink)">${x}</span><span style="border-bottom:2px solid var(--ink)">${y}</span>`;});

      const cur=k<steps.length?[steps[k][1],steps[k][2]]:last;h+=`<span></span><span>${cur[0]}</span><span>${cur[1]}</span></div>`;H.$('#sd11',box).innerHTML=h;}

    H.$('#sdBtn',box).onclick=async()=>{for(k=0;k<=steps.length&&box.isConnected;k++){draw();H.SFX.play('pencil');await H.wait(450);}k=steps.length;

      if(!box.isConnected)return;const g=steps.reduce((m,s)=>m*s[0],1);H.$('#sdCap',box).textContent=`除到${last[0]}和${last[1]}互質（除了1沒有別的公因數）就停。左邊相乘：${steps.map(s=>s[0]).join('×')}＝${g}，是最大公因數。左邊和下面全部相乘：${g}×${last[0]}×${last[1]}＝${g*last[0]*last[1]}，是最小公倍數。`;};

    k=0;H.$('#sd11',box).innerHTML=`<div style="font:600 20px/1.6 inherit;text-align:center">${o.a}　${o.b}</div>`;

    return{run(){H.$('#sdBtn',box).click();}};

  }

});

/* 比的表格：一起變幾倍 */

W.ratio=(o)=>({

  html:`<div class="table-wrap"><table class="menu" id="rt11"><thead><tr><th></th>${o.mult.map(m=>`<th>${m}倍</th>`).join('')}</tr></thead><tbody><tr><th>${o.la}</th>${o.mult.map(m=>`<td>${o.a*m}</td>`).join('')}</tr><tr><th>${o.lb}</th>${o.mult.map((m,i)=>`<td data-j="${i}">${i?'？':o.b*m}</td>`).join('')}</tr></tbody></table></div>

    <div class="wbtns"><button type="button" class="wbtn" id="rtBtn">一起變成幾倍</button></div><p class="cap" id="rtCap">${o.cap}</p>`,

  mount(box,H){

    H.$('#rtBtn',box).onclick=()=>{box.querySelectorAll('#rt11 [data-j]').forEach(td=>{const i=+td.dataset.j;td.textContent=o.b*o.mult[i];td.classList.add('hl');});H.SFX.play('ok');

      H.$('#rtCap',box).textContent=`${o.la}變成幾倍，${o.lb}也要變成幾倍：${o.mult.map(m=>`${o.a*m}：${o.b*m}`).join('＝')}。比值都是${o.a}÷${o.b}＝${o.a/o.b}，味道就一樣。`;};

    return{go(){H.$('#rtBtn',box).click();}};

  }

});



/* 賽跑：每秒跑幾公尺 */

W.race=(o)=>({

  html:`<svg viewBox="0 0 340 120" width="340" role="img" aria-label="兩人賽跑" id="ra11"></svg><div class="wbtns"><button type="button" class="wbtn" id="raBtn">算每秒跑幾公尺</button></div><p class="cap" id="raCap">${o.runners.map(r=>`${r[0]}：${r[1]}公尺，${r[2]}秒`).join('；')}。</p>`,

  mount(box,H){let t=0;const maxd=Math.max(...o.runners.map(r=>r[1]));const U=280/maxd;

    function draw(){if(!box.isConnected)return;let s='';o.runners.forEach((r,i)=>{const y=30+i*44,v=r[1]/r[2],d=Math.min(r[1],v*t);

      s+=`<line x1="30" y1="${y+10}" x2="${30+maxd*U}" y2="${y+10}" style="stroke:#d9734a" stroke-width="16" opacity=".5"/><line x1="${30+r[1]*U}" y1="${y}" x2="${30+r[1]*U}" y2="${y+20}" class="ink-s" stroke-width="2"/>`;

      s+=`<circle cx="${30+d*U}" cy="${y+10}" r="7" style="fill:${i?'var(--water)':'var(--berry)'}" class="ink-s" stroke-width="1.5"/><text x="4" y="${y+14}" class="lbl-s" style="text-anchor:start">${r[0]}</text>`;

      if(t>0)s+=`<text x="${30+r[1]*U-4}" y="${y-4}" class="lbl-s" style="text-anchor:end;font-size:10px">${Math.min(t,r[2]).toFixed(0)}秒</text>`;});

      box.querySelector('#ra11').innerHTML=s;}

    H.$('#raBtn',box).onclick=async()=>{const T=Math.max(...o.runners.map(r=>r[2]));for(let i=1;i<=30&&box.isConnected;i++){t=T*i/30;draw();await H.wait(40);}

      if(!box.isConnected)return;H.SFX.play('whistle');H.$('#raCap',box).textContent=o.runners.map(r=>`${r[0]}：${r[1]}÷${r[2]}＝${+(r[1]/r[2]).toFixed(2)}公尺/秒`).join('；')+'。每秒跑得多的，比較快。';};

    draw();return{go(){H.$('#raBtn',box).click();}};

  }

});



/* 多邊形切成三角形 */

W.polysplit=(o)=>({

  html:`<svg viewBox="0 0 300 220" width="300" role="img" aria-label="${o.name}" id="ps11"></svg><div class="wbtns"><button type="button" class="wbtn" data-m="v">從一個頂點切</button>${o.center?'<button type="button" class="wbtn" data-m="c">從中間一點切</button>':''}</div><p class="cap" id="psCap">${o.name}，有${o.n}個角。</p>`,

  mount(box,H){let m='';const cx=150,cy=112,R=95;const P=o.pts||Array.from({length:o.n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/o.n;return[cx+R*Math.cos(a),cy+R*Math.sin(a)];});

    const C=['#f7e7a6','#cde3ad','#d5e8f0','#fbe3e6','#e7cfb2','#e3d7f0'];

    function draw(){if(!box.isConnected)return;let s='';

      if(m==='v'){for(let i=1;i<o.n-1;i++)s+=`<polygon points="${[P[0],P[i],P[i+1]].map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" style="fill:${C[i%6]}" class="ink-s" stroke-width="1.5"/>`;}

      else if(m==='c'){for(let i=0;i<o.n;i++)s+=`<polygon points="${[[cx,cy],P[i],P[(i+1)%o.n]].map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" style="fill:${C[i%6]}" class="ink-s" stroke-width="1.5"/>`;s+=`<circle cx="${cx}" cy="${cy}" r="16" fill="none" class="acc-s" stroke-width="3"/>`;}

      s+=`<polygon points="${P.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${m?'none':'#fffdf6'}" class="ink-s" stroke-width="3"/>`;

      box.querySelector('#ps11').innerHTML=s;}

    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{m=b.dataset.m;H.SFX.play('cut');draw();const n=o.n;

      H.$('#psCap',box).textContent=m==='v'?`從一個頂點切，切成${n-2}個三角形：180×${n-2}＝${180*(n-2)}度。`:`從中間切，切成${n}個三角形：180×${n}＝${180*n}，可是中間那一圈（360度）不是${o.name}的角，要減掉：${180*n}－360＝${180*n-360}度。`;});

    draw();return{v(){box.querySelector('[data-m="v"]').click();},c(){box.querySelector('[data-m="c"]').click();}};

  }

});



/* ================= 第12島的教具 ================= */



/* 線段圖：基準量和比較量 */

W.segbar=(o)=>({

  html:`<svg viewBox="0 0 340 ${o.rows.length*50+20}" width="340" role="img" aria-label="線段圖" id="sg12"></svg><div class="wbtns"><button type="button" class="wbtn" id="sgBtn">${o.btn}</button></div><p class="cap" id="sgCap">${o.cap}</p>`,

  mount(box,H){let on=false;const U=o.unit;

    function draw(){if(!box.isConnected)return;let s='';o.rows.forEach((r,i)=>{const y=20+i*50;s+=`<text x="6" y="${y+14}" class="lbl-s" style="text-anchor:start">${r.name}</text>`;

        for(let k=0;k<r.parts;k++)s+=`<rect x="${70+k*U}" y="${y}" width="${U}" height="20" style="fill:${r.base?'#d5e8f0':'#f7e7a6'}" class="ink-s" stroke-width="${on?1.5:0}"/>`;

        s+=`<rect x="70" y="${y}" width="${r.parts*U}" height="20" fill="none" class="ink-s" stroke-width="2.5"/><text x="${70+r.parts*U+6}" y="${y+14}" class="lbl-s" style="text-anchor:start;fill:var(--accent)">${on?r.after:r.label}</text>`;

        if(on)for(let k=0;k<r.parts;k++)s+=`<text x="${70+(k+.5)*U}" y="${y+14}" class="lbl-s" style="font-size:10px">${o.each}</text>`;});

      box.querySelector('#sg12').innerHTML=s;}

    H.$('#sgBtn',box).onclick=()=>{on=true;H.SFX.play('pencil');draw();H.$('#sgCap',box).textContent=o.after;};

    draw();return{go(){H.$('#sgBtn',box).click();}};

  }

});



/* 天平：等量公理 */

W.scale12=(o)=>({

  html:`<svg viewBox="0 0 340 190" width="340" role="img" aria-label="天平" id="sc12"></svg><div class="wbtns"><button type="button" class="wbtn" data-a="both">兩邊同時${o.op==='÷'?'分成'+o.k+'份，各留1份':'拿走'+o.k+'個'}</button><button type="button" class="wbtn" data-a="left">只拿左邊的</button><button type="button" class="wbtn" data-a="reset">重來</button></div><p class="cap" id="scCap">左邊：${o.lx}個x${o.op==='÷'?'':'和'+o.k+'個砝碼'}；右邊：${o.r}個砝碼。天平平衡。</p>`,

  mount(box,H){let st={lx:o.lx,lw:o.op==='÷'?0:o.k,r:o.r},tilt=0;

    function draw(){if(!box.isConnected)return;const t=tilt*8;let s=`<path d="M170 180 V70" class="ink-s" stroke-width="5"/><path d="M140 182 H200" class="ink-s" stroke-width="6" stroke-linecap="round"/><g transform="rotate(${t} 170 70)"><line x1="40" y1="70" x2="300" y2="70" class="ink-s" stroke-width="5" stroke-linecap="round"/>

        <path d="M50 70 V100 M110 70 V100 M230 70 V100 M290 70 V100" class="ink-s" stroke-width="1.5"/><path d="M40 100 H120 L112 110 H48Z" class="soft-f ink-s" stroke-width="2"/><path d="M220 100 H300 L292 110 H228Z" class="soft-f ink-s" stroke-width="2"/>`;

      const items=[];for(let i=0;i<st.lx;i++)items.push('x');for(let i=0;i<st.lw;i++)items.push('w');

      items.forEach((it,i)=>{const x=46+(i%6)*12,y=92-Math.floor(i/6)*12;s+=it==='x'?`<rect x="${x-1}" y="${y-6}" width="13" height="14" rx="2" style="fill:var(--berry)" class="ink-s"/><text x="${x+5.5}" y="${y+5}" class="lbl-s" style="fill:#fff;font-size:9px">x</text>`:`<circle cx="${x+5}" cy="${y+2}" r="5" style="fill:#e9b44c" class="ink-s"/>`;});

      for(let i=0;i<st.r;i++){const x=226+(i%6)*12,y=92-Math.floor(i/6)*12;s+=`<circle cx="${x+5}" cy="${y+2}" r="5" style="fill:#e9b44c" class="ink-s"/>`;}

      box.querySelector('#sc12').innerHTML=s+'</g>';}

    box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;

      if(a==='reset'){st={lx:o.lx,lw:o.op==='÷'?0:o.k,r:o.r};tilt=0;H.$('#scCap',box).textContent='重新擺好，天平平衡。';}

      else if(a==='left'){if(o.op==='÷'){st.lx=1;}else st.lw=0;tilt=1;H.SFX.play('retry');H.$('#scCap',box).textContent='只動一邊，天平就歪了：等號不成立了。';}

      else{if(o.op==='÷'){st.lx=1;st.r=o.r/o.lx;}else{st.lw=0;st.r=o.r-o.k;}tilt=0;H.SFX.play('ok');H.$('#scCap',box).textContent=o.after;}

      draw();});

    draw();return{both(){box.querySelector('[data-a="both"]').click();}};

  }

});



/* 雞兔同籠 */

W.chicks=(o)=>({

  html:`<svg viewBox="0 0 340 110" width="340" role="img" aria-label="${o.n}隻雞和兔" id="ck12"></svg><div class="wbtns"><button type="button" class="wbtn" id="ckBtn">把一隻雞換成兔子</button><button type="button" class="wbtn" id="ckRst">全部都當成雞</button></div><p class="cap" id="ckCap">先假設${o.n}隻都是雞：${o.n*2}隻腳。題目說有${o.legs}隻腳。</p>`,

  mount(box,H){let r=0;

    function draw(){if(!box.isConnected)return;let s='';for(let i=0;i<o.n;i++){const x=20+i*32,rab=i>=o.n-r;s+=rab?`<g transform="translate(${x} 50)"><ellipse rx="12" ry="9" style="fill:#d5d9dc" class="ink-s" stroke-width="1.5"/><circle cx="9" cy="-8" r="6" style="fill:#d5d9dc" class="ink-s" stroke-width="1.5"/><path d="M8 -13 v-10 M11 -13 v-9" class="ink-s" stroke-width="2.5"/><path d="M-8 8 v8 M-3 8 v8 M3 8 v8 M8 8 v8" class="ink-s" stroke-width="2"/></g>`:`<g transform="translate(${x} 50)"><ellipse rx="11" ry="9" style="fill:#fff8ec" class="ink-s" stroke-width="1.5"/><circle cx="8" cy="-9" r="5.5" style="fill:#fff8ec" class="ink-s" stroke-width="1.5"/><path d="M7 -15 l2 -4 l2 4" style="fill:#d9534a"/><path d="M-3 8 v9 M3 8 v9" class="ink-s" stroke-width="2"/></g>`;}

      const legs=(o.n-r)*2+r*4;s+=`<text x="170" y="100" class="lbl-s" style="fill:${legs===o.legs?'var(--accent)':'var(--ink)'};font-weight:700">雞${o.n-r}隻、兔${r}隻：${legs}隻腳</text>`;box.querySelector('#ck12').innerHTML=s;}

    H.$('#ckBtn',box).onclick=()=>{if(r>=o.n)return;r++;draw();const legs=(o.n-r)*2+r*4;H.SFX.play(legs===o.legs?'ok':'hop');

      H.$('#ckCap',box).textContent=legs===o.legs?`對了！每換一隻多2隻腳。少的${o.legs-o.n*2}隻腳，要換${(o.legs-o.n*2)/2}次：雞${o.n-r}隻、兔${r}隻。`:`換了${r}隻，現在${legs}隻腳，${legs<o.legs?'還差'+(o.legs-legs)+'隻腳':'太多了'}。`;};

    H.$('#ckRst',box).onclick=()=>{r=0;draw();H.$('#ckCap',box).textContent=`先假設${o.n}隻都是雞：${o.n*2}隻腳。題目說有${o.legs}隻腳。`;};

    draw();return{solve(){while(r<(o.legs-o.n*2)/2)H.$('#ckBtn',box).click();}};

  }

});



/* 滾一圈：圓周長 */

W.roll=(o)=>({

  html:`<svg viewBox="0 0 350 130" width="350" role="img" aria-label="把圓滾一圈" id="ro12"></svg><div class="wbtns"><button type="button" class="wbtn" id="roBtn">把輪子滾一圈</button></div><p class="cap" id="roCap">輪子的直徑是1格。滾一圈，會走多遠？</p>`,

  mount(box,H){const D=30,x0=20,y0=100;let k=0;

    function draw(){if(!box.isConnected)return;const d=k*Math.PI*D,cx=x0+D/2+d,a=k*2*Math.PI;let s='';

      for(let i=0;i<=10;i++)s+=`<line x1="${x0+i*D}" y1="${y0}" x2="${x0+i*D}" y2="${y0+8}" class="ink-s"/>${i<=4?`<text x="${x0+(i+.5)*D}" y="${y0+22}" class="lbl-s" style="font-size:10px">${i<4?'直徑':''}</text>`:''}`;

      s+=`<line x1="${x0}" y1="${y0}" x2="${x0+11*D}" y2="${y0}" class="ink-s" stroke-width="2"/>`;

      if(k>0)s+=`<line x1="${x0}" y1="${y0-1}" x2="${x0+d}" y2="${y0-1}" class="acc-s" stroke-width="5"/>`;

      s+=`<circle cx="${cx}" cy="${y0-D/2}" r="${D/2}" style="fill:#f7e7a6" class="ink-s" stroke-width="2.5"/><line x1="${cx}" y1="${y0-D/2}" x2="${cx-D/2*Math.sin(a)}" y2="${y0-D/2+D/2*Math.cos(a)}" class="acc-s" stroke-width="3"/>`;

      if(k>=1)s+=`<text x="${x0+d/2}" y="${y0-38}" class="lbl-s" style="fill:var(--accent);font-weight:700">大約3.14個直徑</text>`;

      box.querySelector('#ro12').innerHTML=s;}

    H.$('#roBtn',box).onclick=async()=>{H.SFX.play('roll');for(let i=1;i<=30&&box.isConnected;i++){k=i/30;draw();await H.wait(40);}

      if(box.isConnected)H.$('#roCap',box).textContent='滾一圈，走了3個直徑多一點，大約是3.14個直徑。不管圓多大都一樣：圓周長＝直徑×3.14。';};

    draw();return{go(){H.$('#roBtn',box).click();}};

  }

});



/* 圓切開重排：圓面積 */

W.circlecut=(o)=>({

  html:`<svg viewBox="0 0 350 160" width="350" role="img" aria-label="把圓切成很多塊扇形" id="cc12"></svg><div class="wbtns"><button type="button" class="wbtn" id="ccBtn">切成16塊，排成一排</button></div><p class="cap" id="ccCap">半徑${o.r}公尺的圓形廣場。</p>`,

  mount(box,H){let on=false;const N=16,R=50;

    function sector(cx,cy,a0,a1,up,c){return`<path d="M${cx} ${cy} L${(cx+R*Math.cos(a0)).toFixed(1)} ${(cy+R*Math.sin(a0)).toFixed(1)} A${R} ${R} 0 0 1 ${(cx+R*Math.cos(a1)).toFixed(1)} ${(cy+R*Math.sin(a1)).toFixed(1)}Z" style="fill:${c}" class="ink-s" stroke-width="1"/>`;}

    function draw(){if(!box.isConnected)return;let s='';const da=2*Math.PI/N;

      if(!on){for(let i=0;i<N;i++)s+=sector(80,80,i*da,(i+1)*da,0,i%2?'#e9b44c':'#5b9bb5');s+=`<line x1="80" y1="80" x2="130" y2="80" class="acc-s" stroke-width="2.5"/><text x="105" y="74" class="lbl-s" style="fill:var(--accent)">半徑</text>`;}

      else{const w=Math.PI*R/(N/2);for(let i=0;i<N;i++){const up=i%2===0;const cx=80+w*Math.floor(i/2)+(up?0:w/2);if(up)s+=sector(cx,30,Math.PI/2-da/2,Math.PI/2+da/2,0,'#5b9bb5');else s+=sector(cx,80,-Math.PI/2-da/2,-Math.PI/2+da/2,0,'#e9b44c');}

        s+=`<text x="${80+Math.PI*R/2}" y="104" class="lbl-s" style="fill:var(--accent)">長：圓周的一半＝半徑×3.14</text><text x="${74}" y="60" class="lbl-s" style="text-anchor:end;fill:var(--accent)">寬：半徑</text>`;}

      box.querySelector('#cc12').innerHTML=s;}

    H.$('#ccBtn',box).onclick=()=>{on=true;H.SFX.play('cut');draw();H.$('#ccCap',box).textContent=`切得越細，越像一個長方形：長是圓周的一半（半徑×3.14），寬是半徑。面積＝半徑×半徑×3.14＝${o.r}×${o.r}×3.14＝${+(o.r*o.r*3.14).toFixed(2)}平方公尺。`;};

    draw();return{go(){H.$('#ccBtn',box).click();}};

  }

});



/* 角柱：數頂點、邊、面 */

W.prism=(o)=>({

  html:`<svg viewBox="0 0 300 200" width="300" role="img" aria-label="${o.n}角柱" id="pr12"></svg><div class="wbtns"><button type="button" class="wbtn" data-k="v">數頂點</button><button type="button" class="wbtn" data-k="e">數邊</button><button type="button" class="wbtn" data-k="f">數面</button></div><p class="cap" id="prCap">底面是${o.n}邊形的角柱，叫做${o.n}角柱。</p>`,

  mount(box,H){let k='';const n=o.n,cx=150,top=50,bot=160,rx=90,ry=26;

    const pt=(i,y)=>{const a=i*2*Math.PI/n+Math.PI/n/2;return[cx+rx*Math.cos(a),y+ry*Math.sin(a)];};

    function draw(){if(!box.isConnected)return;let s='';const T=Array.from({length:n},(_,i)=>pt(i,top)),B=Array.from({length:n},(_,i)=>pt(i,bot));

      const vis=i=>Math.sin(i*2*Math.PI/n+Math.PI/n/2)>-0.01||Math.sin((i+1)*2*Math.PI/n+Math.PI/n/2)>-0.01;

      for(let i=0;i<n;i++){const j=(i+1)%n;const front=Math.sin(i*2*Math.PI/n+Math.PI/n/2)+Math.sin(j*2*Math.PI/n+Math.PI/n/2)>0;

        if(front)s+=`<polygon points="${[T[i],T[j],B[j],B[i]].map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" style="fill:${k==='f'?'#f7e7a6':'#fffdf6'}" class="ink-s" stroke-width="2"/>`;}

      s+=`<polygon points="${T.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" style="fill:${k==='f'?'#e9763a':'#e3f1f3'}" class="ink-s" stroke-width="2"/>`;

      for(let i=0;i<n;i++){const j=(i+1)%n;const front=Math.sin(i*2*Math.PI/n+Math.PI/n/2)>-0.01&&Math.sin(j*2*Math.PI/n+Math.PI/n/2)>-0.01;if(!front)s+=`<line x1="${B[i][0]}" y1="${B[i][1]}" x2="${B[j][0]}" y2="${B[j][1]}" class="ink-s" stroke-dasharray="4 4" opacity=".6"/>`;}

      for(let i=0;i<n;i++){if(Math.sin(i*2*Math.PI/n+Math.PI/n/2)<-0.01)s+=`<line x1="${T[i][0]}" y1="${T[i][1]}" x2="${B[i][0]}" y2="${B[i][1]}" class="ink-s" stroke-dasharray="4 4" opacity=".6"/>`;}

      if(k==='v')[...T,...B].forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" class="acc-f"/>`;});

      if(k==='e'){for(let i=0;i<n;i++){const j=(i+1)%n;s+=`<line x1="${T[i][0]}" y1="${T[i][1]}" x2="${T[j][0]}" y2="${T[j][1]}" class="acc-s" stroke-width="3.5"/><line x1="${B[i][0]}" y1="${B[i][1]}" x2="${B[j][0]}" y2="${B[j][1]}" class="acc-s" stroke-width="3.5" opacity=".7"/><line x1="${T[i][0]}" y1="${T[i][1]}" x2="${B[i][0]}" y2="${B[i][1]}" style="stroke:var(--water)" stroke-width="3.5" opacity=".8"/>`;}}

      box.querySelector('#pr12').innerHTML=s;}

    const cap={v:`上面${n}個、下面${n}個頂點：${n}×2＝${n*2}個。`,e:`上面${n}條、下面${n}條，中間直的${n}條：${n}×3＝${n*3}條邊。`,f:`上下2個底面，旁邊${n}個側面：${n}＋2＝${n+2}個面。`};

/* 放大圖 */

W.enlarge=(o)=>({

  html:`<svg viewBox="0 0 350 170" width="350" role="img" aria-label="原圖和放大圖" id="en12"></svg><div class="wbtns"><button type="button" class="wbtn" id="enBtn">數一數格子</button></div><p class="cap" id="enCap">左邊是原圖，右邊是2倍放大圖。一小格是1公分。</p>`,

  mount(box,H){let on=false;const u=18;

    function draw(){if(!box.isConnected)return;let s=grid(10,10,5,8)+grid(110,10,12,8);

      s+=`<rect x="${10+u}" y="${10+5*u}" width="${3*u}" height="${2*u}" style="fill:#f7e7a6" class="ink-s" stroke-width="2.5"/>`;

      box.querySelector('#en12').innerHTML=s;}

    H.$('#enBtn',box).onclick=()=>{on=true;H.SFX.play('pencil');draw();H.$('#enCap',box).textContent='長和寬都變成2倍（3→6、2→4），角還是直角，形狀一樣。可是面積從6格變成24格：原圖的1格，在放大圖裡變成2×2＝4格，所以面積是4倍。';};

    draw();return{go(){H.$('#enBtn',box).click();}};

  }

});

function standardRecord(st){return log[st.id]||(log[st.id]={id:st.id,label:st.label||st.q,first:'',last:'',tries:0,how:'',kind:st.type,viewedExplanation:false,operationUsed:false});}

logIt=function(st,answer,ok){const r=standardRecord(st);if(!r.first)r.first=answer;r.last=answer;r.tries++;r.operationUsed=r.operationUsed||!!st.observe||widgetWasUsed;

 if(ok)r.how=r.tries>1?RECORD_STATUS.hint:r.operationUsed?RECORD_STATUS.observed:RECORD_STATUS.self;

 return r;

};
